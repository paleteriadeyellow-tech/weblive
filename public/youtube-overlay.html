<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin">
  <title>Overlay — YouTube (ahora + cola)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap');
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Montserrat', system-ui, sans-serif; }
    .yt-wrap { width: 460px; padding: 14px; }
    .yt-card {
      background: linear-gradient(135deg, rgba(12,18,32,.97), rgba(8,10,18,.97));
      border: 1px solid rgba(37,244,238,.4);
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.55);
    }
    .yt-card.idle { border-color: rgba(255,255,255,.12); opacity: .92; }
    .np-section { padding: 14px 16px 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .np-row { display: flex; gap: 14px; align-items: flex-start; }
    .np-player {
      width: 200px; height: 112px; border-radius: 12px; flex: none;
      background: #0a0e16; overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
    #yt-player { width: 100%; height: 100%; }
    .np-body { min-width: 0; flex: 1; }
    .np-badge {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      color: #25f4ee; margin-bottom: 6px;
    }
    .np-title {
      color: #fff; font-weight: 800; font-size: 16px; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .np-artist {
      color: #9fb3c8; font-size: 12px; font-weight: 600; margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .np-by { color: #25f4ee; font-size: 11px; font-weight: 700; margin-top: 6px; }
    .np-idle-text { color: #8aa; font-size: 14px; font-weight: 600; }
    .queue-section { padding: 0; }
    .queue-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px; background: rgba(37,244,238,.1);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .queue-head-left {
      display: flex; align-items: center; gap: 8px; color: #25f4ee;
      font-weight: 800; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
    }
    .queue-count {
      font-size: 11px; font-weight: 800; background: rgba(37,244,238,.18);
      color: #7af8f3; padding: 3px 8px; border-radius: 99px;
    }
    .yt-list { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow: hidden; }
    .yt-item {
      display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px;
      background: rgba(255,255,255,.04); animation: yt-in .35s ease;
    }
    .yt-pos {
      width: 22px; height: 22px; border-radius: 6px; flex: none;
      display: grid; place-items: center; font-size: 11px; font-weight: 800;
      color: #25f4ee; background: rgba(37,244,238,.15);
    }
    .yt-item img { width: 56px; height: 32px; border-radius: 6px; object-fit: cover; background: #222; flex: none; }
    .yt-info { min-width: 0; flex: 1; }
    .yt-name { color: #fff; font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .yt-meta { color: #9fb3c8; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .yt-by { color: #25f4ee; font-size: 10px; font-weight: 700; margin-top: 2px; }
    .yt-empty { color: #6b7f94; text-align: center; padding: 14px 12px; font-size: 12px; font-weight: 600; }
    @keyframes yt-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="yt-wrap">
    <div class="yt-card idle" id="yt-card">
      <div class="np-section">
        <div class="np-row">
          <div class="np-player"><div id="yt-player"></div></div>
          <div class="np-body">
            <div class="np-badge" id="np-badge" hidden><span>Ahora suena</span></div>
            <div class="np-idle-text" id="np-idle">Sin reproducción activa</div>
            <div id="np-track" hidden>
              <div class="np-title" id="np-title"></div>
              <div class="np-artist" id="np-artist"></div>
              <div class="np-by" id="np-by" hidden></div>
            </div>
          </div>
        </div>
      </div>
      <div class="queue-section">
        <div class="queue-head">
          <div class="queue-head-left"><span>En cola</span></div>
          <span class="queue-count" id="yt-count">0</span>
        </div>
        <ul class="yt-list" id="yt-list">
          <li class="yt-empty">La cola está vacía</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const card = document.getElementById('yt-card');
    const badge = document.getElementById('np-badge');
    const idle = document.getElementById('np-idle');
    const trackEl = document.getElementById('np-track');
    const title = document.getElementById('np-title');
    const artist = document.getElementById('np-artist');
    const by = document.getElementById('np-by');
    const list = document.getElementById('yt-list');
    const countEl = document.getElementById('yt-count');

    let player = null;
    let playerReady = false;
    let currentId = '';
    let lastState = null;
    let endedSentFor = '';
    let ignoreEndedUntil = 0;
    let loadToken = 0;

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function send(obj) {
      try {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
      } catch {}
    }

    function playerVideoId() {
      try {
        const d = player && player.getVideoData && player.getVideoData();
        return d && d.video_id ? String(d.video_id) : '';
      } catch { return ''; }
    }

    function applyVolume(vol) {
      if (!player || !playerReady) return;
      const n = Math.max(0, Math.min(100, Number(vol) || 80));
      try { player.unMute(); } catch {}
      try { player.setVolume(n); } catch {}
    }

    function loadVideo(videoId, paused) {
      if (!player || !playerReady || !videoId) return;
      if (videoId !== currentId) {
        currentId = videoId;
        endedSentFor = '';
        // Al cambiar de vídeo el iframe a veces dispara ENDED del anterior:
        // ignoramos ended unos segundos para no saltar la pista nueva.
        ignoreEndedUntil = Date.now() + 2500;
        loadToken += 1;
        const token = loadToken;
        try {
          player.loadVideoById({ videoId, startSeconds: 0 });
        } catch {
          try { player.cueVideoById(videoId); } catch {}
        }
        setTimeout(() => {
          if (token !== loadToken || currentId !== videoId) return;
          applyVolume(lastState && lastState.volume);
          try {
            if (paused) player.pauseVideo();
            else player.playVideo();
          } catch {}
          // Algunos embeds arrancan muteados por política de autoplay.
          setTimeout(() => applyVolume(lastState && lastState.volume), 400);
        }, 200);
        return;
      }
      applyVolume(lastState && lastState.volume);
      try {
        if (paused) player.pauseVideo();
        else player.playVideo();
      } catch {}
    }

    function renderNow(now, volume) {
      if (!now || !now.videoId) {
        card.classList.add('idle');
        badge.hidden = true;
        trackEl.hidden = true;
        idle.hidden = false;
        // No stopVideo aquí: un skip con cola manda el siguiente estado al instante;
        // stopVideo disparaba ENDED y vaciaba la cola.
        if (!currentId) return;
        ignoreEndedUntil = Date.now() + 2500;
        currentId = '';
        endedSentFor = '';
        try { if (player && playerReady) player.pauseVideo(); } catch {}
        return;
      }
      card.classList.remove('idle');
      idle.hidden = true;
      badge.hidden = false;
      trackEl.hidden = false;
      title.textContent = now.title || '—';
      artist.textContent = now.channel || '';
      if (now.nickname) {
        by.hidden = false;
        by.textContent = 'Pedida por @' + now.nickname;
      } else {
        by.hidden = true;
      }
      applyVolume(now.volume != null ? now.volume : volume);
      loadVideo(now.videoId, !!now.paused);
    }

    function renderQueue(queue) {
      const q = Array.isArray(queue) ? queue : [];
      countEl.textContent = String(q.length);
      if (!q.length) {
        list.innerHTML = '<li class="yt-empty">La cola está vacía</li>';
        return;
      }
      list.innerHTML = q.map((item, i) => `
        <li class="yt-item">
          <span class="yt-pos">${i + 1}</span>
          <img src="${esc(item.thumb || '')}" alt="" onerror="this.style.visibility='hidden'">
          <div class="yt-info">
            <div class="yt-name">${esc(item.title || '—')}</div>
            <div class="yt-meta">${esc(item.channel || '')}</div>
            <div class="yt-by">${item.nickname ? '@' + esc(item.nickname) : ''}</div>
          </div>
        </li>`).join('');
    }

    function onState(p) {
      lastState = p || {};
      renderQueue(lastState.queue || []);
      renderNow(lastState.now || null, lastState.volume);
    }

    function maybeRequestNext(reason) {
      if (!currentId) return;
      const isErr = reason === 'error' || reason === 'embed';
      // Los errores de embed llegan al momento; no hay que esperar el cooldown del skip.
      if (!isErr && Date.now() < ignoreEndedUntil) return;
      const playingId = playerVideoId() || currentId;
      if (!isErr && playingId && playingId !== currentId) return;
      if (endedSentFor === currentId) return;
      endedSentFor = currentId;
      send({ action: 'youtubeControl', op: 'ended', reason: reason || 'ended' });
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('yt-player', {
        width: '200',
        height: '112',
        playerVars: {
          autoplay: 1,
          controls: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          mute: 0,
          origin: location.origin,
        },
        events: {
          onReady: () => {
            playerReady = true;
            if (lastState) onState(lastState);
          },
          onStateChange: (ev) => {
            // 0 = ENDED — solo si es el vídeo actual y no venimos de un skip/cambio
            if (ev.data === 0) maybeRequestNext('ended');
          },
          onError: (ev) => {
            // 101/150 = no permitido incrustar; 100 = no encontrado; 153 = config/referrer
            const code = Number(ev?.data);
            maybeRequestNext(code === 101 || code === 150 || code === 153 ? 'embed' : 'error');
          },
        },
      });
    };

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    let ws, rt;
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
      ws.onopen = () => {
        clearTimeout(rt);
        send({ action: 'getYoutubeState' });
      };
      ws.onclose = () => { rt = setTimeout(connect, 1500); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === 'youtubeState') onState(m.payload || {});
      };
    }
    connect();
  })();
  </script>
</body>
</html>
