<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay — Contador de victorias PRO</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Cinzel:wght@700;900&family=Exo+2:wght@700;800&family=Fredoka:wght@600;700&family=Inter:wght@700;800&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@800;900&family=Orbitron:wght@700;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800&family=Press+Start+2P&family=Rubik:wght@700;800&family=Titan+One&display=swap');

    html, body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--wp-font, 'Fredoka', system-ui, sans-serif);
    }

    /* El wrapper es lo único que se escala: así el tamaño de texto del panel
       agranda o encoge el overlay entero sin descuadrar ningún diseño. */
    #wrap {
      transform-origin: center center;
      transition: transform 0.16s ease;
    }
    #wrap.pulse { animation: wp-pop 0.34s ease; }
    @keyframes wp-pop {
      0% { transform: scale(var(--wp-scale, 1)); }
      45% { transform: scale(calc(var(--wp-scale, 1) * 1.07)); }
      100% { transform: scale(var(--wp-scale, 1)); }
    }

    .design { display: none; }
    /* Los halos y aros van en box-shadow, que sobresale de la caja del elemento.
       Sin este margen interior la vista previa recorta el borde de Neon y Candy. */
    .design.active { display: block; padding: 22px; }

    /* Texto arcoíris opcional (misma idea que el resto de contadores). */
    @keyframes wp-rainbow { to { background-position: 200% center; } }
    .rainbow-txt {
      background-image: linear-gradient(90deg, #ff004c, #ff8a00, #ffe600, #2bff00, #00e5ff, #2a6bff, #c400ff, #ff004c);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: wp-rainbow 2.8s linear infinite;
    }

    /* ==================== 1. CLASSIC ====================
       Tarjeta oscura vertical: número grande, línea y meta debajo,
       con un trofeo grande de marca de agua al fondo. */
    .cl-card {
      position: relative;
      width: 208px;
      height: 236px;
      border-radius: 18px;
      /* Color base blanco: el separador «/» y cualquier texto sin color propio
         heredarían el negro del navegador y se perderían sobre el fondo oscuro. */
      color: #ffffff;
      background: radial-gradient(120% 100% at 50% 0%, #2a2a30 0%, #191a1e 60%, #131317 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      overflow: hidden;
    }
    .cl-wm {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 150px;
      line-height: 1;
      opacity: 0.12;
      filter: blur(0.4px);
      pointer-events: none;
    }
    .cl-num, .cl-goal {
      position: relative;
      z-index: 2;
      font-weight: 800;
      font-size: 62px;
      line-height: 1;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.75);
    }
    .cl-line {
      position: relative;
      z-index: 2;
      width: 118px;
      height: 5px;
      border-radius: 3px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    /* ==================== 2. VERTICAL / 3. TRANSPARENT ====================
       Barra horizontal: trofeo + etiqueta + cápsula con marcador. */
    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-radius: 16px;
      color: #ffffff;
      background: linear-gradient(180deg, #26262c 0%, #17171b 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.42);
    }
    .bar.plain {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }
    .bar-ico { font-size: 46px; line-height: 1; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5)); }
    .bar-label {
      font-weight: 800;
      font-size: 38px;
      line-height: 1;
      letter-spacing: 0.01em;
      -webkit-text-stroke: 3px rgba(0, 0, 0, 0.55);
      paint-order: stroke fill;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.55);
    }
    .bar-pill {
      display: flex;
      align-items: baseline;
      gap: 2px;
      min-width: 104px;
      justify-content: center;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.55);
      font-variant-numeric: tabular-nums;
    }
    .bar-cur { font-weight: 800; font-size: 30px; line-height: 1; }
    /* La barra va aparte y a plena opacidad: dentro del número de meta quedaba
       apagada y sobre el fondo oscuro casi no se veía. */
    .bar-sep { font-weight: 800; font-size: 26px; line-height: 1; margin: 0 1px; }
    .bar-goal { font-weight: 700; font-size: 24px; line-height: 1; opacity: 0.82; }

    /* ==================== 4. NEON ====================
       Cápsula violeta con borde degradado, barra de progreso y chip. */
    .neon {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-radius: 999px;
      color: #ffffff;
      background: linear-gradient(180deg, #a855f7 0%, #7e22ce 55%, #5b1499 100%);
      box-shadow:
        0 0 0 3px rgba(226, 173, 255, 0.85),
        0 0 22px rgba(168, 85, 247, 0.85),
        0 10px 26px rgba(0, 0, 0, 0.45),
        inset 0 2px 10px rgba(255, 255, 255, 0.28);
    }
    .neon-ico {
      font-size: 40px;
      line-height: 1;
      filter: hue-rotate(230deg) saturate(1.5) brightness(1.15) drop-shadow(0 0 8px rgba(236, 180, 255, 0.9));
    }
    .neon-label {
      font-weight: 800;
      font-style: italic;
      font-size: 34px;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.75), 0 2px 4px rgba(60, 0, 100, 0.6);
    }
    .neon-track {
      /* Son <span>: sin display block el ancho/alto no se aplican y la barra
         de progreso se quedaría en 0 aunque el relleno diga 100%. */
      display: block;
      width: 118px;
      height: 24px;
      border-radius: 999px;
      background: rgba(58, 10, 96, 0.7);
      box-shadow: inset 0 2px 7px rgba(0, 0, 0, 0.55), 0 0 0 2px rgba(232, 190, 255, 0.5);
      overflow: hidden;
    }
    .neon-fill {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffffff 0%, #f0d6ff 100%);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
      transition: width 0.35s ease;
    }
    .neon-chip {
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(45, 6, 78, 0.55);
      box-shadow: inset 0 2px 7px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(232, 190, 255, 0.5);
      font-weight: 800;
      font-size: 24px;
      line-height: 1;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    /* ==================== 5. CANDY ====================
       Cápsula rosa brillante con nubes, destellos y chip claro. */
    .candy {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      border-radius: 999px;
      color: #ffffff;
      background: linear-gradient(180deg, #ff8ec4 0%, #ff5fa8 48%, #ff3f95 100%);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.55),
        0 0 0 7px rgba(255, 120, 180, 0.55),
        0 12px 26px rgba(190, 20, 100, 0.35),
        inset 0 3px 12px rgba(255, 255, 255, 0.55);
      overflow: hidden;
    }
    .candy::before {
      /* Nube/brillo interior que da el aspecto acaramelado. */
      content: '';
      position: absolute;
      left: 22%;
      top: -30%;
      width: 62%;
      height: 118%;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 72%);
      pointer-events: none;
    }
    .candy-ico {
      position: relative;
      z-index: 2;
      font-size: 42px;
      line-height: 1;
      filter: drop-shadow(0 3px 4px rgba(180, 20, 90, 0.45));
    }
    .candy-label {
      position: relative;
      z-index: 2;
      font-weight: 800;
      font-size: 36px;
      line-height: 1;
      color: #ffffff;
      -webkit-text-stroke: 4px rgba(255, 105, 170, 0.9);
      paint-order: stroke fill;
      text-shadow: 0 3px 0 rgba(214, 40, 120, 0.5);
    }
    .candy-chip {
      position: relative;
      z-index: 2;
      min-width: 92px;
      text-align: center;
      padding: 8px 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd7e9 0%, #ffb2d5 100%);
      box-shadow: inset 0 2px 6px rgba(200, 40, 110, 0.28), 0 0 0 3px rgba(255, 255, 255, 0.85);
      font-weight: 800;
      font-size: 26px;
      line-height: 1;
      color: #d61f76;
      font-variant-numeric: tabular-nums;
    }
    .candy-spark {
      position: absolute;
      z-index: 3;
      color: #ffffff;
      opacity: 0.9;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
    }
    .candy-spark.s1 { left: 16%; top: 12%; font-size: 15px; }
    .candy-spark.s2 { left: 27%; bottom: 14%; font-size: 11px; }
    .candy-spark.s3 { right: 34%; top: 16%; font-size: 12px; }
  </style>
</head>
<body>
  <div id="wrap" aria-live="polite">
    <!-- 1. Classic -->
    <div class="design d-classic" data-design="classic">
      <div class="cl-card">
        <div class="cl-wm">🏆</div>
        <div class="cl-num js-cur">0</div>
        <div class="cl-line"></div>
        <div class="cl-goal js-goal">5</div>
      </div>
    </div>

    <!-- 2. Vertical (barra con fondo) -->
    <div class="design d-vertical" data-design="vertical">
      <div class="bar">
        <span class="bar-ico">🏆</span>
        <span class="bar-label js-label">Win</span>
        <span class="bar-pill">
          <span class="bar-cur js-cur">0</span>
          <span class="bar-sep js-sep">/</span>
          <span class="bar-goal js-goal">5</span>
        </span>
      </div>
    </div>

    <!-- 3. Transparent (sin fondo) -->
    <div class="design d-transparent" data-design="transparent">
      <div class="bar plain">
        <span class="bar-ico">🏆</span>
        <span class="bar-label js-label">Win</span>
        <span class="bar-pill">
          <span class="bar-cur js-cur">0</span>
          <span class="bar-sep js-sep">/</span>
          <span class="bar-goal js-goal">5</span>
        </span>
      </div>
    </div>

    <!-- 4. Neon -->
    <div class="design d-neon" data-design="neon">
      <div class="neon">
        <span class="neon-ico">🏆</span>
        <span class="neon-label js-label">Win</span>
        <span class="neon-track"><span class="neon-fill" id="neon-fill"></span></span>
        <span class="neon-chip"><span class="js-cur">0</span>/<span class="js-goal">5</span></span>
      </div>
    </div>

    <!-- 5. Candy -->
    <div class="design d-candy" data-design="candy">
      <div class="candy">
        <span class="candy-spark s1">✦</span>
        <span class="candy-spark s2">✦</span>
        <span class="candy-spark s3">✧</span>
        <span class="candy-ico">🏆</span>
        <span class="candy-label js-label">Win</span>
        <span class="candy-chip"><span class="js-cur">0</span>/<span class="js-goal">5</span></span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const isEmbed = params.get('embed') === '1';
      const wrap = document.getElementById('wrap');
      const neonFill = document.getElementById('neon-fill');
      const panels = {};
      document.querySelectorAll('.design').forEach((el) => { panels[el.dataset.design] = el; });

      // Mismas claves que el selector de fuentes del panel (CFG_FONTS): si falta
      // alguna, el usuario la elige y el overlay se queda con la anterior.
      const FONTS = {
        pressstart: "'Press Start 2P', monospace", exo2: "'Exo 2', system-ui, sans-serif",
        fredoka: "'Fredoka', system-ui, sans-serif", cinzel: "'Cinzel', Georgia, serif",
        luckiest: "'Luckiest Guy', system-ui, sans-serif", bangers: "'Bangers', system-ui, sans-serif",
        lilita: "'Lilita One', system-ui, sans-serif", titan: "'Titan One', system-ui, sans-serif",
        bungee: "'Bungee', system-ui, sans-serif", rubik: "'Rubik', system-ui, sans-serif",
        oswald: "'Oswald', system-ui, sans-serif", bebas: "'Bebas Neue', Impact, sans-serif",
        montserrat: "'Montserrat', system-ui, sans-serif", poppins: "'Poppins', system-ui, sans-serif",
        orbitron: "'Orbitron', system-ui, sans-serif", inter: "'Inter', system-ui, sans-serif",
        system: 'system-ui, sans-serif',
      };
      const DESIGNS = ['classic', 'vertical', 'transparent', 'neon', 'candy'];

      const state = {
        design: 'classic', label: 'Win', wins: 0, winsMax: 5,
        font: 'fredoka', fontSize: 28, rainbow: false,
        textColor: '#ffffff', accentColor: '#ffffff',
      };

      // El número es libre: puede pasar de la meta y bajar de 0 (igual que el resto
      // de contadores de victorias del panel). La meta solo es el denominador.
      function clampWins(v) {
        const n = parseInt(v, 10);
        const x = Number.isFinite(n) ? n : 0;
        return Math.max(-999999, Math.min(999999, x));
      }

      function mergeConfig(c) {
        if (!c || typeof c !== 'object') return;
        if (c.design != null && DESIGNS.includes(String(c.design))) state.design = String(c.design);
        if (c.label != null) state.label = String(c.label).trim().slice(0, 48) || 'Win';
        if (c.font != null && FONTS[c.font]) state.font = c.font;
        if (c.rainbow != null) state.rainbow = !!c.rainbow;
        const maxRaw = c.winsMax != null ? c.winsMax : c.max;
        if (maxRaw != null) {
          const m = parseInt(maxRaw, 10);
          if (Number.isFinite(m)) state.winsMax = Math.max(1, Math.min(999999, m));
        }
        if (c.wins != null) state.wins = clampWins(c.wins);
        if (c.textColor) state.textColor = String(c.textColor);
        if (c.accentColor) state.accentColor = String(c.accentColor);
        const fs = parseInt(c.fontSize, 10);
        if (Number.isFinite(fs) && fs > 8 && fs < 200) state.fontSize = fs;
      }

      function render() {
        const shown = testDisplay != null ? testDisplay : state.wins;
        const panel = panels[state.design] || panels.classic;
        Object.values(panels).forEach((p) => p.classList.remove('active'));
        panel.classList.add('active');

        document.documentElement.style.setProperty('--wp-font', FONTS[state.font] || FONTS.fredoka);

        panel.querySelectorAll('.js-cur').forEach((el) => { el.textContent = shown; });
        panel.querySelectorAll('.js-goal').forEach((el) => { el.textContent = state.winsMax; });
        panel.querySelectorAll('.js-label').forEach((el) => { el.textContent = state.label; });

        // Neon y Candy llevan su propia paleta: los colores del panel solo pintan
        // los diseños neutros, si no se pierde el estilo del diseño.
        const neutral = state.design === 'classic' || state.design === 'vertical' || state.design === 'transparent';
        panel.querySelectorAll('.js-label, .js-goal, .js-sep').forEach((el) => {
          el.classList.toggle('rainbow-txt', state.rainbow && neutral);
          el.style.color = state.rainbow && neutral ? '' : (neutral ? state.textColor : '');
        });
        panel.querySelectorAll('.js-cur').forEach((el) => {
          el.classList.toggle('rainbow-txt', state.rainbow && neutral);
          el.style.color = state.rainbow && neutral ? '' : (neutral ? state.accentColor : '');
        });

        if (state.design === 'neon' && neonFill) {
          const pct = Math.max(0, Math.min(100, (shown / Math.max(1, state.winsMax)) * 100));
          neonFill.style.width = pct + '%';
        }

        const scale = state.fontSize / 28;
        wrap.style.setProperty('--wp-scale', scale);
        wrap.style.transform = 'scale(' + scale + ')';
        fitEmbed(scale);
      }

      function pulse() {
        wrap.classList.remove('pulse');
        void wrap.offsetWidth;
        wrap.classList.add('pulse');
        setTimeout(() => wrap.classList.remove('pulse'), 380);
      }

      let testRaf = null;
      let testDisplay = null;
      function cancelTest() {
        if (testRaf != null) { cancelAnimationFrame(testRaf); testRaf = null; }
        testDisplay = null;
      }
      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
      function runTestCountUp() {
        cancelTest();
        pulse();
        const end = clampWins(state.wins);
        let start, target, backToZero = false;
        if (end === 0) { start = 0; target = Math.max(1, Math.min(6, state.winsMax)); backToZero = true; }
        else { start = Math.max(0, end - 8); if (start >= end) start = Math.max(0, end - 1); target = end; }
        const dur = 2200;
        const t0 = performance.now();
        function tick(now) {
          const u = Math.min(1, (now - t0) / dur);
          testDisplay = Math.round(start + (target - start) * easeOutCubic(u));
          render();
          if (u < 1) { testRaf = requestAnimationFrame(tick); return; }
          testRaf = null;
          if (backToZero) {
            testDisplay = 0; render();
            setTimeout(() => { testDisplay = null; render(); }, 320);
          } else { testDisplay = null; render(); }
        }
        testDisplay = start;
        render();
        testRaf = requestAnimationFrame(tick);
      }

      function fitEmbed(scale) {
        if (!isEmbed) return;
        const panel = panels[state.design] || panels.classic;
        const r = panel.getBoundingClientRect();
        if (!r.width || !r.height) return;
        // getBoundingClientRect ya viene escalado: se divide para medir el tamaño real.
        const w = r.width / scale;
        const h = r.height / scale;
        const s = Math.min(scale, (window.innerWidth - 16) / w, (window.innerHeight - 16) / h);
        wrap.style.transform = 'scale(' + Math.max(0.05, s) + ')';
      }

      // ---- WebSocket (misma room que el resto de overlays) ----
      let ws, rt;
      function connectWS() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
        ws.onopen = () => clearTimeout(rt);
        ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
        ws.onmessage = (ev) => {
          let m; try { m = JSON.parse(ev.data); } catch { return; }
          if (m.type === 'settings') {
            if (m.payload && m.payload.winsCounterPro) { mergeConfig(m.payload.winsCounterPro); render(); }
          } else if (m.type === 'winsProTest') {
            if (!isEmbed) runTestCountUp();
          } else if (m.type === 'winsProReset') {
            if (!isEmbed) { cancelTest(); render(); }
          }
        };
      }

      // ---- Control desde el panel (vista previa embebida) ----
      window.addEventListener('message', (e) => {
        const d = e.data;
        if (!d || d.kind !== 'wins_counter_pro') return;
        if (d.type === 'config') { cancelTest(); mergeConfig(d.config); render(); }
        else if (d.type === 'test') runTestCountUp();
        else if (d.type === 'reset') { cancelTest(); render(); }
      });

      window.addEventListener('resize', () => render());
      render();
      connectWS();
    })();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
