<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Contador de meta</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Fredoka:wght@600;700&family=Inter:wght@700;800;900&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800;900&family=Titan+One&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; background: transparent !important; font-family: var(--tf-font-stack, 'Rubik', system-ui, sans-serif); }
    html.embed, html.embed body { width: 100%; height: 100%; }
    html.embed body { display: flex; align-items: center; justify-content: center; }
    html.embed .wrap { transform: scale(var(--fit, 1)); transform-origin: center center; }
    .wrap { width: 800px; height: 450px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 24px 16px; background: transparent;
      --title-color: #ffffff; --title-stroke: #242424; --counter-color: #ebc94d; --counter-stroke: #3a3320; --tc1: #ff00aa; --tc2: #00ddff; --tc3: #ffcc00; --tf-font-stack: 'Rubik', system-ui, sans-serif; }
    .img-wrap { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; max-height: 240px; min-height: 200px; margin: 4px 0 6px; }
    .img-wrap::before { content: ''; position: absolute; width: min(320px, 85vw); height: min(320px, 85vw); max-height: 260px; border-radius: 50%; z-index: 0; pointer-events: none; background: radial-gradient(circle at 50% 45%, rgba(255,130,180,.22) 0%, rgba(120,160,255,.12) 38%, rgba(40,200,160,.08) 58%, transparent 72%); filter: blur(.5px); }
    .hero-img { position: relative; z-index: 1; max-width: 280px; max-height: 220px; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(0,0,0,.45)) drop-shadow(0 0 28px rgba(255,150,200,.15)); will-change: transform; animation: gift-float 3.2s ease-in-out infinite; }
    @keyframes gift-float { 0% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-12px) rotate(1.2deg); } 100% { transform: translateY(0) rotate(-1.2deg); } }
    .hero-ph { position: relative; z-index: 1; font-size: 150px; filter: drop-shadow(0 8px 20px rgba(0,0,0,.45)); animation: gift-float 3.2s ease-in-out infinite; }
    .title { font-family: var(--tf-font-stack, 'Rubik', sans-serif); font-weight: 900; font-size: 50px; letter-spacing: .04em; line-height: 1.05; margin: 0 0 6px; max-width: 96%; text-align: center; text-transform: uppercase; color: var(--title-color); -webkit-text-stroke: 3px var(--title-stroke); paint-order: stroke fill; text-shadow: 0 4px 0 rgba(15,15,22,.5), 0 7px 14px rgba(0,0,0,.5); }
    .title--rainbow { background: linear-gradient(92deg, #ff1744, #ff9100, #ffea00, #00e676, #00b0ff, #e040fb, #ff1744); background-size: 300% 100%; animation: title-rainbow 4.5s linear infinite; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; -webkit-text-stroke: 0; filter: drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 5px 12px rgba(0,0,0,.4)); }
    @keyframes title-rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    .title--gradient { background: linear-gradient(100deg, var(--tc1), var(--tc2), var(--tc3)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; -webkit-text-stroke: 0; filter: drop-shadow(0 3px 0 rgba(0,0,0,.5)) drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
    .counter { font-family: var(--tf-font-stack, 'Rubik', sans-serif); font-weight: 900; font-size: 58px; letter-spacing: .03em; color: var(--counter-color); text-align: center; margin: 0; -webkit-text-stroke: 3px var(--counter-stroke); paint-order: stroke fill; text-shadow: 0 3px 0 rgba(20,15,10,.45), 0 5px 12px rgba(0,0,0,.45); transition: transform .18s ease; }
    .counter.bump { transform: scale(1.18); }
    .counter.reached { animation: reached-glow 1.4s ease-in-out infinite; }
    @keyframes reached-glow { 0%,100% { filter: drop-shadow(0 0 6px rgba(255,210,80,.5)); } 50% { filter: drop-shadow(0 0 22px rgba(255,210,80,.95)); } }
</style>
</head>
<body>
  <div class="wrap" id="root">
    <div class="img-wrap">
      <img class="hero-img" id="gift-img" alt="" referrerpolicy="no-referrer" style="display:none">
      <span class="hero-ph" id="gift-ph">🎯</span>
    </div>
    <div class="title title--rainbow" id="el-title">MY CHALLENGE</div>
    <div class="counter" id="el-counter">0 / 50</div>
  </div>

  <script>
(function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    const FONTS = { luckiest: "'Luckiest Guy', system-ui, sans-serif", bangers: "'Bangers', system-ui, sans-serif", lilita: "'Lilita One', system-ui, sans-serif", titan: "'Titan One', system-ui, sans-serif", fredoka: "'Fredoka', system-ui, sans-serif", bungee: "'Bungee', system-ui, sans-serif", rubik: "'Rubik', system-ui, sans-serif", oswald: "'Oswald', system-ui, sans-serif", bebas: "'Bebas Neue', Impact, sans-serif", montserrat: "'Montserrat', system-ui, sans-serif", poppins: "'Poppins', system-ui, sans-serif", orbitron: "'Orbitron', system-ui, sans-serif", inter: "'Inter', system-ui, sans-serif", system: "system-ui, sans-serif" };

    let cfg = { title: 'MY CHALLENGE', titleRainbow: true, tc1: '#ff00aa', tc2: '#00ddff', tc3: '#ffcc00', titleColor: '#ffffff', counterColor: '#ebc94d', titleStroke: '#242424', counterStroke: '#3a3320', font: 'rubik', goal: 50, image: '' };
    let count = 0;

    const $ = (id) => document.getElementById(id);
    function applyStyle() {
      const root = $('root');
      root.style.setProperty('--tf-font-stack', FONTS[cfg.font] || FONTS.rubik);
      root.style.setProperty('--title-color', cfg.titleColor);
      root.style.setProperty('--counter-color', cfg.counterColor);
      root.style.setProperty('--title-stroke', cfg.titleStroke);
      root.style.setProperty('--counter-stroke', cfg.counterStroke);
      root.style.setProperty('--tc1', cfg.tc1);
      root.style.setProperty('--tc2', cfg.tc2);
      root.style.setProperty('--tc3', cfg.tc3);
      const t = $('el-title');
      t.textContent = cfg.title || 'MY CHALLENGE';
      // Arcoíris ON = degradado animado. OFF = color sólido del título (sin degradado).
      t.classList.toggle('title--rainbow', !!cfg.titleRainbow);
      t.classList.remove('title--gradient');
      // imagen del regalo a contar (si se eligió uno)
      const img = $('gift-img'), ph = $('gift-ph');
      const url = (cfg.image || '').trim();
      if (url) { img.style.display = ''; ph.style.display = 'none'; img.src = url; img.onerror = () => { img.style.display = 'none'; ph.style.display = ''; }; }
      else { img.style.display = 'none'; ph.style.display = ''; }
    }
    function render(bump) {
      const goal = Math.max(1, Number(cfg.goal) || 50);
      const el = $('el-counter');
      el.textContent = count.toLocaleString('es-ES') + ' / ' + goal.toLocaleString('es-ES');
      el.classList.toggle('reached', count >= goal);
      if (bump) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    }
    function setCount(n, goal, bump) {
      count = Math.max(0, Number(n) || 0);
      if (goal != null) cfg.goal = goal;
      render(bump);
    }
    let testTimer;
    function runTest() {
      clearTimeout(testTimer);
      count = 0; render();
      const goal = Math.max(1, Number(cfg.goal) || 50);
      const step = () => { count = Math.min(goal, count + Math.max(1, Math.round(goal / 12))); render(true); if (count < goal) testTimer = setTimeout(step, 450); };
      testTimer = setTimeout(step, 350);
    }

    let ws, rt;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
      ws.onopen = () => clearTimeout(rt);
      ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === 'giftCounter') { if (!isEmbed) setCount(m.payload.count, m.payload.goal, true); }
        else if (m.type === 'settings') { if (m.payload && m.payload.giftCounter) { cfg = Object.assign(cfg, m.payload.giftCounter); applyStyle(); render(); } }
        else if (m.type === 'giftCounterTest') { if (!isEmbed) runTest(); }
      };
    }
    window.addEventListener('message', (e) => {
      const d = e.data; if (!d || d.kind !== 'gcounter') return;
      if (d.type === 'config') { cfg = Object.assign(cfg, d.config); applyStyle(); render(); }
      else if (d.type === 'test') runTest();
      else if (d.type === 'reset') { isEmbed ? runTest() : (count = 0, render()); }
    });

    if (isEmbed) {
      document.documentElement.classList.add('embed');
      const fit = () => document.documentElement.style.setProperty('--fit', Math.min(window.innerWidth / 800, window.innerHeight / 450));
      fit(); window.addEventListener('resize', fit);
    }
    applyStyle();
    if (isEmbed) { runTest(); } else { render(); }
    connectWS();
  })();
  </script>
</body>
</html>
