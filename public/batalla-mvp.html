<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — MVP de la batalla (PK)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Exo+2:wght@700;800;900&family=Fredoka:wght@600;700&family=Inter:wght@600;700;800&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Press+Start+2P&family=Rubik:wght@700;800;900&family=Titan+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
      font-family: var(--tf-font-stack, 'Rubik', system-ui, sans-serif);
    }
    html.stage-800x600, html.stage-800x600 body {
      width: 800px; height: 600px;
    }
    html.embed, html.embed body { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    html.embed .stage {
      width: max-content;
      height: max-content;
      max-width: 760px;
      padding: 16px 20px;
    }
    .stage {
      width: 800px; height: 600px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 24px 32px;
      transform: scale(var(--tf-fit, 1)); transform-origin: center center;
      opacity: 0; pointer-events: none;
      transition: opacity .3s ease;
      --name-color: #ffffff;
      --line-color: #ffe566;
      --score-color: rgba(255,255,255,.72);
      --ring1: #ffe98a; --ring2: #f0b400;
      --tc1: #ff00aa; --tc2: #00ddff; --tc3: #ffcc00;
      --tf-font-stack: 'Rubik', system-ui, sans-serif;
      --name-size: 36px;
      --line-size: 22px;
    }
    .stage.is-on { opacity: 1; }
    .panel {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; max-width: 100%;
    }
    /* Marco dorado circular: foto detrás del PNG, en el hueco del aro */
    .frame-hero {
      position: relative;
      width: 280px;
      height: 280px;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.45));
    }
    .avatar-hole {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 72%;
      height: 72%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      overflow: hidden;
      z-index: 1;
      background: #111;
      -webkit-clip-path: circle(50% at 50% 50%);
      clip-path: circle(50% at 50% 50%);
    }
    .avatar-hole .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      border: 0;
      border-radius: 50%;
    }
    .frame-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      z-index: 2;
      pointer-events: none;
      user-select: none;
    }
    .ov-title {
      margin: 2px 0 0; max-width: 92%;
      font-family: var(--tf-font-stack);
      font-weight: 900; font-size: var(--name-size);
      color: var(--name-color);
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 3px 0 rgba(0,0,0,.55), 0 0 22px rgba(0,0,0,.35);
      padding: 0 12px;
      -webkit-text-fill-color: var(--name-color);
      background: none;
    }
    .ov-title.title--rainbow {
      background: linear-gradient(90deg, var(--tc1), var(--tc2), var(--tc3), var(--tc1), var(--tc2), var(--tc3), var(--tc1));
      background-size: 280% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
      text-shadow: none;
      animation: title-rainbow-move 3.2s linear infinite;
      filter: drop-shadow(0 3px 0 rgba(0,0,0,.55));
    }
    .ov-title.is-empty { display: none !important; }
    .name {
      margin: 0; max-width: 92%;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800; font-size: calc(var(--name-size) * 0.55);
      color: rgba(255,255,255,.9);
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 2px 0 rgba(0,0,0,.5);
      padding: 0 10px;
    }
    .name.is-empty { display: none !important; }
    @keyframes title-rainbow-move {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .line {
      margin: 0; text-align: center; max-width: 92%;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800; font-size: var(--line-size); line-height: 1.3;
      color: var(--line-color);
      text-shadow: 0 2px 0 rgba(0,0,0,.55);
    }
    .score {
      font-weight: 900; font-size: 18px; color: var(--score-color);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 0 rgba(0,0,0,.5);
    }
    .stage.hide-text .ov-title,
    .stage.hide-text .name,
    .stage.hide-text .line,
    .stage.hide-text .score { display: none !important; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="panel">
      <div class="frame-hero">
        <div class="avatar-hole"><img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer" /></div>
        <img class="frame-img" src="/overlays/marco-mvp-top1.png?v=2" alt="" />
      </div>
      <div class="ov-title" id="title">FAN MVP</div>
      <div class="name" id="name"></div>
      <p class="line" id="line"></p>
      <div class="score" id="score"></div>
    </div>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    const STAGE_W = 800;
    const STAGE_H = 600;
    if (isEmbed) document.documentElement.classList.add('embed');
    else document.documentElement.classList.add('stage-800x600');
    const FALLBACK = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
    const DEMO = '/jarron/lv.png';

    const FONTS = {
      pressstart: "'Press Start 2P', monospace",
      exo2: "'Exo 2', system-ui, sans-serif",
      luckiest: "'Luckiest Guy', system-ui, sans-serif",
      bangers: "'Bangers', system-ui, sans-serif",
      lilita: "'Lilita One', system-ui, sans-serif",
      titan: "'Titan One', system-ui, sans-serif",
      fredoka: "'Fredoka', system-ui, sans-serif",
      bungee: "'Bungee', system-ui, sans-serif",
      rubik: "'Rubik', system-ui, sans-serif",
      oswald: "'Oswald', system-ui, sans-serif",
      bebas: "'Bebas Neue', Impact, sans-serif",
      montserrat: "'Montserrat', system-ui, sans-serif",
      poppins: "'Poppins', system-ui, sans-serif",
      orbitron: "'Orbitron', system-ui, sans-serif",
      inter: "'Inter', system-ui, sans-serif",
      system: 'system-ui, sans-serif',
    };

    let embedFit = null;
    (function fit() {
      function apply() {
        if (!isEmbed) {
          document.documentElement.style.setProperty('--tf-fit', '1');
          return;
        }
        const stage = document.getElementById('stage');
        if (!stage) return;
        document.documentElement.style.setProperty('--tf-fit', '1');
        void stage.offsetWidth;
        const pad = 20;
        const w = Math.max(stage.scrollWidth, stage.offsetWidth, 280);
        const h = Math.max(stage.scrollHeight, stage.offsetHeight, 200);
        const k = Math.min(
          ((innerWidth || 1) - pad) / w,
          ((innerHeight || 1) - pad) / h,
          2.6
        );
        document.documentElement.style.setProperty('--tf-fit', String(Math.max(0.4, k) || 1));
      }
      embedFit = apply;
      apply();
      addEventListener('resize', apply);
      setTimeout(apply, 120);
      setTimeout(apply, 450);
    })();

    let cfg = {
      title: 'FAN MVP',
      lineTpl: 'decidió la pelea con {n} puntos',
      lineNoPts: '',
      font: 'rubik',
      titleRainbow: true,
      showText: true,
      tc1: '#ff00aa', tc2: '#00ddff', tc3: '#ffcc00',
      nameColor: '#ffffff',
      lineColor: '#ffe566',
      scoreColor: '#b8b8c2',
      ring1: '#ffe98a',
      ring2: '#f0b400',
      nameSize: 36,
      lineSize: 22,
    };

    const el = {
      stage: document.getElementById('stage'),
      avatar: document.getElementById('avatar'),
      title: document.getElementById('title'),
      name: document.getElementById('name'),
      line: document.getElementById('line'),
      score: document.getElementById('score'),
    };

    let demo = false;
    let wasLive = false;
    let holding = false;
    let current = null;
    let scores = { host: 0, rival: 0 };

    function fmt(n) {
      return Math.max(0, Math.round(Number(n) || 0)).toLocaleString('es-ES');
    }
    function titleText() {
      return String(cfg.title || cfg.badgeText || '').trim();
    }
    function applyStyle() {
      const fontKey = FONTS[cfg.font] ? cfg.font : 'rubik';
      const stack = FONTS[fontKey];
      el.stage.style.setProperty('--tf-font-stack', stack);
      document.documentElement.style.setProperty('--tf-font-stack', stack);
      document.documentElement.dataset.font = fontKey;
      el.stage.style.setProperty('--name-color', cfg.nameColor || '#ffffff');
      el.stage.style.setProperty('--line-color', cfg.lineColor || '#ffe566');
      el.stage.style.setProperty('--score-color', cfg.scoreColor || '#b8b8c2');
      el.stage.style.setProperty('--ring1', cfg.ring1 || '#ffe98a');
      el.stage.style.setProperty('--ring2', cfg.ring2 || '#f0b400');
      el.stage.style.setProperty('--tc1', cfg.tc1 || '#ff00aa');
      el.stage.style.setProperty('--tc2', cfg.tc2 || '#00ddff');
      el.stage.style.setProperty('--tc3', cfg.tc3 || '#ffcc00');
      el.stage.style.setProperty('--name-size', Math.max(22, Math.min(52, Number(cfg.nameSize) || 36)) + 'px');
      el.stage.style.setProperty('--line-size', Math.max(14, Math.min(32, Number(cfg.lineSize) || 22)) + 'px');
      const t = titleText();
      el.title.textContent = t || 'MVP';
      el.title.classList.toggle('is-empty', !t);
      el.title.classList.toggle('title--rainbow', !!cfg.titleRainbow);
      el.stage.classList.toggle('hide-text', cfg.showText === false);
    }
    function setAvatar(url) {
      const src = String(url || '').trim() || (isEmbed ? DEMO : FALLBACK);
      el.avatar.onerror = function () { this.onerror = null; this.src = isEmbed ? DEMO : FALLBACK; };
      el.avatar.src = src;
    }
    function lineFor(pts) {
      const n = Math.max(0, Math.round(Number(pts) || 0));
      if (n > 0) {
        const tpl = cfg.lineTpl || 'decidió la pelea con {n} puntos';
        return tpl.replace('{n}', fmt(n));
      }
      return cfg.lineNoPts || '';
    }
    function paint(mvp) {
      if (mvp && current && String(mvp.uniqueId || '') && String(mvp.uniqueId) === String(current.uniqueId || '')) {
        mvp = { ...mvp, points: Math.max(Number(mvp.points) || 0, Number(current.points) || 0) };
      }
      current = mvp || null;
      if (!mvp) {
        setAvatar('');
        el.name.textContent = '';
        el.name.classList.add('is-empty');
        el.line.textContent = '';
        el.score.textContent = '';
        return;
      }
      setAvatar(mvp.photo);
      const nick = String(mvp.nickname || '').trim();
      el.name.textContent = nick;
      el.name.classList.toggle('is-empty', !nick);
      el.line.textContent = lineFor(mvp.points);
      if (holding) el.score.textContent = `Final ${fmt(scores.host)} — ${fmt(scores.rival)}`;
      else el.score.textContent = `${fmt(scores.host)} — ${fmt(scores.rival)}`;
    }
    function showOn() {
      el.stage.classList.add('is-on');
      if (typeof embedFit === 'function') requestAnimationFrame(embedFit);
    }
    function hide() {
      el.stage.classList.remove('is-on');
      holding = false;
      current = null;
      paint(null);
    }
    function pickTop(payload) {
      if (payload?.armyTopHost && payload.armyTopHost.points > 0) return payload.armyTopHost;
      const top3 = Array.isArray(payload?.armyTop3Host) ? payload.armyTop3Host : [];
      if (top3[0] && top3[0].points > 0) return top3[0];
      // Fallback: streamer host
      const h = payload?.host;
      if (h && (h.photo || h.nickname || h.uniqueId)) {
        return {
          uniqueId: h.uniqueId || '',
          nickname: h.nickname || 'Tú',
          photo: h.photo || '',
          points: Math.max(0, Math.round(Number(payload.pointsHost) || 0)),
        };
      }
      return null;
    }
    function applyPk(payload) {
      if (!payload || typeof payload !== 'object') return;
      // PK real cancela el modo Testear (si no, se queda pegado el demo)
      if (payload.live && demo) demo = false;
      if (demo) return;
      const live = !!payload.live;
      if (payload.pointsHost != null) scores.host = Number(payload.pointsHost) || 0;
      if (payload.pointsRival != null) scores.rival = Number(payload.pointsRival) || 0;

      if (live && !wasLive) {
        // Nueva batalla → reiniciar
        holding = false;
        paint(null);
      }

      if (live) {
        holding = false;
        const top = pickTop(payload);
        if (top) paint(top);
        showOn();
      } else if (wasLive && !live) {
        // Terminó: mantener visible hasta la siguiente
        holding = !!current;
        if (holding) showOn();
      } else if (!live && !holding) {
        hide();
      }
      wasLive = live;
    }
    function demoFill() {
      demo = true;
      scores = { host: 1171, rival: 44 };
      paint({ uniqueId: 'mvp_demo', nickname: 'Arce Gonzalez', photo: DEMO, points: 820 });
      showOn();
    }
    function resetLocal() {
      demo = false;
      wasLive = false;
      holding = false;
      scores = { host: 0, rival: 0 };
      hide();
    }

    let ws, reconnectTimer;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
      ws.onopen = () => clearTimeout(reconnectTimer);
      ws.onclose = () => { reconnectTimer = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'pkBattle') applyPk(msg.payload || {});
        if (msg.type === 'pkBattleMvp' && msg.payload?.mvp) {
          if (msg.payload.demo) {
            demo = true;
            scores.host = Number(msg.payload.scoreHost) || 1171;
            scores.rival = Number(msg.payload.scoreRival) || 44;
            paint(msg.payload.mvp);
            holding = false;
            showOn();
          } else {
            // MVP real (fin de batalla): salir de Testear
            demo = false;
            scores.host = Number(msg.payload.scoreHost) || scores.host;
            scores.rival = Number(msg.payload.scoreRival) || scores.rival;
            paint(msg.payload.mvp);
            holding = true;
            showOn();
          }
        }
        if (msg.type === 'pkBattleMvpReset' || msg.type === 'pkBattleReset') resetLocal();
        if (msg.type === 'settings' && msg.payload?.batallaMvp) {
          cfg = Object.assign(cfg, msg.payload.batallaMvp);
          applyStyle();
          if (current) paint(current);
        }
      };
    }
    connectWS();

    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.kind !== 'batallaMvp') return;
      if (d.type === 'config' && d.config) {
        cfg = Object.assign(cfg, d.config);
        applyStyle();
        if (current) paint(current);
      } else if (d.type === 'test') demoFill();
      else if (d.type === 'reset') resetLocal();
    });

    applyStyle();
    if (isEmbed) setTimeout(demoFill, 400);
  })();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
