<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay — Ruleta de regalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800;900&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Exo 2', system-ui, sans-serif;
  }

  #stage {
    width: min(960px, 96vw);
    opacity: 0;
    transform: translateY(14px) scale(.96);
    pointer-events: none;
    transition: opacity .32s ease, transform .38s cubic-bezier(.2,.9,.2,1.1);
  }
  #stage.show { opacity: 1; transform: none; }
  #stage.impact .roulette-shell {
    animation: hud-impact .42s cubic-bezier(.2,.85,.3,1.2);
  }

  .roulette-shell {
    position: relative;
    padding: 14px 12px 10px;
    border-radius: 16px;
    background:
      linear-gradient(180deg, rgba(10, 22, 48, .72), rgba(6, 12, 28, .55));
    border: 1px solid rgba(34, 211, 238, .42);
    box-shadow:
      0 0 0 1px rgba(168, 85, 247, .18),
      0 0 28px rgba(34, 211, 238, .22),
      0 16px 40px rgba(0, 0, 0, .45),
      inset 0 1px 0 rgba(255, 255, 255, .08);
  }
  .roulette-shell::before,
  .roulette-shell::after {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    pointer-events: none;
    z-index: 6;
  }
  .roulette-shell::before {
    top: 6px; left: 6px;
    border-top: 2px solid #22d3ee;
    border-left: 2px solid #22d3ee;
    box-shadow: -2px -2px 12px rgba(34, 211, 238, .35);
  }
  .roulette-shell::after {
    bottom: 6px; right: 6px;
    border-bottom: 2px solid #e879f9;
    border-right: 2px solid #e879f9;
    box-shadow: 2px 2px 12px rgba(232, 121, 249, .35);
  }

  .roulette-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 4px 8px;
    min-height: 18px;
  }
  .roulette-tag {
    font-family: Orbitron, 'Exo 2', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #7dd3fc;
    text-shadow: 0 0 12px rgba(34, 211, 238, .55);
  }
  .roulette-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(255,255,255,.55);
  }
  .roulette-status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 10px #22d3ee;
  }
  .roulette-container.is-spinning .roulette-status .dot {
    background: #f0abfc;
    box-shadow: 0 0 12px #e879f9;
    animation: pulse-dot .55s ease-in-out infinite;
  }
  .roulette-container.landed .roulette-status .dot {
    background: #fde68a;
    box-shadow: 0 0 14px #fbbf24;
    animation: none;
  }

  .roulette-container { position: relative; }

  .roulette-pointer {
    position: absolute; left: 50%; top: 28px; z-index: 8;
    width: 0; height: 0; margin-left: -8px;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid #22d3ee;
    filter:
      drop-shadow(0 0 8px rgba(34, 211, 238, .95))
      drop-shadow(0 4px 8px rgba(0,0,0,.45));
  }
  .roulette-container.is-spinning .roulette-pointer {
    animation: pointer-pulse .45s ease-in-out infinite;
  }

  .center-beam {
    position: absolute;
    left: 50%; top: 42px; bottom: 18px;
    width: 2px; margin-left: -1px; z-index: 7;
    background: linear-gradient(180deg, rgba(34,211,238,.95), rgba(232,121,249,.35), transparent);
    box-shadow: 0 0 14px rgba(34, 211, 238, .75);
    pointer-events: none;
  }
  .center-frame {
    position: absolute;
    left: 50%; top: 50%; z-index: 6;
    width: 98px; height: 108px;
    margin: -42px 0 0 -49px;
    border-radius: 12px;
    border: 2px solid rgba(34, 211, 238, .85);
    box-shadow:
      0 0 0 1px rgba(232, 121, 249, .35),
      0 0 22px rgba(34, 211, 238, .45),
      inset 0 0 18px rgba(34, 211, 238, .12);
    pointer-events: none;
  }
  .roulette-container.is-spinning .center-frame {
    animation: frame-pulse .5s ease-in-out infinite;
  }
  .roulette-container.landed .center-frame {
    border-color: #fde68a;
    box-shadow:
      0 0 0 1px rgba(251, 191, 36, .5),
      0 0 28px rgba(251, 191, 36, .55),
      inset 0 0 20px rgba(253, 230, 138, .18);
    animation: none;
  }

  .roulette-viewport {
    position: relative;
    overflow: hidden;
    height: 132px;
    border-radius: 12px;
    background:
      linear-gradient(180deg, rgba(4, 10, 22, .82), rgba(8, 16, 34, .7));
    border: 1px solid rgba(94, 176, 255, .28);
    box-shadow:
      inset 0 0 28px rgba(0, 0, 0, .55),
      0 0 18px rgba(34, 211, 238, .12);
  }
  .roulette-viewport::before {
    content: '';
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(34, 211, 238, .03) 2px,
        rgba(34, 211, 238, .03) 3px
      );
    opacity: .7;
  }
  .roulette-viewport::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
    background:
      linear-gradient(90deg, rgba(2,6,16,.75) 0%, transparent 16%, transparent 84%, rgba(2,6,16,.75) 100%),
      linear-gradient(180deg, rgba(34,211,238,.08), transparent 30%, transparent 70%, rgba(232,121,249,.08));
  }
  .roulette-container.is-spinning .roulette-viewport {
    box-shadow:
      inset 0 0 28px rgba(0, 0, 0, .55),
      0 0 26px rgba(34, 211, 238, .28),
      0 0 40px rgba(232, 121, 249, .18);
  }

  .roulette-clip {
    height: 100%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
  }

  #roulette-track {
    display: flex; align-items: center; height: 100%;
    gap: 10px;
    padding: 0 10px;
    position: relative;
    z-index: 1;
    will-change: transform;
    backface-visibility: hidden;
    transform: translate3d(0,0,0);
  }
  .roulette-container.is-spinning #roulette-track {
    filter: blur(.35px) saturate(1.15);
  }
  .roulette-container.landed #roulette-track {
    filter: none;
  }

  .card {
    flex: none;
    width: 90px; height: 98px;
    margin: 0;
    border-radius: 10px;
    border: 1px solid rgba(34, 211, 238, .35);
    background:
      linear-gradient(180deg, rgba(14, 28, 56, .92), rgba(8, 14, 28, .88));
    box-shadow:
      0 8px 18px rgba(0, 0, 0, .35),
      inset 0 1px 0 rgba(255, 255, 255, .08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
    transition: filter .18s ease, opacity .18s ease, box-shadow .18s ease, transform .14s ease, border-color .18s ease;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(34,211,238,.12), transparent 42%, transparent 58%, rgba(232,121,249,.1));
  }
  .card img {
    width: 54px; height: 54px; object-fit: contain;
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .45));
    position: relative; z-index: 1;
  }
  .card .ph {
    width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; position: relative; z-index: 1;
  }
  .card .rarity {
    position: absolute; left: 16%; right: 16%; bottom: 8px; height: 3px; border-radius: 99px;
    box-shadow: 0 0 8px currentColor;
  }
  .card[data-rarity="common"] .rarity { background: #94a3b8; color: #94a3b8; }
  .card[data-rarity="rare"] .rarity { background: #38bdf8; color: #38bdf8; }
  .card[data-rarity="epic"] .rarity { background: #c084fc; color: #c084fc; }
  .card[data-rarity="legendary"] .rarity { background: #fbbf24; color: #fbbf24; }
  .card[data-rarity="mythic"] .rarity { background: #f43f5e; color: #f43f5e; }

  .card.hot {
    transform: scale(1.1) translateY(-2px);
    z-index: 2;
    border-color: rgba(34, 211, 238, .95);
    filter: brightness(1.18) saturate(1.2);
    box-shadow:
      0 10px 22px rgba(0,0,0,.4),
      0 0 18px rgba(34, 211, 238, .45),
      0 0 28px rgba(232, 121, 249, .22);
  }
  .roulette-container.landed .card:not(.winner) {
    filter: brightness(0.38) saturate(0.55);
    opacity: 0.32;
    transform: scale(.94);
  }
  .card.winner {
    z-index: 3;
    opacity: 1;
    transform: scale(1.16) translateY(-3px);
    border-color: #fde68a;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(253, 230, 138, .35), transparent 55%),
      linear-gradient(180deg, rgba(40, 28, 10, .95), rgba(18, 14, 8, .92));
    box-shadow:
      0 0 0 1px rgba(255, 246, 200, .45),
      0 0 24px rgba(251, 191, 36, .65),
      0 0 48px rgba(245, 158, 11, .4),
      0 12px 28px rgba(0,0,0,.45);
    filter: brightness(1.25) saturate(1.25);
    animation: winner-pop .45s cubic-bezier(.2,.9,.3,1.25), winner-glow 1.3s ease-in-out .45s infinite;
  }

  .result {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    margin-top: 10px;
  }
  .result.show {
    display: flex;
    animation: result-in .35s cubic-bezier(.2,.9,.2,1.1);
  }
  .result .user {
    color: #7dd3fc;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(34, 211, 238, .55);
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .result .user:empty { display: none; }
  .result .name {
    font-family: Orbitron, 'Exo 2', sans-serif;
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    text-shadow:
      0 0 14px rgba(34, 211, 238, .45),
      0 2px 10px rgba(0,0,0,.65);
  }

  #fx {
    position: absolute; inset: 8px; pointer-events: none; overflow: hidden; border-radius: 12px; z-index: 5;
  }
  .spark {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    animation: pop 700ms ease-out forwards;
    box-shadow: 0 0 8px currentColor;
  }
  .scan {
    position: absolute; left: -20%; right: -20%; height: 28%;
    background: linear-gradient(180deg, transparent, rgba(34,211,238,.18), transparent);
    animation: scan-move 1.1s linear infinite;
    pointer-events: none; z-index: 3; opacity: 0;
  }
  .roulette-container.is-spinning .scan { opacity: 1; }

  @keyframes rainbow-shift {
    0% { background-position: 0 0, 0% 50%; }
    100% { background-position: 0 0, 100% 50%; }
  }
  @keyframes winner-glow {
    0%, 100% { filter: brightness(1.18) saturate(1.2); }
    50% { filter: brightness(1.42) saturate(1.35); }
  }
  @keyframes winner-pop {
    0% { transform: scale(.92); }
    55% { transform: scale(1.22) translateY(-4px); }
    100% { transform: scale(1.16) translateY(-3px); }
  }
  @keyframes frame-pulse {
    0%, 100% { box-shadow: 0 0 0 1px rgba(232,121,249,.35), 0 0 18px rgba(34,211,238,.4), inset 0 0 16px rgba(34,211,238,.1); }
    50% { box-shadow: 0 0 0 1px rgba(232,121,249,.55), 0 0 28px rgba(34,211,238,.7), inset 0 0 22px rgba(34,211,238,.18); }
  }
  @keyframes pointer-pulse {
    0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 8px rgba(34,211,238,.95)); }
    50% { transform: translateY(2px); filter: drop-shadow(0 0 14px rgba(232,121,249,.95)); }
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .55; transform: scale(1.25); }
  }
  @keyframes hud-impact {
    0% { transform: scale(1); }
    35% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  @keyframes result-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pop {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.15); opacity: 0; }
  }
  @keyframes scan-move {
    from { top: -20%; }
    to { top: 110%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .roulette-container.is-spinning .roulette-pointer,
    .roulette-container.is-spinning .center-frame,
    .roulette-container.is-spinning .roulette-status .dot,
    .card.winner,
    #stage.impact .roulette-shell,
    .scan { animation: none !important; }
    .roulette-container.is-spinning #roulette-track { filter: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="roulette-shell">
      <div class="roulette-container">
        <div class="roulette-head">
          <span class="roulette-tag">Ruleta</span>
          <span class="roulette-status"><i class="dot" aria-hidden="true"></i><span id="spin-label">LISTO</span></span>
        </div>
        <div class="roulette-pointer"></div>
        <div class="center-beam" aria-hidden="true"></div>
        <div class="center-frame" aria-hidden="true"></div>
        <div class="roulette-viewport" id="viewport">
          <div class="scan" aria-hidden="true"></div>
          <div class="roulette-clip">
            <div id="roulette-track"></div>
          </div>
        </div>
        <div id="fx"></div>
      </div>
    </div>
    <div class="result" id="result">
      <div class="user" id="res-user"></div>
      <div class="name" id="res-name"></div>
    </div>
  </div>
<script>
(function () {
  const isEmbed = /(?:^|[?&])embed=1(?:&|$)/.test(location.search);
  const stage = document.getElementById('stage');
  const track = document.getElementById('roulette-track');
  const viewport = document.getElementById('viewport');
  const box = document.querySelector('.roulette-container');
  const spinLabel = document.getElementById('spin-label');
  const resultEl = document.getElementById('result');
  const resUser = document.getElementById('res-user');
  const resName = document.getElementById('res-name');
  const fx = document.getElementById('fx');

  let spinning = false;
  let hideTimer = null;
  let raf = null;
  let spinGen = 0;
  let endTimer = null;
  let pendingUserName = '';
  let cfg = {
    showUser: true, showResult: true, particles: true,
    spinSound: 'tick', winSound: 'win',
  };

  const SOUND_SRC = {
    tick: '/sounds/roulette/tick.wav?v=2',
    win: '/sounds/roulette/win.wav?v=1',
  };
  const soundOk = { tick: null, win: null }; // null=unknown, true/false
  const tickPool = [];
  let tickPoolI = 0;
  let winAudio = null;

  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function mergeCfg(next) {
    if (!next || typeof next !== 'object') return;
    if (next.showUser != null) cfg.showUser = !!next.showUser;
    if (next.showResult != null) cfg.showResult = !!next.showResult;
    if (next.particles != null) cfg.particles = !!next.particles;
    if (next.spinSound != null) cfg.spinSound = String(next.spinSound || '');
    if (next.winSound != null) cfg.winSound = String(next.winSound || '');
  }

  function makeAudio(src, vol) {
    try {
      const a = new Audio(src);
      a.preload = 'auto';
      a.volume = vol;
      return a;
    } catch { return null; }
  }

  function ensureTickPool() {
    if (tickPool.length) return;
    for (let i = 0; i < 10; i++) {
      const a = makeAudio(SOUND_SRC.tick, 0.45);
      if (a) tickPool.push(a);
    }
    if (tickPool[0]) {
      tickPool[0].addEventListener('error', () => { soundOk.tick = false; }, { once: true });
      tickPool[0].addEventListener('canplaythrough', () => { soundOk.tick = true; }, { once: true });
    }
  }

  function ensureWinAudio() {
    if (winAudio) return winAudio;
    winAudio = makeAudio(SOUND_SRC.win, 0.62);
    if (winAudio) {
      winAudio.addEventListener('error', () => { soundOk.win = false; }, { once: true });
      winAudio.addEventListener('canplaythrough', () => { soundOk.win = true; }, { once: true });
    }
    return winAudio;
  }

  /* Fallback si el .wav no carga (OBS / autoplay). */
  let audioCtx = null;
  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    return audioCtx;
  }
  function beep(freq, dur, type, vol) {
    const ctx = ensureAudio();
    if (!ctx) return;
    try {
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = vol == null ? 0.04 : vol;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + dur);
    } catch {}
  }

  /* Un tic por tarjeta que cruza el centro; pitch baja al frenar. */
  function playTick(t) {
    if (cfg.spinSound !== 'tick') return;
    ensureTickPool();
    const rate = 1.12 - clamp(t || 0, 0, 1) * 0.28; // rápido al inicio, más grave al final
    if (tickPool.length && soundOk.tick !== false) {
      const a = tickPool[tickPoolI % tickPool.length];
      tickPoolI++;
      try {
        a.pause();
        a.currentTime = 0;
        a.playbackRate = clamp(rate, 0.82, 1.2);
        a.volume = 0.42 + (1 - clamp(t || 0, 0, 1)) * 0.12;
        const p = a.play();
        if (p && p.catch) p.catch(() => { beep(1500 * rate, 0.03, 'square', 0.035); });
        return;
      } catch { /* fallback */ }
    }
    beep(1500 * rate, 0.03, 'square', 0.035);
  }

  function playWin() {
    if (cfg.winSound !== 'win') return;
    const a = ensureWinAudio();
    if (a && soundOk.win !== false) {
      try {
        a.pause();
        a.currentTime = 0;
        a.volume = 0.68;
        const p = a.play();
        if (p && p.catch) p.catch(() => {
          beep(660, 0.09, 'triangle', 0.06);
          setTimeout(() => beep(880, 0.14, 'triangle', 0.06), 90);
        });
        return;
      } catch { /* fallback */ }
    }
    beep(660, 0.09, 'triangle', 0.06);
    setTimeout(() => beep(880, 0.14, 'triangle', 0.06), 90);
  }

  function warmSounds() {
    ensureTickPool();
    ensureWinAudio();
  }

  function cardHtml(item) {
    const img = String(item.image || '').trim();
    const fb = String(item.imageFb || '').trim();
    const emoji = String(item.emoji || '').trim();
    const inner = img
      ? `<img src="${esc(img)}" alt="" data-fb="${esc(fb)}" onerror="if(this.dataset.fb&&this.src!==this.dataset.fb){const u=this.dataset.fb;this.dataset.fb='';this.src=u;}else{this.style.display='none';var p=this.nextElementSibling;if(p&&p.classList&&p.classList.contains('ph'))p.style.display='flex'}">` +
        (emoji ? `<div class="ph" style="display:none">${esc(emoji)}</div>` : '')
      : `<div class="ph">${esc(emoji || '🎁')}</div>`;
    return `<div class="card" data-rarity="${esc(item.rarity || 'common')}" data-uid="${esc(item.uid || '')}" data-name="${esc(item.name || '')}">${inner}<i class="rarity"></i></div>`;
  }

  function clearFx() { fx.innerHTML = ''; }
  function burst() {
    if (!cfg.particles) return;
    clearFx();
    const colors = ['#22d3ee', '#e879f9', '#fbbf24', '#ffffff', '#38bdf8', '#f472b6'];
    for (let i = 0; i < 36; i++) {
      const s = document.createElement('i');
      s.className = 'spark';
      const ang = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 140;
      s.style.left = '50%';
      s.style.top = '48%';
      s.style.background = colors[i % colors.length];
      s.style.color = colors[i % colors.length];
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      fx.appendChild(s);
    }
    setTimeout(clearFx, 850);
  }

  function hideStage() {
    spinGen++;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (endTimer) { clearTimeout(endTimer); endTimer = null; }
    stage.classList.remove('show', 'impact');
    box?.classList.remove('landed', 'is-spinning');
    if (spinLabel) spinLabel.textContent = 'LISTO';
    resultEl.classList.remove('show');
    track.innerHTML = '';
    track.style.transition = 'none';
    track.style.transform = 'translate3d(0px,0,0)';
    spinning = false;
  }

  function targetFor(el) {
    return -((el.offsetLeft + el.offsetWidth / 2) - (viewport.clientWidth / 2));
  }

  /* Arranque rápido + frenada fuerte al final (sensación gamer) */
  function spinEase(t) {
    const x = clamp(t, 0, 1);
    return 1 - Math.pow(1 - x, 3.6);
  }

  function whenImagesReady(root, ms) {
    const imgs = [...root.querySelectorAll('img')];
    if (!imgs.length) return Promise.resolve();
    return Promise.race([
      Promise.all(imgs.map((img) => (img.complete ? Promise.resolve() : new Promise((res) => {
        img.addEventListener('load', res, { once: true });
        img.addEventListener('error', res, { once: true });
      })))),
      new Promise((r) => setTimeout(r, ms)),
    ]);
  }

  function cardUnderPointer() {
    const cards = track.querySelectorAll('.card');
    const v = viewport.getBoundingClientRect();
    const cx = v.left + v.width / 2;
    let idx = 0;
    let best = 1e9;
    for (let i = 0; i < cards.length; i++) {
      const r = cards[i].getBoundingClientRect();
      const d = Math.abs(r.left + r.width / 2 - cx);
      if (d < best) { best = d; idx = i; }
    }
    return idx;
  }

  function landedFromCard(el, fallback) {
    const img = el && el.querySelector('img');
    const src = img && img.style.display !== 'none'
      ? (img.getAttribute('src') || img.currentSrc || img.src || '')
      : '';
    return {
      uid: (el && el.dataset.uid) || fallback.uid || '',
      name: (el && el.dataset.name) || fallback.name || 'Premio',
      image: src || fallback.image || '',
      rarity: (el && el.dataset.rarity) || fallback.rarity || 'common',
    };
  }

  function startSpin(payload) {
    if (!payload) return;
    const items = Array.isArray(payload.items) ? payload.items : [];
    if (!items.length) return;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    if (endTimer) { clearTimeout(endTimer); endTimer = null; }

    mergeCfg(payload);
    warmSounds();

    const winnerIndex = clamp(parseInt(payload.winnerIndex, 10) || 0, 0, items.length - 1);
    const duration = clamp(Number(payload.duration) || 4000, 1500, 10000);
    const winner = payload.winner || items[winnerIndex] || {};
    const user = payload.user || {};
    pendingUserName = String(user.username || user.nickname || user.uniqueId || '').trim();
    const my = ++spinGen;

    spinning = true;
    stage.classList.remove('impact');
    box?.classList.remove('landed');
    box?.classList.add('is-spinning');
    if (spinLabel) spinLabel.textContent = 'GIRANDO';
    resultEl.classList.remove('show');
    if (resUser) resUser.textContent = '';
    clearFx();

    track.style.transition = 'none';
    track.style.transform = 'translate3d(0px,0,0)';
    track.innerHTML = items.map(cardHtml).join('');
    stage.classList.add('show');

    const cards = track.querySelectorAll('.card');
    const winnerEl = cards[winnerIndex];
    if (!winnerEl) {
      spinning = false;
      box?.classList.remove('is-spinning');
      return;
    }
    winnerEl.dataset.win = '1';

    whenImagesReady(track, 180).then(() => {
      if (my !== spinGen) return;
      track.style.transition = 'none';
      track.style.transform = 'translate3d(0px,0,0)';
      void track.offsetWidth;
      const target = targetFor(winnerEl);
      const start = performance.now();
      const arriveIn = duration * 0.86;
      let lastTick = -1;
      let settled = false;

      function finish() {
        if (my !== spinGen || settled) return;
        settled = true;
        track.style.transition = 'none';
        track.style.transform = 'translate3d(' + target + 'px,0,0)';
        finishSpin(winnerEl, landedFromCard(winnerEl, items[winnerIndex] || winner));
      }

      function frame(now) {
        if (my !== spinGen) return;
        const t = clamp((now - start) / arriveIn, 0, 1);
        const x = target * spinEase(t);
        track.style.transform = 'translate3d(' + x + 'px,0,0)';
        const idx = cardUnderPointer();
        if (idx !== lastTick) {
          const list = track.children;
          if (lastTick >= 0 && list[lastTick]) list[lastTick].classList.remove('hot');
          if (list[idx]) list[idx].classList.add('hot');
          lastTick = idx;
          playTick(t);
        }
        if (t < 1) {
          raf = requestAnimationFrame(frame);
          return;
        }
        raf = null;
        finish();
      }
      raf = requestAnimationFrame(frame);
      endTimer = setTimeout(finish, arriveIn + 80);
    });
  }

  function finishSpin(winnerEl, winner) {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    box?.classList.remove('is-spinning');
    box?.classList.add('landed');
    stage.classList.remove('impact');
    void stage.offsetWidth;
    stage.classList.add('impact');
    if (spinLabel) spinLabel.textContent = 'GANADOR';
    winnerEl.classList.add('winner');
    playWin();
    burst();
    const showResult = cfg.showResult !== false;
    const showUser = cfg.showUser !== false && !!pendingUserName;
    if (showResult || showUser) {
      if (resUser) resUser.textContent = showUser ? pendingUserName : '';
      if (resName) resName.textContent = showResult ? (winner.name || winnerEl.dataset.name || 'Premio') : '';
      resultEl.classList.add('show');
    }
    hideTimer = setTimeout(hideStage, 3400);
  }

  window.addEventListener('message', (ev) => {
    const m = ev.data || {};
    if (m.kind !== 'gift_roulette') return;
    if (m.type === 'config') mergeCfg(m.config);
    if (m.type === 'reset') hideStage();
    if (m.type === 'test' || m.type === 'roulette_start' || m.type === 'start') startSpin(m.payload || m.data || m);
  });

  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'settings' && m.payload && m.payload.giftRoulette) mergeCfg(m.payload.giftRoulette);
      if (m.type === 'rouletteStart' || m.type === 'roulette_start') startSpin(m.payload || m.data || m);
      if (m.type === 'rouletteReset' || m.type === 'roulette_reset') hideStage();
    };
  }
  if (!isEmbed) connectWS();
  else {
    try { connectWS(); } catch {}
  }
})();
</script>
</body>
</html>
