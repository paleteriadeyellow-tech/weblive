<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay — Ruleta de regalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; }

  #stage {
    width: min(920px, 94vw);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
  }
  #stage.show { opacity: 1; transform: none; }

  .roulette-container {
    position: relative;
    padding: 6px 0 0;
    background: none;
    border: none;
    box-shadow: none;
  }
  .roulette-pointer {
    position: absolute; left: 50%; top: -2px; z-index: 5;
    width: 0; height: 0; margin-left: -6px;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 8px solid #fff;
    filter: drop-shadow(0 0 8px rgba(255,180,255,.85)) drop-shadow(0 0 12px rgba(80,200,255,.55));
  }
  .roulette-viewport {
    position: relative;
    overflow: hidden;
    height: 124px;
    border-radius: 14px;
    background: rgba(10, 8, 16, .38);
    border: 2px solid transparent;
    background-image:
      linear-gradient(rgba(10, 8, 16, .38), rgba(10, 8, 16, .38)),
      linear-gradient(120deg, #ff3b5c, #ffd166, #7bff6b, #4cc9f0, #c77dff, #ff3b5c);
    background-origin: padding-box, border-box;
    background-clip: padding-box, border-box;
    background-size: 100% 100%, 280% 280%;
    box-shadow: 0 10px 28px rgba(0,0,0,.28), 0 0 22px rgba(180,80,255,.18);
    animation: rainbow-shift 7s linear infinite;
  }
  .roulette-clip {
    height: 100%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
  }
  .roulette-viewport::before {
    content: '';
    position: absolute; inset: -40%;
    z-index: 0;
    background: conic-gradient(from 90deg, #ff4d6d, #ffd166, #80ed99, #4cc9f0, #c77dff, #ff4d6d);
    filter: blur(42px);
    opacity: .38;
    animation: rainbow-spin 12s linear infinite;
    pointer-events: none;
  }
  .roulette-viewport::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: linear-gradient(90deg, rgba(0,0,0,.35) 0%, transparent 18%, transparent 82%, rgba(0,0,0,.35) 100%);
  }
  #roulette-track {
    display: flex; align-items: center; height: 100%;
    gap: 8px;
    padding: 0 8px;
    position: relative;
    z-index: 1;
    will-change: transform;
    backface-visibility: hidden;
    transform: translate3d(0,0,0);
  }
  .card {
    flex: none;
    width: 86px; height: 92px;
    margin: 0;
    border-radius: 11px;
    border: 2px solid transparent;
    background-image:
      linear-gradient(180deg, rgba(18,14,24,.78), rgba(14,12,20,.62)),
      linear-gradient(120deg, #ff3b5c, #ffd166, #7bff6b, #4cc9f0, #c77dff, #ff3b5c);
    background-origin: padding-box, border-box;
    background-clip: padding-box, border-box;
    background-size: 100% 100%, 280% 280%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
    animation: rainbow-shift 5s linear infinite;
    transition: filter .22s ease, opacity .22s ease, box-shadow .22s ease, transform .18s ease;
  }
  .card img {
    width: 52px; height: 52px; object-fit: contain;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
  }
  .card .ph {
    width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .card .rarity {
    position: absolute; left: 18%; right: 18%; bottom: 8px; height: 3px; border-radius: 99px; opacity: .7;
  }
  .card[data-rarity="common"] .rarity { background: #c5c9d0; }
  .card[data-rarity="rare"] .rarity { background: #5dade2; }
  .card[data-rarity="epic"] .rarity { background: #af7ac5; }
  .card[data-rarity="legendary"] .rarity { background: #f8d56b; }
  .card[data-rarity="mythic"] .rarity { background: #e74c3c; }
  .card.hot {
    transform: scale(1.12);
    z-index: 2;
    filter: brightness(1.1);
    box-shadow: 0 8px 18px rgba(0,0,0,.3), 0 0 16px rgba(255,255,255,.16);
  }
  .roulette-container.landed .card:not(.winner) {
    filter: brightness(0.45) saturate(0.7);
    opacity: 0.38;
    transform: none;
  }
  .card.winner {
    z-index: 2;
    opacity: 1;
    transform: scale(1.12);
    background-image:
      linear-gradient(180deg, rgba(255,255,255,.22), rgba(40,18,48,.28)),
      linear-gradient(120deg, #fff6c2, #ff7eb6, #7bff6b, #4cc9f0, #c77dff, #fff6c2);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.45),
      0 0 22px rgba(255,255,255,.42),
      0 0 40px rgba(180,80,255,.5),
      0 0 62px rgba(255,80,160,.28);
    filter: brightness(1.28) saturate(1.2);
    animation: rainbow-shift 2s linear infinite, winner-glow 1.4s ease-in-out infinite;
  }
  @keyframes rainbow-shift {
    0% { background-position: 0 0, 0% 50%; }
    100% { background-position: 0 0, 100% 50%; }
  }
  @keyframes rainbow-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes winner-glow {
    0%, 100% { filter: brightness(1.18) saturate(1.15); }
    50% { filter: brightness(1.48) saturate(1.3); }
  }

  .result {
    display: none;
    justify-content: center;
    margin-top: 8px;
  }
  .result.show { display: flex; }
  .result .name {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .02em;
    text-shadow: 0 2px 10px rgba(0,0,0,.55);
  }

  #fx {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 20px;
  }
  .spark {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    animation: pop 650ms ease-out forwards;
  }
  @keyframes pop {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="roulette-container">
      <div class="roulette-pointer"></div>
      <div class="roulette-viewport" id="viewport">
        <div class="roulette-clip">
          <div id="roulette-track"></div>
        </div>
      </div>
      <div id="fx"></div>
    </div>
    <div class="result" id="result">
      <div class="name" id="res-name"></div>
    </div>
  </div>
<script>
(function () {
  const isEmbed = /(?:^|[?&])embed=1(?:&|$)/.test(location.search);
  const stage = document.getElementById('stage');
  const track = document.getElementById('roulette-track');
  const viewport = document.getElementById('viewport');
  const box = document.querySelector('.roulette-container');
  const resultEl = document.getElementById('result');
  const resName = document.getElementById('res-name');
  const fx = document.getElementById('fx');

  let spinning = false;
  let hideTimer = null;
  let raf = null;
  let spinGen = 0;
  let endTimer = null;
  let audioCtx = null;
  let cfg = {
    showUser: true, showResult: true, particles: true,
    spinSound: 'tick', winSound: 'win',
  };

  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function mergeCfg(next) {
    if (!next || typeof next !== 'object') return;
    if (next.showUser != null) cfg.showUser = !!next.showUser;
    if (next.showResult != null) cfg.showResult = !!next.showResult;
    if (next.particles != null) cfg.particles = !!next.particles;
    if (next.spinSound != null) cfg.spinSound = String(next.spinSound || '');
    if (next.winSound != null) cfg.winSound = String(next.winSound || '');
  }

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    return audioCtx;
  }
  function beep(freq, dur, type, vol) {
    const ctx = ensureAudio();
    if (!ctx) return;
    try {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = vol == null ? 0.04 : vol;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + dur);
    } catch {}
  }

  function cardHtml(item) {
    const img = String(item.image || '').trim();
    const fb = String(item.imageFb || '').trim();
    const emoji = String(item.emoji || '').trim();
    const inner = img
      ? `<img src="${esc(img)}" alt="" data-fb="${esc(fb)}" onerror="if(this.dataset.fb&&this.src!==this.dataset.fb){const u=this.dataset.fb;this.dataset.fb='';this.src=u;}else{this.style.display='none';var p=this.nextElementSibling;if(p&&p.classList&&p.classList.contains('ph'))p.style.display='flex'}">` +
        (emoji ? `<div class="ph" style="display:none">${esc(emoji)}</div>` : '')
      : `<div class="ph">${esc(emoji || '🎁')}</div>`;
    return `<div class="card" data-rarity="${esc(item.rarity || 'common')}" data-uid="${esc(item.uid || '')}" data-name="${esc(item.name || '')}">${inner}<i class="rarity"></i></div>`;
  }

  function clearFx() { fx.innerHTML = ''; }
  function burst() {
    if (!cfg.particles) return;
    clearFx();
    const colors = ['#f1c40f', '#3498db', '#e74c3c', '#ffffff', '#9b59b6'];
    for (let i = 0; i < 28; i++) {
      const s = document.createElement('i');
      s.className = 'spark';
      const ang = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 120;
      s.style.left = '50%';
      s.style.top = '46%';
      s.style.background = colors[i % colors.length];
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      fx.appendChild(s);
    }
    setTimeout(clearFx, 800);
  }

  function hideStage() {
    spinGen++;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (endTimer) { clearTimeout(endTimer); endTimer = null; }
    stage.classList.remove('show');
    box?.classList.remove('landed');
    resultEl.classList.remove('show');
    track.innerHTML = '';
    track.style.transition = 'none';
    track.style.transform = 'translate3d(0px,0,0)';
    spinning = false;
  }

  function targetFor(el) {
    return -((el.offsetLeft + el.offsetWidth / 2) - (viewport.clientWidth / 2));
  }

  function spinEase(t) {
    const u = 1 - clamp(t, 0, 1);
    return 1 - u * u * (0.28 + 0.72 * u);
  }

  function whenImagesReady(root, ms) {
    const imgs = [...root.querySelectorAll('img')];
    if (!imgs.length) return Promise.resolve();
    return Promise.race([
      Promise.all(imgs.map((img) => (img.complete ? Promise.resolve() : new Promise((res) => {
        img.addEventListener('load', res, { once: true });
        img.addEventListener('error', res, { once: true });
      })))),
      new Promise((r) => setTimeout(r, ms)),
    ]);
  }

  function cardUnderPointer() {
    const cards = track.querySelectorAll('.card');
    const v = viewport.getBoundingClientRect();
    const cx = v.left + v.width / 2;
    let idx = 0;
    let best = 1e9;
    for (let i = 0; i < cards.length; i++) {
      const r = cards[i].getBoundingClientRect();
      const d = Math.abs(r.left + r.width / 2 - cx);
      if (d < best) { best = d; idx = i; }
    }
    return idx;
  }

  function landedFromCard(el, fallback) {
    const img = el && el.querySelector('img');
    const src = img && img.style.display !== 'none'
      ? (img.getAttribute('src') || img.currentSrc || img.src || '')
      : '';
    return {
      uid: (el && el.dataset.uid) || fallback.uid || '',
      name: (el && el.dataset.name) || fallback.name || 'Premio',
      image: src || fallback.image || '',
      rarity: (el && el.dataset.rarity) || fallback.rarity || 'common',
    };
  }

  function startSpin(payload) {
    if (!payload) return;
    const items = Array.isArray(payload.items) ? payload.items : [];
    if (!items.length) return;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    if (endTimer) { clearTimeout(endTimer); endTimer = null; }

    const winnerIndex = clamp(parseInt(payload.winnerIndex, 10) || 0, 0, items.length - 1);
    const duration = clamp(Number(payload.duration) || 4000, 1500, 9000);
    const winner = payload.winner || items[winnerIndex] || {};
    const user = payload.user || {};
    const my = ++spinGen;

    spinning = true;
    box?.classList.remove('landed');
    resultEl.classList.remove('show');
    clearFx();

    track.style.transition = 'none';
    track.style.transform = 'translate3d(0px,0,0)';
    track.innerHTML = items.map(cardHtml).join('');
    stage.classList.add('show');

    const cards = track.querySelectorAll('.card');
    const winnerEl = cards[winnerIndex];
    if (!winnerEl) { spinning = false; return; }
    winnerEl.dataset.win = '1';

    whenImagesReady(track, 180).then(() => {
      if (my !== spinGen) return;
      track.style.transition = 'none';
      track.style.transform = 'translate3d(0px,0,0)';
      void track.offsetWidth;
      const target = targetFor(winnerEl);
      const start = performance.now();
      const arriveIn = duration * 0.86;
      let lastTick = -1;
      let settled = false;

      function finish() {
        if (my !== spinGen || settled) return;
        settled = true;
        track.style.transition = 'none';
        track.style.transform = 'translate3d(' + target + 'px,0,0)';
        finishSpin(winnerEl, landedFromCard(winnerEl, items[winnerIndex] || winner));
      }

      function frame(now) {
        if (my !== spinGen) return;
        const t = clamp((now - start) / arriveIn, 0, 1);
        const x = target * spinEase(t);
        track.style.transform = 'translate3d(' + x + 'px,0,0)';
        const idx = cardUnderPointer();
        if (idx !== lastTick) {
          const list = track.children;
          if (lastTick >= 0 && list[lastTick]) list[lastTick].classList.remove('hot');
          if (list[idx]) list[idx].classList.add('hot');
          lastTick = idx;
          if (cfg.spinSound === 'tick') {
            beep(460 + Math.min(220, idx * 3), 0.022, 'square', 0.028);
          }
        }
        if (t < 1) {
          raf = requestAnimationFrame(frame);
          return;
        }
        raf = null;
        finish();
      }
      raf = requestAnimationFrame(frame);
      endTimer = setTimeout(finish, arriveIn + 80);
    });
  }

  function finishSpin(winnerEl, winner) {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    winnerEl.classList.add('winner');
    box?.classList.add('landed');
    if (cfg.winSound === 'win') {
      beep(660, 0.09, 'triangle', 0.06);
      setTimeout(() => beep(880, 0.14, 'triangle', 0.06), 90);
    }
    burst();
    if (cfg.showResult !== false) {
      resName.textContent = winner.name || winnerEl.dataset.name || 'Premio';
      resultEl.classList.add('show');
    }
    hideTimer = setTimeout(hideStage, 3200);
  }

  window.addEventListener('message', (ev) => {
    const m = ev.data || {};
    if (m.kind !== 'gift_roulette') return;
    if (m.type === 'config') mergeCfg(m.config);
    if (m.type === 'reset') hideStage();
    if (m.type === 'test' || m.type === 'roulette_start' || m.type === 'start') startSpin(m.payload || m.data || m);
  });

  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'settings' && m.payload && m.payload.giftRoulette) mergeCfg(m.payload.giftRoulette);
      if (m.type === 'rouletteStart' || m.type === 'roulette_start') startSpin(m.payload || m.data || m);
      if (m.type === 'rouletteReset' || m.type === 'roulette_reset') hideStage();
    };
  }
  if (!isEmbed) connectWS();
  else {
    // En el iframe del panel también escucha WS por si el Testear llega por el servidor.
    try { connectWS(); } catch {}
  }
})();
</script>
</body>
</html>
