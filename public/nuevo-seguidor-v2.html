<!DOCTYPE html>
<html lang="es">
<head>
<script src="/js/overlay-channel.js?v=ovch7"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Overlay · Nuevo seguidor v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Outfit:wght@500;600&display=swap">
<style>
:root{--ink:#06071a;--violet:#7b2cff;--magenta:#ff2bd6;--cyan:#19e6ff;--white:#f7f4ff;--nsf2-scale:1}
html{height:100%}
*{box-sizing:border-box;margin:0}
body{height:100%;overflow:hidden;background:transparent;font-family:'Outfit',system-ui,sans-serif;color:var(--white)}
canvas{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;transform:translate(-50%,-50%) scale(var(--nsf2-scale))}
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080" aria-label="Alerta de nuevo seguidor"></canvas>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const isEmbed = params.get('embed') === '1';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 1920, H = 1080;
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const R = Math.random;

  let cfg = { title: '¡NUEVO SEGUIDOR!', subtitle: '¡Bienvenido/a a la comunidad!', durationSec: 5, scale: 100 };
  let P = [], C = [], name = '', t0 = 0, active = false, exitT = 0, END = 0;
  const q = [];
  let busy = false;
  let timer = 0;

  function applyConfig(c) {
    if (!c || typeof c !== 'object') return;
    cfg = Object.assign(cfg, c);
    const sc = Math.min(150, Math.max(50, Number(cfg.scale) || 100)) / 100;
    document.documentElement.style.setProperty('--nsf2-scale', String(sc));
    fit();
  }

  function fit() {
    const sc = Math.min(150, Math.max(50, Number(cfg.scale) || 100)) / 100;
    const s = Math.min(innerWidth / W, innerHeight / H) * sc;
    cv.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  function nick(d) {
    return (d && (d.nickname || d.nickName || '')).trim()
      || (d && d.uniqueId ? '@' + d.uniqueId : 'PreviewFan');
  }

  function build() {
    const off = document.createElement('canvas');
    off.width = W; off.height = 300;
    const o = off.getContext('2d');
    let fs = 200;
    o.font = `900 ${fs}px Unbounded,'Arial Black',sans-serif`;
    const w = o.measureText(name).width;
    if (w > 1500) fs = Math.floor(fs * 1500 / w);
    o.font = `900 ${fs}px Unbounded,'Arial Black',sans-serif`;
    o.textAlign = 'center'; o.textBaseline = 'middle';
    o.fillText(name, W / 2, 150);
    const d = o.getImageData(0, 0, W, 300).data;
    P = [];
    const step = fs > 140 ? 5 : 4;
    for (let y = 0; y < 300; y += step) for (let x = 0; x < W; x += step) {
      if (d[(y * W + x) * 4 + 3] > 140) {
        const a = R() * 6.283, r = 700 + R() * 500, ty = y + 420, k = x / W;
        P.push({
          tx: x, ty, sx: W / 2 + Math.cos(a) * r * 1.5, sy: H / 2 + Math.sin(a) * r,
          cv: (R() - .5) * 320, dl: Math.abs(x - W / 2) / W * 900 + R() * 250,
          s: 2.4 + R() * 2.2,
          c: R() < .14 ? '#ffe39a' : `hsl(${190 + k * 120} 100% ${58 + R() * 14}%)`,
          vx: (R() - .5) * 1400, vy: -R() * 900 - 100
        });
      }
    }
    C = [];
    for (let i = 0; i < 46; i++) C.push({
      x: R() * W, ts: 200 + R() * 2400, vy: 520 + R() * 520, r: 20 + R() * 22,
      rs: 3 + R() * 5, ph: R() * 6.28, h: R() < .5 ? 190 : 300
    });
  }

  function coin(c, y, rot, al) {
    const sx = Math.cos(rot);
    ctx.save(); ctx.globalAlpha = al; ctx.translate(c.x, y); ctx.scale(Math.abs(sx) < .12 ? .12 : sx, 1);
    const g = ctx.createRadialGradient(-c.r * .3, -c.r * .3, 2, 0, 0, c.r);
    g.addColorStop(0, '#fff'); g.addColorStop(.5, `hsl(${c.h} 100% 65%)`); g.addColorStop(1, '#2a1a7a');
    ctx.shadowColor = `hsl(${c.h} 100% 60%)`; ctx.shadowBlur = 18; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, c.r * .7, 0, 6.283); ctx.stroke(); ctx.restore();
  }

  function title(t) {
    const u = clamp((t - 300) / 900), out = clamp(1 - (t - exitT) / 450);
    if (u <= 0 || out <= 0) return;
    const off = Math.max(3, 26 * (1 - u)), flick = u < .7 && R() < .25;
    if (flick) return;
    const txt = (cfg.title || '¡NUEVO SEGUIDOR!').trim() || '¡NUEVO SEGUIDOR!';
    ctx.save();
    ctx.font = "900 74px Unbounded,'Arial Black',sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.translate(W / 2, 300); ctx.transform(1, 0, -.14, 1, 0, 0); ctx.globalAlpha = out;
    ctx.shadowColor = '#7b2cff'; ctx.shadowBlur = 36;
    ctx.fillStyle = '#ff2bd6'; ctx.fillText(txt, off, 0);
    ctx.fillStyle = '#19e6ff'; ctx.fillText(txt, -off, 0);
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.fillText(txt, 0, 0); ctx.restore();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!active) return;
    const t = now - t0;
    ctx.clearRect(0, 0, W, H);
    const gl = clamp((t - 500) / 1200) * clamp(1 - (t - exitT) / 500);
    if (gl > 0) {
      const g = ctx.createRadialGradient(W / 2, 560, 0, W / 2, 560, 760);
      g.addColorStop(0, `rgba(123,44,255,${.38 * gl})`);
      g.addColorStop(.5, `rgba(255,43,214,${.12 * gl})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (!reduce) for (const c of C) {
      const dt = (t - c.ts) / 1000; if (dt < 0) continue;
      const y = -60 + c.vy * dt; if (y < H + 60) coin(c, y, c.ph + dt * c.rs, .95);
    }
    if (t < 420) { ctx.fillStyle = `rgba(25,230,255,${.5 * (1 - t / 420)})`; ctx.fillRect(0, 0, W, H); }
    title(t);
    ctx.globalCompositeOperation = 'lighter';
    const sw = (t - 2300) / 900 * (W + 400) - 200, ex = t > exitT ? (t - exitT) / 1000 : 0;
    for (const p of P) {
      let x, y, a = 1, s = p.s;
      if (!ex) {
        const u = clamp((t - 350 - p.dl) / 1300), e = 1 - Math.pow(1 - u, 3);
        x = p.sx + (p.tx - p.sx) * e + Math.sin(u * 3.14159) * p.cv;
        y = p.sy + (p.ty - p.sy) * e + Math.sin(u * 3.14159) * p.cv * .6;
        if (u >= 1) { x += Math.sin(t / 260 + p.tx * .02) * 1.4; y += Math.cos(t / 310 + p.tx * .015) * 1.4; }
        a = .25 + .75 * e;
        if (Math.abs(p.tx - sw) < 90) { s *= 1.7; ctx.fillStyle = '#fff'; } else ctx.fillStyle = p.c;
      } else {
        x = p.tx + p.vx * ex; y = p.ty + p.vy * ex + 1100 * ex * ex; a = clamp(1 - ex / .95); ctx.fillStyle = p.c;
      }
      ctx.globalAlpha = a; ctx.fillRect(x, y, s, s);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const li = clamp((t - 1900) / 700), lo = clamp(1 - (t - exitT) / 450);
    if (li > 0 && lo > 0) {
      const w = 900 * (1 - Math.pow(1 - li, 3));
      const g = ctx.createLinearGradient(W / 2 - 450, 0, W / 2 + 450, 0);
      g.addColorStop(0, 'rgba(25,230,255,0)'); g.addColorStop(.2, '#19e6ff');
      g.addColorStop(.8, '#ff2bd6'); g.addColorStop(1, 'rgba(255,43,214,0)');
      ctx.globalAlpha = lo; ctx.fillStyle = g; ctx.shadowColor = '#7b2cff'; ctx.shadowBlur = 18;
      ctx.fillRect(W / 2 - w / 2, 690, w, 4); ctx.shadowBlur = 0;
      ctx.globalAlpha = clamp((t - 2300) / 600) * lo; ctx.fillStyle = '#e4defd';
      ctx.font = "600 38px Outfit,system-ui,sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText((cfg.subtitle || '¡Bienvenido/a a la comunidad!').trim() || '¡Bienvenido/a a la comunidad!', W / 2, 760);
      ctx.globalAlpha = 1;
    }
    if (t > END) {
      active = false;
      ctx.clearRect(0, 0, W, H);
      busy = false;
      drain();
    }
  }

  function playOne(user) {
    clearTimeout(timer);
    name = nick(user).slice(0, 28);
    build();
    const hold = Math.min(120000, Math.max(2000, (Number(cfg.durationSec) || 5) * 1000));
    exitT = 2400 + hold;
    END = exitT + 1300;
    t0 = performance.now();
    active = true;
  }

  function drain() {
    if (busy || !q.length) return;
    busy = true;
    playOne(q.shift());
  }

  const DEMO = { uniqueId: 'preview_fan', nickname: 'PreviewFan' };

  function runTest() {
    if (isEmbed) {
      clearTimeout(timer);
      busy = false;
      q.length = 0;
      playOne(DEMO);
      busy = true;
      return;
    }
    q.push({ ...DEMO });
    drain();
  }

  function resetAll() {
    clearTimeout(timer);
    q.length = 0;
    busy = false;
    active = false;
    ctx.clearRect(0, 0, W, H);
    if (isEmbed) requestAnimationFrame(() => requestAnimationFrame(runTest));
  }

  let ws, rt;
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connect, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'settings') {
        if (m.payload && m.payload.nuevoSeguidorV2) applyConfig(m.payload.nuevoSeguidorV2);
        return;
      }
      if (isEmbed) return;
      if (m.type === 'follow') { q.push(m.payload || {}); drain(); }
      else if (m.type === 'nuevoSeguidorV2Test') runTest();
      else if (m.type === 'nuevoSeguidorV2Reset') resetAll();
    };
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.kind !== 'nuevoseguidorv2') return;
    if (d.type === 'config') applyConfig(d.config);
    else if (d.type === 'test') runTest();
    else if (d.type === 'reset') resetAll();
  });

  applyConfig({});
  requestAnimationFrame(frame);
  if (isEmbed) {
    (document.fonts ? document.fonts.load("900 100px Unbounded").catch(() => {}) : Promise.resolve())
      .then(() => setTimeout(runTest, 150));
  }
  connect();
})();
</script>
<script src="/js/overlay-idle.js?v=oi1"></script>
<script src="/js/overlay-keepalive.js"></script>
</body>
</html>
