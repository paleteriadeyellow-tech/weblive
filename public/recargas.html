<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recargas · Admin</title>
<style>
  :root { --bg:#0f1220; --card:#181c2e; --tx:#e8eaf3; --mut:#8b90a8; --acc:#6c5cff; --ok:#2ecc71; --bad:#ff5c6c; --warn:#ffb020; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 system-ui,Segoe UI,sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, select, button { font:inherit; border-radius:8px; border:1px solid #2c3150; background:#0f1326; color:var(--tx); padding:8px 10px; }
  input { min-width:0; flex:1; }
  button { background:var(--acc); border:0; cursor:pointer; font-weight:600; }
  button.sec { background:#2c3150; }
  button:disabled { opacity:.5; cursor:default; }
  .mut { color:var(--mut); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px; border-bottom:1px solid #262b45; vertical-align:top; }
  .list { max-height:360px; overflow:auto; }
  tr.pick { cursor:pointer; } tr.pick:hover { background:#20253c; } tr.sel { background:#2a2560; }
  code { background:#0f1326; padding:1px 5px; border-radius:5px; word-break:break-all; }
  .tag { display:inline-block; padding:1px 7px; border-radius:99px; background:#2c3150; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Recargas (RecargasAmerica)</h1>

  <div class="card" id="st">Cargando…</div>

  <div class="card">
    <div class="row">
      <input id="q" placeholder="Buscar producto (ej: free fire)">
      <button class="sec" id="reload">Actualizar catálogo</button>
    </div>
    <div class="list" style="margin-top:10px"><table id="prods"></table></div>
  </div>

  <div class="card">
    <div id="picked" class="mut">Elige un producto de la lista.</div>
    <div class="row" style="margin-top:10px">
      <input id="player" placeholder="ID del jugador / cuenta">
      <input id="zone" placeholder="Zona / servidor (si lo pide)" style="max-width:220px">
      <input id="qty" type="number" min="1" max="100" value="1" style="max-width:90px" title="Cantidad (solo pines)">
    </div>
    <div class="row" style="margin-top:10px">
      <button class="sec" id="validate" disabled>Validar ID</button>
      <button id="buy" disabled>Comprar</button>
      <span id="msg"></span>
    </div>
  </div>

  <div class="card">
    <div class="row"><b>Historial</b><button class="sec" id="hist">Actualizar</button></div>
    <div class="list" style="margin-top:10px"><table id="orders"></table></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let products = [], picked = null, busy = false;

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts,
    headers: opts.body ? { 'Content-Type': 'application/json' } : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('Error ' + r.status)); e.data = j; e.status = r.status; throw e; }
  return j;
}
function say(text, cls = '') { $('msg').className = cls; $('msg').textContent = text; }

async function loadStatus() {
  try {
    const s = await api('/api/admin/recargas/status');
    if (!s.configured) { $('st').innerHTML = '<span class="warn">Falta la variable <code>RECARGAS_API_KEY</code> en Render.</span>'; return; }
    $('st').innerHTML = (s.sandbox ? '<span class="tag warn">SANDBOX</span> ' : '<span class="tag ok">PRODUCCIÓN</span> ')
      + (s.ok ? `Saldo: <b>${esc(s.balance)} ${esc(s.currency)}</b>` : `<span class="bad">${esc(s.error || 'Sin conexión')} (${esc(s.code)})</span>`);
  } catch (e) {
    $('st').innerHTML = e.status === 403 ? '<span class="bad">Solo el admin puede ver esto. Inicia sesión con la cuenta admin.</span>' : `<span class="bad">${esc(e.message)}</span>`;
  }
}

async function loadCatalog() {
  $('prods').innerHTML = '<tr><td class="mut">Cargando…</td></tr>';
  try { products = (await api('/api/admin/recargas/catalog')).products || []; renderProducts(); }
  catch (e) { $('prods').innerHTML = `<tr><td class="bad">${esc(e.message)}</td></tr>`; }
}
function renderProducts() {
  const q = $('q').value.trim().toLowerCase();
  const list = products.filter((p) => !q || (p.name + ' ' + (p.sku || '')).toLowerCase().includes(q)).slice(0, 300);
  $('prods').innerHTML = '<tr><th>ID</th><th>Producto</th><th>Tipo</th><th>Precio</th><th>Pide</th></tr>' + list.map((p) =>
    `<tr class="pick${picked && picked.id === p.id ? ' sel' : ''}" data-id="${esc(p.id)}"><td>${esc(p.id)}</td><td>${esc(p.name)}</td><td>${esc(p.type)}</td>`
    + `<td>${esc(p.price ?? p.cost ?? '')}</td><td class="mut">${esc((p.required_fields || []).join(', '))}</td></tr>`).join('');
}
$('prods').addEventListener('click', (ev) => {
  const tr = ev.target.closest('tr[data-id]'); if (!tr) return;
  picked = products.find((p) => String(p.id) === tr.dataset.id) || null;
  $('picked').innerHTML = picked ? `<b>${esc(picked.name)}</b> <span class="mut">#${esc(picked.id)} · ${esc(picked.type)}</span>` : '';
  $('validate').disabled = $('buy').disabled = !picked;
  renderProducts(); say('');
});
$('q').addEventListener('input', renderProducts);
$('reload').onclick = loadCatalog;

function form() {
  return { productId: picked && picked.id, playerId: $('player').value.trim(), zoneId: $('zone').value.trim(), quantity: Number($('qty').value) || 1 };
}
$('validate').onclick = async () => {
  if (!picked || busy) return;
  busy = true; say('Validando…');
  try {
    const d = await api('/api/admin/recargas/validate', { method: 'POST', body: JSON.stringify(form()) });
    if (!d.supported) say('Este producto no permite validar el ID.', 'mut');
    else if (d.status) say('ID válido' + (d.account_name ? ': ' + d.account_name : ''), 'ok');
    else say(d.message || 'ID no válido', 'bad');
  } catch (e) { say(e.message, 'bad'); }
  busy = false;
};
$('buy').onclick = async () => {
  if (!picked || busy) return;
  const f = form();
  if (!confirm(`¿Comprar "${picked.name}"${f.playerId ? ' para ' + f.playerId : ''}? Se descuenta de tu saldo.`)) return;
  busy = true; $('buy').disabled = true; say('Comprando…');
  try {
    const d = await api('/api/admin/recargas/buy', { method: 'POST', body: JSON.stringify(f) });
    say(`Orden ${d.order.orderId || ''}: ${d.order.status}`, d.order.status === 'COMPLETED' ? 'ok' : 'warn');
  } catch (e) { say(`${e.message} (${(e.data && e.data.code) || e.status})`, 'bad'); }
  busy = false; $('buy').disabled = !picked;
  loadOrders(); loadStatus();
};

function delivery(o) {
  return (o.delivery || []).map((d) => d.key ? `<code>${esc(d.key)}</code>${d.serial ? ' <span class="mut">' + esc(d.serial) + '</span>' : ''}`
    : `<code>${esc(d.username)}</code> / <code>${esc(d.password)}</code>`).join('<br>');
}
async function loadOrders() {
  try {
    const { orders } = await api('/api/admin/recargas/orders');
    $('orders').innerHTML = '<tr><th>Fecha</th><th>Producto</th><th>Destino</th><th>Estado</th><th>Entrega</th><th></th></tr>' + orders.map((o) =>
      `<tr><td>${new Date(o.createdAt).toLocaleString()}</td><td>${esc(o.item || ('#' + o.productId))}${o.sandbox ? ' <span class="tag">sandbox</span>' : ''}</td>`
      + `<td>${esc(o.playerId)}${o.zoneId ? ' / ' + esc(o.zoneId) : ''}</td>`
      + `<td class="${o.status === 'COMPLETED' ? 'ok' : /REFUND|FAILED/.test(o.status) ? 'bad' : 'warn'}">${esc(o.status)}${o.needsReview ? ' (en revisión)' : ''}<br><span class="mut">${esc(o.orderId || '')}</span></td>`
      + `<td>${delivery(o)}</td><td>${!o.final && o.orderId ? `<button class="sec" data-o="${esc(o.orderId)}">Consultar</button>` : ''}</td></tr>`).join('');
  } catch (e) { $('orders').innerHTML = `<tr><td class="bad">${esc(e.message)}</td></tr>`; }
}
$('orders').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-o]'); if (!b) return;
  b.disabled = true;
  try { await api('/api/admin/recargas/orders/' + encodeURIComponent(b.dataset.o)); } catch (e) { alert(e.message); }
  loadOrders();
});
$('hist').onclick = loadOrders;

loadStatus().then(() => { loadCatalog(); loadOrders(); });
</script>
</body>
</html>
