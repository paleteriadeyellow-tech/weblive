<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay — Contador de victorias (Mario Bros)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Fredoka:wght@600;700&family=Inter:wght@700;800&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800;900&family=Titan+One&display=swap');
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: var(--tf-font-stack, 'Press Start 2P', monospace);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            image-rendering: pixelated;
        }
        .mario-wrap {
            position: relative;
            transform-origin: center center;
            user-select: none;
            filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.35));
        }
        .mario-sky {
            height: 14px;
            margin: 0 8px;
            border: 4px solid #1a1a1a;
            border-bottom: none;
            background: linear-gradient(180deg, #5ec8ff 0%, #049cd8 55%, #0369a1 100%);
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.35);
        }
        .mario-cloud {
            position: absolute;
            top: 2px;
            width: 22px;
            height: 8px;
            background: #fff;
            border-radius: 0;
            box-shadow:
                -8px 2px 0 #fff,
                8px 2px 0 #fff,
                0 -3px 0 #fff;
            opacity: 0.9;
        }
        .mario-cloud.c1 { left: 12%; }
        .mario-cloud.c2 { right: 18%; transform: scale(0.85); }
        .mario-panel {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px 16px 18px;
            background: var(--mario-bg, #e52521);
            border: 4px solid #1a1a1a;
            box-shadow:
                inset 0 4px 0 rgba(255,255,255,0.28),
                inset 0 -5px 0 rgba(0,0,0,0.22);
        }
        .mario-panel::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 3px solid rgba(0,0,0,0.18);
            pointer-events: none;
        }
        .mario-brick {
            position: absolute;
            inset: 0;
            opacity: 0.14;
            pointer-events: none;
            background-image:
                linear-gradient(90deg, #000 50%, transparent 50%),
                linear-gradient(180deg, #000 50%, transparent 50%);
            background-size: 16px 10px;
        }
        .mario-coin {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 4px solid #1a1a1a;
            background: radial-gradient(circle at 35% 30%, #fff6a8 0%, #ffe14d 35%, #f0a800 100%);
            box-shadow: inset -3px -4px 0 rgba(0,0,0,0.2), inset 2px 2px 0 rgba(255,255,255,0.45);
            position: relative;
            z-index: 1;
        }
        .mario-coin::after {
            content: '★';
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 14px;
            color: #c97800;
            text-shadow: 1px 1px 0 #fff8c0;
        }
        .mario-label {
            position: relative;
            z-index: 1;
            font-family: var(--tf-font-stack, 'Press Start 2P', monospace);
            font-weight: 700;
            color: var(--mario-text, #ffffff);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 3px 3px 0 #1a1a1a, -1px -1px 0 rgba(0,0,0,0.35);
            line-height: 1.35;
        }
        .mario-score-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: baseline;
            gap: 2px;
            font-family: var(--tf-font-stack, 'Press Start 2P', monospace);
            font-variant-numeric: tabular-nums;
        }
        .mario-score {
            font-weight: 700;
            color: var(--mario-accent, #ffe14d);
            text-shadow:
                3px 3px 0 #9a3b00,
                0 0 10px rgba(255, 225, 77, 0.55);
        }
        .mario-max {
            font-weight: 700;
            color: var(--mario-border, #049cd8);
            text-shadow: 2px 2px 0 #1a1a1a;
        }
        .mario-wrap.no-glow .mario-score {
            text-shadow: 3px 3px 0 #9a3b00;
        }
        @keyframes wins-rainbow { to { background-position: 200% center; } }
        .mario-wrap.rainbow .mario-label,
        .mario-wrap.rainbow .mario-score,
        .mario-wrap.rainbow .mario-max {
            background-image: linear-gradient(90deg, #e52521, #ffe14d, #049cd8, #43b047, #ffe14d, #e52521);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: wins-rainbow 2.6s linear infinite;
        }
        @keyframes marioJump {
            0%, 100% { transform: scale(var(--fit, 1)) translateY(0); }
            20% { transform: scale(var(--fit, 1)) translateY(-10px); }
            45% { transform: scale(calc(var(--fit, 1) * 1.08)) translateY(-4px); }
            70% { transform: scale(var(--fit, 1)) translateY(-8px); }
        }
        .mario-wrap.win-animation {
            animation: marioJump 0.6s steps(6) forwards;
        }
        .mario-wrap.win-animation .mario-coin {
            animation: coinSpin 0.6s steps(6);
        }
        @keyframes coinSpin {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(0.35); }
        }
    </style>
</head>
<body>
    <div class="mario-wrap" id="counterBox" aria-live="polite">
        <div class="mario-sky" id="elSky">
            <span class="mario-cloud c1" aria-hidden="true"></span>
            <span class="mario-cloud c2" aria-hidden="true"></span>
        </div>
        <div class="mario-panel" id="elPanel">
            <div class="mario-brick" aria-hidden="true"></div>
            <div class="mario-coin" id="elCoin" aria-hidden="true"></div>
            <span class="mario-label" id="elLabel">WINS</span>
            <div class="mario-score-row">
                <span class="mario-score" id="elScore">00</span>
                <span class="mario-max" id="elMax">/10</span>
            </div>
        </div>
    </div>

    <script>
    (function () {
        const params = new URLSearchParams(location.search);
        const isEmbed = params.get('embed') === '1';

        const elLabel = document.getElementById('elLabel');
        const elScore = document.getElementById('elScore');
        const elMax = document.getElementById('elMax');
        const elBox = document.getElementById('counterBox');
        const elPanel = document.getElementById('elPanel');
        const elSky = document.getElementById('elSky');

        const FONTS = {
            pressstart: "'Press Start 2P', monospace",
            luckiest: "'Luckiest Guy', system-ui, sans-serif",
            bangers: "'Bangers', system-ui, sans-serif",
            lilita: "'Lilita One', system-ui, sans-serif",
            titan: "'Titan One', system-ui, sans-serif",
            fredoka: "'Fredoka', system-ui, sans-serif",
            bungee: "'Bungee', system-ui, sans-serif",
            rubik: "'Rubik', system-ui, sans-serif",
            oswald: "'Oswald', system-ui, sans-serif",
            bebas: "'Bebas Neue', Impact, sans-serif",
            montserrat: "'Montserrat', system-ui, sans-serif",
            poppins: "'Poppins', system-ui, sans-serif",
            orbitron: "'Orbitron', system-ui, sans-serif",
            inter: "'Inter', system-ui, sans-serif",
            system: "system-ui, sans-serif",
        };

        const state = {
            label: 'WINS', wins: 0, winsMax: 10, font: 'pressstart', rainbow: false, scoreGlow: true,
            textColor: '#ffffff', accentColor: '#ffe14d',
            bgColor: '#e52521', borderColor: '#049cd8', fontSize: 22,
        };

        function clampWins(w) {
            const n = parseInt(w, 10);
            const x = Number.isFinite(n) ? n : 0;
            return Math.max(-999999, Math.min(999999, x));
        }
        function mergeConfig(c) {
            if (!c || typeof c !== 'object') return;
            if (c.label != null) state.label = String(c.label).trim().slice(0, 48) || 'WINS';
            if (c.font != null && FONTS[c.font]) state.font = c.font;
            if (c.rainbow != null) state.rainbow = !!c.rainbow;
            if (c.scoreGlow != null) state.scoreGlow = !!c.scoreGlow;
            const maxRaw = c.winsMax != null ? c.winsMax : c.max;
            if (maxRaw != null) { const m = parseInt(maxRaw, 10); if (Number.isFinite(m)) state.winsMax = Math.max(1, Math.min(999999, m)); }
            if (c.wins != null) state.wins = clampWins(c.wins);
            else state.wins = clampWins(state.wins);
            if (c.textColor) state.textColor = String(c.textColor);
            if (c.accentColor) state.accentColor = String(c.accentColor);
            if (c.bgColor) state.bgColor = String(c.bgColor);
            if (c.borderColor) state.borderColor = String(c.borderColor);
            const fs = parseInt(c.fontSize, 10);
            if (Number.isFinite(fs) && fs > 8 && fs < 200) state.fontSize = fs;
        }
        function formatTwoDigits(n) {
            const v = Number.isFinite(n) ? n : 0;
            if (v < 0) return String(v);
            if (v < 10) return '0' + v;
            return String(v);
        }
        function hexToRgb(hex) {
            if (typeof hex !== 'string') return null;
            let h = hex.trim().replace(/^#/, '');
            if (h.length === 3) h = h.split('').map((c) => c + c).join('');
            if (h.length !== 6 || /[^0-9a-f]/i.test(h)) return null;
            return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
        }
        function rgbaFromColor(color, alpha) {
            const rgb = hexToRgb(color);
            const a = typeof alpha === 'number' ? alpha : 1;
            if (rgb) return 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + a + ')';
            return 'rgba(229,37,33,' + a + ')';
        }
        function render() {
            const num = winsTestAnimDisplay != null ? winsTestAnimDisplay : state.wins;
            document.documentElement.style.setProperty('--tf-font-stack', FONTS[state.font] || FONTS.pressstart);
            elLabel.textContent = String(state.label || 'WINS').toUpperCase();
            elScore.textContent = formatTwoDigits(num);
            elMax.textContent = '/' + state.winsMax;

            const base = Math.max(10, Math.min(80, state.fontSize || 22));
            elLabel.style.fontSize = Math.round(base * 0.55) + 'px';
            elScore.style.fontSize = Math.round(base * 0.85) + 'px';
            elMax.style.fontSize = Math.round(base * 0.65) + 'px';

            elBox.classList.toggle('rainbow', !!state.rainbow);
            elBox.classList.toggle('no-glow', !state.scoreGlow);

            if (!state.rainbow) {
                elLabel.style.color = state.textColor;
                elScore.style.color = state.accentColor;
                elMax.style.color = state.borderColor;
            } else {
                elLabel.style.color = '';
                elScore.style.color = '';
                elMax.style.color = '';
            }

            elPanel.style.background = rgbaFromColor(state.bgColor, 0.98);
            elPanel.style.borderColor = '#1a1a1a';
            elSky.style.borderColor = '#1a1a1a';
            document.documentElement.style.setProperty('--mario-bg', rgbaFromColor(state.bgColor, 0.98));
            document.documentElement.style.setProperty('--mario-text', state.textColor);
            document.documentElement.style.setProperty('--mario-accent', state.accentColor);
            document.documentElement.style.setProperty('--mario-border', state.borderColor);
            fitEmbed();
        }

        function testPulse() {
            elBox.classList.remove('win-animation');
            void elBox.offsetWidth;
            elBox.classList.add('win-animation');
            setTimeout(() => elBox.classList.remove('win-animation'), 650);
        }

        let winsTestAnimRaf = null;
        let winsTestAnimDisplay = null;
        function cancelWinsTestAnim() { if (winsTestAnimRaf != null) { cancelAnimationFrame(winsTestAnimRaf); winsTestAnimRaf = null; } winsTestAnimDisplay = null; }
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function runWinsTestCountUp() {
            cancelWinsTestAnim();
            testPulse();
            const end = clampWins(state.wins);
            const max = state.winsMax;
            let start, target, snapToZeroAfter = false;
            if (end === 0) { start = 0; target = Math.min(6, Math.max(1, max)); snapToZeroAfter = true; }
            else { start = Math.max(0, end - 8); if (start >= end) start = Math.max(0, end - 1); target = end; }
            const durationMs = 2200;
            const t0 = performance.now();
            function tick(now) {
                const u = Math.min(1, (now - t0) / durationMs);
                winsTestAnimDisplay = Math.round(start + (target - start) * easeOutCubic(u));
                render();
                if (u < 1) { winsTestAnimRaf = requestAnimationFrame(tick); }
                else {
                    winsTestAnimRaf = null;
                    if (snapToZeroAfter) { winsTestAnimDisplay = 0; render(); setTimeout(() => { winsTestAnimDisplay = null; render(); }, 320); }
                    else { winsTestAnimDisplay = null; render(); }
                }
            }
            winsTestAnimDisplay = start; render();
            winsTestAnimRaf = requestAnimationFrame(tick);
        }

        function fitEmbed() {
            if (!isEmbed) return;
            document.documentElement.style.setProperty('--fit', '1');
            const r = elBox.getBoundingClientRect();
            if (!r.width || !r.height) return;
            const s = Math.min(1, (window.innerWidth - 16) / r.width, (window.innerHeight - 16) / r.height);
            document.documentElement.style.setProperty('--fit', String(s));
            if (!elBox.classList.contains('win-animation')) elBox.style.transform = 'scale(' + s + ')';
        }

        let ws, rt;
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
            ws.onopen = () => clearTimeout(rt);
            ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
            ws.onmessage = (ev) => {
                let m; try { m = JSON.parse(ev.data); } catch { return; }
                if (m.type === 'settings') {
                    if (m.payload && m.payload.winsCounterMario) { mergeConfig(m.payload.winsCounterMario); render(); }
                } else if (m.type === 'winsMarioTest') { if (!isEmbed) runWinsTestCountUp(); }
                else if (m.type === 'winsMarioReset') { if (!isEmbed) { cancelWinsTestAnim(); render(); } }
            };
        }

        window.addEventListener('message', (e) => {
            const d = e.data;
            if (!d || d.kind !== 'wins_counter_mario') return;
            if (d.type === 'config') { cancelWinsTestAnim(); mergeConfig(d.config); render(); }
            else if (d.type === 'test') runWinsTestCountUp();
            else if (d.type === 'reset') { cancelWinsTestAnim(); render(); }
        });

        window.addEventListener('resize', fitEmbed);
        render();
        connectWS();
    })();
    </script>
</body>
</html>
