<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch7"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Alerta — Likes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --size: 180px;
      --pink: #ff4d8d;
      --violet: #a78bfa;
      --cyan: #22d3ee;
      --s: 1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: 'Poppins', sans-serif; }

    .stage { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .fit { display: flex; flex-direction: column; align-items: center; transform: scale(var(--s)); transform-origin: center; }

    /* ---------- Avatar ---------- */
    .avatar {
      position: relative; width: var(--size); height: var(--size);
      opacity: 0; transform: scale(.3) translateY(20px);
      will-change: transform, opacity;
    }
    .stage.in .avatar { animation: avatarIn .85s cubic-bezier(.2,1.3,.35,1) forwards; }
    .stage.out .avatar { animation: avatarOut .55s cubic-bezier(.5,0,.8,.4) forwards; }
    @keyframes avatarIn { to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes avatarOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.6) translateY(-10px); } }

    .glow {
      position: absolute; inset: -40px; border-radius: 50%;
      background: radial-gradient(circle closest-side, rgba(255,60,120,.55), rgba(167,139,250,.25) 50%, transparent 100%);
      will-change: transform, opacity;
      animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100% { transform: scale(.92); opacity: .7; } 50% { transform: scale(1.1); opacity: 1; } }

    .core { position: absolute; inset: 0; will-change: transform; }
    .ring-glow {
      position: absolute; inset: 0; border-radius: 50%;
      box-shadow: 0 0 10px 1px rgba(255,77,141,.8), inset 0 0 10px 1px rgba(255,77,141,.8);
    }
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--pink), var(--violet), var(--cyan), var(--violet), var(--pink));
      will-change: transform;
      animation: spin 5s linear infinite;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .photo {
      position: absolute; inset: 11px; border-radius: 50%; overflow: hidden;
      background: radial-gradient(circle at 30% 25%, #2b1b4d, #0b1020 75%);
      box-shadow: inset 0 0 22px rgba(0,0,0,.7), 0 8px 30px rgba(0,0,0,.5);
      display: grid; place-items: center;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.26) 50%, transparent 65%);
      transform: translateX(-120%);
      animation: shine 3.4s ease-in-out infinite 1s;
    }
    @keyframes shine { 0% { transform: translateX(-120%); } 45%,100% { transform: translateX(120%); } }

    .wave { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,110,165,.9); pointer-events: none; will-change: transform, opacity; }

    /* ---------- Texto ---------- */
    .text { position: relative; margin-top: 36px; text-align: center; }
    .line {
      display: inline-block; white-space: nowrap;
      font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900;
      font-size: 42px; line-height: 1.1; letter-spacing: -.5px;
      background: linear-gradient(90deg, var(--pink), var(--violet) 50%, var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 14px rgba(167,139,250,.45));
      opacity: 0; transform: translateY(24px);
    }
    .stage.in .line { animation: textIn .7s cubic-bezier(.2,1,.3,1) .3s forwards; }
    .stage.out .line { animation: textOut .45s ease-in forwards; }
    @keyframes textIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes textOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-14px); } }
    #num { font-variant-numeric: tabular-nums; }

    .plus {
      position: absolute; left: 50%; top: -6px;
      font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900;
      font-size: 26px; color: #fff;
      text-shadow: 0 0 14px rgba(255,60,130,.95), 0 2px 8px rgba(0,0,0,.6);
      pointer-events: none; white-space: nowrap;
      will-change: transform, opacity;
    }

    /* ---------- Partículas ---------- */
    #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    .p { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
    .p svg { display: block; width: 100%; height: 100%; overflow: visible; }
  </style>
</head>
<body>
  <!-- Halo de las partículas dentro del SVG: se rasteriza una vez por partícula, no por cuadro. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="hgP" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#ff3278" flood-opacity=".85"/></filter>
    <filter id="hgW" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#ffffff" flood-opacity=".9"/></filter>
  </svg>
  <div class="stage" id="stage">
    <div class="fit" id="fit">
      <div class="avatar" id="avatar">
        <div class="glow"></div>
        <div class="core" id="core">
          <div class="ring-glow"></div>
          <div class="ring"></div>
          <div class="photo"><img id="img" alt="" referrerpolicy="no-referrer"></div>
        </div>
      </div>
      <div class="text" id="textWrap">
        <div class="line" id="line"><span id="who">PreviewFan</span> dio <span id="num">0</span> <span id="unit">likes</span></div>
      </div>
    </div>
    <div id="fx"></div>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    const PREVIEW_AVATAR = '/jarron/lv.png';
    const DEBOUNCE = 720;
    const COLORS = ['#ff2d6f', '#ff5c9a', '#ff7eb3', '#ff4d8d', '#ff8fb8', '#f43f5e', '#e83e8c'];
    const OLD_DEF = { g1: '#ff4d8d', g2: '#c084fc', g3: '#38bdf8' };
    const NEW_DEF = { g1: '#ff4d8d', g2: '#a78bfa', g3: '#22d3ee' };

    const $ = (id) => document.getElementById(id);
    const stage = $('stage'), fit = $('fit'), avatar = $('avatar'), core = $('core'), fx = $('fx');
    const imgEl = $('img'), lineEl = $('line'), numEl = $('num'), unitEl = $('unit'), whoEl = $('who'), textWrap = $('textWrap');

    const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#ff4d8d'/><stop offset='1' stop-color='#a78bfa'/></linearGradient></defs><rect width='100' height='100' fill='#10152b'/><path fill='url(#g)' d='M50 78S22 61 22 41c0-11 8-18 17-18 5 0 9 3 11 7 2-4 6-7 11-7 9 0 17 7 17 18 0 20-28 37-28 37z'/></svg>");
    const HEART = '<svg viewBox="0 0 24 24"><g filter="url(#hgP)"><path fill="currentColor" d="M12 21.2s-7.7-4.7-9.8-9.4C.7 8.3 2.9 4.8 6.3 4.8c2 0 3.6 1.1 5.7 3.3 2.1-2.2 3.7-3.3 5.7-3.3 3.4 0 5.6 3.5 4.1 7-2.1 4.7-9.8 9.4-9.8 9.4z"/><ellipse cx="7.6" cy="8" rx="2.1" ry="1.3" transform="rotate(-35 7.6 8)" fill="#fff" opacity=".55"/></g></svg>';
    const SPARK = '<svg viewBox="0 0 24 24"><path filter="url(#hgW)" fill="#fff" d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>';

    let cfg = { durationSec: 6, scale: 100, g1: OLD_DEF.g1, g2: OLD_DEF.g2, g3: OLD_DEF.g3 };

    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    const easeOutQuart = (t) => 1 - Math.pow(1 - t, 4);
    const easeOutBack = (t) => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
    const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
    const fmt = (n) => Math.round(n).toLocaleString('es-ES');

    function color(key) {
      const v = String(cfg[key] || '').toLowerCase();
      if (!/^#[0-9a-f]{3,8}$/.test(v) || v === OLD_DEF[key]) return NEW_DEF[key];
      return v;
    }
    function userScale() { return Math.min(150, Math.max(50, Number(cfg.scale) || 100)) / 100; }
    function applyConfig(c) {
      if (c && typeof c === 'object') cfg = Object.assign(cfg, c);
      const r = document.documentElement.style;
      r.setProperty('--pink', color('g1')); r.setProperty('--violet', color('g2')); r.setProperty('--cyan', color('g3'));
      resize();
    }
    function resize() {
      const s = Math.min(1, innerWidth / 720, innerHeight / 420) * userScale();
      fit.style.setProperty('--s', String(s));
      measure();
    }
    addEventListener('resize', resize);

    /* Centro del avatar cacheado: leerlo en cada cuadro forzaría layout. */
    let C = { x: innerWidth / 2, y: innerHeight / 2, R: 90 };
    function measure() {
      const r = avatar.getBoundingClientRect();
      const s = Number(fit.style.getPropertyValue('--s')) || 1;
      C = { x: r.left + r.width / 2, y: r.top + r.height / 2, R: (avatar.offsetWidth / 2) * s };
    }

    /* ---------- partículas ---------- */
    let particles = [];
    let emitting = false, emitAcc = 0, boost = 0;
    let lastNow = performance.now();
    let numAnim = null;
    let rafId = 0;
    function kick() { if (!rafId) { lastNow = performance.now(); rafId = requestAnimationFrame(frame); } }

    function makeEl(kind, size, col) {
      const d = document.createElement('div');
      d.className = 'p';
      d.style.width = d.style.height = size + 'px';
      d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px';
      d.style.color = col;
      d.innerHTML = kind === 'spark' ? SPARK : HEART;
      d.style.opacity = 0;
      fx.appendChild(d);
      return d;
    }

    function spawn(now) {
      const R = C.R;
      const isSpark = Math.random() < .2;
      const size = isSpark ? rand(9, 16) : rand(18, 38);
      const dir = Math.random() < .8 ? 1 : -1;
      particles.push({
        el: makeEl(isSpark ? 'spark' : 'heart', size, COLORS[(Math.random() * COLORS.length) | 0]),
        t0: now,
        dur: rand(1900, 3100),
        a0: rand(0, Math.PI * 2),
        spin: dir * rand(.7, 1.9) * Math.PI,
        r0: rand(0, R * .32),
        r1: R + rand(55, 175),
        lift: rand(20, 80),
        seed: rand(0, 10),
        sway: rand(10, 26),
      });
      kick();
    }

    function frame(now) {
      rafId = 0;
      const dt = Math.min(.05, (now - lastNow) / 1000); lastNow = now;
      const cx = C.x, cy = C.y;

      boost *= Math.pow(.55, dt);
      if (emitting && !document.hidden) {
        emitAcc += dt * (7 + boost);
        while (emitAcc >= 1) { emitAcc -= 1; spawn(now); }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const t = (now - p.t0) / p.dur;
        if (t < 0) continue;
        if (t >= 1) { p.el.remove(); particles.splice(i, 1); continue; }
        const e = easeOutCubic(t);
        const r = p.r0 + (p.r1 - p.r0) * e;
        const a = p.a0 + p.spin * easeOutQuart(t);
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r - p.lift * t;
        const scale = Math.max(0, easeOutBack(clamp(t / .2))) * (1 - .5 * easeInOutSine(clamp((t - .25) / .75)));
        const op = clamp(t / .05) * (1 - clamp((t - .62) / .38));
        const rot = Math.sin(t * 5 + p.seed) * p.sway;
        p.el.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${scale})`;
        p.el.style.opacity = op;
      }

      if (numAnim) {
        const k = clamp((now - numAnim.t0) / numAnim.dur);
        const txt = fmt(numAnim.from + (numAnim.to - numAnim.from) * easeOutCubic(k));
        if (numEl.textContent !== txt) numEl.textContent = txt;
        if (k >= 1) numAnim = null;
      }
      if (emitting || particles.length || numAnim) kick();
    }

    /* ---------- efectos puntuales ---------- */
    function beat(strength = 1) {
      if (document.hidden) return;
      core.animate(
        [{ transform: 'scale(1)' }, { transform: `scale(${1 + .07 * strength})`, offset: .35 }, { transform: 'scale(1)' }],
        { duration: 420, easing: 'cubic-bezier(.3,0,.2,1)' }
      );
      const w = document.createElement('div');
      w.className = 'wave';
      avatar.appendChild(w);
      const a = w.animate(
        [{ transform: 'scale(1)', opacity: .85 }, { transform: 'scale(2.1)', opacity: 0 }],
        { duration: 1300, easing: 'cubic-bezier(.1,.6,.3,1)' }
      );
      a.onfinish = () => w.remove();
    }
    function bumpText() {
      lineEl.animate(
        [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-3px) scale(1.07)', offset: .35 }, { transform: 'translateY(0) scale(1)' }],
        { duration: 380, easing: 'cubic-bezier(.3,0,.2,1)' }
      );
    }
    function floatPlus(n) {
      const el = document.createElement('div');
      el.className = 'plus';
      el.textContent = '+' + fmt(n) + ' ❤';
      textWrap.appendChild(el);
      const a = el.animate(
        [
          { transform: 'translate(-50%,10px) scale(.6)', opacity: 0 },
          { transform: 'translate(-50%,-14px) scale(1.15)', opacity: 1, offset: .25 },
          { transform: 'translate(-50%,-62px) scale(1)', opacity: 0 },
        ],
        { duration: 1200, easing: 'cubic-bezier(.2,.8,.3,1)' }
      );
      a.onfinish = () => el.remove();
    }

    /* ---------- alerta ---------- */
    function name(d) { return (d.nickname || '').trim() || (d.uniqueId ? '@' + String(d.uniqueId).replace(/^@+/, '') : 'Usuario'); }
    function keyOf(d) { return String(d.uniqueId || d.nickname || 'anon').toLowerCase(); }

    const q = [];
    let active = false, cur = null;
    let timers = [];
    let hideTimer = null, beatTimer = null, demoTimer = null;
    function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
    function durMs() { return Math.min(120000, Math.max(3000, (Number(cfg.durationSec) || 6) * 1000)); }

    function stopAll() {
      timers.forEach(clearTimeout); timers = [];
      clearTimeout(hideTimer); hideTimer = null;
      clearInterval(beatTimer); beatTimer = null;
      clearInterval(demoTimer); demoTimer = null;
      emitting = false; boost = 0; emitAcc = 0; numAnim = null;
      particles.forEach((p) => p.el.remove()); particles = [];
      q.length = 0; active = false; cur = null;
      stage.classList.remove('in', 'out');
    }

    function pushLikes(d) {
      const n = Math.max(1, Math.floor(Number(d.likeCount)) || 1);
      if (active && cur && cur.key === keyOf(d)) { addLikes(n); return; }
      q.push({ ...d, likeCount: n });
      if (!active) next();
    }

    function next() {
      const d = q.shift();
      if (!d) { active = false; return; }
      active = true;
      cur = { key: keyOf(d), count: 0 };
      whoEl.textContent = name(d);
      imgEl.onerror = function () { this.onerror = null; this.src = FALLBACK_IMG; };
      imgEl.src = String(d.photo || d.profilePictureUrl || '').trim() || FALLBACK_IMG;
      imgEl.alt = name(d);
      numEl.textContent = '0';
      unitEl.textContent = 'likes';

      stage.classList.remove('out');
      void stage.offsetWidth;
      stage.classList.add('in');
      measure();
      later(measure, 900);

      emitting = true; kick();
      later(() => addLikes(d.likeCount, true), 350);
      clearInterval(beatTimer);
      beatTimer = setInterval(() => beat(.7), 1100);
      later(() => beat(1.2), 300);
    }

    function addLikes(n, first = false) {
      if (!cur) return;
      const from = cur.count;
      cur.count += n;
      numAnim = { from, to: cur.count, t0: performance.now(), dur: first ? 1200 : 650 };
      unitEl.textContent = cur.count === 1 ? 'like' : 'likes';
      boost = Math.min(34, boost + 6 + n * .5);
      const now = performance.now();
      for (let i = 0; i < Math.min(18, 4 + n * .2); i++) spawn(now + i * 25);
      if (!first) { beat(1.3); bumpText(); floatPlus(n); }
      kick();
      if (isEmbed) return;
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hide, durMs());
    }

    function hide() {
      hideTimer = null;
      emitting = false;
      clearInterval(beatTimer); beatTimer = null;
      const now = performance.now();
      for (let i = 0; i < 16; i++) spawn(now + i * 20);
      stage.classList.remove('in');
      stage.classList.add('out');
      later(() => {
        stage.classList.remove('out');
        cur = null; active = false;
        next();
      }, 900);
    }

    /* Likes llegan en lotes por usuario: acumular y soltar tras una pausa. */
    const pending = Object.create(null);
    function onLike(p) {
      p = p || {};
      const uid = String(p.uniqueId || p.nickname || 'anon').toLowerCase();
      const delta = Math.max(0, Math.floor(Number(p.count)) || 0);
      if (delta <= 0) return;
      let pe = pending[uid];
      if (!pe) { pe = { timer: null, count: 0, nick: p.nickname || uid, pic: p.photo || p.profilePictureUrl || '', uid: p.uniqueId || uid }; pending[uid] = pe; }
      pe.count += delta;
      if (p.nickname) pe.nick = p.nickname;
      if (p.photo || p.profilePictureUrl) pe.pic = p.photo || p.profilePictureUrl;
      if (pe.timer) clearTimeout(pe.timer);
      pe.timer = setTimeout(() => {
        const total = pe.count; delete pending[uid];
        if (total <= 0) return;
        pushLikes({ uniqueId: pe.uid, nickname: pe.nick, photo: pe.pic, likeCount: total });
      }, DEBOUNCE);
    }

    const DEMO = { uniqueId: 'preview_fan', nickname: 'PreviewFan', photo: PREVIEW_AVATAR, likeCount: 60 };

    /* Vista previa del panel: se queda visible con combos de vez en cuando. */
    function idleDemo() {
      stopAll();
      q.push({ ...DEMO });
      next();
      let step = 0;
      demoTimer = setInterval(() => {
        if (document.hidden || !cur) return;
        addLikes([15, 25, 10][step++ % 3]);
      }, 3200);
    }

    function runTest() {
      if (isEmbed) { idleDemo(); return; }
      stopAll();
      pushLikes({ ...DEMO });
      later(() => pushLikes({ ...DEMO, likeCount: 15 }), 2400);
      later(() => pushLikes({ ...DEMO, likeCount: 25 }), 3800);
    }
    function resetAll() {
      stopAll();
      if (isEmbed) idleDemo();
    }

    let ws, rt;
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
      ws.onopen = () => clearTimeout(rt);
      ws.onclose = () => { rt = setTimeout(connect, 1500); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === 'settings') { if (m.payload && m.payload.alertaLikes) applyConfig(m.payload.alertaLikes); return; }
        if (isEmbed) return;
        if (m.type === 'like') onLike(m.payload);
        else if (m.type === 'alertaLikesTest') runTest();
        else if (m.type === 'alertaLikesReset') resetAll();
      };
    }
    window.addEventListener('message', (e) => {
      const d = e.data; if (!d || d.kind !== 'alertalikes') return;
      if (d.type === 'config') applyConfig(d.config);
      else if (d.type === 'test') runTest();
      else if (d.type === 'reset') resetAll();
    });

    applyConfig({});
    if (isEmbed) {
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(idleDemo, 120));
    }
    connect();
  })();
  </script>
<script src="/js/overlay-keepalive.js"></script>
</body>
</html>
