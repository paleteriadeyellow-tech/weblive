<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch1"></script>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay — Contador de victorias (Minecraft)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Fredoka:wght@600;700&family=Inter:wght@700;800&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800;900&family=Titan+One&display=swap');
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: var(--tf-font-stack, 'Press Start 2P', monospace);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            image-rendering: pixelated;
        }
        .mc-wrap {
            position: relative;
            transform-origin: center center;
            transition: transform 0.15s steps(3);
            user-select: none;
            filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.45));
        }
        .mc-grass {
            height: 10px;
            margin: 0 6px;
            border: 3px solid #1a1a1a;
            border-bottom: none;
            background:
                repeating-linear-gradient(90deg, #5d9b38 0 8px, #4a7f2c 8px 16px),
                linear-gradient(180deg, #6dbb45 0%, #4a7f2c 100%);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.25);
        }
        .mc-panel {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 22px 16px 20px;
            background: var(--mc-bg, rgba(86, 86, 86, 0.92));
            border: 4px solid #1a1a1a;
            box-shadow:
                inset 3px 3px 0 rgba(255, 255, 255, 0.22),
                inset -3px -3px 0 rgba(0, 0, 0, 0.35);
        }
        .mc-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.12;
            background-image:
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%),
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
        }
        .mc-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            image-rendering: pixelated;
            background:
                linear-gradient(180deg, #6dbb45 0 45%, #8b5a2b 45% 100%);
            border: 3px solid #1a1a1a;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.2), inset -2px -2px 0 rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }
        .mc-icon::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px;
            height: 8px;
            background: repeating-linear-gradient(90deg, #7ed957 0 4px, #5d9b38 4px 8px);
        }
        .mc-label {
            position: relative;
            z-index: 1;
            font-family: var(--tf-font-stack, 'Press Start 2P', monospace);
            font-weight: 700;
            color: var(--mc-text, #ffffff);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #1a1a1a, 3px 3px 0 rgba(0,0,0,0.35);
            line-height: 1.35;
        }
        .mc-score-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: baseline;
            gap: 2px;
            font-family: var(--tf-font-stack, 'Press Start 2P', monospace);
            font-variant-numeric: tabular-nums;
        }
        .mc-score {
            font-weight: 700;
            color: var(--mc-accent, #55ff55);
            text-shadow:
                2px 2px 0 #1a4a1a,
                0 0 8px rgba(85, 255, 85, 0.45);
        }
        .mc-max {
            font-weight: 700;
            color: var(--mc-border, #c6c6c6);
            text-shadow: 2px 2px 0 #1a1a1a;
            opacity: 0.92;
        }
        .mc-wrap.no-glow .mc-score {
            text-shadow: 2px 2px 0 #1a4a1a;
        }
        @keyframes wins-rainbow { to { background-position: 200% center; } }
        .mc-wrap.rainbow .mc-label,
        .mc-wrap.rainbow .mc-score,
        .mc-wrap.rainbow .mc-max {
            background-image: linear-gradient(90deg, #55ff55, #8b5a2b, #55ff55, #00e5ff, #ffcc00, #55ff55);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: wins-rainbow 3.2s linear infinite;
        }
        @keyframes mcBounce {
            0%, 100% { transform: scale(var(--fit, 1)) translateY(0); }
            25% { transform: scale(var(--fit, 1)) translateY(-6px); }
            50% { transform: scale(calc(var(--fit, 1) * 1.06)) translateY(-2px); }
            75% { transform: scale(var(--fit, 1)) translateY(-4px); }
        }
        .mc-wrap.win-animation {
            animation: mcBounce 0.55s steps(5) forwards;
        }
</style>
</head>
<body>
    <div class="mc-wrap" id="counterBox" aria-live="polite">
        <div class="mc-grass" id="elGrass"></div>
        <div class="mc-panel" id="elPanel">
            <div class="mc-icon" id="elIcon" aria-hidden="true"></div>
            <span class="mc-label" id="elLabel">WINS</span>
            <div class="mc-score-row">
                <span class="mc-score" id="elScore">00</span>
                <span class="mc-max" id="elMax">/10</span>
            </div>
        </div>
    </div>

    <script>
(function () {
        const params = new URLSearchParams(location.search);
        const isEmbed = params.get('embed') === '1';

        const elLabel = document.getElementById('elLabel');
        const elScore = document.getElementById('elScore');
        const elMax = document.getElementById('elMax');
        const elBox = document.getElementById('counterBox');
        const elPanel = document.getElementById('elPanel');
        const elGrass = document.getElementById('elGrass');

        const FONTS = {
            pressstart: "'Press Start 2P', monospace",
            luckiest: "'Luckiest Guy', system-ui, sans-serif",
            bangers: "'Bangers', system-ui, sans-serif",
            lilita: "'Lilita One', system-ui, sans-serif",
            titan: "'Titan One', system-ui, sans-serif",
            fredoka: "'Fredoka', system-ui, sans-serif",
            bungee: "'Bungee', system-ui, sans-serif",
            rubik: "'Rubik', system-ui, sans-serif",
            oswald: "'Oswald', system-ui, sans-serif",
            bebas: "'Bebas Neue', Impact, sans-serif",
            montserrat: "'Montserrat', system-ui, sans-serif",
            poppins: "'Poppins', system-ui, sans-serif",
            orbitron: "'Orbitron', system-ui, sans-serif",
            inter: "'Inter', system-ui, sans-serif",
            system: "system-ui, sans-serif",
        };

        const state = {
            label: 'WINS', wins: 0, winsMax: 10, font: 'pressstart', rainbow: false, scoreGlow: true,
            textColor: '#ffffff', accentColor: '#55ff55',
            bgColor: '#565656', borderColor: '#c6c6c6', fontSize: 22,
        };

        function clampWins(w) {
            const n = parseInt(w, 10);
            const x = Number.isFinite(n) ? n : 0;
            return Math.max(-999999, Math.min(999999, x));
        }
        function mergeConfig(c) {
            if (!c || typeof c !== 'object') return;
            if (c.label != null) state.label = String(c.label).trim().slice(0, 48) || 'WINS';
            if (c.font != null && FONTS[c.font]) state.font = c.font;
            if (c.rainbow != null) state.rainbow = !!c.rainbow;
            if (c.scoreGlow != null) state.scoreGlow = !!c.scoreGlow;
            const maxRaw = c.winsMax != null ? c.winsMax : c.max;
            if (maxRaw != null) { const m = parseInt(maxRaw, 10); if (Number.isFinite(m)) state.winsMax = Math.max(1, Math.min(999999, m)); }
            if (c.wins != null) state.wins = clampWins(c.wins);
            else state.wins = clampWins(state.wins);
            if (c.textColor) state.textColor = String(c.textColor);
            if (c.accentColor) state.accentColor = String(c.accentColor);
            if (c.bgColor) state.bgColor = String(c.bgColor);
            if (c.borderColor) state.borderColor = String(c.borderColor);
            const fs = parseInt(c.fontSize, 10);
            if (Number.isFinite(fs) && fs > 8 && fs < 200) state.fontSize = fs;
        }
        function formatTwoDigits(n) {
            const v = Number.isFinite(n) ? n : 0;
            if (v < 0) return String(v);
            if (v < 10) return '0' + v;
            return String(v);
        }
        function hexToRgb(hex) {
            if (typeof hex !== 'string') return null;
            let h = hex.trim().replace(/^#/, '');
            if (h.length === 3) h = h.split('').map((c) => c + c).join('');
            if (h.length !== 6 || /[^0-9a-f]/i.test(h)) return null;
            return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
        }
        function rgbaFromColor(color, alpha) {
            const rgb = hexToRgb(color);
            const a = typeof alpha === 'number' ? alpha : 1;
            if (rgb) return 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + a + ')';
            return 'rgba(86,86,86,' + a + ')';
        }
        function render() {
            const num = winsTestAnimDisplay != null ? winsTestAnimDisplay : state.wins;
            document.documentElement.style.setProperty('--tf-font-stack', FONTS[state.font] || FONTS.pressstart);
            elLabel.textContent = String(state.label || 'WINS').toUpperCase();
            elScore.textContent = formatTwoDigits(num);
            elMax.textContent = '/' + state.winsMax;

            const base = Math.max(10, Math.min(80, state.fontSize || 22));
            elLabel.style.fontSize = Math.round(base * 0.55) + 'px';
            elScore.style.fontSize = Math.round(base * 0.85) + 'px';
            elMax.style.fontSize = Math.round(base * 0.65) + 'px';

            elBox.classList.toggle('rainbow', !!state.rainbow);
            elBox.classList.toggle('no-glow', !state.scoreGlow);

            if (!state.rainbow) {
                elLabel.style.color = state.textColor;
                elScore.style.color = state.accentColor;
                elMax.style.color = state.borderColor;
            } else {
                elLabel.style.color = '';
                elScore.style.color = '';
                elMax.style.color = '';
            }

            elPanel.style.background = rgbaFromColor(state.bgColor, 0.92);
            elPanel.style.borderColor = '#1a1a1a';
            elGrass.style.borderColor = '#1a1a1a';
            document.documentElement.style.setProperty('--mc-bg', rgbaFromColor(state.bgColor, 0.92));
            document.documentElement.style.setProperty('--mc-text', state.textColor);
            document.documentElement.style.setProperty('--mc-accent', state.accentColor);
            document.documentElement.style.setProperty('--mc-border', state.borderColor);
            fitEmbed();
        }

        function testPulse() {
            elBox.classList.remove('win-animation');
            void elBox.offsetWidth;
            elBox.classList.add('win-animation');
            setTimeout(() => elBox.classList.remove('win-animation'), 600);
        }

        let winsTestAnimRaf = null;
        let winsTestAnimDisplay = null;
        function cancelWinsTestAnim() { if (winsTestAnimRaf != null) { cancelAnimationFrame(winsTestAnimRaf); winsTestAnimRaf = null; } winsTestAnimDisplay = null; }
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function runWinsTestCountUp() {
            cancelWinsTestAnim();
            testPulse();
            const end = clampWins(state.wins);
            const max = state.winsMax;
            let start, target, snapToZeroAfter = false;
            if (end === 0) { start = 0; target = Math.min(6, Math.max(1, max)); snapToZeroAfter = true; }
            else { start = Math.max(0, end - 8); if (start >= end) start = Math.max(0, end - 1); target = end; }
            const durationMs = 2200;
            const t0 = performance.now();
            function tick(now) {
                const u = Math.min(1, (now - t0) / durationMs);
                winsTestAnimDisplay = Math.round(start + (target - start) * easeOutCubic(u));
                render();
                if (u < 1) { winsTestAnimRaf = requestAnimationFrame(tick); }
                else {
                    winsTestAnimRaf = null;
                    if (snapToZeroAfter) { winsTestAnimDisplay = 0; render(); setTimeout(() => { winsTestAnimDisplay = null; render(); }, 320); }
                    else { winsTestAnimDisplay = null; render(); }
                }
            }
            winsTestAnimDisplay = start; render();
            winsTestAnimRaf = requestAnimationFrame(tick);
        }

        function fitEmbed() {
            if (!isEmbed) return;
            document.documentElement.style.setProperty('--fit', '1');
            const r = elBox.getBoundingClientRect();
            if (!r.width || !r.height) return;
            const s = Math.min(1, (window.innerWidth - 16) / r.width, (window.innerHeight - 16) / r.height);
            document.documentElement.style.setProperty('--fit', String(s));
            if (!elBox.classList.contains('win-animation')) elBox.style.transform = 'scale(' + s + ')';
        }

        let ws, rt;
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
            ws.onopen = () => clearTimeout(rt);
            ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
            ws.onmessage = (ev) => {
                let m; try { m = JSON.parse(ev.data); } catch { return; }
                if (m.type === 'settings') {
                    if (m.payload && m.payload.winsCounterMinecraft) { mergeConfig(m.payload.winsCounterMinecraft); render(); }
                } else if (m.type === 'winsMinecraftTest') { if (!isEmbed) runWinsTestCountUp(); }
                else if (m.type === 'winsMinecraftReset') { if (!isEmbed) { cancelWinsTestAnim(); render(); } }
            };
        }

        window.addEventListener('message', (e) => {
            const d = e.data;
            if (!d || d.kind !== 'wins_counter_minecraft') return;
            if (d.type === 'config') { cancelWinsTestAnim(); mergeConfig(d.config); render(); }
            else if (d.type === 'test') runWinsTestCountUp();
            else if (d.type === 'reset') { cancelWinsTestAnim(); render(); }
        });

        window.addEventListener('resize', fitEmbed);
        render();
        connectWS();
    })();
    </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
