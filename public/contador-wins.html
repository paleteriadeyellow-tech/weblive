<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay — Contador de victorias</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Cinzel:wght@700;900&family=Fredoka:wght@600;700&family=Inter:wght@700;800&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800;900&family=Titan+One&display=swap');
        html, body {
            margin: 0;
            overflow: hidden;
            font-family: var(--tf-font-stack, 'Inter', system-ui, sans-serif);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        /* Marco gamer (contador1.png): panel oscuro angular con borde verde neón.
           El texto va centrado dentro de la zona oscura del marco. */
        /* Base BLANCA/plateada: el marco se desatura (escala de grises) y se tiñe con
           --frame-color mediante una capa en "multiply". Blanco => sin tinte (plateado);
           cualquier color => marco de ese color. --glow es el resplandor del pulso. */
        .wins-box {
            position: relative;
            width: 440px;
            aspect-ratio: 1024 / 683;
            transition: transform 0.15s ease;
            transform-origin: center center;
            isolation: isolate;
        }
        .wins-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('contador1.png') center center / contain no-repeat;
            filter: grayscale(1) brightness(1.3) contrast(1.04);
            transition: filter 0.15s ease;
        }
        .wins-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--frame-color, #ffffff);
            -webkit-mask: url('contador1.png') center center / contain no-repeat;
            mask: url('contador1.png') center center / contain no-repeat;
            mix-blend-mode: multiply;
            pointer-events: none;
        }
        .wins-box.pulse { transform: scale(1.05); }
        .wins-box.pulse::before {
            filter: grayscale(1) brightness(1.3) contrast(1.04) drop-shadow(0 0 14px var(--glow, rgba(255, 255, 255, 0.6)));
        }
        .wins-text {
            /* Centrado dentro del panel oscuro del marco (un poco sobre el centro). */
            position: absolute;
            z-index: 2;
            top: 44%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 74%;
            text-align: center;
            margin: 0;
            font-family: var(--tf-font-stack, 'Inter', system-ui, sans-serif);
            font-weight: 800;
            font-size: 28px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.55), 0 2px 4px rgba(0, 0, 0, 0.7);
        }
        .wins-label { color: #ffffff; }
        .wins-sep { color: rgba(255, 255, 255, 0.65); margin: 0 0.15em; }
        .wins-count { color: #22c55e; }
        /* Texto arcoíris (casilla del panel): degradado animado sobre todas las letras y números. */
        @keyframes wins-rainbow { to { background-position: 200% center; } }
        .wins-text.rainbow .wins-label,
        .wins-text.rainbow .wins-sep,
        .wins-text.rainbow .wins-count {
            background-image: linear-gradient(90deg, #ff004c, #ff8a00, #ffe600, #2bff00, #00e5ff, #2a6bff, #c400ff, #ff004c);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: wins-rainbow 2.8s linear infinite;
        }
</style>
</head>
<body>
    <div class="wins-box" id="wins-box" aria-live="polite">
        <p class="wins-text" id="wins-line"><span class="wins-label" id="el-label">Wins</span><span class="wins-sep"> - </span><span class="wins-count" id="el-count">0/10</span></p>
    </div>

    <script>
(function () {
        const params = new URLSearchParams(location.search);
        const isEmbed = params.get('embed') === '1';

        const elLabel = document.getElementById('el-label');
        const elCount = document.getElementById('el-count');
        const elBox = document.getElementById('wins-box');

        const FONTS = { luckiest: "'Luckiest Guy', system-ui, sans-serif", bangers: "'Bangers', system-ui, sans-serif", lilita: "'Lilita One', system-ui, sans-serif", titan: "'Titan One', system-ui, sans-serif", fredoka: "'Fredoka', system-ui, sans-serif", bungee: "'Bungee', system-ui, sans-serif", rubik: "'Rubik', system-ui, sans-serif", oswald: "'Oswald', system-ui, sans-serif", bebas: "'Bebas Neue', Impact, sans-serif", montserrat: "'Montserrat', system-ui, sans-serif", poppins: "'Poppins', system-ui, sans-serif", orbitron: "'Orbitron', system-ui, sans-serif", inter: "'Inter', system-ui, sans-serif", system: "system-ui, sans-serif" };

        const state = {
            label: 'Wins', wins: 0, winsMax: 10, font: 'inter', rainbow: false,
            textColor: '#ffffff', accentColor: '#22c55e',
            bgColor: '#1c1c1f', borderColor: '#ffffff', fontSize: 28,
        };

        function clampWins(w, max) {
            // wins libre: puede superar el máximo y bajar de 0 (negativos).
            const n = parseInt(w, 10);
            const x = Number.isFinite(n) ? n : 0;
            return Math.max(-999999, Math.min(999999, x));
        }
        function hexToRgb(hex) {
            if (typeof hex !== 'string') return null;
            let h = hex.trim().replace(/^#/, '');
            if (h.length === 3) h = h.split('').map((c) => c + c).join('');
            if (h.length !== 6 || /[^0-9a-f]/i.test(h)) return null;
            return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
        }
        function rgbaFromColor(color, alpha) {
            const rgb = hexToRgb(color);
            const a = typeof alpha === 'number' ? alpha : 1;
            if (rgb) return 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + a + ')';
            if (typeof color === 'string' && /^rgba?\(/i.test(color)) return color;
            return 'rgba(34,197,94,' + a + ')';
        }
        function mergeConfig(c) {
            if (!c || typeof c !== 'object') return;
            if (c.label != null) state.label = String(c.label).trim().slice(0, 48) || 'Wins';
            if (c.font != null && FONTS[c.font]) state.font = c.font;
            if (c.rainbow != null) state.rainbow = !!c.rainbow;
            const maxRaw = c.winsMax != null ? c.winsMax : c.max;
            if (maxRaw != null) { const m = parseInt(maxRaw, 10); if (Number.isFinite(m)) state.winsMax = Math.max(1, Math.min(999999, m)); }
            if (c.wins != null) state.wins = clampWins(c.wins, state.winsMax);
            else state.wins = clampWins(state.wins, state.winsMax);
            if (c.textColor) state.textColor = String(c.textColor);
            if (c.accentColor) state.accentColor = String(c.accentColor);
            if (c.bgColor) state.bgColor = String(c.bgColor);
            if (c.borderColor) state.borderColor = String(c.borderColor);
            const fs = parseInt(c.fontSize, 10);
            if (Number.isFinite(fs) && fs > 8 && fs < 200) state.fontSize = fs;
        }
        function render() {
            const w = winsTestAnimDisplay != null ? winsTestAnimDisplay : state.wins;
            document.documentElement.style.setProperty('--tf-font-stack', FONTS[state.font] || FONTS.inter);
            elLabel.textContent = state.label;
            elCount.textContent = w + '/' + state.winsMax;
            const line = document.getElementById('wins-line');
            if (state.rainbow) {
                line.classList.add('rainbow');
                elLabel.style.color = ''; elCount.style.color = ''; elLabel.style.webkitTextFillColor = ''; elCount.style.webkitTextFillColor = '';
            } else {
                line.classList.remove('rainbow');
                elLabel.style.color = state.textColor;
                elCount.style.color = state.accentColor;
            }
            // El fondo/borde lo aporta la imagen del marco; el color de acento tiñe el glow del texto.
            const glow = rgbaFromColor(state.accentColor, 0.55);
            document.getElementById('wins-line').style.textShadow = '0 0 10px ' + glow + ', 0 2px 4px rgba(0,0,0,0.7)';
            document.getElementById('wins-line').style.fontSize = state.fontSize + 'px';
            // El marco escala con el tamaño de fuente (base: 28px => 440px de ancho).
            elBox.style.width = Math.round(440 * (state.fontSize / 28)) + 'px';
            // Color del marco: base blanca/plateada teñida con el color elegido (blanco = sin tinte).
            elBox.style.setProperty('--frame-color', state.borderColor || '#ffffff');
            elBox.style.setProperty('--glow', rgbaFromColor(state.borderColor, 0.6));
            fitEmbed();
        }

        function testPulse() { elBox.classList.add('pulse'); setTimeout(() => elBox.classList.remove('pulse'), 220); }

        let winsTestAnimRaf = null;
        let winsTestAnimDisplay = null;
        function cancelWinsTestAnim() { if (winsTestAnimRaf != null) { cancelAnimationFrame(winsTestAnimRaf); winsTestAnimRaf = null; } winsTestAnimDisplay = null; }
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function runWinsTestCountUp() {
            cancelWinsTestAnim();
            testPulse();
            const end = clampWins(state.wins, state.winsMax);
            const max = state.winsMax;
            let start, target, snapToZeroAfter = false;
            if (end === 0) { start = 0; target = Math.min(6, Math.max(1, max)); snapToZeroAfter = true; }
            else { start = Math.max(0, end - 8); if (start >= end) start = Math.max(0, end - 1); target = end; }
            const durationMs = 2200;
            const t0 = performance.now();
            function tick(now) {
                const u = Math.min(1, (now - t0) / durationMs);
                winsTestAnimDisplay = Math.round(start + (target - start) * easeOutCubic(u));
                render();
                if (u < 1) { winsTestAnimRaf = requestAnimationFrame(tick); }
                else {
                    winsTestAnimRaf = null;
                    if (snapToZeroAfter) { winsTestAnimDisplay = 0; render(); setTimeout(() => { winsTestAnimDisplay = null; render(); }, 320); }
                    else { winsTestAnimDisplay = null; render(); }
                }
            }
            winsTestAnimDisplay = start; render();
            winsTestAnimRaf = requestAnimationFrame(tick);
        }

        function fitEmbed() {
            if (!isEmbed) return;
            elBox.style.transform = 'scale(1)';
            const r = elBox.getBoundingClientRect();
            if (!r.width || !r.height) return;
            const s = Math.min(1, (window.innerWidth - 16) / r.width, (window.innerHeight - 16) / r.height);
            elBox.style.transform = 'scale(' + s + ')';
        }

        // ---- WebSocket nativo (misma room que el resto de overlays) ----
        let ws, rt;
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
            ws.onopen = () => clearTimeout(rt);
            ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
            ws.onmessage = (ev) => {
                let m; try { m = JSON.parse(ev.data); } catch { return; }
                if (m.type === 'settings') { if (m.payload && m.payload.winsCounter) { mergeConfig(m.payload.winsCounter); render(); } }
                else if (m.type === 'winsTest') { if (!isEmbed) runWinsTestCountUp(); }
                else if (m.type === 'winsReset') { if (!isEmbed) { cancelWinsTestAnim(); render(); } }
            };
        }

        // ---- Control desde el panel (vista previa embebida) ----
        window.addEventListener('message', (e) => {
            const d = e.data;
            if (!d || d.kind !== 'wins_counter') return;
            if (d.type === 'config') { cancelWinsTestAnim(); mergeConfig(d.config); render(); }
            else if (d.type === 'test') runWinsTestCountUp();
            else if (d.type === 'reset') { cancelWinsTestAnim(); render(); }
        });

        window.addEventListener('resize', fitEmbed);
        render();
        connectWS();
    })();
    </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
