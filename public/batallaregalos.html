<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Batalla de regalos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap');
    * { box-sizing: border-box; }
    :root {
      --bat-gap: 4px;
      --bat-c1-bg: rgba(36,48,64,.72); --bat-c1-bd: rgba(148,163,184,.5);
      --bat-c1-inset1: rgba(56,189,248,.08); --bat-c1-inset2: rgba(148,163,184,.06);
      --bat-c2-bg: rgba(22,26,34,.72); --bat-c2-bd: rgba(100,110,125,.75);
      --bat-cr-bg: rgba(18,22,30,.75); --bat-cr-bd: rgba(90,100,118,.55);
      --bat-ng1: #ff006e; --bat-ng2: #3a86ff; --bat-ng3: #ffbe0b;
      --bat-vc: #fde68a; --bat-vg: rgba(250,204,21,.45);
      --bat-coin: #ffd700; --bat-coin-glow: rgba(255,215,0,.65);
      --bat-vs1: #fff5e6; --bat-vs2: #ff6b35; --bat-vs3: #c41e3a;
      --bat-vs-g1: rgba(56,189,248,.55); --bat-vs-g2: rgba(250,204,21,.35);
      --bat-a1-bd: rgba(186,230,253,.5); --bat-a1-sh: rgba(56,189,248,.22);
      --bat-a2-bd: rgba(180,195,210,.65); --bat-a2-sh: rgba(180,200,220,.2);
      --bat-ar-bd: rgba(160,170,185,.45); --bat-ar-sh: rgba(160,170,185,.12);
      --bat-ph: rgba(226,232,240,.88); --bat-ph-glow: rgba(56,189,248,.3);
    }
    body { background-color: transparent !important; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 6px; overflow: hidden; }
    html.embed, html.embed body { width: 100%; height: 100%; }
    html.embed body { display: flex; align-items: center; justify-content: center; padding: 0; }
    html.embed .battle-root { transform: scale(var(--fit, 1)); transform-origin: center center; }
    .battle-root { display: inline-block; position: relative; }
    .battle-container { position: relative; width: 404px; padding: 0; overflow: visible; }
    .battle-duel { display: flex; flex-direction: column; gap: var(--bat-gap); }
    .battle-duel__row { display: grid; grid-template-columns: 122px 1fr; gap: 12px; align-items: center; min-height: 64px; padding: 8px 12px; border-radius: 12px; position: relative; z-index: 1; background-color: rgba(22,28,38,.72); border: 1px solid rgba(120,130,150,.45); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
    .battle-duel__icons { display: flex; flex-direction: row; align-items: center; gap: 14px; justify-content: flex-start; }
    .battle-duel__vs-row { display: grid; grid-template-columns: 122px 1fr; gap: 12px; align-items: center; min-height: 28px; }
    .battle-duel__vs-cell { display: flex; justify-content: center; align-items: center; overflow: visible; min-height: 26px; padding: 0 4px; }
    .battle-card--first { background-color: var(--bat-c1-bg); border-color: var(--bat-c1-bd); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), inset 6px 0 18px -6px var(--bat-c1-inset1), inset -6px 0 18px -6px var(--bat-c1-inset2); }
    .battle-card--second { background-color: var(--bat-c2-bg); border-color: var(--bat-c2-bd); }
    .battle-card--rest { background-color: var(--bat-cr-bg); border-color: var(--bat-cr-bd); box-shadow: inset 0 0 0 1px rgba(0,0,0,.3), inset 4px 0 12px -6px rgba(180,140,80,.08); }
    .bat-rank-badge { width: 50px; height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 38px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,.55)); }
    .hexagon { width: 30px; height: 34px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); display: flex; justify-content: center; align-items: center; color: #1a1206; font-weight: 900; font-size: 16px; flex-shrink: 0; background: linear-gradient(160deg, #efebe9 0%, #a1887f 45%, #6d4c41 100%); filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
    .avatar-wrap { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background-color: #111; border: 2px solid rgba(255,255,255,.2); }
    .battle-card--first .avatar { border-color: var(--bat-a1-bd); box-shadow: 0 0 10px var(--bat-a1-sh); }
    .battle-card--second .avatar { border-color: var(--bat-a2-bd); box-shadow: 0 0 10px var(--bat-a2-sh); }
    .battle-card--rest .avatar { border-color: var(--bat-ar-bd); box-shadow: 0 0 8px var(--bat-ar-sh); }
    .info { display: flex; flex-direction: column; justify-content: center; gap: 4px; flex-grow: 1; min-width: 0; overflow: hidden; }
    .battle-nombre--rainbow { font-weight: 900; font-size: 16px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #fb5607, #ff006e); background-size: 220% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: rainbow-flow 4s linear infinite; filter: drop-shadow(0 1px 2px rgba(0,0,0,.8)); }
    .battle-nombre--grad { font-weight: 900; font-size: 16px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(92deg, var(--bat-ng1), var(--bat-ng2), var(--bat-ng3)); background-size: 140% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 1px 2px rgba(0,0,0,.85)); }
    @keyframes rainbow-flow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    .stat-line { color: var(--bat-vc); font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 6px; text-shadow: 0 0 12px var(--bat-vg); }
    .moneda-svg { width: 18px; height: 18px; flex-shrink: 0; filter: drop-shadow(0 0 4px var(--bat-coin-glow)); }
    .vs-logo { display: inline-block; position: relative; transform: rotate(-5deg); font-size: 32px; font-weight: 900; font-style: italic; line-height: 1.15; z-index: 12; letter-spacing: .02em; padding: 2px 4px; background: linear-gradient(180deg, var(--bat-vs1) 0%, var(--bat-vs2) 42%, var(--bat-vs3) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px var(--bat-vs-g1)) drop-shadow(0 0 14px var(--bat-vs-g2)) drop-shadow(1px 2px 0 rgba(0,0,0,.4)); pointer-events: none; }
    .battle-duel--sequential .battle-duel__row, .battle-duel--sequential .battle-duel__vs-row { opacity: 0; transform: translateY(10px); transition: opacity .4s ease, transform .4s ease; }
    .battle-duel--sequential .battle-duel__row.bat-seq-visible, .battle-duel--sequential .battle-duel__vs-row.bat-seq-visible { opacity: 1; transform: translateY(0); }
    .battle-placeholder { color: var(--bat-ph); font-weight: 800; font-size: 14px; text-align: center; padding: 24px 12px; text-shadow: 0 0 12px var(--bat-ph-glow); }
  </style>
</head>
<body>
  <div class="battle-root">
    <div class="battle-container" id="lista-ranking">
      <div class="battle-placeholder">Esperando regalos...</div>
    </div>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    let cfg = { limit: 2, nameRainbow: true, placeholder: 'Esperando regalos...', valueColor: '#fde68a', coinColor: '#ffd700' };
    let ranking = {};
    let seqTimers = [];
    let fitFn = null;

    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function safeId(s) { return String(s == null ? '' : s).replace(/[^a-zA-Z0-9_-]/g, '_'); }
    function applyStyle() {
      const r = document.documentElement.style;
      r.setProperty('--bat-vc', cfg.valueColor || '#fde68a');
      r.setProperty('--bat-coin', cfg.coinColor || '#ffd700');
      const ph = document.querySelector('.battle-placeholder');
      if (ph && !Object.keys(ranking).length) ph.textContent = cfg.placeholder || 'Esperando regalos...';
    }
    function coinSvg() { const c = cfg.coinColor || '#ffd700'; return '<svg class="moneda-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="' + c + '"/><circle cx="12" cy="12" r="5" fill="none" stroke="#fff" stroke-width="2.5"/></svg>'; }
    function rankBadge(rank) { const m = { 1: '👑', 2: '🥈', 3: '🥉' }; if (m[rank]) return '<div class="bat-rank-badge">' + m[rank] + '</div>'; return '<div class="hexagon">' + rank + '</div>'; }
    function cardClass(i) { return i === 0 ? 'battle-card--first' : i === 1 ? 'battle-card--second' : 'battle-card--rest'; }
    function nameClass() { return cfg.nameRainbow ? 'battle-nombre--rainbow' : 'battle-nombre--grad'; }
    function clearSeq() { seqTimers.forEach((t) => clearTimeout(t)); seqTimers = []; }
    function runSeq(cont) { clearSeq(); const wrap = cont.querySelector('.battle-duel--sequential'); if (!wrap) return; wrap.querySelectorAll('.battle-duel__row, .battle-duel__vs-row').forEach((el, i) => { seqTimers.push(setTimeout(() => el.classList.add('bat-seq-visible'), i * 420)); }); }

    function render(opts) {
      opts = opts || {};
      clearSeq();
      const maxRows = Math.max(2, Math.min(3, parseInt(cfg.limit, 10) || 2));
      const arr = Object.entries(ranking).map(([id, d]) => ({ id, ...d })).sort((a, b) => b.monedas - a.monedas).slice(0, maxRows);
      const cont = document.getElementById('lista-ranking');
      if (!arr.length) { cont.innerHTML = '<div class="battle-placeholder">' + esc(cfg.placeholder || 'Esperando regalos...') + '</div>'; applyStyle(); return; }
      const vsRow = '<div class="battle-duel__vs-row" aria-hidden="true"><div class="battle-duel__vs-cell"><span class="vs-logo">VS</span></div><div></div></div>';
      const useSeq = !!opts.seq;
      const parts = [];
      arr.forEach((u, i) => {
        parts.push('<div class="battle-duel__row ' + cardClass(i) + '" id="card-' + safeId(u.id) + '">' +
          '<div class="battle-duel__icons">' + rankBadge(i + 1) +
          '<div class="avatar-wrap"><img src="' + esc(u.pic) + '" class="avatar" referrerpolicy="no-referrer" onerror="this.style.visibility=\'hidden\'"></div></div>' +
          '<div class="info"><div class="' + nameClass() + '">' + esc(u.name) + '</div>' +
          '<div class="stat-line">' + coinSvg() + ' ' + u.monedas.toLocaleString('es-ES') + '</div></div></div>');
        if (i === 0 && arr.length >= 2) parts.push(vsRow);
      });
      cont.innerHTML = '<div class="battle-duel' + (useSeq ? ' battle-duel--sequential' : '') + '">' + parts.join('') + '</div>';
      if (useSeq) runSeq(cont);
      if (fitFn) fitFn();
    }
    function demo() {
      const d = [
        { id: 'b_a', name: 'Jugador 1', pic: 'https://randomuser.me/api/portraits/men/32.jpg', monedas: 120 },
        { id: 'b_b', name: 'Jugador 2', pic: 'https://randomuser.me/api/portraits/men/45.jpg', monedas: 95 },
        { id: 'b_c', name: 'Jugador 3', pic: 'https://randomuser.me/api/portraits/women/44.jpg', monedas: 40 },
      ];
      d.forEach((x) => { ranking[x.id] = { name: x.name, monedas: x.monedas, pic: isEmbed ? '/jarron/lv.png' : x.pic }; });
    }
    function onGift(data) {
      if (data && data.streak) return;
      const coins = (Number(data.diamonds) || 0) * (Number(data.repeatCount) || 1);
      if (coins <= 0) return;
      const uid = data.uniqueId || data.nickname; if (!uid) return;
      if (!ranking[uid]) ranking[uid] = { name: data.nickname || uid, monedas: 0, pic: data.photo || '' };
      ranking[uid].monedas += coins;
      if (data.photo) ranking[uid].pic = data.photo;
      render();
    }

    let ws, rt;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
      ws.onopen = () => clearTimeout(rt);
      ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === 'gift') { if (!isEmbed) onGift(m.payload); }
        else if (m.type === 'settings') { if (m.payload && m.payload.batallaGifts) { cfg = Object.assign(cfg, m.payload.batallaGifts); applyStyle(); render(); } }
        else if (m.type === 'batallaGiftsTest') { if (!isEmbed) { ranking = {}; demo(); render({ seq: true }); } }
        else if (m.type === 'batallaGiftsReset') { if (!isEmbed) { ranking = {}; render(); } }
      };
    }
    window.addEventListener('message', (e) => {
      const d = e.data; if (!d || d.kind !== 'batgifts') return;
      if (d.type === 'config') { cfg = Object.assign(cfg, d.config); applyStyle(); render(); }
      else if (d.type === 'test') { ranking = {}; demo(); render({ seq: true }); }
      else if (d.type === 'reset') { ranking = {}; if (isEmbed) demo(); render(); }
    });

    if (isEmbed) {
      document.documentElement.classList.add('embed');
      const root = document.querySelector('.battle-root');
      fitFn = () => { root.style.transform = 'none'; const s = Math.min(window.innerWidth / (root.offsetWidth + 6), window.innerHeight / (root.offsetHeight + 6), 1); root.style.transform = 'scale(' + s + ')'; };
      window.addEventListener('resize', fitFn);
    }
    applyStyle();
    if (isEmbed) { demo(); render(); } else render();
    connectWS();
  })();
  </script>
</body>
</html>
