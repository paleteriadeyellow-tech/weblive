<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Pelota de regalos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage-fit {
      position: relative;
      width: calc(1080px * var(--fit, 1));
      height: calc(1920px * var(--fit, 1));
      overflow: hidden;
      background: transparent !important;
      flex: 0 0 auto;
    }
    .stage {
      position: absolute;
      left: 0; top: 0;
      width: 1080px; height: 1920px;
      overflow: hidden;
      background: transparent !important;
      pointer-events: none;
      transform: scale(var(--fit, 1));
      transform-origin: 0 0;
    }
    .balls-layer {
      position: absolute; inset: 0;
      overflow: hidden;
      z-index: 2;
    }
    .glass-flash {
      position: absolute;
      left: 6%; right: 6%; top: 10%; height: 42%;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at var(--hx, 50%) var(--hy, 45%), rgba(255,255,255,.4), transparent 50%);
    }
    .glass-flash.on { animation: hit-flash .22s ease-out; }
    @keyframes hit-flash {
      0% { opacity: .55; }
      100% { opacity: 0; }
    }

    .throw-ball, .ball {
      position: absolute;
      left: 0; top: 0;
      width: var(--ball, 120px);
      height: var(--ball, 120px);
      border-radius: 50%;
      pointer-events: none;
      background: transparent;
      overflow: visible;
      transform: translate3d(-9999px, -9999px, 0);
      backface-visibility: hidden;
      contain: layout style;
    }
    .throw-ball {
      margin-left: calc(var(--ball, 120px) / -2);
      margin-top: calc(var(--ball, 120px) / -2);
      z-index: 8;
    }
    .ball { z-index: 2; }
    .throw-ball .gift, .ball .gift {
      position: absolute;
      left: 50%; top: 50%;
      width: 42%; height: 42%;
      transform: translate(-50%, -52%);
      object-fit: contain;
      z-index: 1;
      display: block;
      pointer-events: none;
    }
    .throw-ball .sphere, .ball .sphere {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      background: url('/overlays/gift-sphere.png?v=2') center / contain no-repeat;
      z-index: 2;
      pointer-events: none;
    }
    .throw-ball.is-bare, .ball.is-bare { border-radius: 0; }
    .throw-ball.is-bare .sphere, .ball.is-bare .sphere { display: none !important; }
    .throw-ball.is-bare .gift, .ball.is-bare .gift {
      width: 88%; height: 88%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="stage-fit" id="stage-fit">
    <div class="stage" id="stage" aria-hidden="true">
      <div class="balls-layer" id="balls-layer"></div>
      <div class="glass-flash" id="glass-flash"></div>
      <div id="throw-layer"></div>
    </div>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    if (isEmbed) document.documentElement.classList.add('embed');

    const STAGE_W = 1080;
    const STAGE_H = 1920;
    // Capacidad para llenar 1080×1920 incluso con regalos chicos (~32px).
    const HARD_CAP = 2200;
    const THROW_MS = 320;
    const G = 0.0032;
    const FLOOR = STAGE_H - 6;
    const CEILING = 6;
    const REST = 0.26;
    const FRICTION = 0.978;

    const GLASS = {
      left: STAGE_W * 0.06,
      top: STAGE_H * 0.10,
      w: STAGE_W * 0.88,
      h: STAGE_H * 0.42,
    };

    const FALLBACK_ROSE =
      'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp';
    const SPHERE_SRC = '/overlays/gift-sphere.png?v=2';

    try {
      const pre = new Image();
      pre.decoding = 'async';
      pre.src = SPHERE_SRC;
    } catch {}

    let cfg = { ballSize: 120, maxBalls: HARD_CAP, dropMode: 'ball', resetPeriod: 'battle' };
    let sizeTable = null;
    const layer = document.getElementById('balls-layer');
    const throwLayer = document.getElementById('throw-layer');
    const glassFlash = document.getElementById('glass-flash');
    const balls = [];
    let spawnSeq = 0;
    let throwing = false;
    let paused = false;
    let pkLive = false;
    let gen = 0;
    let raf = 0;
    let lastTs = 0;
    const throwQ = [];
    const THROW_Q_MAX = 100;
    const spriteCache = new Map();
    const SPRITE_CACHE_MAX = 28;

    function clamp(n, lo, hi, d) {
      const x = Number(n);
      return Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : d;
    }
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function isBareMode() { return cfg.dropMode === 'gift'; }
    function giftDrawSize(sizePx, bare) {
      return Math.max(8, Math.round(sizePx * (bare ? 0.88 : 0.42)));
    }

    function applySizes(raw) {
      if (!Array.isArray(raw)) { sizeTable = null; return; }
      const out = raw
        .map((r) => ({ t: Number(r && r.t), sz: Number(r && r.sz) }))
        .filter((r) => Number.isFinite(r.t) && Number.isFinite(r.sz) && r.sz > 0)
        .sort((a, b) => b.t - a.t);
      sizeTable = out.length ? out : null;
    }
    function sizeFromTable(d) {
      if (!sizeTable) return null;
      for (const row of sizeTable) {
        if (d >= row.t) {
          const jitter = row.sz * 0.06;
          return Math.max(8, Math.min(200, row.sz + rnd(-jitter, jitter)));
        }
      }
      return sizeTable[sizeTable.length - 1].sz;
    }
    function sizeForDiamonds(d, opts) {
      opts = opts || {};
      if (opts.sizePx != null) return Math.round(clamp(opts.sizePx, 8, 200, cfg.ballSize || 56));
      const tbl = sizeFromTable(Number(d) || 0);
      if (tbl != null) return Math.round(tbl);
      return Math.round(clamp(cfg.ballSize, 8, 200, 56));
    }

    function fitStage() {
      const vw = Math.max(1, window.innerWidth || STAGE_W);
      const vh = Math.max(1, window.innerHeight || STAGE_H);
      document.documentElement.style.setProperty('--fit', String(Math.min(vw / STAGE_W, vh / STAGE_H) || 1));
    }
    fitStage();
    window.addEventListener('resize', fitStage);

    function applyCfg(next) {
      if (!next || typeof next !== 'object') return;
      if (next.ballSize != null) cfg.ballSize = clamp(next.ballSize, 8, 200, 56);
      if (next.maxBalls != null) cfg.maxBalls = HARD_CAP;
      if (next.dropMode != null) {
        const m = String(next.dropMode || 'ball').toLowerCase();
        cfg.dropMode = (m === 'gift' || m === 'bare' || m === 'solo') ? 'gift' : 'ball';
      }
      if (next.resetPeriod != null) {
        const p = String(next.resetPeriod || 'battle').toLowerCase();
        cfg.resetPeriod = (p === 'live') ? 'live' : 'battle';
      }
      if (next.sizes != null) applySizes(next.sizes);
    }

    function giftSrc(payload) {
      const g = payload || {};
      return String(g.image || g.giftImage || g.url || '').trim() || FALLBACK_ROSE;
    }

    function cachePut(key, canvas) {
      if (spriteCache.has(key)) spriteCache.delete(key);
      spriteCache.set(key, canvas);
      while (spriteCache.size > SPRITE_CACHE_MAX) {
        const k = spriteCache.keys().next().value;
        spriteCache.delete(k);
      }
    }
    function cloneSprite(srcCanvas) {
      const c = document.createElement('canvas');
      c.className = 'gift';
      c.width = srcCanvas.width;
      c.height = srcCanvas.height;
      try { c.getContext('2d').drawImage(srcCanvas, 0, 0); } catch {}
      return c;
    }
    function rasterToCanvas(img, destPx) {
      const c = document.createElement('canvas');
      c.width = destPx;
      c.height = destPx;
      const ctx = c.getContext('2d', { alpha: true });
      const iw = img.naturalWidth || img.width || destPx;
      const ih = img.naturalHeight || img.height || destPx;
      const s = Math.min(destPx / iw, destPx / ih);
      const dw = iw * s, dh = ih * s;
      ctx.drawImage(img, (destPx - dw) / 2, (destPx - dh) / 2, dw, dh);
      return c;
    }
    function loadGiftCanvas(src, destPx) {
      const key = destPx + '|' + src;
      const hit = spriteCache.get(key);
      if (hit) return Promise.resolve(cloneSprite(hit));
      return new Promise((resolve) => {
        let done = false;
        const finish = (node) => {
          if (done) return;
          done = true;
          resolve(node);
        };
        const img = new Image();
        img.referrerPolicy = 'no-referrer';
        img.decoding = 'async';
        const fallbackImg = () => {
          const el = document.createElement('img');
          el.className = 'gift';
          el.alt = '';
          el.referrerPolicy = 'no-referrer';
          el.decoding = 'async';
          el.src = src || FALLBACK_ROSE;
          finish(el);
        };
        img.onload = () => {
          try {
            const baked = rasterToCanvas(img, destPx);
            cachePut(key, baked);
            finish(cloneSprite(baked));
          } catch {
            fallbackImg();
          }
        };
        img.onerror = fallbackImg;
        img.src = src;
      });
    }
    function mountGift(el, src, sizePx, bare) {
      const token = (el._giftTok = (el._giftTok || 0) + 1);
      loadGiftCanvas(src, giftDrawSize(sizePx, bare)).then((node) => {
        if (el._giftTok !== token) return;
        const old = el.querySelector('.gift');
        if (old) old.remove();
        el.insertBefore(node, el.firstChild);
      });
    }
    function appendSphere(el) {
      const sphere = document.createElement('div');
      sphere.className = 'sphere';
      el.appendChild(sphere);
    }

    function paint(b) {
      const half = b.r;
      const x = (b.x - half).toFixed(1);
      const y = (b.y - half).toFixed(1);
      if (b.bare) {
        b.el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      } else {
        b.el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) rotate(' + b.ang.toFixed(2) + 'rad)';
      }
    }

    function setPaused(v) {
      paused = !!v;
      if (paused) {
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        lastTs = 0;
      } else {
        startLoop();
      }
    }

    function startLoop() {
      if (raf || paused) return;
      lastTs = 0;
      const step = (ts) => {
        if (paused) { raf = 0; lastTs = 0; return; }
        if (!lastTs) lastTs = ts;
        let dt = ts - lastTs;
        lastTs = ts;
        if (dt > 24) dt = 24;
        simulate(dt);
        let moving = 0;
        for (let i = 0; i < balls.length; i++) {
          if (!balls[i].sleep) {
            moving++;
            paint(balls[i]);
          }
        }
        if (moving || throwing || throwQ.length) {
          raf = requestAnimationFrame(step);
        } else {
          raf = 0;
          lastTs = 0;
        }
      };
      raf = requestAnimationFrame(step);
    }

    function simulate(dt) {
      const n = balls.length;
      const bare = isBareMode();
      for (let i = 0; i < n; i++) {
        const b = balls[i];
        if (b.sleep) continue;
        b.vy += G * dt;
        b.vx *= Math.pow(FRICTION, dt / 16);
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (!bare && !b.bare) b.ang += b.spin * dt * 0.06;

        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * REST; b.spin *= -0.5; }
        if (b.x > STAGE_W - b.r) { b.x = STAGE_W - b.r; b.vx = -Math.abs(b.vx) * REST; b.spin *= -0.5; }
        if (b.y < CEILING + b.r) {
          b.y = CEILING + b.r;
          if (b.vy < 0) b.vy = Math.abs(b.vy) * REST;
        }

        if (b.y + b.r > FLOOR) {
          b.y = FLOOR - b.r;
          if (Math.abs(b.vy) < 0.28) {
            b.vy = 0;
            b.vx *= 0.88;
            if (Math.abs(b.vx) < 0.07 && Math.abs(b.spin) < 0.02) {
              b.vx = 0; b.spin = 0; b.sleep = true;
              paint(b);
              continue;
            }
          } else {
            b.vy = -Math.abs(b.vy) * REST;
            b.vx *= 0.9;
            b.spin *= 0.65;
          }
        }
      }

      collideGrid();
      collideGrid();
    }

    function resolvePair(a, b) {
      if (a.sleep && b.sleep) return;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist2 = dx * dx + dy * dy;
      const min = a.r + b.r;
      if (dist2 >= min * min || dist2 < 1e-8) return;
      const dist = Math.sqrt(dist2);
      const overlap = (min - dist) * 0.52;
      const nx = dx / dist, ny = dy / dist;
      a.x -= nx * overlap; a.y -= ny * overlap;
      b.x += nx * overlap; b.y += ny * overlap;
      if (a.y < CEILING + a.r) a.y = CEILING + a.r;
      if (b.y < CEILING + b.r) b.y = CEILING + b.r;
      if (a.y + a.r > FLOOR) a.y = FLOOR - a.r;
      if (b.y + b.r > FLOOR) b.y = FLOOR - b.r;
      a.sleep = false; b.sleep = false;
      const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (vn < 0) {
        const impulse = vn * 0.46;
        a.vx += impulse * nx; a.vy += impulse * ny;
        b.vx -= impulse * nx; b.vy -= impulse * ny;
      }
    }

    function collideGrid() {
      const n = balls.length;
      if (n < 2) return;
      let cell = 48;
      for (let i = 0; i < n; i++) {
        const d = balls[i].r * 2.15;
        if (d > cell) cell = d;
      }
      const cols = Math.ceil(STAGE_W / cell) + 1;
      const buckets = [];
      for (let i = 0; i < n; i++) {
        const b = balls[i];
        const cx = Math.max(0, Math.min(cols - 1, (b.x / cell) | 0));
        const cy = Math.max(0, (b.y / cell) | 0);
        const id = cy * cols + cx;
        let list = buckets[id];
        if (!list) buckets[id] = list = [];
        list.push(i);
        b._cx = cx; b._cy = cy; b._cols = cols;
      }
      for (let i = 0; i < n; i++) {
        const a = balls[i];
        const cx = a._cx, cy = a._cy, ncols = a._cols;
        for (let oy = -1; oy <= 1; oy++) {
          for (let ox = -1; ox <= 1; ox++) {
            const list = buckets[(cy + oy) * ncols + (cx + ox)];
            if (!list) continue;
            for (let k = 0; k < list.length; k++) {
              const j = list[k];
              if (j <= i) continue;
              resolvePair(a, balls[j]);
            }
          }
        }
      }
    }

    function removeBallAt(i) {
      const b = balls[i];
      if (!b) return;
      try { b.el.remove(); } catch {}
      balls.splice(i, 1);
    }

    function minGiftSize() {
      let m = cfg.ballSize || 56;
      if (sizeTable && sizeTable.length) {
        m = sizeTable[0].sz;
        for (let i = 1; i < sizeTable.length; i++) {
          if (sizeTable[i].sz < m) m = sizeTable[i].sz;
        }
      }
      return Math.max(18, Math.min(200, m));
    }

    function ballCap() {
      const d = minGiftSize() * 0.92;
      const fit = Math.floor((STAGE_W / d) * (STAGE_H / d) * 0.90);
      return Math.min(HARD_CAP, Math.max(400, fit));
    }

    function prune() {
      const cap = ballCap();
      while (balls.length > cap) removeBallAt(0);
    }

    function pileSurfaceY(r) {
      let top = FLOOR;
      for (let i = 0; i < balls.length; i++) {
        const t = balls[i].y - balls[i].r;
        if (t < top) top = t;
      }
      return Math.max(CEILING + r + 4, Math.min(STAGE_H * 0.62, top - 4));
    }

    function impactPoint() {
      return {
        x: GLASS.left + GLASS.w * rnd(0.10, 0.90),
        y: GLASS.top + GLASS.h * rnd(0.28, 0.62),
      };
    }

    function playGlassHit(hit) {
      const hx = ((hit.x - GLASS.left) / GLASS.w) * 100;
      const hy = ((hit.y - GLASS.top) / GLASS.h) * 100;
      glassFlash.style.setProperty('--hx', hx.toFixed(0) + '%');
      glassFlash.style.setProperty('--hy', hy.toFixed(0) + '%');
      glassFlash.classList.remove('on');
      requestAnimationFrame(() => glassFlash.classList.add('on'));
    }

    function makeBallEl(sizePx, src, bare) {
      const el = document.createElement('div');
      el.className = 'ball' + (bare ? ' is-bare' : '');
      el.style.setProperty('--ball', sizePx + 'px');
      el.style.zIndex = String(20 + (++spawnSeq % 80));
      mountGift(el, src, sizePx, bare);
      if (!bare) appendSphere(el);
      return el;
    }

    function addFallBall(payload, hit, opts) {
      opts = opts || {};
      if (balls.length >= ballCap()) return;

      const sizePx = sizeForDiamonds(payload && payload.diamonds, opts);
      const r = sizePx * 0.48;
      const bare = opts.bare != null ? !!opts.bare : isBareMode();
      const el = makeBallEl(sizePx, giftSrc(payload), bare);
      layer.appendChild(el);

      let x = (hit && hit.x != null) ? hit.x + rnd(-90, 90) : rnd(r + 16, STAGE_W - r - 16);
      x = Math.max(r + 8, Math.min(STAGE_W - r - 8, x));
      let y = (hit && hit.y != null) ? hit.y : STAGE_H * 0.28;
      if (balls.length > 6) y = Math.min(y, pileSurfaceY(r));
      y = Math.max(CEILING + r + 4, Math.min(STAGE_H * 0.58, y));

      const b = {
        el, r, sizePx, bare,
        x, y,
        vx: rnd(-0.45, 0.45),
        vy: rnd(0.45, 0.95),
        ang: bare ? 0 : rnd(-0.4, 0.4),
        spin: bare ? 0 : rnd(-0.04, 0.04),
        sleep: false,
      };
      balls.push(b);
      paint(b);
      startLoop();
    }

    function throwAtGlassOnce(payload, opts) {
      opts = opts || {};
      const myGen = gen;
      const sizePx = sizeForDiamonds(payload && payload.diamonds, opts);
      const bare = opts.bare != null ? !!opts.bare : isBareMode();
      const hit = impactPoint();
      // Cola larga o montón grande: caer al tiro (si no, 320ms×N nunca llena la pantalla).
      if (throwQ.length >= 4 || balls.length >= 60) {
        addFallBall(payload, hit, { force: true, sizePx, bare });
        return Promise.resolve();
      }
      throwing = true;
      startLoop();
      const startX = STAGE_W / 2 + rnd(-60, 60);
      const startY = STAGE_H * 0.58 + rnd(-24, 24);
      const src = giftSrc(payload);

      const el = document.createElement('div');
      el.className = 'throw-ball' + (bare ? ' is-bare' : '');
      el.style.setProperty('--ball', sizePx + 'px');
      mountGift(el, src, sizePx, bare);
      if (!bare) appendSphere(el);
      throwLayer.appendChild(el);

      let settled = false;
      const settle = () => {
        if (settled) return;
        settled = true;
        try { el.remove(); } catch {}
        throwing = false;
        if (myGen !== gen) return;
        playGlassHit(hit);
        addFallBall(payload, hit, { force: true, sizePx, bare });
      };

      const from = 'translate3d(' + startX + 'px,' + startY + 'px,0) scale(0.22)';
      const to = 'translate3d(' + hit.x + 'px,' + hit.y + 'px,0) scale(1.06)';
      el.style.transform = from;
      el.style.opacity = '0.85';

      // Live Studio usa CEF viejo: animate()/finished a veces no resuelve y la pelota nunca aparece.
      if (typeof el.animate !== 'function') {
        el.style.transform = to;
        el.style.opacity = '1';
        setTimeout(settle, 40);
        return Promise.resolve();
      }
      try {
        const anim = el.animate(
          [
            { transform: from, opacity: 0.85 },
            { transform: to, opacity: 1 },
          ],
          { duration: THROW_MS, easing: 'cubic-bezier(0.55, 0.05, 0.92, 0.32)', fill: 'forwards' }
        );
        const finished = (anim && anim.finished)
          ? anim.finished.catch(() => {})
          : new Promise((res) => setTimeout(res, THROW_MS));
        const watchdog = new Promise((res) => setTimeout(res, THROW_MS + 120));
        return Promise.race([finished, watchdog]).then(settle, settle);
      } catch {
        el.style.transform = to;
        el.style.opacity = '1';
        setTimeout(settle, 40);
        return Promise.resolve();
      }
    }

    function pumpThrowQueue() {
      if (paused || throwing) return;
      if (!throwQ.length) return;
      const job = throwQ.shift();
      throwAtGlassOnce(job.payload, job.opts).finally(() => {
        if (gen === job.gen) pumpThrowQueue();
      });
    }

    function enqueueThrow(payload, opts) {
      const src = giftSrc(payload);
      const sizePx = sizeForDiamonds(payload && payload.diamonds, opts);
      const bare = (opts && opts.bare != null) ? !!opts.bare : isBareMode();
      loadGiftCanvas(src, giftDrawSize(sizePx, bare));
      if (throwQ.length >= THROW_Q_MAX) throwQ.shift();
      throwQ.push({ payload, opts: opts || {}, gen });
      pumpThrowQueue();
    }

    function dropGift(payload) { enqueueThrow(payload, {}); }

    function dropOne(payload) {
      const p = payload || {};
      if (p.dropMode != null) applyCfg({ dropMode: p.dropMode });
      enqueueThrow({
        giftName: p.giftName || p.name || 'Rose',
        image: p.image || p.giftImage || FALLBACK_ROSE,
        diamonds: Number(p.diamonds) || 1,
        giftId: p.giftId || '',
      }, { force: true });
    }

    function clearAll() {
      gen++;
      throwQ.length = 0;
      throwing = false;
      try { throwLayer.innerHTML = ''; } catch {}
      glassFlash.classList.remove('on');
      for (let i = balls.length - 1; i >= 0; i--) removeBallAt(i);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      lastTs = 0;
    }

    function applyPk(p) {
      pkLive = !!(p && p.live);
    }

    function onGift(p) {
      if (!p) return;
      // TikTok manda la racha (rosas) con streak=true y al final repeatEnd.
      // Si solo escuchamos el cierre y Live Studio no lo manda, no cae nada.
      // Un extra al cerrar la racha es aceptable; HARD_CAP recorta.
      const diamonds = Math.max(0, Number(p.diamonds != null ? p.diamonds : p.diamondCount) || 0);
      dropGift(Object.assign({}, p, { diamonds }));
    }

    function runTest(gift) {
      const g = gift || {};
      enqueueThrow({
        giftName: g.name || g.giftName || 'Rose',
        image: g.image || g.giftImage || FALLBACK_ROSE,
        diamonds: Number(g.diamonds) || 1,
      }, { force: true });
    }

    let ws, rt;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
      ws.onopen = () => clearTimeout(rt);
      ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === 'gift') {
          if (!isEmbed) onGift(m.payload);
        } else if (m.type === 'settings') {
          if (m.payload && m.payload.batallaGiftBall) applyCfg(m.payload.batallaGiftBall);
        } else if (m.type === 'pkBattle') {
          if (!isEmbed) applyPk(m.payload || {});
        } else if (m.type === 'pkBattleReset') {
          if (!isEmbed) pkLive = false;
        } else if (m.type === 'batallaGiftBallTest') {
          if (!isEmbed) runTest(m.payload && m.payload.gift);
        } else if (m.type === 'batallaGiftBallDropOne') {
          if (!isEmbed) dropOne(m.payload || {});
        } else if (m.type === 'batallaGiftBallReset') {
          if (!isEmbed) clearAll();
        }
      };
    }

    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.kind !== 'batallaGiftBall') return;
      if (d.type === 'config') {
        if (d.config) applyCfg(d.config);
        if (d.sizes) applySizes(d.sizes);
      } else if (d.type === 'pause') setPaused(true);
      else if (d.type === 'resume') setPaused(false);
      else if (d.type === 'test') { setPaused(false); runTest(d.gift); }
      else if (d.type === 'dropOne') { setPaused(false); dropOne(d); }
      else if (d.type === 'reset') clearAll();
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !paused) startLoop();
    });

    // Preview del panel: sin WS (los regalos del live irían al mismo hilo que el dashboard).
    if (!isEmbed) connectWS();
  })();
  </script>
  <script src="/js/overlay-keepalive.js?v=nokp1"></script>
</body>
