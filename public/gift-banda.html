<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch7"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Banda de regalos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Bungee&family=Fredoka:wght@600;700&family=Inter:wght@700;800;900&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800&family=Titan+One&display=swap" rel="stylesheet">
  <style>
    :root{
      --cyan:#37e3ff; --pink:#ff4fa3; --gold:#ffc93c;
      --tile:170px; --icon:96px; --fsize:21px;
      --gsh-font:'Anton','Impact','Arial Narrow',sans-serif;
      --gsh-text:#ffffff;
    }
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;width:100%;overflow:hidden;background:transparent!important}
    body{
      font-family:var(--gsh-font);
      display:flex;align-items:center;justify-content:center;
      pointer-events:none;
    }
    .bar{
      position:relative;width:100%;height:220px;
      background:none;overflow:hidden;
      animation:rise .9s cubic-bezier(.2,.9,.25,1.05) both;
      transform:scale(var(--gsh-scale,1));transform-origin:center center;
    }
    @keyframes rise{from{transform:translateY(60px) scale(var(--gsh-scale,1));opacity:0}to{transform:scale(var(--gsh-scale,1));opacity:1}}

    .viewport{
      position:absolute;inset:0;z-index:2;
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%);
              mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%);
    }
    .bar.is-static .viewport{
      -webkit-mask-image:none;mask-image:none;
      display:flex;align-items:center;justify-content:center;
    }
    .track{
      position:absolute;left:0;top:0;height:100%;
      display:flex;align-items:center;will-change:transform;
    }
    .bar.is-static .track{
      position:relative;left:auto;transform:none!important;
      justify-content:center;width:auto;max-width:100%;
    }

    .item{
      flex:none;width:var(--tile);height:100%;
      display:flex;align-items:center;justify-content:center;
      animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;
      animation-delay:calc(min(var(--i),12) * 70ms + 200ms);
    }
    @keyframes pop{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}

    .card{
      --f:0;
      position:relative;
      display:flex;flex-direction:column;align-items:center;gap:10px;
      transform:translateY(calc(var(--f) * -4px)) scale(calc(.9 + var(--f) * .42));
    }

    .ico{
      position:relative;width:var(--icon);height:var(--icon);
      display:grid;place-items:center;
      animation:bob 3.4s ease-in-out infinite;
      animation-delay:calc(var(--i) * -.45s);
    }
    @keyframes bob{50%{transform:translateY(-7px) rotate(-2deg)}}

    .ico::before{
      content:"";position:absolute;inset:-10px;border-radius:50%;
      background:conic-gradient(from 0deg,var(--cyan),var(--pink),var(--gold),var(--cyan));
      -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
              mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
      opacity:calc(var(--f) * .95);
      animation:spin 3s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .ico::after{
      content:"";position:absolute;inset:6px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);
      opacity:calc(var(--f) * .9);
      filter:blur(10px);z-index:-1;
    }

    .glyph{
      font-size:calc(var(--icon) * .7);line-height:1;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 calc(var(--f) * 14px) rgba(255,255,255,.55));
    }
    .ico img{
      width:calc(var(--icon) * .875);height:calc(var(--icon) * .875);object-fit:contain;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 calc(var(--f) * 14px) rgba(255,255,255,.55));
    }

    .name{
      font-family:var(--gsh-font);
      font-size:var(--fsize);line-height:.95;text-align:center;
      text-transform:uppercase;letter-spacing:.02em;
      transform:skewX(-6deg);
      color:color-mix(in srgb,var(--gsh-text) calc(100% - var(--f) * 100%),var(--gold));
      -webkit-text-stroke:1px rgba(0,0,0,.55);
      paint-order:stroke fill;
      text-shadow:
        0 2px 0 rgba(0,0,0,.7),
        0 3px 8px rgba(0,0,0,.6),
        0 0 calc(var(--f) * 16px) rgba(255,201,60,.8);
      max-width:calc(var(--tile) - 20px);
      white-space:pre-line;word-break:break-word;
    }
    html[data-colormode="rainbow"] .name,
    html[data-colormode="flow"] .name{
      color:transparent!important;-webkit-text-fill-color:transparent;
      background:linear-gradient(92deg,#ff1744,#ff9100,#ffea00,#00e676,#00b0ff,#e040fb,#ff1744);
      background-size:300% 100%;
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-stroke:0 transparent;paint-order:normal;
      text-shadow:none;
      filter:drop-shadow(0 2px 0 rgba(0,0,0,.9));
    }
    html[data-colormode="flow"] .name{animation:gsh-rainbow 4.5s linear infinite}
    @keyframes gsh-rainbow{0%{background-position:0% center}100%{background-position:300% center}}

    .empty{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      text-align:center;color:rgba(255,255,255,.7);font-size:14px;font-weight:800;
      letter-spacing:.06em;text-transform:uppercase;font-family:system-ui,sans-serif;
      pointer-events:none;
    }
    .empty.is-hidden,.bar.is-hidden{display:none!important}

    @media (prefers-reduced-motion:reduce){
      .ico,.ico::before{animation:none}
    }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="viewport" id="viewport">
      <div class="track" id="track"></div>
    </div>
  </div>
  <div class="empty is-hidden" id="empty">Sin regalos configurados</div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    const FONTS = {
      luckiest: "'Luckiest Guy', system-ui, sans-serif", bangers: "'Bangers', system-ui, sans-serif",
      lilita: "'Lilita One', system-ui, sans-serif", titan: "'Titan One', system-ui, sans-serif",
      fredoka: "'Fredoka', system-ui, sans-serif", bungee: "'Bungee', system-ui, sans-serif",
      rubik: "'Rubik', system-ui, sans-serif", oswald: "'Oswald', system-ui, sans-serif",
      bebas: "'Bebas Neue', Impact, sans-serif", montserrat: "'Montserrat', system-ui, sans-serif",
      poppins: "'Poppins', system-ui, sans-serif", inter: "'Inter', system-ui, sans-serif",
      anton: "'Anton','Impact','Arial Narrow',sans-serif",
      system: 'system-ui, sans-serif',
    };

    let cfg = {
      displayMode: 'marquee', visibleCount: 3, intervalSec: 2, marqueeSec: 18,
      iconSize: 88, gap: 24, font: 'anton', fontSize: 21, textColor: '#ffffff', textStroke: 2,
      colorMode: 'solid', scale: 100, items: [],
    };

    let rotatePage = 0;
    let rotateTimer = null;
    let motionActive = false;
    let els = [];
    let setWidth = 0;
    let offset = 0;
    let vw = 0;
    let last = performance.now();
    let scrolling = false;
    let tile = 170;
    let rafOn = false;

    const DEMO = [
      { giftName: 'Freestyle', giftImage: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/1f5ca5cfb4b98c2761fb85987f47c641.png~tplv-obj.webp', customText: 'Freestyle' },
      { giftName: 'GG', giftImage: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/3f02fa9594bd1495ff4e8aa5ae265eef~tplv-obj.webp', customText: 'GG' },
      { giftName: 'Creeper', giftImage: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/d686d45bd66e16b0aca8b0e5eb52a977.png~tplv-obj.webp', customText: 'Creeper' },
      { giftName: 'Congratulations', giftImage: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/8e73d843b23a9e68f8d3cf8c46fc0bee.png~tplv-obj.webp', customText: 'Congratulations' },
      { giftName: "It's Match Time", giftImage: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/be170a9d325c02c1d5786301679bf013.png~tplv-obj.webp', customText: "It's Match Time" },
      { giftName: "It's corn", giftImage: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/37f5c76b65c17d6dbbbd4b6724f61bf2~tplv-obj.webp', customText: "It's corn" },
    ];

    function isPreviewEmbed() { return isEmbed && cfg._preview !== false; }
    function clamp(n, lo, hi, d) {
      const x = parseInt(n, 10);
      return Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : d;
    }
    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }
    function normItems(list) {
      return (Array.isArray(list) ? list : []).filter((it) => it && (it.giftImage || it.giftName)).map((it) => ({
        giftName: String(it.giftName || 'Regalo').trim() || 'Regalo',
        giftImage: String(it.giftImage || '').trim(),
        customText: String(it.customText || it.giftName || 'Regalo').trim() || 'Regalo',
      }));
    }
    function visibleLimit() { return Math.max(1, clamp(cfg.visibleCount, 1, 8, 3)); }
    function needsMotion(items) { return items.length > visibleLimit(); }
    function stopRotate() { if (rotateTimer) { clearInterval(rotateTimer); rotateTimer = null; } }

    function applyStyle() {
      const root = document.documentElement;
      const mode = cfg.colorMode === 'rainbow' || cfg.colorMode === 'flow' ? cfg.colorMode : 'solid';
      root.dataset.colormode = mode;
      const fontKey = FONTS[cfg.font] ? cfg.font : 'anton';
      root.style.setProperty('--gsh-font', FONTS[fontKey] || FONTS.anton);
      root.style.setProperty('--fsize', clamp(cfg.fontSize, 10, 48, 21) + 'px');
      root.style.setProperty('--gsh-text', cfg.textColor || '#ffffff');
      const iconPx = clamp(cfg.iconSize, 48, 160, 88);
      const icon = isEmbed ? Math.min(iconPx, 84) : iconPx;
      root.style.setProperty('--icon', icon + 'px');
      const gap = clamp(cfg.gap, 8, 64, 24);
      tile = Math.max(icon + gap + 20, 140);
      root.style.setProperty('--tile', tile + 'px');
      const sc = clamp(cfg.scale, 50, 150, 100) / 100;
      document.getElementById('bar').style.setProperty('--gsh-scale', isEmbed ? '1' : String(sc));
    }

    function makeItem(it, i) {
      const item = document.createElement('div');
      item.className = 'item';
      item.style.setProperty('--i', String(i));

      const card = document.createElement('div');
      card.className = 'card';

      const ico = document.createElement('div');
      ico.className = 'ico';
      if (it.giftImage) {
        const im = document.createElement('img');
        im.src = it.giftImage;
        im.alt = '';
        im.referrerPolicy = 'no-referrer';
        im.loading = 'eager';
        im.decoding = 'async';
        im.onerror = () => {
          im.replaceWith(Object.assign(document.createElement('span'), { className: 'glyph', textContent: '🎁' }));
        };
        ico.appendChild(im);
      } else {
        const gl = document.createElement('span');
        gl.className = 'glyph';
        gl.textContent = '🎁';
        ico.appendChild(gl);
      }

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = it.customText;

      card.append(ico, name);
      item.appendChild(card);
      return { item, card };
    }

    function clearTrack() {
      const track = document.getElementById('track');
      track.innerHTML = '';
      els = [];
      offset = 0;
      track.style.transform = '';
    }

    function buildScrolling(items) {
      const bar = document.getElementById('bar');
      const track = document.getElementById('track');
      const viewport = document.getElementById('viewport');
      bar.classList.remove('is-static');
      clearTrack();
      vw = viewport.clientWidth || window.innerWidth;
      setWidth = Math.max(1, items.length * tile);
      const copies = Math.max(2, Math.ceil(vw / setWidth) + 2);
      let idx = 0;
      for (let c = 0; c < copies; c++) {
        items.forEach((g) => {
          const { item, card } = makeItem(g, idx++);
          track.appendChild(item);
          els.push(card);
        });
      }
      scrolling = true;
      if (!rafOn) { rafOn = true; requestAnimationFrame(frame); }
    }

    function buildStatic(items, highlightCenter) {
      const bar = document.getElementById('bar');
      const track = document.getElementById('track');
      bar.classList.add('is-static');
      scrolling = false;
      clearTrack();
      items.forEach((g, i) => {
        const { item, card } = makeItem(g, i);
        if (highlightCenter) {
          const mid = (items.length - 1) / 2;
          const f = Math.exp(-Math.pow(i - mid, 2) / 2);
          card.style.setProperty('--f', f.toFixed(3));
        } else {
          card.style.setProperty('--f', '0.55');
        }
        track.appendChild(item);
        els.push(card);
      });
    }

    function pagesOf(items) {
      const vis = visibleLimit();
      if (items.length <= vis) return [items];
      const out = [];
      for (let i = 0; i < items.length; i += vis) out.push(items.slice(i, i + vis));
      return out;
    }

    function renderRotate(items) {
      stopRotate();
      const pages = pagesOf(items);
      rotatePage = 0;
      const paint = () => buildStatic(pages[rotatePage] || [], true);
      paint();
      if (pages.length > 1) {
        const ms = Math.max(1000, clamp(cfg.intervalSec, 1, 15, 2) * 1000);
        rotateTimer = setInterval(() => {
          rotatePage = (rotatePage + 1) % pages.length;
          paint();
        }, ms);
      }
    }

    function speedPx() {
      // marqueeSec ≈ segundos para recorrer un set
      const sec = Math.max(6, clamp(cfg.marqueeSec, 6, 120, 18));
      return Math.max(24, setWidth / sec);
    }

    function frame(now) {
      if (!scrolling) { rafOn = false; return; }
      const dt = Math.min((now - last) / 1000, .1);
      last = now;
      if (setWidth > 0) {
        offset = (offset + speedPx() * dt) % setWidth;
        document.getElementById('track').style.transform = `translate3d(${-offset}px,0,0)`;
        const mid = vw / 2;
        const sigma2 = 2 * 130 * 130;
        for (let k = 0; k < els.length; k++) {
          const cx = k * tile + tile / 2 - offset;
          const d = cx - mid;
          if (d < -tile * 2 || d > vw + tile * 2) continue;
          els[k].style.setProperty('--f', Math.exp(-(d * d) / sigma2).toFixed(3));
        }
      }
      requestAnimationFrame(frame);
    }

    function render() {
      applyStyle();
      let items = normItems(cfg.items);
      const previewEmbed = isPreviewEmbed();
      if (!items.length && motionActive) items = normItems(DEMO);
      const empty = document.getElementById('empty');
      const bar = document.getElementById('bar');
      if (!items.length) {
        stopRotate();
        scrolling = false;
        clearTrack();
        bar.classList.add('is-hidden');
        empty.classList.remove('is-hidden');
        empty.textContent = previewEmbed && !motionActive ? 'Pulsa Testear para ver la banda' : 'Sin regalos configurados';
        return;
      }
      empty.classList.add('is-hidden');
      bar.classList.remove('is-hidden');
      const motion = needsMotion(items);
      const useMarquee = cfg.displayMode !== 'rotate';

      if (previewEmbed && !motionActive) {
        buildStatic(items.slice(0, visibleLimit()), true);
      } else if (!motion) {
        buildStatic(items, true);
      } else if (useMarquee) {
        stopRotate();
        buildScrolling(items);
      } else {
        renderRotate(items);
      }
    }

    function mergeCfg(c) {
      if (!c || typeof c !== 'object') return;
      const { _preview, ...rest } = c;
      cfg = Object.assign(cfg, rest);
      if (_preview != null) cfg._preview = _preview;
    }

    function runTest() {
      motionActive = true;
      stopRotate();
      rotatePage = 0;
      if (!normItems(cfg.items).length) mergeCfg({ items: DEMO });
      render();
    }

    let ws, rt;
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
      ws.onopen = () => clearTimeout(rt);
      ws.onclose = () => { rt = setTimeout(connect, 1500); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === 'settings' && m.payload?.giftShowcase) {
          if (isEmbed) return;
          mergeCfg(m.payload.giftShowcase);
          render();
        }
      };
    }

    window.addEventListener('message', (e) => {
      const d = e.data; if (!d || d.kind !== 'giftshowcase') return;
      if (d.type === 'config') { motionActive = false; mergeCfg(d.config); render(); }
      else if (d.type === 'test') runTest();
      else if (d.type === 'reset') { motionActive = false; stopRotate(); rotatePage = 0; render(); }
    });

    window.addEventListener('resize', () => {
      if (scrolling) {
        const items = normItems(cfg.items).length ? normItems(cfg.items) : (motionActive ? normItems(DEMO) : []);
        if (items.length && needsMotion(items)) buildScrolling(items);
      }
    });

    if (isEmbed) mergeCfg({ _preview: true });
    render();
    connect();
  })();
  </script>
  <script src="/js/overlay-idle.js?v=oi1"></script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
