<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Top 3 de tu ejército (PK)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Exo+2:wght@700;800;900&family=Fredoka:wght@600;700&family=Inter:wght@600;700;800&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Press+Start+2P&family=Rubik:wght@700;800;900&family=Titan+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
      font-family: var(--tf-font-stack, 'Rubik', system-ui, sans-serif);
    }
    /* Canvas fijo Live Studio / OBS — Browser Source 800×600 */
    html.stage-800x600, html.stage-800x600 body {
      width: 800px; height: 600px;
    }
    html.embed, html.embed body { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    html.embed .stage {
      width: max-content;
      height: max-content;
      max-width: 760px;
      padding: 16px 12px;
    }
    .stage {
      width: 800px; height: 600px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 20px 16px 28px;
      transform: scale(var(--tf-fit, 1)); transform-origin: center center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
      --title-color: #ffffff;
      --name-color: #ffffff;
      --pts-color: #ffe566;
      --empty-color: rgba(255,255,255,.7);
      --tc1: #ff00aa; --tc2: #00ddff; --tc3: #ffcc00;
      --tf-font-stack: 'Rubik', system-ui, sans-serif;
      --title-size: 28px;
    }
    .stage.is-on { opacity: 1; }
    .badge {
      display: none !important;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      padding: 5px 12px; border-radius: 999px;
      background: rgba(0,0,0,.45); color: rgba(255,255,255,.7);
    }
    .badge.is-live { color: #ffe566; background: rgba(80,60,10,.55); }
    .badge.is-hold { color: #9ec9ff; background: rgba(20,40,80,.55); }
    .title {
      margin: 0;
      font-family: var(--tf-font-stack);
      font-weight: 900; font-size: var(--title-size); color: var(--title-color);
      text-shadow: 0 3px 0 rgba(0,0,0,.55);
      letter-spacing: .03em;
      -webkit-text-fill-color: var(--title-color);
      background: none;
    }
    .title.title--rainbow {
      background: linear-gradient(90deg, var(--tc1), var(--tc2), var(--tc3), var(--tc1), var(--tc2), var(--tc3), var(--tc1));
      background-size: 280% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
      text-shadow: none;
      animation: title-rainbow-move 3.2s linear infinite;
      filter: drop-shadow(0 3px 0 rgba(0,0,0,.55));
    }
    @keyframes title-rainbow-move {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .row {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 16px; width: 100%; min-height: 280px;
    }
    .slot {
      width: 200px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      opacity: 0; transform: translateY(24px) scale(.82);
      transition: opacity .35s ease, transform .45s cubic-bezier(.2,1.3,.3,1);
    }
    .slot.is-filled { opacity: 1; transform: none; }
    .slot.is-pop { animation: slotPop .5s cubic-bezier(.2,1.4,.3,1); }
    @keyframes slotPop {
      0% { transform: scale(.7) translateY(20px); }
      60% { transform: scale(1.06) translateY(-4px); }
      100% { transform: none; }
    }
    .slot.rank-1 { order: 2; width: 250px; }
    .slot.rank-2 { order: 1; width: 210px; }
    .slot.rank-3 { order: 3; width: 210px; }
    .medal { display: none !important; }
    .hero {
      position: relative;
      display: flex; align-items: flex-end; justify-content: center;
      width: 100%;
    }
    /* Marcos Top1/2/3: foto detrás del PNG, centrada en el aro */
    .frame-hero {
      position: relative;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.4));
    }
    .rank-1 .frame-hero {
      width: 210px;
      height: calc(210px * 718 / 747);
    }
    .rank-2 .frame-hero {
      width: 168px;
      height: 168px;
    }
    .rank-3 .frame-hero {
      width: 168px;
      height: 168px;
    }
    .avatar-hole {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      overflow: hidden;
      z-index: 1;
      background: #111;
      -webkit-clip-path: circle(50% at 50% 50%);
      clip-path: circle(50% at 50% 50%);
    }
    .rank-1 .avatar-hole {
      left: 48.66%; top: 53.76%;
      width: 39.78%; height: 41.39%;
    }
    .rank-2 .avatar-hole {
      left: 50%; top: 47.9%;
      width: 64%; height: 64%;
    }
    .rank-3 .avatar-hole {
      left: 50%; top: 47.7%;
      width: 63%; height: 63%;
    }
    .avatar-hole .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      border: 0;
      border-radius: 50%;
    }
    .frame-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      z-index: 2;
      pointer-events: none;
      user-select: none;
    }
    .name {
      margin: 0; max-width: 100%;
      font-family: var(--tf-font-stack);
      font-weight: 800; font-size: 15px; color: var(--name-color); text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 2px 0 rgba(0,0,0,.55);
      padding: 0 4px;
    }
    .rank-1 .name { font-size: 17px; }
    .pts {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800; font-size: 15px; color: var(--pts-color);
      text-shadow: 0 1px 0 rgba(0,0,0,.5);
      font-variant-numeric: tabular-nums;
    }
    .empty {
      margin: 0; font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700; font-size: 16px; color: var(--empty-color);
      text-shadow: 0 1px 0 rgba(0,0,0,.45);
    }
    .stage.hide-title .title { display: none !important; }
    .stage.hide-text .name,
    .stage.hide-text .pts,
    .stage.hide-text .empty,
    .stage.hide-text .badge,
    .stage.hide-text .medal { display: none !important; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="badge" id="badge">ESPERANDO PK</div>
    <h1 class="title" id="title">TOP 3 · TU EJÉRCITO</h1>
    <div class="row" id="row">
      <div class="slot rank-1" data-rank="1">
        <div class="medal">#1</div>
        <div class="hero">
          <div class="frame-hero">
            <div class="avatar-hole"><img class="avatar" alt="" referrerpolicy="no-referrer" /></div>
            <img class="frame-img" src="/overlays/marco-mvp-top1.png" alt="" />
          </div>
        </div>
        <p class="name">—</p>
        <p class="pts">0</p>
      </div>
      <div class="slot rank-2" data-rank="2">
        <div class="medal">#2</div>
        <div class="hero">
          <div class="frame-hero">
            <div class="avatar-hole"><img class="avatar" alt="" referrerpolicy="no-referrer" /></div>
            <img class="frame-img" src="/overlays/marco-top2.png?v=2" alt="" />
          </div>
        </div>
        <p class="name">—</p>
        <p class="pts">0</p>
      </div>
      <div class="slot rank-3" data-rank="3">
        <div class="medal">#3</div>
        <div class="hero">
          <div class="frame-hero">
            <div class="avatar-hole"><img class="avatar" alt="" referrerpolicy="no-referrer" /></div>
            <img class="frame-img" src="/overlays/marco-top3.png?v=2" alt="" />
          </div>
        </div>
        <p class="name">—</p>
        <p class="pts">0</p>
      </div>
    </div>
    <p class="empty" id="empty" hidden>Aún no hay aportes en tu ejército</p>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    const STAGE_W = 800;
    const STAGE_H = 600;
    if (isEmbed) document.documentElement.classList.add('embed');
    else document.documentElement.classList.add('stage-800x600');
    const FALLBACK = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
    const DEMO = '/jarron/lv.png';

    const FONTS = {
      pressstart: "'Press Start 2P', monospace",
      exo2: "'Exo 2', system-ui, sans-serif",
      luckiest: "'Luckiest Guy', system-ui, sans-serif",
      bangers: "'Bangers', system-ui, sans-serif",
      lilita: "'Lilita One', system-ui, sans-serif",
      titan: "'Titan One', system-ui, sans-serif",
      fredoka: "'Fredoka', system-ui, sans-serif",
      bungee: "'Bungee', system-ui, sans-serif",
      rubik: "'Rubik', system-ui, sans-serif",
      oswald: "'Oswald', system-ui, sans-serif",
      bebas: "'Bebas Neue', Impact, sans-serif",
      montserrat: "'Montserrat', system-ui, sans-serif",
      poppins: "'Poppins', system-ui, sans-serif",
      orbitron: "'Orbitron', system-ui, sans-serif",
      inter: "'Inter', system-ui, sans-serif",
      system: 'system-ui, sans-serif',
    };

    let embedFit = null;
    (function fit() {
      function apply() {
        if (!isEmbed) {
          document.documentElement.style.setProperty('--tf-fit', '1');
          return;
        }
        const stage = document.getElementById('stage');
        if (!stage) return;
        document.documentElement.style.setProperty('--tf-fit', '1');
        void stage.offsetWidth;
        const pad = 20;
        const w = Math.max(stage.scrollWidth, stage.offsetWidth, 280);
        const h = Math.max(stage.scrollHeight, stage.offsetHeight, 200);
        const k = Math.min(
          ((innerWidth || 1) - pad) / w,
          ((innerHeight || 1) - pad) / h,
          2.6
        );
        document.documentElement.style.setProperty('--tf-fit', String(Math.max(0.4, k) || 1));
      }
      embedFit = apply;
      apply();
      addEventListener('resize', apply);
      setTimeout(apply, 120);
      setTimeout(apply, 450);
    })();

    let cfg = {
      title: 'TOP 3 · TU EJÉRCITO',
      emptyText: 'Aún no hay aportes en tu ejército',
      labelWaiting: 'ESPERANDO PK',
      labelLive: 'EN VIVO',
      labelHold: 'ÚLTIMA RONDA',
      labelDemo: 'DEMO',
      font: 'rubik',
      titleRainbow: true,
      showTitle: true,
      showText: true,
      tc1: '#ff00aa', tc2: '#00ddff', tc3: '#ffcc00',
      titleColor: '#ffffff',
      nameColor: '#ffffff',
      ptsColor: '#ffe566',
      emptyColor: '#b8b8c2',
      titleSize: 28,
    };

    const el = {
      stage: document.getElementById('stage'),
      badge: document.getElementById('badge'),
      title: document.getElementById('title'),
      empty: document.getElementById('empty'),
      slots: [...document.querySelectorAll('.slot')],
    };

    let demo = false;
    let state = { live: false, holding: false, top3: [] };
    let wasLive = false;
    let animTimers = [];

    function fmt(n) {
      return Math.max(0, Math.round(Number(n) || 0)).toLocaleString('es-ES');
    }
    function clearAnim() {
      animTimers.forEach(clearTimeout);
      animTimers = [];
    }
    function applyStyle() {
      const fontKey = FONTS[cfg.font] ? cfg.font : 'rubik';
      const stack = FONTS[fontKey];
      el.stage.style.setProperty('--tf-font-stack', stack);
      document.documentElement.style.setProperty('--tf-font-stack', stack);
      document.documentElement.dataset.font = fontKey;
      el.stage.style.setProperty('--title-color', cfg.titleColor || '#ffffff');
      el.stage.style.setProperty('--name-color', cfg.nameColor || '#ffffff');
      el.stage.style.setProperty('--pts-color', cfg.ptsColor || '#ffe566');
      el.stage.style.setProperty('--empty-color', cfg.emptyColor || '#b8b8c2');
      el.stage.style.setProperty('--tc1', cfg.tc1 || '#ff00aa');
      el.stage.style.setProperty('--tc2', cfg.tc2 || '#00ddff');
      el.stage.style.setProperty('--tc3', cfg.tc3 || '#ffcc00');
      el.stage.style.setProperty('--title-size', Math.max(18, Math.min(40, Number(cfg.titleSize) || 28)) + 'px');
      el.title.textContent = cfg.title || 'TOP 3 · TU EJÉRCITO';
      el.title.classList.toggle('title--rainbow', !!cfg.titleRainbow);
      el.empty.textContent = cfg.emptyText || 'Aún no hay aportes en tu ejército';
      el.stage.classList.toggle('hide-title', cfg.showTitle === false);
      el.stage.classList.toggle('hide-text', cfg.showText === false);
    }
    function setAvatar(img, url) {
      const src = String(url || '').trim() || (isEmbed ? DEMO : FALLBACK);
      img.onerror = function () { this.onerror = null; this.src = isEmbed ? DEMO : FALLBACK; };
      img.src = src;
    }
    function paintSlots(list, stagger) {
      clearAnim();
      el.slots.forEach((slot) => {
        slot.classList.remove('is-filled', 'is-pop');
        const img = slot.querySelector('.avatar');
        const name = slot.querySelector('.name');
        const pts = slot.querySelector('.pts');
        setAvatar(img, '');
        name.textContent = '—';
        pts.textContent = '0';
      });
      const items = Array.isArray(list) ? list : [];
      items.forEach((u, i) => {
        const slot = el.slots.find((s) => Number(s.dataset.rank) === i + 1);
        if (!slot || !u) return;
        const apply = () => {
          const img = slot.querySelector('.avatar');
          const name = slot.querySelector('.name');
          const pts = slot.querySelector('.pts');
          setAvatar(img, u.photo);
          name.textContent = u.nickname || 'Fan';
          pts.textContent = fmt(u.points) + ' pts';
          slot.classList.add('is-filled');
          void slot.offsetWidth;
          slot.classList.add('is-pop');
        };
        if (stagger) animTimers.push(setTimeout(apply, 280 + i * 420));
        else apply();
      });
    }
    function render(opts) {
      const stagger = !!(opts && opts.stagger);
      const active = demo || !!state.live || !!state.holding;
      el.stage.classList.toggle('is-on', active);
      el.badge.classList.remove('is-live', 'is-hold');
      if (demo) {
        el.badge.textContent = cfg.labelDemo || 'DEMO';
        el.badge.classList.add('is-live');
      } else if (state.live) {
        el.badge.textContent = cfg.labelLive || 'EN VIVO';
        el.badge.classList.add('is-live');
      } else if (state.holding) {
        el.badge.textContent = cfg.labelHold || 'ÚLTIMA RONDA';
        el.badge.classList.add('is-hold');
      } else {
        el.badge.textContent = cfg.labelWaiting || 'ESPERANDO PK';
      }
      const list = Array.isArray(state.top3) ? state.top3 : [];
      el.empty.hidden = !active || list.length > 0;
      if (!active) {
        clearAnim();
        paintSlots([], false);
        return;
      }
      paintSlots(list, stagger);
      if (typeof embedFit === 'function') requestAnimationFrame(embedFit);
    }
    function applyPk(payload) {
      if (!payload || typeof payload !== 'object') return;
      // PK real cancela el modo Testear (si no, se queda pegado el demo)
      if (payload.live && demo) {
        clearAnim();
        demo = false;
      }
      if (demo) return;
      const live = !!payload.live;
      const nextTop = Array.isArray(payload.armyTop3Host) ? payload.armyTop3Host : [];

      if (live && !wasLive) {
        // Empieza la siguiente batalla → limpiar hold y arrancar de nuevo
        state.holding = false;
        state.top3 = nextTop;
      } else if (live) {
        state.holding = false;
        if (nextTop.length) state.top3 = nextTop;
      } else if (wasLive && !live) {
        // Terminó la ronda → mantener Top 3 hasta la siguiente
        state.holding = state.top3.length > 0;
      }
      wasLive = live;
      state.live = live;
      render({ stagger: false });
    }
    function runFullTest() {
      clearAnim();
      demo = true;
      state.live = true;
      state.holding = false;
      state.top3 = [
        { nickname: 'TOP1', photo: DEMO, points: 820 },
        { nickname: 'top2', photo: DEMO, points: 410 },
        { nickname: 'top 3', photo: DEMO, points: 188 },
      ];
      render({ stagger: true });
      animTimers.push(setTimeout(() => {
        state.top3 = [
          { nickname: 'TOP1', photo: DEMO, points: 910 },
          { nickname: 'top2', photo: DEMO, points: 820 },
          { nickname: 'top 3', photo: DEMO, points: 505 },
        ];
        render({ stagger: true });
      }, 2200));
    }
    function resetLocal() {
      clearAnim();
      demo = false;
      wasLive = false;
      state.live = false;
      state.holding = false;
      state.top3 = [];
      render();
    }

    let ws, reconnectTimer;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
      ws.onopen = () => clearTimeout(reconnectTimer);
      ws.onclose = () => { reconnectTimer = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'pkBattle') applyPk(msg.payload || {});
        if (msg.type === 'pkBattleReset' || msg.type === 'batallaTop3Reset') resetLocal();
        if (msg.type === 'batallaTop3Test') runFullTest();
        if (msg.type === 'settings' && msg.payload?.batallaTop3) {
          cfg = Object.assign(cfg, msg.payload.batallaTop3);
          applyStyle();
          render();
        }
      };
    }
    connectWS();

    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.kind !== 'batallaTop3') return;
      if (d.type === 'config' && d.config) {
        cfg = Object.assign(cfg, d.config);
        applyStyle();
        render();
      } else if (d.type === 'test') runFullTest();
      else if (d.type === 'reset') resetLocal();
    });

    applyStyle();
    if (isEmbed) setTimeout(runFullTest, 400);
    else render();
  })();
  </script>
</body>
</html>
