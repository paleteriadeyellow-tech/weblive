<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay — Spotify Song Requests</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        html.embed, html.embed body {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        html.embed body {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 12px;
            overflow: hidden;
        }
        .sp-wrap {
            width: 420px;
            max-width: 100%;
            min-height: 0;
            padding: 0;
            box-sizing: border-box;
            background: transparent;
        }
        html.embed .sp-wrap {
            width: 100%;
            max-width: none;
        }
        html.embed .sp-list { gap: 10px; }
        html.embed .sp-art {
            width: 56px;
            height: 56px;
        }
        html.embed .sp-title { font-size: 14px; }
        html.embed .sp-time { font-size: 12px; }
        html.embed .sp-row { gap: 12px; }
        .sp-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .sp-row {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
            width: 100%;
        }
        .sp-art {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            object-fit: cover;
            background: linear-gradient(135deg, #1db954 0%, #191414 100%);
            flex: none;
            display: block;
        }
        .sp-art.is-empty {
            visibility: hidden;
        }
        .sp-art.is-demo {
            visibility: visible;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), transparent 45%),
                linear-gradient(135deg, #1db954, #0d2818 55%, #191414);
        }
        .sp-meta {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            justify-content: center;
        }
        .sp-title {
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .85);
        }
        .sp-time {
            color: rgba(255, 255, 255, .9);
            font-weight: 400;
            font-size: 14px;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .85);
        }
    </style>
</head>
<body>
    <div class="sp-wrap">
        <ul class="sp-list" id="sp-list"></ul>
    </div>

    <script>
    (function () {
        const list = document.getElementById('sp-list');
        const isEmbed = /(?:^|[?&])embed=1(?:&|$)/.test(location.search);
        if (isEmbed) document.documentElement.classList.add('embed');

        let now = null;
        let queue = [];
        let anim = null;
        let demoMode = false;

        const esc = (s) => String(s == null ? '' : s)
            .replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const fmt = (ms) => {
            const s = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
            const m = Math.floor(s / 60);
            return `${m}:${String(s % 60).padStart(2, '0')}`;
        };

        function stopAnim() {
            if (anim) { clearInterval(anim); anim = null; }
        }

        function startAnim() {
            stopAnim();
            if (now && now.playing) {
                anim = setInterval(paint, 250);
            }
        }

        function progressNow() {
            if (!now) return 0;
            if (!now.playing) return now.progressMs || 0;
            const elapsed = Date.now() - (now.serverTs || Date.now());
            return Math.min(now.durationMs || 0, (now.progressMs || 0) + elapsed);
        }

        function remainingNow() {
            if (!now) return 0;
            return Math.max(0, (now.durationMs || 0) - progressNow());
        }

        function artUrl(url) {
            const raw = String(url || '').trim();
            if (!raw) return '';
            if (raw.startsWith('data:') || raw.startsWith('/') || raw.startsWith('blob:')) return raw;
            return `/api/img-proxy?url=${encodeURIComponent(raw)}`;
        }

        function rowHtml(item) {
            const title = item.artists
                ? `${item.name || ''} - ${item.artists}`
                : (item.name || '—');
            const img = artUrl(item.image);
            const demoCls = !img && item.demoArt ? ' is-demo' : '';
            const emptyCls = !img && !item.demoArt ? ' is-empty' : '';
            return `
                <li class="sp-row" data-kind="${esc(item.kind)}">
                    <img class="sp-art${emptyCls}${demoCls}" ${img ? `src="${esc(img)}"` : ''} alt="" referrerpolicy="no-referrer"
                        onerror="this.classList.add('is-demo'); this.removeAttribute('src');">
                    <div class="sp-meta">
                        <div class="sp-title">${esc(title)}</div>
                        <div class="sp-time">${esc(item.timeLabel || '')}</div>
                    </div>
                </li>`;
        }

        function buildRows() {
            const rows = [];
            if (now && now.name) {
                const p = progressNow();
                const d = now.durationMs || 0;
                rows.push({
                    kind: 'now',
                    name: now.name,
                    artists: now.artists,
                    image: now.image,
                    demoArt: !!now.demoArt,
                    timeLabel: `${fmt(p)} / ${fmt(d)}`,
                });
            }
            let startIn = remainingNow();
            for (const q of queue) {
                rows.push({
                    kind: 'queue',
                    name: q.name,
                    artists: q.artists,
                    image: q.image,
                    demoArt: !!q.demoArt,
                    timeLabel: `Start in ${fmt(startIn)}`,
                });
                startIn += Math.max(0, Number(q.durationMs) || 0);
            }
            return rows;
        }

        function paint() {
            const rows = buildRows();
            list.innerHTML = rows.length ? rows.map(rowHtml).join('') : '';
        }

        function renderNow(t) {
            now = t && t.name ? { ...t } : null;
            paint();
            startAnim();
        }

        function renderQueue(q) {
            queue = Array.isArray(q) ? q.map((x) => ({ ...x })) : [];
            paint();
            startAnim();
        }

        function showDemoPreview() {
            demoMode = true;
            renderNow({
                name: 'Blinding Lights',
                artists: 'The Weeknd',
                image: '',
                demoArt: true,
                durationMs: 3 * 60 * 1000 + 20 * 1000,
                progressMs: 72 * 1000,
                playing: true,
                serverTs: Date.now(),
            });
            renderQueue([
                {
                    name: 'Save Your Tears',
                    artists: 'The Weeknd',
                    image: '',
                    demoArt: true,
                    durationMs: 3 * 60 * 1000 + 35 * 1000,
                },
                {
                    name: 'Starboy',
                    artists: 'The Weeknd, Daft Punk',
                    image: '',
                    demoArt: true,
                    durationMs: 3 * 60 * 1000 + 50 * 1000,
                },
            ]);
        }

        let ws, rt;
        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
            ws.onopen = () => clearTimeout(rt);
            ws.onclose = () => { rt = setTimeout(connect, 1500); };
            ws.onmessage = (ev) => {
                let m; try { m = JSON.parse(ev.data); } catch { return; }
                if (m.type === 'spotifyNowPlaying') {
                    const t = m.payload?.track || null;
                    if (t && t.name) demoMode = false;
                    // En embed: si aún no hay pista real, mantener la demo
                    if (!t && isEmbed && demoMode) return;
                    renderNow(t);
                } else if (m.type === 'spotifyQueue') {
                    const q = m.payload?.queue || [];
                    if (Array.isArray(q) && q.length) demoMode = false;
                    if ((!q || !q.length) && isEmbed && demoMode) return;
                    renderQueue(q);
                }
            };
        }

        if (isEmbed) showDemoPreview();
        connect();
    })();
    </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
