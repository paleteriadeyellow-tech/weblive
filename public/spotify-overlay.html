<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Overlay — Spotify Song Requests</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        html.embed, html.embed body {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        html.embed body {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 16px 18px;
            overflow: hidden;
        }
        .sp-skin { display: none; }
        body.skin-list #skin-list { display: block; width: 100%; max-width: 100%; }
        body.skin-player #skin-player { display: flex; }

        .sp-wrap {
            width: 420px;
            max-width: 100%;
            min-height: 0;
            padding: 0;
            box-sizing: border-box;
            background: transparent;
        }
        html.embed .sp-wrap {
            width: 100%;
            max-width: none;
        }
        html.embed .sp-list { gap: 10px; }
        html.embed .sp-art {
            width: 56px;
            height: 56px;
        }
        html.embed .sp-title { font-size: 14px; }
        html.embed .sp-time { font-size: 12px; }
        html.embed .sp-row { gap: 12px; }
        .sp-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .sp-row {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
            width: 100%;
        }
        .sp-art {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            object-fit: cover;
            background: linear-gradient(135deg, #1db954 0%, #191414 100%);
            flex: none;
            display: block;
        }
        .sp-art.is-empty { visibility: hidden; }
        .sp-art.is-demo {
            visibility: visible;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), transparent 45%),
                linear-gradient(135deg, #1db954, #0d2818 55%, #191414);
        }
        .sp-meta {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            justify-content: center;
        }
        .sp-title {
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .85);
        }
        .sp-time {
            color: rgba(255, 255, 255, .9);
            font-weight: 400;
            font-size: 14px;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .85);
        }

        html.embed body.skin-player { padding: 12px; }
        html.embed .sp-player {
          width: min(100%, 480px);
          height: auto;
          min-height: 140px;
          aspect-ratio: 520 / 168;
        }
        html.embed .sp-cover-wrap {
          width: auto;
          height: auto;
          aspect-ratio: 1;
          align-self: stretch;
        }
        .sp-player {
          --bg: #121212;
          --fg: #ffffff;
          --muted: #a7a7a7;
          --track: #404040;
          width: 520px;
          max-width: 100%;
          height: 168px;
          box-sizing: border-box;

          align-items: stretch;
          gap: 0;

          box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
          font-family: Inter, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;

          transform: translateY(6px);

        }
        .sp-player.is-on { opacity: 1; transform: none; }
        .sp-cover-wrap {
          position: relative;
          width: 168px;
          height: 168px;
          flex: none;
          background: #000;
        }
        .sp-cover {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
          background:
            radial-gradient(circle at 30% 25%, rgba(255,255,255,.18), transparent 42%),
            linear-gradient(145deg, #1db954, #121212 70%);
        }
        .sp-cover-title {
          position: absolute;
          left: 10px;
          right: 10px;
          bottom: 10px;

          font-weight: 800;
          font-size: 15px;
          line-height: 1.15;

          text-transform: uppercase;
          text-shadow: 0 2px 8px rgba(0,0,0,.85);
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          pointer-events: none;
        }
        .sp-pbody {
          flex: 1;

          padding: 16px 18px 14px;

          flex-direction: column;

        .sp-name {

        }
        .sp-artist {

          text-overflow: ellipsis;
        }
        .sp-progress-block { margin-top: 10px; }
        .sp-bar {
          position: relative;
          height: 4px;
          border-radius: 999px;
          background: var(--track);
          overflow: visible;
        }
        .sp-bar-fill {
          height: 100%;
          width: 0%;
          border-radius: inherit;
          background: #fff;
        }
        .sp-bar-thumb {
          position: absolute;
          top: 50%;
          left: 0%;
          width: 10px;
          height: 10px;

          border-radius: 50%;

        .sp-times {

        .ss-qdur { flex: none; font-size: 12px; color: rgba(255,255,255,.78); font-variant-numeric: tabular-nums; }

    <script>
    (function () {
        const list = document.getElementById('sp-list');
        const player = document.getElementById('skin-player');
        const params = new URLSearchParams(location.search);
        const isEmbed = params.get('embed') === '1';
        if (isEmbed) document.documentElement.classList.add('embed');

        const el = {
          cover: document.getElementById('sp-cover'),
          coverTitle: document.getElementById('sp-cover-title'),
          name: document.getElementById('sp-name'),
          artist: document.getElementById('sp-artist'),
          fill: document.getElementById('sp-fill'),
          thumb: document.getElementById('sp-thumb'),
          cur: document.getElementById('sp-cur'),
          dur: document.getElementById('sp-dur'),
          iconPause: document.getElementById('sp-icon-pause'),
          iconPlay: document.getElementById('sp-icon-play'),
        };

        let now = null;
        let queue = [];
        let anim = null;
        let demoMode = false;

        function normSkin(s) {
          s = String(s || 'list').toLowerCase();
          return (s === 'player' || s === 'nowlist' || s === 'studio') ? s : 'list';
        }
        function setSkin(s) {
          const skin = normSkin(s);
          document.body.classList.remove('skin-list', 'skin-player', 'skin-nowlist', 'skin-studio');
          document.body.classList.add('skin-' + skin);
        }
        setSkin(params.get('skin'));

        const esc = (s) => String(s == null ? '' : s)
            .replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const fmt = (ms) => {
            const s = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
            const m = Math.floor(s / 60);
            return `${m}:${String(s % 60).padStart(2, '0')}`;
        };
        const fmtP = (ms) => {
            const s = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
            const m = Math.floor(s / 60);
            return `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        };

        function progressNow() {
            if (!now) return 0;
            if (!now.playing) return now.progressMs || 0;
            const elapsed = Date.now() - (now.serverTs || Date.now());
            return Math.min(now.durationMs || 0, (now.progressMs || 0) + elapsed);
        }
        function remainingNow() {
            if (!now) return 0;
            return Math.max(0, (now.durationMs || 0) - progressNow());
        }
        function artUrl(url) {
            const raw = String(url || '').trim();
            if (!raw) return '';
            if (raw.startsWith('data:') || raw.startsWith('/') || raw.startsWith('blob:')) return raw;
            return `/api/img-proxy?url=${encodeURIComponent(raw)}`;
        }

        function rowHtml(item) {
            const title = item.artists
                ? `${item.name || ''} - ${item.artists}`
                : (item.name || '—');
            const img = artUrl(item.image);
            const demoCls = !img && item.demoArt ? ' is-demo' : '';
            const emptyCls = !img && !item.demoArt ? ' is-empty' : '';
            return `
                <li class="sp-row" data-kind="${esc(item.kind)}">
                    <img class="sp-art${emptyCls}${demoCls}" ${img ? `src="${esc(img)}"` : ''} alt="" referrerpolicy="no-referrer"
                        onerror="this.classList.add('is-demo'); this.removeAttribute('src');">
                    <div class="sp-meta">
                        <div class="sp-title">${esc(title)}</div>
                        <div class="sp-time">${esc(item.timeLabel || '')}</div>
                    </div>
                </li>`;
        }

        function paintList() {
            const rows = [];
            if (now && now.name) {
                const p = progressNow();
                const d = now.durationMs || 0;
                rows.push({
                    kind: 'now',
                    name: now.name,
                    artists: now.artists,
                    image: now.image,
                    demoArt: !!now.demoArt,
                    timeLabel: `${fmt(p)} / ${fmt(d)}`,
                });
            }
            let startIn = remainingNow();
            for (const q of queue) {
                rows.push({
                    kind: 'queue',
                    name: q.name,
                    artists: q.artists,
                    image: q.image,
                    demoArt: !!q.demoArt,
                    timeLabel: `Start in ${fmt(startIn)}`,
                });
                startIn += Math.max(0, Number(q.durationMs) || 0);
            }
            list.innerHTML = rows.length ? rows.map(rowHtml).join('') : '';
        }

        function paintPlayer() {
            if (!now || !now.name) {
                player.classList.add('is-empty');
                player.classList.remove('is-on');
                return;
            }
            player.classList.remove('is-empty');
            player.classList.add('is-on');
            el.name.textContent = now.name || '—';
            el.artist.textContent = now.artists || '—';
            el.coverTitle.textContent = String(now.name || '').toUpperCase();
            const src = artUrl(now.image);
            if (src) {
                el.cover.src = src;
                el.cover.onerror = () => { el.cover.removeAttribute('src'); };
            } else {
                el.cover.removeAttribute('src');
            }
            const playing = !!now.playing;
            el.iconPause.style.display = playing ? '' : 'none';
            el.iconPlay.style.display = playing ? 'none' : '';
            const dur = Math.max(1, now.durationMs || 1);
            const p = progressNow();
            const pct = Math.max(0, Math.min(100, (p / dur) * 100));
            el.fill.style.width = pct + '%';
            el.thumb.style.left = pct + '%';
            el.cur.textContent = fmtP(p);
            el.dur.textContent = fmtP(dur);
        }

        function whoOf(item) {
            return String((item && (item.requestedBy || item.nickname)) || '').trim();
        }
        function setArt(imgEl, item) {
            if (!imgEl) return;
            const src = artUrl(item && item.image);
            imgEl.classList.remove('is-demo', 'is-empty');
            if (src) {
                imgEl.src = src;
                imgEl.onerror = () => { imgEl.classList.add('is-demo'); imgEl.removeAttribute('src'); };
            } else {
                imgEl.removeAttribute('src');
                if (item && item.demoArt) imgEl.classList.add('is-demo');
            }
        }

        function paintNowlist() {
            const snNow = document.getElementById('sn-now');
            const snArt = document.getElementById('sn-art');
            const snTitle = document.getElementById('sn-title');
            const snTime = document.getElementById('sn-time');
            const snQueue = document.getElementById('sn-queue');
            const idle = !(now && now.name);
            if (snNow) snNow.classList.toggle('is-idle', idle && !demoMode);
            if (snTitle) {
                snTitle.textContent = idle
                    ? (demoMode ? 'Never Gonna Give You Up - Rick Astley' : 'Esperando canción…')
                    : ([now.name, now.artists].filter(Boolean).join(' - ') || now.name);
            }
            if (snTime) {
                if (idle && !demoMode) snTime.textContent = '0:00 / 0:00';
                else snTime.textContent = `${fmt(progressNow())} / ${fmt(now && now.durationMs)}`;
            }
            setArt(snArt, idle && !demoMode ? null : now);
            if (snQueue) {
                let startIn = remainingNow();
                snQueue.innerHTML = queue.map((q) => {
                    const src = artUrl(q.image);
                    const demoCls = !src && q.demoArt ? ' is-demo' : '';
                    const title = [q.name, q.artists].filter(Boolean).join(' - ') || 'Canción';
                    const row = `<li class="sn-row sn-row--queue"><img class="sn-art${demoCls}"${src ? ` src="${esc(src)}"` : ''} alt="" referrerpolicy="no-referrer" onerror="this.classList.add('is-demo'); this.removeAttribute('src');"><div class="sn-meta"><div class="sn-title">${esc(title)}</div><div class="sn-time">En ${esc(fmt(startIn))}</div></div></li>`;
                    startIn += Math.max(0, Number(q.durationMs) || 0);
                    return row;
                }).join('');
            }
        }

        function paintStudio() {
            const ssNow = document.getElementById('ss-now');
            const ssCover = document.getElementById('ss-cover');
            const ssTitle = document.getElementById('ss-title');
            const ssArtist = document.getElementById('ss-artist');
            const ssKick = document.getElementById('ss-kicker');
            const ssFill = document.getElementById('ss-fill');
            const ssTime = document.getElementById('ss-time');
            const ssReq = document.getElementById('ss-req');
            const ssQueue = document.getElementById('ss-queue');
            const ssWrap = document.getElementById('ss-qwrap');
            const idle = !(now && now.name);
            if (ssNow) ssNow.classList.toggle('is-idle', idle && !demoMode);
            if (ssKick) ssKick.textContent = idle && !demoMode ? 'Spotify' : 'Reproduciendo';
            if (ssTitle) ssTitle.textContent = idle ? (demoMode && now ? now.name : 'Esperando canción…') : (now.name || 'Canción');
            if (ssArtist) {
                ssArtist.textContent = idle
                    ? (demoMode && now ? (now.artists || '') : 'Pide con !play nombre de la canción')
                    : (now.artists || '');
            }
            const dur = Math.max(0, (now && now.durationMs) || 0);
            const p = progressNow();
            const pct = dur > 0 ? Math.min(100, (p / dur) * 100) : 0;
            if (ssFill) ssFill.style.width = pct + '%';
            if (ssTime) ssTime.textContent = `${fmt(p)} / ${fmt(dur)}`;
            if (ssReq) {
                const who = !idle || demoMode ? whoOf(now) : '';
                ssReq.innerHTML = who ? 'Solicitada por <b>' + esc(who) + '</b>' : '';
            }
            setArt(ssCover, idle && !demoMode ? null : now);
            if (ssQueue) {
                const items = queue.slice(0, isEmbed ? 4 : 6);
                ssQueue.innerHTML = items.map((q) => {
                    const src = artUrl(q.image);
                    const demoCls = !src && q.demoArt ? ' is-demo' : '';
                    const by = whoOf(q) ? `<div class="ss-qby">Pedida por ${esc(whoOf(q))}</div>` : '';
                    return `<li class="ss-qitem"><img class="${demoCls.trim()}"${src ? ` src="${esc(src)}"` : ''} alt="" referrerpolicy="no-referrer" onerror="this.classList.add('is-demo'); this.removeAttribute('src');"><div class="ss-qmeta"><div class="ss-qtitle">${esc(q.name || 'Canción')}</div><div class="ss-qartist">${esc(q.artists || '')}</div>${by}</div><span class="ss-qdur">${esc(fmt(q.durationMs))}</span></li>`;
                }).join('');
            }
            if (ssWrap) ssWrap.hidden = !(queue.length || (isEmbed && demoMode));
        }

        function paint() {
            paintList();
            paintPlayer();
            paintNowlist();
            paintStudio();
        }

        function stopAnim() {
            if (anim) { clearInterval(anim); anim = null; }
        }
        function startAnim() {
            stopAnim();
            if (now && now.playing) anim = setInterval(paint, 250);
        }

        function renderNow(t) {
            now = t && t.name ? { ...t } : null;
            paint();
            startAnim();
        }
        function renderQueue(q) {
            queue = Array.isArray(q) ? q.map((x) => ({ ...x })) : [];
            paint();
            startAnim();
        }

        function showDemoPreview() {
            demoMode = true;
            renderNow({
                name: 'Never Gonna Give You Up',
                artists: 'Rick Astley',
                image: '',
                demoArt: true,
                requestedBy: 'Demo',
                durationMs: 3 * 60 * 1000 + 33 * 1000,
                progressMs: 75 * 1000,
                playing: true,
                serverTs: Date.now(),
            });
            renderQueue([
                { name: 'Africa', artists: 'Toto', image: '', demoArt: true, nickname: 'viewer', durationMs: 4 * 60 * 1000 + 55 * 1000 },
                { name: 'Take On Me', artists: 'a-ha', image: '', demoArt: true, nickname: 'mods', durationMs: 3 * 60 * 1000 + 45 * 1000 },
                { name: 'Billie Jean', artists: 'Michael Jackson', image: '', demoArt: true, nickname: 'panel', durationMs: 4 * 60 * 1000 + 54 * 1000 },
            ]);
        }

        function applyStyle(raw) {
            if (raw == null || raw === '') return;
            setSkin(raw);
        }

        let ws, rt;
        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
            ws.onopen = () => clearTimeout(rt);
            ws.onclose = () => { rt = setTimeout(connect, 1500); };
            ws.onmessage = (ev) => {
                let m; try { m = JSON.parse(ev.data); } catch { return; }
                if (m.type === 'settings' && m.payload && m.payload.spotify) {
                    applyStyle(m.payload.spotify.overlayStyle);
                }
                if (m.type === 'spotifyNowPlaying') {
                    if (m.payload && m.payload.overlayStyle) applyStyle(m.payload.overlayStyle);
                    const t = m.payload?.track || null;
                    if (t && t.name) demoMode = false;
                    if (!t && isEmbed && demoMode) return;
                    renderNow(t);
                } else if (m.type === 'spotifyQueue') {
                    const q = m.payload?.queue || [];
                    if (Array.isArray(q) && q.length) demoMode = false;
                    if ((!q || !q.length) && isEmbed && demoMode) return;
                    renderQueue(q);
                }
            };
        }

        window.addEventListener('message', (e) => {
            const d = e.data;
            if (d && d.kind === 'spotifyOverlay' && d.overlayStyle) applyStyle(d.overlayStyle);
        });

        if (isEmbed) showDemoPreview();
        connect();
    })();
    </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
