<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay — Spotify Song Requests</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        .sp-wrap {
            width: 420px;
            min-height: 80px;
            padding: 16px 18px;
            box-sizing: border-box;
            background: #212121;
            border-radius: 4px;
        }
        .sp-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .sp-row {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }
        .sp-art {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            object-fit: cover;
            background: #333;
            flex: none;
            display: block;
        }
        .sp-art.is-empty {
            visibility: hidden;
        }
        .sp-meta {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            justify-content: center;
        }
        .sp-title {
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sp-time {
            color: rgba(255, 255, 255, .85);
            font-weight: 400;
            font-size: 14px;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }
        .sp-empty {
            color: rgba(255, 255, 255, .45);
            font-size: 14px;
            font-weight: 400;
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <div class="sp-wrap">
        <ul class="sp-list" id="sp-list">
            <li class="sp-empty">Sin reproducción activa</li>
        </ul>
    </div>

    <script>
    (function () {
        const list = document.getElementById('sp-list');
        let now = null;
        let queue = [];
        let anim = null;

        const esc = (s) => String(s == null ? '' : s)
            .replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const fmt = (ms) => {
            const s = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
            const m = Math.floor(s / 60);
            return `${m}:${String(s % 60).padStart(2, '0')}`;
        };

        function stopAnim() {
            if (anim) { clearInterval(anim); anim = null; }
        }

        function startAnim() {
            stopAnim();
            if (now && now.playing) {
                anim = setInterval(paint, 250);
            }
        }

        function progressNow() {
            if (!now) return 0;
            if (!now.playing) return now.progressMs || 0;
            const elapsed = Date.now() - (now.serverTs || Date.now());
            return Math.min(now.durationMs || 0, (now.progressMs || 0) + elapsed);
        }

        function remainingNow() {
            if (!now) return 0;
            return Math.max(0, (now.durationMs || 0) - progressNow());
        }

        function artUrl(url) {
            const raw = String(url || '').trim();
            if (!raw) return '';
            return `/api/img-proxy?url=${encodeURIComponent(raw)}`;
        }

        function rowHtml(item) {
            const title = item.artists
                ? `${item.name || ''} - ${item.artists}`
                : (item.name || '—');
            const img = artUrl(item.image);
            return `
                <li class="sp-row" data-kind="${esc(item.kind)}">
                    <img class="sp-art${img ? '' : ' is-empty'}" src="${esc(img)}" alt="" referrerpolicy="no-referrer"
                        onerror="this.classList.add('is-empty'); this.removeAttribute('src');">
                    <div class="sp-meta">
                        <div class="sp-title">${esc(title)}</div>
                        <div class="sp-time">${esc(item.timeLabel || '')}</div>
                    </div>
                </li>`;
        }

        function buildRows() {
            const rows = [];
            if (now && now.name) {
                const p = progressNow();
                const d = now.durationMs || 0;
                rows.push({
                    kind: 'now',
                    name: now.name,
                    artists: now.artists,
                    image: now.image,
                    timeLabel: `${fmt(p)} / ${fmt(d)}`,
                });
            }
            let startIn = remainingNow();
            for (const q of queue) {
                rows.push({
                    kind: 'queue',
                    name: q.name,
                    artists: q.artists,
                    image: q.image,
                    timeLabel: `Start in ${fmt(startIn)}`,
                });
                startIn += Math.max(0, Number(q.durationMs) || 0);
            }
            return rows;
        }

        function paint() {
            const rows = buildRows();
            if (!rows.length) {
                list.innerHTML = '<li class="sp-empty">Sin reproducción activa</li>';
                return;
            }
            list.innerHTML = rows.map(rowHtml).join('');
        }

        function renderNow(t) {
            now = t && t.name ? { ...t } : null;
            paint();
            startAnim();
        }

        function renderQueue(q) {
            queue = Array.isArray(q) ? q.map((x) => ({ ...x })) : [];
            paint();
            startAnim();
        }

        let ws, rt;
        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
            ws.onopen = () => clearTimeout(rt);
            ws.onclose = () => { rt = setTimeout(connect, 1500); };
            ws.onmessage = (ev) => {
                let m; try { m = JSON.parse(ev.data); } catch { return; }
                if (m.type === 'spotifyNowPlaying') renderNow(m.payload?.track || null);
                else if (m.type === 'spotifyQueue') renderQueue(m.payload?.queue || []);
            };
        }
        connect();
    })();
    </script>
</body>
</html>
