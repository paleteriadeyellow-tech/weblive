<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Gift VS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Inter:wght@600;700&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; background: transparent !important; font-family: 'Inter', system-ui, sans-serif; }

    #multi-rows { flex: 1; width: 100%; min-width: 0; min-height: 0; height: 100%; display: flex; align-items: flex-start; justify-content: center; }
    .stage { width: 850px; height: 520px; position: relative; background: transparent; display: flex; flex-direction: row; align-items: flex-start; justify-content: center; padding: 4px 32px 28px; }
    .battle-row { display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 4px; width: 100%; height: auto; min-height: 0; }
    .side-m { flex: 0 1 300px; max-width: 300px; display: flex; flex-direction: column; align-items: center; min-width: 0; position: relative; }
    .vs-winner-badge { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6; font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 30px; line-height: 1; letter-spacing: .12em; text-transform: uppercase; color: #fff8e8; text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 22px rgba(255,200,80,.55); pointer-events: none; animation: winner-pop .55s cubic-bezier(.22,1.1,.36,1) both; }
    .vs-winner-badge[hidden] { display: none !important; }
    .side-m.vs-side--winner .hero-m img, .side-m.vs-side--winner .hero-m .ph { filter: drop-shadow(0 0 24px rgba(255,210,100,.45)); }
    @keyframes winner-pop { 0% { opacity: 0; transform: translateX(-50%) translateY(12px) scale(.85); } 100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
    .hero-showcase { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .battle-row.hero-row-swap .hero-showcase { animation: hero-row-swap .32s cubic-bezier(.22,1.05,.36,1); }
    @keyframes hero-row-swap { 0% { opacity: .35; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    .hero-m { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; min-height: 0; width: 100%; position: relative; }
    .hero-m .hero-float { display: flex; align-items: center; justify-content: center; animation: hero-float 2.6s ease-in-out infinite; will-change: transform; }
    #side-l-m .hero-float { animation-delay: 0s; }
    #side-r-m .hero-float { animation-delay: .35s; }
    @keyframes hero-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .hero-m img { max-width: 240px; max-height: 240px; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 0 20px rgba(100,200,255,.2)); transition: opacity .12s ease; }
    .hero-m .ph { font-size: 72px; opacity: .35; }
    .hero-coin-badge { margin-top: 6px; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 22px; line-height: 1; color: #ffe08a; text-shadow: 0 1px 0 rgba(0,0,0,.65), 0 0 14px rgba(255,200,80,.35); letter-spacing: .02em; min-height: 24px; }
    .hero-coin-badge[hidden] { display: none !important; }
    .hero-coin-badge::before { content: '+'; margin-right: .2em; font-weight: 900; color: #fff3c8; }
    .score-m { font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 72px; line-height: 1; color: #fff; text-shadow: 0 2px 0 #000, 0 0 28px rgba(255,255,255,.15); letter-spacing: -.02em; margin-top: 4px; transition: transform .15s ease; }
    .score-m.score-pop { animation: score-pop .38s cubic-bezier(.22,1.2,.36,1); }
    @keyframes score-pop { 0% { transform: scale(1); } 35% { transform: scale(1.14); } 100% { transform: scale(1); } }
    .mid-m { flex: 0 0 auto; width: auto; min-width: 100px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; align-self: flex-start; padding: 28px 2px 0; position: relative; z-index: 1; }
    .mid-m .mid-aura { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 110px; height: 110px; border-radius: 50%; pointer-events: none; z-index: 0; background: radial-gradient(circle at 50% 50%, rgba(255,210,120,.22) 0%, rgba(255,130,60,.12) 42%, rgba(255,70,40,.06) 62%, transparent 78%); animation: aura-flicker 2.2s ease-in-out infinite; }
    @keyframes aura-flicker { 0%,100% { opacity: .65; transform: translate(-50%,-50%) scale(1); } 33% { opacity: .85; transform: translate(-50%,-50%) scale(1.04); } 66% { opacity: .55; transform: translate(-50%,-50%) scale(.98); } }
    .vs-mini { position: relative; z-index: 2; font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 86px; line-height: .9; letter-spacing: -.04em; color: #fff8e8; text-transform: uppercase; background: linear-gradient(185deg, #fffef0 0%, #ffcc33 22%, #ff6600 55%, #ff2200 88%, #ffaa00 100%); background-size: 100% 140%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 3px rgba(255,190,100,.45)); animation: vs-fire 2.4s ease-in-out infinite; }
    @keyframes vs-fire { 0%,100% { filter: drop-shadow(0 0 4px rgba(255,200,100,.5)) drop-shadow(0 0 10px rgba(255,120,50,.28)) drop-shadow(0 0 18px rgba(255,70,30,.14)); } 50% { filter: drop-shadow(0 0 5px rgba(255,220,130,.55)) drop-shadow(0 0 12px rgba(255,130,55,.32)) drop-shadow(0 0 22px rgba(255,80,35,.18)); } }
    .vs-countdown { position: relative; z-index: 2; margin-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; }
    .vs-countdown[hidden] { display: none !important; }
    .vs-countdown-label { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,220,160,.75); }
    .vs-countdown-num { font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; color: #fff8e8; text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 18px rgba(255,180,80,.45); }
    .vs-countdown-num.vs-countdown--urgent { color: #ff6b4a; animation: cd-pulse .55s ease-in-out infinite; }
    @keyframes cd-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .92; } }
    .goal-flash .stage { animation: gf .6s ease; }
    @keyframes gf { 0%,100% { filter: none; } 50% { filter: brightness(1.25); } }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="multi-rows"></div>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';

    let cfgObj = null;
    let slotCount = 1, metaBase = 500, metaStep = 500, currentMeta = 500;
    let onGoal = 'increase';
    let cdSeconds = 0, cdWhen = 'goal', cdRestartOnGoal = false, cdTimer = null, cdRemaining = 0;
    let goalLatchMeta = -1, vsRoundFrozen = false, vsMatchStarted = false;

    const isCountdownFromStart = () => cdWhen === 'start';
    const isMetaReached = () => leftPts >= currentMeta || rightPts >= currentMeta;

    let pairs = [];
    let leftKeys = [], rightKeys = [];
    const HERO_ROTATE_MS = 1000;
    let heroCarouselTimer = null, carouselRowPos = 0, carouselPauseUntil = 0;
    let combosRegalosActivos = {};
    let leftPts = 0, rightPts = 0;

    function rebuildKeys() {
      leftKeys = []; rightKeys = [];
      for (const p of pairs) { if (p.gl) leftKeys.push(p.gl); if (p.gr) rightKeys.push(p.gr); }
    }

    function syncFromConfig() {
      const c = cfgObj || {};
      const rows = Array.isArray(c.rows) ? c.rows : [];
      metaBase = Math.max(1, parseInt(c.meta, 10) || 500);
      metaStep = Math.max(1, parseInt(c.goalStep, 10) || metaBase);
      currentMeta = metaBase;
      onGoal = c.onGoal || 'increase';
      cdSeconds = Math.max(0, parseInt(c.countdown, 10) || 0);
      cdWhen = (c.cdWhen === 'start') ? 'start' : 'goal';
      cdRestartOnGoal = !!c.cdRestart;
      pairs = rows.map((r) => ({
        gl: r.leftId ? String(r.leftId) : '',
        gr: r.rightId ? String(r.rightId) : '',
        gli: r.leftImg || '',
        gri: r.rightImg || '',
        gld: parseInt(r.leftDiamonds, 10) > 0 ? parseInt(r.leftDiamonds, 10) : 0,
        grd: parseInt(r.rightDiamonds, 10) > 0 ? parseInt(r.rightDiamonds, 10) : 0,
      }));
      if (!pairs.length) pairs.push({ gl: '', gr: '', gli: '', gri: '', gld: 0, grd: 0 });
      slotCount = pairs.length;
      rebuildKeys();
    }

    function matchesListaRegalo(catalogKey, data) {
      const k = String(catalogKey || '').trim().toLowerCase();
      if (!k) return false;
      const nombreTikTok = (data.giftName || '').toLowerCase().replace(/_/g, ' ');
      const gid = data.giftId != null ? String(data.giftId) : '';
      if (/^\d+$/.test(k)) return gid === k;
      const partes = k.split('_').filter(Boolean);
      if (!partes.length) return false;
      const last = partes[partes.length - 1];
      if (/^\d+$/.test(last)) {
        if (gid === last) return true;
        const namePart = partes.slice(0, -1).join(' ');
        return !!(namePart && nombreTikTok.indexOf(namePart) !== -1);
      }
      return nombreTikTok.indexOf(partes.join(' ')) !== -1;
    }

    function findPairIndexForGift(side, data) {
      const field = side === 'l' ? 'gl' : 'gr';
      for (let i = 0; i < pairs.length; i++) {
        const key = pairs[i][field];
        if (key && matchesListaRegalo(key, data)) return i;
      }
      return -1;
    }

    function activeRowSlots() {
      const slots = [];
      for (let i = 0; i < pairs.length; i++) {
        const p = pairs[i];
        if (p.gl || p.gr || p.gli || p.gri) slots.push(i);
      }
      return slots;
    }

    function resolveRowCoins(side, idx) {
      const p = pairs[idx]; if (!p) return 0;
      let n = side === 'l' ? p.gld : p.grd;
      if (n > 0) return n;
      const key = side === 'l' ? p.gl : p.gr;
      if (key) { const f = diamondForCatalogKey(key); if (f > 0) return f; }
      return 0;
    }

    function updateCoinBadge(side, coins) {
      const el = document.getElementById('coin-' + (side === 'l' ? 'l' : 'r') + '-0');
      if (!el) return;
      const n = Math.max(0, parseInt(coins, 10) || 0);
      if (n > 0) { el.hidden = false; el.textContent = String(n); }
      else { el.hidden = true; el.textContent = ''; }
    }

    function applyHeroSideUI(side, idx) {
      const p = pairs[idx]; if (!p) return;
      const pre = side === 'l' ? 'l' : 'r';
      const img = document.getElementById('img-' + pre + '-0');
      const ph = document.getElementById('ph-' + pre + '-0');
      if (!img || !ph) return;
      const u = ((side === 'l' ? p.gli : p.gri) || '').trim();
      if (u) {
        img.style.display = ''; ph.style.display = 'none';
        if ((img.dataset.tfHeroSrc || '') !== u) {
          img.dataset.tfHeroSrc = u; img.src = u;
          img.onerror = function () { img.style.display = 'none'; ph.style.display = ''; };
        }
      } else { img.dataset.tfHeroSrc = ''; img.style.display = 'none'; ph.style.display = ''; }
      updateCoinBadge(side, resolveRowCoins(side, idx));
    }

    function preloadRowImages(idx) {
      const p = pairs[idx]; if (!p) return;
      [p.gli, p.gri].forEach((u) => { const s = (u || '').trim(); if (s) { const im = new Image(); im.referrerPolicy = 'no-referrer'; im.src = s; } });
    }
    function flashHeroRowSwap() {
      const row = document.querySelector('.battle-row'); if (!row) return;
      row.classList.remove('hero-row-swap'); void row.offsetWidth; row.classList.add('hero-row-swap');
    }
    function showHeroRow(idx, opts) {
      opts = opts || {};
      const rows = activeRowSlots();
      const pi = idx != null && pairs[idx] != null ? idx : rows[0];
      if (pi == null) return;
      const nextIdx = rows.indexOf(pi);
      const rowChanged = nextIdx >= 0 && nextIdx !== carouselRowPos;
      if (nextIdx >= 0) carouselRowPos = nextIdx;
      if (opts.animate !== false && rowChanged) flashHeroRowSwap();
      applyHeroSideUI('l', pi); applyHeroSideUI('r', pi);
    }
    function tickHeroCarousel() {
      const rows = activeRowSlots(); if (!rows.length) return;
      if (Date.now() < carouselPauseUntil) return;
      const nextPos = (carouselRowPos + 1) % rows.length;
      preloadRowImages(rows[nextPos]); showHeroRow(rows[nextPos]);
    }
    function startHeroCarousel() {
      stopHeroCarousel();
      const rows = activeRowSlots();
      carouselRowPos = 0; carouselPauseUntil = 0;
      if (rows.length) showHeroRow(rows[0]);
      if (!rows.length) return;
      heroCarouselTimer = setInterval(tickHeroCarousel, HERO_ROTATE_MS);
    }
    function stopHeroCarousel() { if (heroCarouselTimer) { clearInterval(heroCarouselTimer); heroCarouselTimer = null; } }
    function highlightHeroRow(idx) {
      const rows = activeRowSlots();
      const si = rows.indexOf(idx);
      showHeroRow(idx, { animate: si >= 0 && si !== carouselRowPos });
      if (si >= 0) carouselRowPos = si;
      carouselPauseUntil = Date.now() + HERO_ROTATE_MS;
    }

    function perDiamondForPair(side, idx, data) {
      const p = pairs[idx]; if (!p) return 0;
      const cfg = side === 'l' ? p.gld : p.grd;
      if (cfg > 0) return cfg;
      let d = data.diamonds; if (d == null) d = data.diamondCount;
      return Math.max(0, Number(d) || 0);
    }
    function coinsForMatchedPair(data, side, idx) {
      const per = perDiamondForPair(side, idx, data);
      if (per <= 0) return 0;
      const r = Math.max(1, Number(data.repeatCount) || 1);
      return per * r;
    }
    function diamondForCatalogKey(catalogKey) {
      const k = String(catalogKey || '').trim(); if (!k) return 1;
      for (const p of pairs) {
        if (p.gl === k && p.gld > 0) return p.gld;
        if (p.gr === k && p.grd > 0) return p.grd;
      }
      return 1;
    }

    function pulseScore(side) {
      const el = document.getElementById('score-' + (side === 'l' ? 'l' : 'r') + '-0');
      if (!el) return;
      el.classList.remove('score-pop'); void el.offsetWidth; el.classList.add('score-pop');
    }
    function renderAllScores(pulseSide) {
      const el = document.getElementById('score-l-0'), er = document.getElementById('score-r-0');
      if (el) el.textContent = String(leftPts);
      if (er) er.textContent = String(rightPts);
      if (pulseSide === 'l') pulseScore('l'); else if (pulseSide === 'r') pulseScore('r');
    }

    function formatCountdownDisplay(sec) {
      const s = Math.max(0, Math.ceil(sec));
      if (s >= 60) { const m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
      return String(s);
    }
    function hideGoalCountdown() {
      const box = document.getElementById('vs-countdown'), num = document.getElementById('vs-countdown-num');
      if (box) box.hidden = true;
      if (num) num.classList.remove('vs-countdown--urgent');
      if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
      cdRemaining = 0;
    }
    function hideWinnerBadges() {
      const wl = document.getElementById('winner-l'), wr = document.getElementById('winner-r');
      if (wl) wl.hidden = true; if (wr) wr.hidden = true;
      document.querySelectorAll('.side-m').forEach((s) => s.classList.remove('vs-side--winner'));
    }
    function resolveWinnerSide() { if (leftPts > rightPts) return 'L'; if (rightPts > leftPts) return 'R'; return 'T'; }
    function showWinnerAnnouncement() {
      hideWinnerBadges();
      const w = resolveWinnerSide();
      const sides = document.querySelectorAll('.battle-row .side-m');
      const sideL = sides[0], sideR = sides[1] || sides[0];
      if (w === 'L' || w === 'T') { const el = document.getElementById('winner-l'); if (el) el.hidden = false; if (sideL) sideL.classList.add('vs-side--winner'); }
      if (w === 'R' || w === 'T') { const el = document.getElementById('winner-r'); if (el) el.hidden = false; if (sideR) sideR.classList.add('vs-side--winner'); }
    }
    function onCountdownFinished() { hideGoalCountdown(); showWinnerAnnouncement(); }
    function updateCountdownDisplay() {
      const num = document.getElementById('vs-countdown-num'); if (!num) return;
      num.textContent = formatCountdownDisplay(cdRemaining);
      if (cdRemaining <= 5 && cdRemaining > 0) num.classList.add('vs-countdown--urgent');
      else num.classList.remove('vs-countdown--urgent');
    }
    function startGoalCountdown(forceStartMode) {
      if (cdSeconds <= 0) { hideGoalCountdown(); return; }
      if (!forceStartMode && !isCountdownFromStart() && !isMetaReached()) { hideGoalCountdown(); return; }
      const box = document.getElementById('vs-countdown'); if (!box) return;
      if (cdTimer && !cdRestartOnGoal) return;
      if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
      cdRemaining = cdSeconds; box.hidden = false; updateCountdownDisplay();
      cdTimer = setInterval(function () {
        cdRemaining -= 1;
        if (cdRemaining <= 0) {
          cdRemaining = 0; updateCountdownDisplay();
          clearInterval(cdTimer); cdTimer = null;
          if (isEmbed && cdSeconds > 0) setTimeout(startGoalCountdown, 650);
          else setTimeout(onCountdownFinished, 400);
          return;
        }
        updateCountdownDisplay();
      }, 1000);
    }
    function maybeStartCountdownFromMatchStart() {
      if (!isCountdownFromStart() || cdSeconds <= 0) return;
      if (vsMatchStarted && cdTimer && cdRemaining > 0) return;
      vsMatchStarted = true; hideWinnerBadges(); startGoalCountdown(true);
    }

    function checkGoal() {
      if (leftPts < currentMeta && rightPts < currentMeta) return;
      if (goalLatchMeta === currentMeta) return;
      goalLatchMeta = currentMeta;
      document.body.classList.add('goal-flash');
      setTimeout(() => document.body.classList.remove('goal-flash'), 550);
      if (isCountdownFromStart()) {
        if (cdSeconds > 0 && cdRemaining <= 0 && !cdTimer) setTimeout(onCountdownFinished, 450);
      } else if (cdSeconds > 0) {
        if (cdRestartOnGoal || !cdTimer) startGoalCountdown();
      } else setTimeout(onCountdownFinished, 450);
      if (onGoal === 'none') { renderAllScores(); return; }
      if (onGoal === 'reset' || onGoal === 'increase_reset') { leftPts = 0; rightPts = 0; goalLatchMeta = -1; }
      else if (onGoal === 'increase') { currentMeta += metaStep; goalLatchMeta = -1; }
      vsRoundFrozen = false; renderAllScores();
    }

    function considerGift(data) {
      if (vsRoundFrozen) return;
      if (data && data.streak) return; // espera fin de racha
      maybeStartCountdownFromMatchStart();
      const li = findPairIndexForGift('l', data);
      if (li >= 0) {
        const total = coinsForMatchedPair(data, 'l', li);
        if (total > 0) { leftPts += total; highlightHeroRow(li); renderAllScores('l'); checkGoal(); }
        return;
      }
      const ri = findPairIndexForGift('r', data);
      if (ri >= 0) {
        const total = coinsForMatchedPair(data, 'r', ri);
        if (total > 0) { rightPts += total; highlightHeroRow(ri); renderAllScores('r'); checkGoal(); }
      }
    }

    function resetAll() {
      leftPts = 0; rightPts = 0; currentMeta = metaBase; goalLatchMeta = -1; vsRoundFrozen = false;
      combosRegalosActivos = {};
      hideGoalCountdown(); hideWinnerBadges(); renderAllScores(); startHeroCarousel();
      maybeStartCountdownFromMatchStart();
    }

    function buildDom() {
      const host = document.getElementById('multi-rows'); if (!host) return;
      host.innerHTML =
        '<div class="battle-row">' +
        '<div class="side-m" id="side-l-m">' +
        '<div class="vs-winner-badge" id="winner-l" hidden>Winner</div>' +
        '<div class="hero-showcase"><div class="hero-m"><span class="hero-float">' +
        '<img id="img-l-0" alt="" style="display:none" referrerpolicy="no-referrer"><span class="ph" id="ph-l-0">🎁</span>' +
        '</span></div><div class="hero-coin-badge" id="coin-l-0" hidden></div></div>' +
        '<div class="score-m" id="score-l-0">0</div></div>' +
        '<div class="mid-m"><div class="mid-aura" aria-hidden="true"></div><div class="vs-mini">VS</div>' +
        '<div class="vs-countdown" id="vs-countdown" hidden><span class="vs-countdown-label">Cuenta atrás</span><span class="vs-countdown-num" id="vs-countdown-num">0</span></div></div>' +
        '<div class="side-m" id="side-r-m">' +
        '<div class="vs-winner-badge" id="winner-r" hidden>Winner</div>' +
        '<div class="hero-showcase"><div class="hero-m"><span class="hero-float">' +
        '<img id="img-r-0" alt="" style="display:none" referrerpolicy="no-referrer"><span class="ph" id="ph-r-0">🎁</span>' +
        '</span></div><div class="hero-coin-badge" id="coin-r-0" hidden></div></div>' +
        '<div class="score-m" id="score-r-0">0</div></div>' +
        '</div>';
      startHeroCarousel();
    }

    function applyConfig(cfg) {
      cfgObj = cfg || {};
      syncFromConfig();
      buildDom();
      resetAll();
    }

    /* ---- Simulación (Testear / vista previa) ---- */
    let testTimers = [];
    function clearTestTimers() { testTimers.forEach((id) => { try { clearTimeout(id); } catch {} }); testTimers = []; }
    function coinsForRowSide(rowIdx, goLeft) { const n = resolveRowCoins(goLeft ? 'l' : 'r', rowIdx); return n > 0 ? n : 1; }
    function applySimHit(hit) {
      const rows = activeRowSlots(); if (!rows.length) return;
      const goLeft = !!(hit && hit.goLeft);
      let rowIdx = hit && hit.rowIndex != null && pairs[hit.rowIndex] != null ? hit.rowIndex : rows[carouselRowPos || 0];
      const si = rows.indexOf(rowIdx); if (si >= 0) carouselRowPos = si;
      showHeroRow(rowIdx);
      let add = hit && hit.coins != null ? Math.max(1, parseInt(hit.coins, 10) || 0) : coinsForRowSide(rowIdx, goLeft);
      if (goLeft) leftPts += add; else rightPts += add;
      renderAllScores(goLeft ? 'l' : 'r'); checkGoal();
    }
    function buildPlan(metaTarget) {
      const rows = activeRowSlots();
      const target = Math.max(1, parseInt(metaTarget, 10) || metaBase || 500);
      if (!rows.length) return { hits: [], endMs: 0 };
      const hits = []; let t = 320, left = 0, right = 0, rowPtr = 0;
      const maxSteps = Math.min(40, Math.max(12, rows.length * 5));
      for (let step = 0; step < maxSteps; step++) {
        if (left >= target || right >= target) break;
        const rowIdx = rows[rowPtr % rows.length];
        const goLeft = step % 2 === 0;
        let add = coinsForRowSide(rowIdx, goLeft);
        const lead = goLeft ? left : right;
        if (lead + add > target) add = Math.max(1, target - lead);
        hits.push({ rowIndex: rowIdx, goLeft, coins: add, t });
        if (goLeft) left += add; else right += add;
        t += 165 + Math.floor(Math.random() * 95);
        if ((step + 1) % 2 === 0) rowPtr += 1;
      }
      const goLeft = left >= right; const lead = goLeft ? left : right;
      if (lead < target) { hits.push({ rowIndex: rows[rowPtr % rows.length], goLeft, coins: Math.max(1, target - lead), t }); t += 260; }
      return { hits, endMs: t + 900 };
    }
    function runSimulation() {
      clearTestTimers(); stopHeroCarousel();
      combosRegalosActivos = {}; leftPts = 0; rightPts = 0; goalLatchMeta = -1; vsRoundFrozen = false;
      hideWinnerBadges(); hideGoalCountdown();
      const rows = activeRowSlots();
      if (rows.length) { carouselRowPos = 0; showHeroRow(rows[0]); }
      renderAllScores();
      if (cdSeconds > 0 && isCountdownFromStart()) { vsMatchStarted = true; startGoalCountdown(); }
      const plan = buildPlan(currentMeta);
      plan.hits.forEach((hit) => testTimers.push(setTimeout(() => applySimHit(hit), hit.t)));
      if (isEmbed) testTimers.push(setTimeout(() => { resetAll(); setTimeout(runSimulation, 2500); }, plan.endMs + 3500));
    }

    // ---- WebSocket nativo ----
    let ws, reconnectTimer;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
      ws.onopen = () => clearTimeout(reconnectTimer);
      ws.onclose = () => { reconnectTimer = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        const { type, payload } = msg;
        if (type === 'gift') { if (!isEmbed) considerGift(payload); }
        else if (type === 'settings') { if (payload && payload.giftVs) applyConfig(payload.giftVs); }
        else if (type === 'giftVsTest') { if (!isEmbed) runSimulation(); }
        else if (type === 'giftVsReset') { if (!isEmbed) { clearTestTimers(); resetAll(); } }
      };
    }

    // ---- Control desde el panel (vista previa embebida) ----
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.kind !== 'giftvs') return;
      if (d.type === 'config') applyConfig(d.config);
      else if (d.type === 'test') runSimulation();
      else if (d.type === 'reset') { clearTestTimers(); resetAll(); }
    });

    // Arranque
    cfgObj = { meta: 500, goalStep: 500, onGoal: 'increase', countdown: 0, rows: [] };
    syncFromConfig();
    buildDom();
    connectWS();
  })();
  </script>
