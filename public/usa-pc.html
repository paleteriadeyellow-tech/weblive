<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livecoins — App PC</title>
  <style>
    :root { --cy: #00e5ff; --mg: #ff2bd6; --bg: #0a0e16; --txt: #e8ecf5; --mut: #8b97b3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, Segoe UI, sans-serif;
      background: radial-gradient(900px 500px at 50% -20%, #1a2540 0%, var(--bg) 60%) no-repeat, var(--bg);
      color: var(--txt); display: grid; place-items: center; padding: 24px; text-align: center;
    }
    .wrap { max-width: 480px; width: 100%; }
    h1 {
      margin: 0 0 12px; font-size: 26px;
      background: linear-gradient(90deg, var(--cy), var(--mg));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { margin: 0 0 10px; color: var(--mut); font-size: 15px; line-height: 1.55; }
    a.dl {
      display: none; margin-top: 22px; padding: 13px 24px; border-radius: 12px;
      color: #04121a; font-weight: 800; text-decoration: none;
      background: linear-gradient(90deg, var(--cy), var(--mg));
    }
    a.dl.show { display: inline-block; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Servidor web cerrado</h1>
    <p>Si quieres continuar usando Livecoins, descarga la versión de PC.</p>
    <a class="dl" id="dl" href="#">Descargar Livecoins PC</a>
  </div>
  <script>
    fetch('/api/web-install').then((r) => r.json()).then((d) => {
      const a = document.getElementById('dl');
      if (d && d.url) { a.href = d.url; a.classList.add('show'); }
    }).catch(() => {});
  </script>
</body>
</html>
