<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livecoins — Mantenimiento</title>
  <style>
    :root { --cy: #00e5ff; --mg: #ff2bd6; --bg: #0a0e16; --txt: #e8ecf5; --mut: #8b97b3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(900px 500px at 50% -20%, #1a2540 0%, var(--bg) 60%) no-repeat, var(--bg);
      color: var(--txt); display: grid; place-items: center; padding: 24px; text-align: center;
    }
    .wrap { max-width: 520px; width: 100%; }
    .sign {
      display: inline-block; padding: 18px 36px; margin-bottom: 28px;
      font-size: clamp(28px, 7vw, 42px); font-weight: 900; letter-spacing: 6px;
      color: #fff; background: linear-gradient(135deg, #f59e0b, #ef4444);
      border: 4px solid rgba(255,255,255,.25); border-radius: 16px;
      box-shadow: 0 16px 48px rgba(239,68,68,.35), inset 0 1px 0 rgba(255,255,255,.2);
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px; font-size: 22px; font-weight: 700;
      background: linear-gradient(90deg, var(--cy), var(--mg));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { margin: 0 0 10px; color: var(--mut); font-size: 15px; line-height: 1.55; }
    #msg { color: #fde68a; font-weight: 600; min-height: 1.4em; }
    a {
      display: inline-block; margin-top: 28px; padding: 12px 22px; border-radius: 12px;
      color: #04121a; font-weight: 700; text-decoration: none;
      background: linear-gradient(90deg, var(--cy), var(--mg));
    }
    .admin-hint { margin-top: 20px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sign">Mantenimiento</div>
    <h1>Panel temporalmente cerrado</h1>
    <p>Estamos trabajando en mejoras. El acceso está limitado mientras dure el mantenimiento.</p>
    <p id="msg"></p>
    <a href="/login.html">Volver al acceso</a>
    <p class="admin-hint">Si eres administrador, inicia sesión con tu cuenta de admin.</p>
  </div>
  <script>
    fetch('/api/maintenance').then((r) => r.json()).then((d) => {
      const el = document.getElementById('msg');
      if (d.message) el.textContent = d.message;
    }).catch(() => {});
  </script>
</body>
</html>
