<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch7"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Metas de regalos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&family=Bangers&family=Bebas+Neue&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800;900&family=Orbitron:wght@700;800&family=Exo+2:wght@700;800;900&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:var(--ggm-font,'Fredoka',sans-serif)}
    body{display:flex;align-items:center;justify-content:center}
    canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
    @property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
    @keyframes spin{to{--a:360deg}}
    @keyframes rot{to{transform:rotate(360deg)}}

    html.embed body{ background: transparent !important; }

    #scaler{flex:none;width:1100px;height:520px;transform-origin:center center}
    .belt{position:relative;width:100%;height:100%;perspective:1500px;overflow:visible}
    .belt.is-stack{
      perspective:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      height:auto;min-height:100%;padding:12px 0;
    }
    .belt.is-row{
      perspective:none;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:var(--gap,18px);
      height:100%;padding:0 12px;overflow:visible;
    }
    .item{position:absolute;left:425px;top:84px;width:250px;height:384px;will-change:transform,opacity;overflow:visible}
    .belt.is-stack .item,.belt.is-row .item{position:relative;left:auto;top:auto;flex:none}
    .shaker{position:absolute;inset:0;overflow:visible}
    .belt.is-stack .shaker,.belt.is-row .shaker{position:relative;width:250px;height:384px}
    .shaker.hit{animation:shake .55s}
    @keyframes shake{20%{transform:translateX(-8px) rotate(-1.5deg)}40%{transform:translateX(8px) rotate(1.5deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

    .t{position:relative;display:inline-block;line-height:1;white-space:nowrap;font-family:'Lilita One',cursive}
    .t::before{content:attr(data-text);position:absolute;left:0;top:0;width:100%;text-align:center;color:var(--sc);-webkit-text-stroke:var(--sw) var(--sc);text-shadow:var(--ext)}
    .t>span{position:relative;color:transparent;-webkit-background-clip:text;background-clip:text;background-repeat:no-repeat}

    .card{
      --c1:#19e3ff;--c2:#4f8cff;position:absolute;inset:0;
      filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c1) 55%,transparent)) drop-shadow(0 18px 20px rgba(0,0,0,.55));
    }
    .card.cyan{--c1:#19e3ff;--c2:#4f8cff}.card.pink{--c1:#ff4fa3;--c2:#ff9f43}.card.purple{--c1:#b46bff;--c2:#ff3d8b}.card.green{--c1:#4dff9b;--c2:#19c3e3}.card.gold{--c1:#ffd23f;--c2:#ff8a00}
    @keyframes in{from{opacity:0;transform:translateY(60px) scale(.85)}}
    @keyframes hover{50%{transform:translateY(-7px)}}
    @keyframes reveal{from{opacity:0;transform:perspective(900px) rotateY(100deg) scale(.7)}}
    .cut{clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}
    .edge{position:absolute;inset:0;overflow:hidden;opacity:calc(.55 + var(--card-alpha,.4)*.45)}
    /* Girar con transform (compositor) en vez de animar el ángulo del gradiente (repintado cada frame). */
    .edge::before{content:"";position:absolute;left:50%;top:50%;width:480px;height:480px;margin:-240px 0 0 -240px;background:conic-gradient(from 0deg,var(--c1),transparent 25%,var(--c2) 50%,transparent 75%,var(--c1));animation:edgeRot 5s linear infinite;will-change:transform}
    @keyframes edgeRot{to{transform:rotate(360deg)}}
    .face{position:absolute;inset:3px;display:flex;flex-direction:column;align-items:center;padding:16px 14px 14px;overflow:hidden;
      background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--c1) 26%,transparent),transparent 70%),linear-gradient(180deg,rgba(18,24,54,calc(.55+var(--card-alpha,.4)*.4)) 0%,rgba(10,14,36,calc(.7+var(--card-alpha,.4)*.25)) 60%,rgba(7,10,24,calc(.85+var(--card-alpha,.4)*.1)) 100%)}
    .face::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}
    .face::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg);animation:sweep 5.5s ease-in-out infinite;z-index:1}
    @keyframes sweep{0%,55%{left:-60%}100%{left:140%}}
    .corner{position:absolute;width:19px;height:19px;border:3px solid var(--c1);filter:drop-shadow(0 0 6px var(--c1));z-index:3}
    .corner.tl{top:10px;left:10px;border-right:0;border-bottom:0}.corner.tr{top:10px;right:10px;border-left:0;border-bottom:0}
    .corner.bl{bottom:10px;left:10px;border-right:0;border-top:0}.corner.br{bottom:10px;right:10px;border-left:0;border-top:0;border-color:var(--c2)}

    .topline{display:flex;justify-content:space-between;align-items:center;width:100%;z-index:2;padding:2px 12px 0;min-height:26px;gap:6px;position:relative}
    .chip{font-weight:700;font-size:10px;letter-spacing:1px;padding:3px 8px;border-radius:8px;color:#071022;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 12px color-mix(in srgb,var(--c1) 70%,transparent);max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;margin-left:6px}
    .meta{font-family:'Lilita One';font-size:14px;letter-spacing:1px;color:var(--c1);text-shadow:0 0 10px var(--c1);flex:none;white-space:nowrap;margin-right:6px}

    .stage{position:relative;width:170px;height:138px;display:grid;place-items:center;z-index:2;flex:none}
    .glow{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 55%,transparent),transparent 62%);filter:blur(6px);animation:breathe 3.4s ease-in-out infinite}
    @keyframes breathe{50%{transform:scale(1.18);opacity:.7}}
    .orbit{position:absolute;width:134px;height:134px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--c1) 70%,#fff);opacity:.55;animation:rot 16s linear infinite}
    .orbit.o2{width:114px;height:114px;border:3px solid transparent;border-top-color:var(--c1);border-bottom-color:var(--c2);opacity:.9;animation:rot 3.2s linear infinite reverse}
    .giftbox{position:relative;width:var(--icon,96px);height:var(--icon,96px);display:grid;place-items:center;animation:bob 3s ease-in-out infinite}
    @keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
    .giftbox img{width:100%;height:100%;object-fit:contain}
    .giftbox .emo{font-size:calc(var(--icon,96px)*.8);line-height:1}
    .giftbox img,.giftbox .emo{filter:drop-shadow(0 10px 10px rgba(0,0,0,.55)) drop-shadow(0 0 16px color-mix(in srgb,var(--c1) 80%,transparent))}
    .giftbox.pop>*{animation:pop .65s cubic-bezier(.2,1.8,.4,1)}
    @keyframes pop{0%{transform:scale(.6) rotate(-18deg)}55%{transform:scale(1.35) rotate(8deg)}100%{transform:none}}
    .floor{position:absolute;bottom:3px;width:88px;height:12px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);animation:fl 3s ease-in-out infinite}
    @keyframes fl{50%{transform:scale(.78);opacity:.6}}
    .sp{position:absolute;animation:tw 2.4s ease-in-out infinite;filter:drop-shadow(0 0 5px #fff);z-index:3}
    @keyframes tw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}

    .name{z-index:2;font-family:var(--ggm-font,'Lilita One');font-size:calc(22px * var(--ggm-text,1));line-height:1.15;letter-spacing:2px;text-align:center;color:var(--label,#fff);text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 14px color-mix(in srgb,var(--c1) 85%,transparent);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .count{z-index:2;margin-top:4px;display:flex;align-items:flex-end;gap:6px}
    .count.bump{animation:bump .55s cubic-bezier(.2,1.9,.4,1)}
    @keyframes bump{40%{transform:scale(1.25) rotate(-2deg)}}
    .num{font-size:calc(52px * var(--ggm-text,1));--sc:#5e2a00;--sw:12px;--ext:0 3px 0 #7a3a00,0 6px 0 #5e2a00,0 10px 12px rgba(0,0,0,.55);filter:drop-shadow(0 0 14px rgba(255,190,40,.6))}
    .num>span{background-image:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%),linear-gradient(180deg,#fffbd2 0%,#ffe45c 30%,var(--count,#ffc400) 49%,#ff9500 51%,#ffc928 78%,#ffb000);background-size:260% 100%,100% 100%;animation:shineC 4s ease-in-out infinite 1s}
    @keyframes shineC{0%{background-position:0% 0,0 0}55%,100%{background-position:100% 0,0 0}}
    .of{font-family:'Lilita One';font-size:calc(26px * var(--ggm-text,1));color:#aeb7e6;margin-bottom:3px;text-shadow:0 2px 0 rgba(0,0,0,.6)}

    .pips{z-index:2;display:flex;gap:4px;width:100%;padding:0 8px;margin-top:8px}
    .pip{flex:1;height:14px;border-radius:3px;transform:skewX(-20deg);background:var(--track,rgba(255,255,255,.09));box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
    .pip.on{background:linear-gradient(180deg,#fff 0%,var(--b1,var(--c1)) 35%,var(--b2,var(--c2)));box-shadow:0 0 10px var(--c1),inset 0 1px 0 rgba(255,255,255,.7)}
    .pip.new{animation:pipin .7s ease-out}
    @keyframes pipin{0%{transform:skewX(-20deg) scaleY(2.4);filter:brightness(2.8)}}
    .pip.next{animation:nextp 1.2s ease-in-out infinite;box-shadow:inset 0 0 0 1px var(--c1)}
    @keyframes nextp{50%{background:color-mix(in srgb,var(--c1) 45%,transparent);box-shadow:0 0 12px var(--c1),inset 0 0 0 1px var(--c1)}}

    .foot{z-index:2;margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:7px}
    .need{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:1.5px;color:#e6ecff;padding:6px 14px;border-radius:16px;
      background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c1) 60%,transparent),0 0 16px color-mix(in srgb,var(--c1) 35%,transparent);animation:beg 1.8s ease-in-out infinite;white-space:nowrap}
    .need b{font-family:'Lilita One';font-size:22px;color:#ffd96a;text-shadow:0 0 10px rgba(255,200,60,.8);letter-spacing:0}
    .need .arrow{color:var(--c1);animation:nudge 1s ease-in-out infinite}
    @keyframes nudge{50%{transform:translateX(4px)}}
    @keyframes beg{50%{transform:scale(1.05)}}
    .who{font-weight:700;font-size:12px;letter-spacing:1.5px;color:#cdd5ff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .who b{color:#ffd96a}
    .who.empty{color:var(--c1);animation:beg 1.6s ease-in-out infinite}

    .card.done{--c1:#ffd23f;--c2:#ff8a00;filter:drop-shadow(0 0 26px rgba(255,190,40,.75)) drop-shadow(0 18px 20px rgba(0,0,0,.55))}
    .card.done .edge::before{animation-duration:2.2s}
    .card.done .face{background:radial-gradient(120% 65% at 50% 0%,rgba(255,200,60,.38),transparent 70%),linear-gradient(180deg,#2c1b08 0%,#180f06 60%,#0d0804 100%)}
    .card.done .rays{position:absolute;left:50%;top:92px;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;z-index:1;
      background:repeating-conic-gradient(from 0deg,rgba(255,215,90,.20) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 6%,transparent 58%);mask:radial-gradient(circle,#000 6%,transparent 58%);animation:rot 26s linear infinite}
    .card.done .name{color:#fff3c4;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 16px rgba(255,190,40,.9)}
    .card.done .num{filter:drop-shadow(0 0 20px rgba(255,200,40,.95))}
    .card.done .of{color:#ffe9a8}
    .card.done .pip.on{animation:wave 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*.09s)}
    @keyframes wave{50%{filter:brightness(1.6);transform:skewX(-20deg) scaleY(1.35)}}
    .check{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#fff2a6,#ffb000);box-shadow:0 0 14px rgba(255,200,60,.95),inset 0 -2px 0 rgba(150,80,0,.5)}
    .check svg{width:15px;height:15px}
    .crown{position:absolute;left:50%;top:-42px;width:92px;height:66px;margin-left:-46px;z-index:9;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6)) drop-shadow(0 0 16px rgba(255,200,60,.95));
      animation:crownIn .9s cubic-bezier(.2,1.8,.4,1) both,crownbob 2.6s ease-in-out infinite .9s}
    @keyframes crownIn{from{opacity:0;transform:translateY(-50px) scale(.4) rotate(-25deg)}}
    @keyframes crownbob{50%{transform:translateY(-6px) rotate(3deg)}}
    .ribbon{position:relative;margin:0 -14px;width:calc(100% + 28px);padding:6px 0 7px;text-align:center;
      font-family:'Lilita One';font-size:21px;line-height:1.15;letter-spacing:3px;color:#4a2300;text-shadow:0 1px 0 rgba(255,255,255,.55);
      background:linear-gradient(180deg,#fff2a6 0%,#ffd23f 45%,#ff9f1c 55%,#ffcf3a 100%);
      clip-path:polygon(0 0,100% 0,calc(100% - 16px) 50%,100% 100%,0 100%,16px 50%);box-shadow:0 0 18px rgba(255,200,60,.9);overflow:hidden}
    .ribbon::after{content:"";position:absolute;top:0;left:-50%;width:30%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg);animation:rsweep 3s ease-in-out infinite}
    @keyframes rsweep{0%,45%{left:-50%}100%{left:140%}}
    .mvp{font-weight:700;font-size:12px;letter-spacing:1.5px;color:#ffe9a8}
    .mvp b{color:#fff}
    .bit{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;z-index:5;animation:fall linear infinite;opacity:.95}
    @keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(420px) rotate(540deg)}}
    .shock{position:absolute;left:50%;top:100px;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:5px solid #ffd23f;box-shadow:0 0 30px #ffd23f;pointer-events:none;z-index:8;animation:shock .9s ease-out forwards}
    @keyframes shock{from{transform:scale(.3);opacity:1}to{transform:scale(3.4);opacity:0}}

    .empty{color:rgba(255,255,255,.75);font-weight:700;font-size:15px;text-align:center;padding:24px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  </style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="scaler"><div class="belt" id="belt"></div></div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const isEmbed = params.get('embed') === '1';
  if (isEmbed) document.documentElement.classList.add('embed');

  const FONTS = {
    montserrat: "'Montserrat', system-ui, sans-serif",
    poppins: "'Poppins', system-ui, sans-serif",
    inter: "'Inter', system-ui, sans-serif",
    rubik: "'Rubik', system-ui, sans-serif",
    exo2: "'Exo 2', system-ui, sans-serif",
    orbitron: "'Orbitron', system-ui, sans-serif",
    bebas: "'Bebas Neue', Impact, sans-serif",
    bangers: "'Bangers', system-ui, sans-serif",
    luckiest: "'Luckiest Guy', system-ui, sans-serif",
    lilita: "'Lilita One', cursive",
    fredoka: "'Fredoka', system-ui, sans-serif",
    system: 'system-ui, sans-serif',
  };
  const THEMES = ['cyan', 'pink', 'purple', 'green', 'gold'];
  const STAR = '<path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z" fill="#fff"/>';
  const CROWN = (uid) => `<svg class="crown" viewBox="0 0 92 66"><defs>
    <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6b8"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#e68a00"/></linearGradient></defs>
    <path d="M8 56 L2 14 L26 32 L46 4 L66 32 L90 14 L84 56 Z" fill="url(#${uid})" stroke="#8a4a00" stroke-width="3" stroke-linejoin="round"/>
    <rect x="8" y="52" width="76" height="10" rx="4" fill="url(#${uid})" stroke="#8a4a00" stroke-width="3"/>
    <circle cx="46" cy="30" r="6" fill="#ff3d8b" stroke="#8a4a00" stroke-width="2"/><circle cx="24" cy="40" r="4.5" fill="#4f8cff" stroke="#8a4a00" stroke-width="2"/><circle cx="68" cy="40" r="4.5" fill="#19e3c1" stroke="#8a4a00" stroke-width="2"/>
    <circle cx="2" cy="14" r="4" fill="#fff6b8"/><circle cx="46" cy="4" r="4.5" fill="#fff6b8"/><circle cx="90" cy="14" r="4" fill="#fff6b8"/></svg>`;

  let cfg = {
    layout: 'banda', scale: 67, iconSize: 78, textSize: 100, gap: 18, font: 'luckiest',
    labelColor: '#ffffff', countColor: '#ffffff', barTrack: 'rgba(255,255,255,0.14)',
    bar1: '#22d3ee', bar2: '#e879f9', bar3: '#a855f7', showCompleted: true,
    bandaSec: 22, bandaVisible: 6, cardOpacity: 39, resetPeriod: 'month', items: [],
  };
  /** @type {Record<string, { count: number, completer?: { nickname?: string, avatar?: string }, shown?: number }>} */
  let progress = {};
  let gifts = []; // runtime card state
  let testGen = 0;
  let testing = false;
  let lastBumpId = '';
  let moving = false;
  let offset = 0;
  let speedF = 1;
  let holdUntil = 0;
  let tween = null;
  let last = performance.now();
  let S = 290;
  let L = 0;
  let rafStarted = false;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function bandaVisibleN() { return Math.max(2, Math.min(12, Number(cfg.bandaVisible) || 4)); }
  function layoutMode() {
    return ['vertical', 'horizontal', 'banda', 'banda-vertical'].includes(cfg.layout) ? cfg.layout : 'banda';
  }
  function useCarousel(items) {
    const mode = layoutMode();
    return mode === 'banda' && items.length > bandaVisibleN();
  }

  function applyCssVars() {
    const root = document.documentElement;
    const textMul = Math.max(0.7, Math.min(2, (Number(cfg.textSize) || 100) / 100));
    const icon = Math.max(48, Math.min(140, Number(cfg.iconSize) || 92));
    const alpha = Math.max(0.08, Math.min(0.95, (Number(cfg.cardOpacity) || 48) / 100));
    const fontKey = FONTS[cfg.font] ? cfg.font : 'luckiest';
    root.style.setProperty('--ggm-font', FONTS[fontKey]);
    root.style.setProperty('--ggm-text', String(textMul));
    root.style.setProperty('--icon', icon + 'px');
    root.style.setProperty('--gap', Math.max(8, Math.min(40, Number(cfg.gap) || 18)) + 'px');
    root.style.setProperty('--label', cfg.labelColor || '#ffffff');
    root.style.setProperty('--count', cfg.countColor || '#ffffff');
    root.style.setProperty('--track', cfg.barTrack || 'rgba(255,255,255,0.09)');
    root.style.setProperty('--b1', cfg.bar1 || '#22d3ee');
    root.style.setProperty('--b2', cfg.bar2 || '#e879f9');
    root.style.setProperty('--b3', cfg.bar3 || '#a855f7');
    root.style.setProperty('--card-alpha', String(alpha));
  }

  function fit() {
    const scaler = $('scaler');
    const mode = layoutMode();
    const n = Math.max(1, gifts.length || 1);
    let baseW = 1100;
    let baseH = 520;
    if (mode === 'vertical' || mode === 'banda-vertical') {
      baseW = 320;
      baseH = Math.max(520, n * 400 + 48);
    } else if (mode === 'horizontal' || (mode === 'banda' && !moving)) {
      baseW = Math.max(1100, n * 270 + 80);
      baseH = 520;
    }
    scaler.style.width = baseW + 'px';
    scaler.style.height = baseH + 'px';
    const userScale = Math.max(0.6, Math.min(1.4, (Number(cfg.scale) || 100) / 100));
    const base = Math.min(innerWidth / baseW, innerHeight / baseH, 1);
    scaler.style.transform = `scale(${base * userScale})`;
    const cv = $('fx');
    cv.width = innerWidth;
    cv.height = innerHeight;
  }

  function pipCount(goal) { return Math.max(1, Math.min(12, goal)); }
  function pipFilled(count, goal, pips) {
    if (goal <= 0) return 0;
    return Math.round((Math.min(count, goal) / goal) * pips);
  }

  function buildCard(g, mode) {
    const done = g.current >= g.goal && cfg.showCompleted !== false;
    const n = Math.min(g.current, g.goal);
    const left = Math.max(0, g.goal - n);
    const prevShown = g.shown ?? n;
    const pipsN = pipCount(g.goal);
    const filled = pipFilled(n, g.goal, pipsN);
    const prevFilled = pipFilled(prevShown, g.goal, pipsN);
    const el = document.createElement('div');
    el.className = `card ${g.theme} ${done ? 'done' : 'pending'}`;
    el.style.animation = mode === 'intro'
      ? `in .9s cubic-bezier(.2,1.3,.4,1) both, hover 5s ease-in-out infinite 1s`
      : mode === 'reveal'
        ? `reveal .85s cubic-bezier(.2,1.5,.4,1) both, hover 5s ease-in-out infinite .85s`
        : `hover 5s ease-in-out infinite`;

    const icon = g.img
      ? `<img src="${esc(g.img)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=emo>🎁</span>'">`
      : `<span class="emo">🎁</span>`;
    const pips = Array.from({ length: pipsN }, (_, k) =>
      `<div class="pip${k < filled ? ' on' : ''}${(!done && k >= prevFilled && k < filled) ? ' new' : ''}${(!done && k === filled) ? ' next' : ''}" style="--i:${k}"></div>`
    ).join('');
    const topRight = done
      ? `<span class="check"><svg viewBox="0 0 24 24"><path d="M4 12.5 L9.5 18 L20 6.5" fill="none" stroke="#6b3500" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`
      : `<span class="meta">META ${g.goal}</span>`;
    const mvpName = (g.completer && g.completer.nickname) || '';
    const foot = done
      ? `<div class="foot"><div class="ribbon">¡META LOGRADA!</div><div class="mvp">${mvpName ? `👑 MVP <b>${esc(mvpName)}</b>` : '⭐ ¡GRACIAS A TODOS!'}</div></div>`
      : left <= 0
        ? `<div class="foot"><div class="need">¡META ALCANZADA!</div>
             <div class="who${mvpName ? '' : ' empty'}">${mvpName ? `👑 <b>${esc(mvpName)}</b>` : '👑 ¡META LISTA!'}</div></div>`
        : `<div class="foot"><div class="need">FALTAN <b>${left}</b> 🎁 <span class="arrow">➜</span></div>
             <div class="who${mvpName ? '' : ' empty'}">${mvpName ? `👑 <b>${esc(mvpName)}</b>` : '👑 ¡SÉ EL PRIMERO!'}</div></div>`;

    el.innerHTML = `
      ${done ? CROWN('cg-' + esc(g.id || 'x').replace(/[^a-zA-Z0-9_-]/g, '') + '-' + n) : ''}
      <div class="edge cut"></div>
      <div class="face cut">
        ${done ? '<div class="rays"></div>' : ''}
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <div class="topline"><span class="chip">${esc(g.rarity)}</span>${topRight}</div>
        <div class="stage"><div class="glow"></div><div class="orbit"></div><div class="orbit o2"></div><div class="floor"></div><div class="giftbox">${icon}</div></div>
        <div class="name" title="${esc(g.name)}">${esc(g.name)}</div>
        <div class="count"><div class="t num" data-text="${n}"><span>${n}</span></div><span class="of">/ ${g.goal}</span></div>
        <div class="pips">${pips}</div>
        ${foot}
      </div>`;

    const st = el.querySelector('.stage');
    for (let k = 0; k < (done ? 7 : 4); k++) {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      const sz = 10 + Math.random() * 12;
      s.setAttribute('viewBox', '0 0 24 24');
      s.classList.add('sp');
      s.innerHTML = STAR;
      s.style.cssText = `left:${10 + Math.random() * 140}px;top:${6 + Math.random() * 100}px;width:${sz}px;height:${sz}px;animation-delay:${(Math.random() * 2.4).toFixed(2)}s`;
      st.appendChild(s);
    }
    if (done) {
      const face = el.querySelector('.face');
      const cols = ['#ff9f43', '#ff3d8b', '#4f8cff', '#19e3c1', '#ffd23f', '#fff'];
      for (let k = 0; k < 14; k++) {
        const b = document.createElement('i');
        b.className = 'bit';
        b.style.cssText = `left:${Math.random() * 100}%;background:${cols[k % cols.length]};animation-duration:${(3 + Math.random() * 3).toFixed(2)}s;animation-delay:${(-Math.random() * 6).toFixed(2)}s`;
        face.appendChild(b);
      }
    }
    g.shown = n;
    return el;
  }

  function rebuild(g, mode) {
    g.shaker.innerHTML = '';
    g.shaker.appendChild(buildCard(g, mode));
  }

  function rarityFor(i) {
    return ['COMÚN', 'RARO', 'ÉPICO', 'LEGENDARIO', 'ÉPICO', 'RARO'][i % 6];
  }

  function itemsList() {
    return (Array.isArray(cfg.items) ? cfg.items : []).filter((x) => x && (x.giftId || x.giftName || x.id));
  }

  function syncGiftsFromCfg(intro) {
    const items = itemsList();
    const belt = $('belt');
    const mode = layoutMode();
    moving = useCarousel(items);
    belt.classList.toggle('is-stack', mode === 'vertical' || mode === 'banda-vertical');
    belt.classList.toggle('is-row', mode === 'horizontal' || (mode === 'banda' && !moving));
    belt.innerHTML = '';
    gifts = items.map((it, i) => {
      const p = progress[it.id] || {};
      const goal = Math.max(1, Number(it.goal) || 10);
      const g = {
        id: it.id,
        name: String(it.label || it.giftName || 'REGALO').toUpperCase(),
        goal,
        current: Math.max(0, Number(p.count) || 0),
        shown: Math.max(0, Number(p.count) || 0),
        img: String(it.giftImage || '').trim(),
        theme: THEMES[i % THEMES.length],
        rarity: rarityFor(i),
        completer: p.completer || null,
        item: null,
        shaker: null,
      };
      const item = document.createElement('div');
      item.className = 'item';
      item.dataset.id = g.id;
      const shaker = document.createElement('div');
      shaker.className = 'shaker';
      item.appendChild(shaker);
      shaker.appendChild(buildCard(g, intro ? 'intro' : 'still'));
      g.item = item;
      g.shaker = shaker;
      belt.appendChild(item);
      return g;
    });
    L = Math.max(1, gifts.length * S);
    offset = 0;
    lastShowCompleted = cfg.showCompleted !== false;
    if (!gifts.length) {
      belt.innerHTML = '<div class="empty">Añade regalos en Configurar</div>';
    }
    layout();
    fit();
  }

  function wrapX(x) { return (((x + L / 2) % L) + L) % L - L / 2; }

  function layout() {
    if (!moving) {
      gifts.forEach((g) => {
        if (!g.item) return;
        g.item.style.transform = '';
        g.item.style.opacity = '1';
        g.item.style.filter = '';
        g.item.style.zIndex = '';
        g.item.style.visibility = 'visible';
      });
      return;
    }
    gifts.forEach((g, i) => {
      const x = wrapX(i * S + offset);
      const d = Math.abs(x) / S;
      const sgn = Math.sign(x) || 0;
      // Menos tilt/escala: evita cortar chips y que el texto lateral se vea más chico
      const sc = 1.06 - .12 * Math.min(d, 1.4);
      const ry = -sgn * Math.min(d, 1.35) * 14;
      const z = -Math.min(Math.abs(x), 600) * .28;
      const op = Math.max(0, Math.min(1, (2.05 - d) / .55));
      g.item.style.transform = `translate3d(${x}px,0,${z}px) rotateY(${ry}deg) scale(${sc})`;
      g.item.style.opacity = String(op);
      g.item.style.zIndex = String(1000 - Math.round(Math.abs(x)));
      g.item.style.filter = `brightness(${1 - .22 * Math.min(d, 1.4)})`;
      g.item.style.visibility = op <= 0.04 ? 'hidden' : 'visible';
    });
  }

  function speedPx() {
    const sec = Math.max(8, Math.min(90, Number(cfg.bandaSec) || 22));
    return Math.max(20, L / sec);
  }

  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000);
    last = t;
    if (moving) {
      if (tween) {
        const k = Math.min(1, (t - tween.t0) / tween.dur);
        const e = 1 - Math.pow(1 - k, 3);
        offset = tween.from + tween.delta * e;
        if (k >= 1) { const r = tween.res; tween = null; r(); }
      } else {
        speedF += ((Date.now() < holdUntil ? 0 : 1) - speedF) * Math.min(1, dt * 3);
        offset -= speedPx() * speedF * dt;
      }
    }
    if (moving) layout();
    drawFx(t);
    requestAnimationFrame(frame);
  }

  function focusGift(i) {
    return new Promise((res) => {
      if (!moving) return res();
      const delta = -wrapX(i * S + offset);
      if (Math.abs(delta) < 3) return res();
      if (tween && typeof tween.res === 'function') {
        try { tween.res(); } catch {}
      }
      tween = { from: offset, delta, t0: performance.now(), dur: Math.min(1400, 650 + Math.abs(delta) * .55), res };
    });
  }

  /* particles */
  const cv = $('fx');
  const ctx = cv.getContext('2d');
  const pal = ['#ff9f43', '#ff3d8b', '#4f8cff', '#19e3c1', '#ffd23f', '#ffffff', '#b46bff'];
  let parts = [];
  const embers = [];
  for (let i = 0; i < 28; i++) {
    embers.push({ x: Math.random(), y: Math.random(), r: .8 + Math.random() * 2.2, s: .0005 + Math.random() * .0012, p: Math.random() * 6, c: pal[Math.random() * pal.length | 0] });
  }
  // shadowBlur en cada frame es caro: cada brasa se pinta una vez con su brillo y luego solo se copia.
  for (const e of embers) {
    const pad = 14;
    const half = Math.ceil(e.r + pad);
    const sp = document.createElement('canvas');
    sp.width = sp.height = half * 2;
    const sx = sp.getContext('2d');
    sx.fillStyle = e.c; sx.shadowColor = e.c; sx.shadowBlur = 10;
    sx.beginPath(); sx.arc(half, half, e.r, 0, 7); sx.fill();
    e.sprite = sp;
    e.half = half;
  }
  function burst(x, y, n, big) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (big ? 11 : 6.5) * (.35 + Math.random());
      parts.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (big ? 5 : 1.5),
        g: .2, life: 1, d: .011 + Math.random() * .012, r: 3 + Math.random() * (big ? 6 : 4),
        c: pal[Math.random() * pal.length | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .45, sq: Math.random() < .5,
      });
    }
  }
  let celebrateIv = null;
  function celebrate(x, y) {
    burst(x, y, 70, true);
    let i = 0;
    if (celebrateIv) clearInterval(celebrateIv);
    celebrateIv = setInterval(() => {
      burst(Math.random() * innerWidth, innerHeight * .15, 36, true);
      if (++i > 4) { clearInterval(celebrateIv); celebrateIv = null; }
    }, 230);
  }
  function stopFx() {
    if (celebrateIv) { clearInterval(celebrateIv); celebrateIv = null; }
    parts = [];
    if (tween && typeof tween.res === 'function') {
      try { tween.res(); } catch {}
    }
    tween = null;
  }
  function drawFx(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    // En preview (embed) no pintar partículas de fondo: el fondo debe verse transparente
    if (!isEmbed) {
      for (const e of embers) {
        e.y -= e.s;
        if (e.y < -.05) { e.y = 1.05; e.x = Math.random(); }
        ctx.globalAlpha = .2 + .35 * Math.sin(t / 600 + e.p) ** 2;
        ctx.drawImage(e.sprite, (e.x + Math.sin(t / 1400 + e.p) * .015) * cv.width - e.half, e.y * cv.height - e.half);
      }
      ctx.globalAlpha = 1;
    }
    parts = parts.filter((p) => p.life > 0);
    for (const p of parts) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .992; p.life -= p.d; p.rot += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(p.life, 0); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 12;
      if (p.sq) ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      else { ctx.beginPath(); ctx.arc(0, 0, p.r / 1.4, 0, 7); ctx.fill(); }
      ctx.restore();
    }
  }

  function pulseGift(g, wasDone, nowDone) {
    holdUntil = Date.now() + 4500;
    const c = g.shaker.querySelector('.count');
    const b = g.shaker.querySelector('.giftbox');
    if (c) c.classList.add('bump');
    if (b) b.classList.add('pop');
    g.shaker.classList.remove('hit');
    void g.shaker.offsetWidth;
    g.shaker.classList.add('hit');
    const r = g.item.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * .36, 34, false);
    if (!wasDone && nowDone) {
      const sh = document.createElement('div');
      sh.className = 'shock';
      g.shaker.appendChild(sh);
      setTimeout(() => sh.remove(), 1000);
      celebrate(r.left + r.width / 2, r.top + r.height / 2);
    }
  }

  let bumpSeq = 0;

  let lastShowCompleted = true;

  function layoutNeedsResync(items) {
    const showDone = cfg.showCompleted !== false;
    if (lastShowCompleted !== showDone) return true;
    if (gifts.length !== items.length) return true;
    if (!gifts.every((g, i) => {
      const it = items[i];
      const goal = Math.max(1, Number(it.goal) || 10);
      const name = String(it.label || it.giftName || 'REGALO').toUpperCase();
      const img = String(it.giftImage || '').trim();
      return g.id === it.id && g.goal === goal && g.name === name && g.img === img;
    })) return true;
    const wantMoving = useCarousel(items);
    const mode = layoutMode();
    const wantStack = mode === 'vertical' || mode === 'banda-vertical';
    const wantRow = mode === 'horizontal' || (mode === 'banda' && !wantMoving);
    const belt = $('belt');
    if (!!moving !== !!wantMoving) return true;
    if (belt.classList.contains('is-stack') !== wantStack) return true;
    if (belt.classList.contains('is-row') !== wantRow) return true;
    return false;
  }

  function settleGift(id) {
    const g = gifts.find((x) => x.id === id);
    if (!g || !g.shaker) return;
    const p = progress[id] || {};
    g.current = Math.max(0, Number(p.count) || 0);
    g.completer = p.completer || null;
    g.shown = g.current;
    rebuild(g, 'still');
  }

  function bumpAnimate(id, wasDoneBefore) {
    const g0 = gifts.find((x) => x.id === id);
    if (!g0) return;
    const p = progress[id] || {};
    const prevShown = Math.max(0, Number(g0.shown) || 0);
    g0.current = Math.max(0, Number(p.count) || 0);
    g0.completer = p.completer || null;
    const wasDone = wasDoneBefore != null ? !!wasDoneBefore : false;
    holdUntil = Date.now() + 6000;
    const seq = ++bumpSeq;

    // En test: aplicar ya (si no, cada paso cancela el anterior y deja el DOM atrasado)
    if (testing) {
      g0.shown = Math.min(prevShown, Math.max(0, g0.current - 1));
      const nowDone = g0.current >= g0.goal;
      rebuild(g0, (!wasDone && nowDone) ? 'reveal' : 'still');
      pulseGift(g0, wasDone, nowDone && cfg.showCompleted !== false);
      return;
    }

    const wait = (tween && tween.res) ? new Promise((r) => setTimeout(r, 280)) : Promise.resolve();
    wait.then(() => {
      if (seq !== bumpSeq) { settleGift(id); return null; }
      const i = gifts.findIndex((x) => x.id === id);
      if (i < 0) return null;
      return focusGift(i);
    }).then(() => {
      if (seq !== bumpSeq) { settleGift(id); return; }
      const g = gifts.find((x) => x.id === id);
      if (!g) return;
      const p2 = progress[id] || {};
      g.current = Math.max(0, Number(p2.count) || 0);
      g.completer = p2.completer || null;
      const nowDone2 = g.current >= g.goal;
      g.shown = Math.min(prevShown, Math.max(0, g.current - 1));
      rebuild(g, (!wasDone && nowDone2) ? 'reveal' : 'still');
      pulseGift(g, wasDone, nowDone2 && cfg.showCompleted !== false);
    });
  }

  function updateGiftVisual(id, bump) {
    const i = gifts.findIndex((g) => g.id === id);
    if (i < 0) return;
    const g = gifts[i];
    const p = progress[id] || {};
    const wasDone = g.current >= g.goal;
    g.current = Math.max(0, Number(p.count) || 0);
    g.completer = p.completer || null;
    if (bump) bumpAnimate(id, wasDone);
    else rebuild(g, 'still');
  }

  function render(bumpId) {
    applyCssVars();
    const items = itemsList();
    if (layoutNeedsResync(items)) {
      let wasDoneBefore = null;
      if (bumpId) {
        const old = gifts.find((x) => x.id === bumpId);
        wasDoneBefore = old ? (old.current >= old.goal) : false;
      }
      syncGiftsFromCfg(true);
      if (bumpId) bumpAnimate(bumpId, wasDoneBefore);
      return;
    }
    gifts.forEach((g) => {
      const p = progress[g.id] || {};
      const next = Math.max(0, Number(p.count) || 0);
      const completer = p.completer || null;
      if (!bumpId || g.id !== bumpId) {
        const nickA = completer && completer.nickname;
        const nickB = g.completer && g.completer.nickname;
        if (next !== g.current || nickA !== nickB) {
          g.current = next;
          g.completer = completer;
          rebuild(g, 'still');
        }
      }
    });
    if (bumpId) updateGiftVisual(bumpId, true);
    layout();
    fit();
  }

  function mergeCfg(next) {
    if (!next || typeof next !== 'object') return;
    cfg = Object.assign({}, cfg, next);
    if (Array.isArray(next.items)) cfg.items = next.items;
  }

  function applyProgressPayload(payload, bumpId) {
    if (!payload || typeof payload !== 'object') return;
    if (payload.counts && typeof payload.counts === 'object') {
      const next = {};
      for (const [id, v] of Object.entries(payload.counts)) {
        next[id] = {
          count: Math.max(0, Number(v?.count != null ? v.count : v) || 0),
          completer: v?.completer || payload.completers?.[id] || null,
        };
      }
      progress = next;
    } else if (payload.progress && typeof payload.progress === 'object') {
      progress = payload.progress;
    }
    if (payload.completers && typeof payload.completers === 'object') {
      for (const [id, c] of Object.entries(payload.completers)) {
        if (!progress[id]) progress[id] = { count: 0 };
        progress[id].completer = c;
      }
    }
    lastBumpId = bumpId || '';
    render(bumpId || '');
  }

  function demoAvatar(letter, c1, c2) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
      </linearGradient></defs>
      <circle cx="75" cy="75" r="75" fill="url(#g)"/>
      <text x="75" y="92" text-anchor="middle" font-family="Montserrat,Arial,sans-serif"
        font-size="64" font-weight="800" fill="#fff">${letter}</text>
    </svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  const DEMO_DONORS = [
    { nickname: 'ZELDRIS', avatar: demoAvatar('Z', '#f59e0b', '#b45309') },
    { nickname: 'NOVA', avatar: demoAvatar('N', '#8b5cf6', '#4c1d95') },
    { nickname: 'KAITO', avatar: demoAvatar('K', '#06b6d4', '#0e7490') },
    { nickname: 'MIA', avatar: demoAvatar('M', '#ec4899', '#9d174d') },
  ];

  let testTimer;
  let testWaitResolve = null;
  function cancelTestWait() {
    clearTimeout(testTimer);
    testTimer = null;
    if (testWaitResolve) {
      const r = testWaitResolve;
      testWaitResolve = null;
      r();
    }
  }
  function runTest() {
    const gen = ++testGen;
    bumpSeq++;
    stopFx();
    testing = true;
    cancelTestWait();
    const items = itemsList();
    if (!items.length) { testing = false; render(); return; }
    progress = {};
    items.forEach((it) => { progress[it.id] = { count: 0 }; });
    syncGiftsFromCfg(true);

    const wait = (ms) => new Promise((resolve) => {
      cancelTestWait();
      testWaitResolve = resolve;
      testTimer = setTimeout(() => {
        testWaitResolve = null;
        resolve();
      }, ms);
    });

    (async () => {
      let itemIdx = 0;
      for (const it of items) {
        if (gen !== testGen) return;
        const goal = Math.max(1, Number(it.goal) || 10);
        const steps = Math.min(goal, 8);
        const stepSize = Math.max(1, Math.ceil(goal / steps));
        const donor = DEMO_DONORS[itemIdx % DEMO_DONORS.length];
        itemIdx++;
        let count = 0;
        while (count < goal) {
          if (gen !== testGen) return;
          count = Math.min(goal, count + stepSize);
          const reached = count >= goal;
          progress[it.id] = {
            count,
            completer: reached ? { nickname: donor.nickname, avatar: donor.avatar } : null,
          };
          render(it.id);
          await wait(reached ? 500 : 280);
        }
        if (gen !== testGen) return;
        await wait(1100);
      }
      if (gen === testGen) testing = false;
    })().catch(() => { if (gen === testGen) testing = false; });
  }

  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'settings' && m.payload?.giftGoals) {
        mergeCfg(m.payload.giftGoals);
        if (!testing) render();
      } else if (m.type === 'giftGoals') {
        if (!testing) applyProgressPayload(m.payload, m.payload?.bumpId || '');
      } else if (m.type === 'giftGoalsTest') {
        if (!isEmbed) runTest();
      } else if (m.type === 'giftGoalsReset') {
        testGen++;
        bumpSeq++;
        testing = false;
        cancelTestWait();
        stopFx();
        progress = {};
        render();
      }
    };
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.kind !== 'giftgoals') return;
    if (d.type === 'config') {
      mergeCfg(d.config);
      if (!testing) render();
    } else if (d.type === 'progress') {
      if (!testing) applyProgressPayload(d.payload || d, d.bumpId || '');
    } else if (d.type === 'test') {
      runTest();
    } else if (d.type === 'reset') {
      testGen++;
      bumpSeq++;
      testing = false;
      cancelTestWait();
