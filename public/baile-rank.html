<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Ranking baile</title>
  <script>
  if (!/[?&]embed=1(?:&|$)/.test(location.search)) {
    document.write('<link rel="preconnect" href="https://fonts.googleapis.com">');
    document.write('<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>');
    document.write('<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">');
  }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; background: transparent !important; font-family: 'Inter', system-ui, sans-serif; }
    html.embed, html.embed body { width: 100%; height: 100%; }
    html.embed body { display: flex; align-items: center; justify-content: center; }
    html.embed .root { transform: scale(var(--fit, 1)); transform-origin: center center; }
    .root { width: 292px; display: flex; flex-direction: column; gap: var(--row-gap, 16px); }
    .title { font-size: 12px; font-weight: 900; letter-spacing: .12em; color: #f5c542; text-shadow: 0 1px 2px rgba(0,0,0,.7); padding: 0 4px; }
    #list { display: flex; flex-direction: column; gap: var(--row-gap, 16px); isolation: isolate; }
    .row {
      position: relative;
      border-radius: 14px;
      background: rgba(8,8,12,.88);
      opacity: 1; filter: none;
      will-change: transform;
      z-index: 1;
      transition: box-shadow .25s ease, background .25s ease, opacity .22s ease;
    }
    #list.has-turn .row:not(.is-gold):not(.is-out) {
      opacity: .5;
    }
    #list.has-turn .row:not(.is-gold):not(.is-out) .name,
    #list.has-turn .row:not(.is-gold):not(.is-out) .tag,
    #list.has-turn .row:not(.is-gold):not(.is-out) .pts { color: #b4b8c0; }
    .row .body {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: 48px 46px 1fr auto; align-items: center; gap: 8px;
      padding: 10px 12px; min-height: 62px;
    }
    .row .tag { color: #d8dce2; }
    .row .name { color: #eceff3; }
    .row .pts { color: #d5d9df; }
    .row .av { border-color: rgba(255,255,255,.28); }
    .row.is-gold {
      z-index: 3;
      background: rgba(40,30,8,.94);
      animation: turnGlow 1.7s ease-in-out infinite;
    }
    .row.is-gold::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 28%, rgba(255, 230, 120, .28) 50%, transparent 72%);
      background-size: 240% 100%;
      animation: turnShine 2.2s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes turnGlow {
      0%, 100% { box-shadow: 0 0 0 2px #f5c542, 0 0 12px rgba(245,197,66,.32); }
      50% { box-shadow: 0 0 0 2px #ffe27a, 0 0 24px rgba(255,214,80,.78); }
    }
    @keyframes turnShine {
      0% { background-position: 130% 0; opacity: .25; }
      45% { background-position: -10% 0; opacity: .85; }
      100% { background-position: 130% 0; opacity: .25; }
    }
    .row.is-out {
      opacity: .78;
      background: rgba(10,10,12,.82);
      box-shadow: none;
    }
    .row.is-shake .body { animation: rshake .28s ease; }
    @keyframes rshake {
      0%,100% { transform: translateX(0); }
      30% { transform: translateX(-4px); }
      60% { transform: translateX(4px); }
    }
    .tag {
      font-size: 15px; font-weight: 900; letter-spacing: .04em; text-align: center;
      font-style: italic;
    }
    .row.is-gold .tag { color: #f5c542; }
    .row.is-out .tag {
      color: #ff4d5c;
      font-size: 11px;
      font-style: normal;
      letter-spacing: .08em;
      text-shadow: 0 0 8px rgba(255, 70, 80, .75), 0 0 16px rgba(255, 40, 50, .4);
    }
    .av { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: #111; border: 2px solid rgba(255,255,255,.22); }
    .row.is-gold .av { border-color: #f5c542; }
    .row.is-out .av { filter: grayscale(.9) brightness(.7); border-color: rgba(255,255,255,.12); }
    .name {
      font-size: 17px; font-weight: 800; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .row.is-gold .name { color: #ffd76a; }
    .row.is-out .name { color: #8a8e94; }
    .pts { font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .row.is-gold .pts { color: #f5c542; }
    .row.is-out .pts { color: #7a7e84; }
    .plus {
      position: absolute; right: 8px; top: -10px; font-size: 16px; font-weight: 900; color: #3dff6a;
      text-shadow: 0 1px 2px #000, 0 0 8px rgba(40, 220, 90, .55); animation: pup .8s ease forwards; pointer-events: none;
    }
    @keyframes pup { from { opacity: 1; transform: translateY(4px); } to { opacity: 0; transform: translateY(-14px); } }
  </style>
</head>
<body>
  <div class="root" id="root">
    <div class="title" id="title">RANKING</div>
    <div id="list"></div>
  </div>
  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const isEmbed = params.get('embed') === '1';
  const FALLBACK_AV = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="#222"/><circle cx="40" cy="30" r="14" fill="#666"/><ellipse cx="40" cy="68" rx="22" ry="16" fill="#666"/></svg>');
  const DEMO = [
    { name: 'Ammy', pts: 54350, photo: '' },
    { name: 'Alma', pts: 12651, photo: '' },
    { name: 'Abby', pts: 7523, photo: '' },
    { name: 'Bianca', pts: 4969, photo: '' },
    { name: 'Alexa', pts: 966, photo: '' },
  ];
  let cfg = { title: 'RANKING', rows: 5, safeSlots: 2, rowGap: 16 };
  const bag = new Map();
  let people = [];
  let activeUid = '';
  let activeId = '';
  let roundWin = false;
  let demoRaf = 0;
  let peopleBackup = null;
  const lastFlash = new Map();
  const lastPts = new Map();
  const lastRank = new Map();

  function fmt(n) { return Math.round(Math.max(0, Number(n) || 0)).toLocaleString('de-DE'); }
  function usePeople() { return Array.isArray(people) && people.length > 0; }
  function applyPeople(src) {
    if (!src) return;
    if (demoRaf) return;
    if (Array.isArray(src.people)) people = src.people.slice();
    if (src.activeId != null) activeId = String(src.activeId || '');
    if (src.phase === 'result') roundWin = !!src.reached;
    else if (src.phase === 'prep' || src.phase === 'idle') roundWin = false;
    render();
  }
  function applyCfg(incoming) {
    if (!incoming || typeof incoming !== 'object') return;
    cfg = Object.assign(cfg, incoming);
    document.getElementById('title').textContent = cfg.title || 'RANKING';
    const gapN = Number(cfg.rowGap);
    const gap = (Number.isFinite(gapN) ? Math.max(0, Math.min(48, gapN)) : 16) + 'px';
    const root = document.getElementById('root');
    const list = document.getElementById('list');
    if (root) root.style.setProperty('--row-gap', gap);
    if (list) list.style.setProperty('--row-gap', gap);
    render();
  }
  function diamondsFromGift(d) {
    const each = Number(d.diamonds || d.diamondCount || 0) || 0;
    if (d.streak) return each * Math.max(0, Number(d.repeatDelta) || 0);
    if (d.streakGift) return 0;
    return each * Math.max(1, Number(d.repeatCount) || 1);
  }
  function showName(p) {
    return String((p && (p.alias || p.name || p.user)) || 'Usuario').replace(/^@+/, '');
  }
  function ranked() {
    const rows = Math.max(2, Math.min(10, Number(cfg.rows) || 5));
    if (usePeople()) {
      return people.slice().map((p, idx) => ({ p, idx })).sort((a, b) => {
        if (!!a.p.out !== !!b.p.out) return a.p.out ? 1 : -1;
        const pa = Math.max(0, Number(a.p.pts) || 0);
        const pb = Math.max(0, Number(b.p.pts) || 0);
        if (pb !== pa) return pb - pa;
        return a.idx - b.idx;
      }).slice(0, rows).map(({ p }) => ({
        uid: p.id,
        name: showName(p),
        photo: p.photo || '',
        pts: Math.max(0, Number(p.pts) || 0),
        out: !!p.out,
        color: p.color || '',
      }));
    }
    return [...bag.values()].sort((a, b) => b.pts - a.pts).slice(0, rows);
  }
  function rowHtml(u, i) {
    const contest = usePeople();
    const safe = Math.max(1, Math.min(10, Number(cfg.safeSlots) || 2));
    const out = contest ? !!u.out : i >= safe;
    const photo = String(u.photo || '').trim() || FALLBACK_AV;
    const name = String(u.name || u.user || 'Usuario').replace(/^@+/, '');
    const uid = String(u.uid || u.name || i);
    const turn = !out && (contest ? uid === activeId : uid === activeUid);
    const gold = turn;
    const flash = lastFlash.get(uid);
    const color = String(u.color || '').trim();
    const cls = 'row'
      + (gold ? ' is-gold' : '')
      + (out ? ' is-out' : '')
      + (flash ? ' is-shake' : '');
    const tag = out ? 'OUT' : String(i + 1);
    const plus = flash ? '<div class="plus">+' + fmt(flash) + '</div>' : '';
    return '<div class="' + cls + '" data-uid="' + uid.replace(/"/g, '') + '"' + (color ? ' style="--pcolor:' + color.replace(/"/g, '') + '"' : '') + '>'
      + '<div class="body">'
      + '<div class="tag">' + tag + '</div>'
      + '<img class="av" alt="">'
      + '<div class="name">' + name.replace(/[<>]/g, '') + '</div>'
      + '<div class="pts">' + fmt(u.pts) + '</div>'
      + plus
      + '</div></div>';
  }
  function uidSel(uid) {
    return String(uid).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
  }
  function paintRow(el, u, i) {
    const contest = usePeople();
    const safe = Math.max(1, Math.min(10, Number(cfg.safeSlots) || 2));
    const out = contest ? !!u.out : i >= safe;
    const uid = String(u.uid || u.name || i);
    const turn = !out && (contest ? uid === activeId : uid === activeUid);
    const gold = turn;
    const flash = lastFlash.get(uid);
    const name = String(u.name || u.user || 'Usuario').replace(/^@+/, '');
    el.classList.toggle('is-gold', !!gold);
    el.classList.toggle('is-out', !!out);
    el.classList.toggle('is-shake', !!flash);
    const color = String(u.color || '').trim();
    if (color) el.style.setProperty('--pcolor', color);
    const tag = out ? 'OUT' : String(i + 1);
    const tagEl = el.querySelector('.tag');
    if (tagEl && tagEl.textContent !== tag) tagEl.textContent = tag;
    const nameEl = el.querySelector('.name');
    if (nameEl) {
      const safeName = name.replace(/[<>]/g, '');
      if (nameEl.textContent !== safeName) nameEl.textContent = safeName;
    }
    const ptsEl = el.querySelector('.pts');
    const ptsTxt = fmt(u.pts);
    if (ptsEl && ptsEl.textContent !== ptsTxt) ptsEl.textContent = ptsTxt;
    const body = el.querySelector('.body') || el;
    let plus = body.querySelector('.plus');
    if (flash) {
      const plusTxt = '+' + fmt(flash);
      if (!plus) {
        plus = document.createElement('div');
        plus.className = 'plus';
        body.appendChild(plus);
      }
      if (plus.textContent !== plusTxt) plus.textContent = plusTxt;
    } else if (plus) plus.remove();
    const img = el.querySelector('.av');
    const photo = String(u.photo || '').trim() || FALLBACK_AV;
    if (img && img.getAttribute('src') !== photo) {
      img.src = photo;
      img.onerror = () => { img.src = FALLBACK_AV; };
    }
  }
  function slideRow(el, fromIdx, toIdx, step) {
    const dy = (fromIdx - toIdx) * step;
    if (Math.abs(dy) < 2) return;
    try {
      el.getAnimations().filter((a) => a.effect && a.effect.target === el).forEach((a) => a.cancel());
      el.style.zIndex = fromIdx > toIdx ? '6' : '2';
      const anim = el.animate(
        [{ transform: 'translateY(' + dy + 'px)' }, { transform: 'translateY(0)' }],
        { duration: 280, easing: 'cubic-bezier(.2,.85,.25,1)' }
      );
      const clear = () => {
        if (el.classList.contains('is-gold')) el.style.zIndex = '3';
        else el.style.removeProperty('z-index');
      };
      anim.finished.then(clear).catch(clear);
    } catch {}
  }
  function render() {
    const list = document.getElementById('list');
    const items = ranked();
    document.getElementById('title').textContent = cfg.title || 'RANKING';
    const keep = new Set();
    const moves = [];
    items.forEach((u, i) => {
      const uid = String(u.uid || u.name || i);
      keep.add(uid);
      let el = list.querySelector('[data-uid="' + uidSel(uid) + '"]');
      if (!el) {
        const wrap = document.createElement('div');
        wrap.innerHTML = rowHtml(u, i);
        el = wrap.firstElementChild;
        const img = el.querySelector('.av');
        const photo = String(u.photo || '').trim() || FALLBACK_AV;
        if (img) {
          img.src = photo;
          img.onerror = () => { img.src = FALLBACK_AV; };
        }
        lastRank.set(uid, i);
      } else {
        const prevPts = lastPts.get(uid);
        if (!demoRaf && prevPts != null && u.pts > prevPts && !lastFlash.has(uid)) {
          lastFlash.set(uid, u.pts - prevPts);
          setTimeout(() => { lastFlash.delete(uid); render(); }, 700);
        }
        const fromIdx = lastRank.has(uid) ? lastRank.get(uid) : i;
        if (fromIdx !== i) moves.push({ el, fromIdx, toIdx: i });
        paintRow(el, u, i);
      }
      lastPts.set(uid, u.pts);
      lastRank.set(uid, i);
      if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null);
    });
    [...list.children].forEach((n) => {
      if (!keep.has(n.dataset.uid)) {
        lastRank.delete(n.dataset.uid);
        n.remove();
      }
    });
    list.classList.toggle('has-turn', !!list.querySelector('.row.is-gold'));
    if (moves.length) {
      const sample = moves[0].el;
      const gap = parseFloat(getComputedStyle(list).gap) || 16;
      const step = (sample.offsetHeight || 52) + gap;
      moves.forEach((m) => slideRow(m.el, m.fromIdx, m.toIdx, step));
    }
  }
  function considerGift(d) {
    if (usePeople()) return;
    if (!d) return;
    const add = diamondsFromGift(d);
    if (add <= 0) return;
    const uid = d.uniqueId || d.nickname || d.name;
    if (!uid) return;
    const prev = bag.get(uid) || { uid, name: d.nickname || d.name || uid, photo: '', pts: 0 };
    prev.pts += add;
    prev.uid = uid;
    prev.name = d.nickname || d.name || prev.name;
    if (d.photo || d.profilePictureUrl) prev.photo = d.photo || d.profilePictureUrl;
    bag.set(uid, prev);
    activeUid = uid;
    lastFlash.set(uid, add);
    setTimeout(() => { lastFlash.delete(uid); render(); }, 700);
    render();
  }
  function stopDemo() {
    if (demoRaf) cancelAnimationFrame(demoRaf);
    demoRaf = 0;
  }
  function resetAll() {
    stopDemo();
    bag.clear();
    activeUid = '';
    roundWin = false;
    lastFlash.clear();
    lastPts.clear();
    lastRank.clear();
    if (peopleBackup) {
      people = peopleBackup.map((p) => Object.assign({}, p));
      peopleBackup = null;
    }
    render();
  }
  function runTest() {
    stopDemo();
    const src = (Array.isArray(people) && people.length)
      ? people.map((p) => ({
        id: p.id, alias: p.alias || '', name: showName(p), user: p.user || p.name, photo: p.photo || '',
        color: p.color || '#f5c542', pts: 0, out: false,
      }))
      : DEMO.map((u, i) => ({
        id: 'demo' + i, name: u.name, user: u.name, photo: u.photo || '',
        color: '#f5c542', pts: 0, out: false,
      }));
    if (Array.isArray(people) && people.length) peopleBackup = people.map((p) => Object.assign({}, p));
    people = src.map((p) => Object.assign({}, p));
    activeId = people[0] ? String(people[0].id) : '';
    activeUid = '';
    roundWin = false;
    lastFlash.clear();
    lastPts.clear();
    lastRank.clear();
    const n = people.length;
    const keys = [];
    const push = (at, rec) => keys.push(Object.assign({ at }, rec));
    const pts = people.map(() => 0);
    const outs = people.map(() => false);
    let t = 0;
    push(t, { pts: pts.slice(), outs: outs.slice(), win: false, flash: -1, add: 0 });
    const hits = n === 1
      ? [{ i: 0, add: 40, wait: 0.7 }, { i: 0, add: 80, wait: 0.85 }]
      : [
        { i: Math.min(1, n - 1), add: 36, wait: 0.65 },
        { i: 0, add: 22, wait: 0.7 },
        { i: Math.min(n > 2 ? 2 : 0, n - 1), add: 95, wait: 0.85 },
        { i: 0, add: 70, wait: 0.8 },
        { i: Math.min(1, n - 1), add: 48, wait: 0.75 },
        { i: 0, add: 40, wait: 0.7 },
      ];
    hits.forEach((h) => {
      t += h.wait;
      pts[h.i] += h.add;
      push(t, { pts: pts.slice(), outs: outs.slice(), win: false, flash: h.i, add: h.add });
    });
    t += 0.85;
    if (n > 1) outs[n - 1] = true;
    push(t, { pts: pts.slice(), outs: outs.slice(), win: false, flash: -1, add: 0 });
    t += 1.05;
    push(t, { pts: pts.slice(), outs: outs.slice(), win: true, flash: -1, add: 0 });
    const endAt = t + 2.2;
    const t0 = performance.now();
    const lerp = (a, b, u) => a + (b - a) * u;
    const loop = (now) => {
      const elapsed = (now - t0) / 1000;
      if (elapsed >= endAt) {
        demoRaf = 0;
        roundWin = true;
        render();
        return;
      }
      let i = 0;
      while (i < keys.length - 1 && keys[i + 1].at <= elapsed) i += 1;
      const a = keys[i];
      const b = keys[i + 1] || a;
      const span = Math.max(0.0001, b.at - a.at);
      const u = b === a ? 1 : Math.min(1, Math.max(0, (elapsed - a.at) / span));
      people.forEach((p, idx) => {
        const av = Number(a.pts[idx]) || 0;
        const bv = Number(b.pts[idx]) || 0;
        p.pts = Math.round(lerp(av, bv, u));
        p.out = !!a.outs[idx];
        if (elapsed >= a.at && b.at - a.at > 0 && elapsed < a.at + 0.55 && a.flash === idx && a.add) {
          lastFlash.set(String(p.id), a.add);
        } else if (lastFlash.get(String(p.id)) && elapsed >= a.at + 0.7) {
          lastFlash.delete(String(p.id));
        }
      });
      roundWin = !!(a.win || (b.win && u > 0.5));
      render();
      demoRaf = requestAnimationFrame(loop);
    };
    render();
    demoRaf = requestAnimationFrame(loop);
  }

  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'settings' && m.payload) {
        if (m.payload.baileRank) applyCfg(m.payload.baileRank);
        if (m.payload.baileRonda) applyPeople(m.payload.baileRonda);
      }
      else if (m.type === 'gift') { if (!isEmbed && !usePeople()) considerGift(m.payload); }
      else if (m.type === 'baileRondaState' || m.type === 'baileRondaStart') {
        applyPeople(m.payload);
      } else if (m.type === 'baileRondaReset') { roundWin = false; render(); }
      else if (m.type === 'baileRankTest') { if (!isEmbed) runTest(); }
      else if (m.type === 'baileRankReset') { if (!isEmbed) resetAll(); }
    };
  }
  window.addEventListener('message', (e) => {
    const d = e.data; if (!d || d.kind !== 'bailerank') return;
    if (d.type === 'config') applyCfg(d.config);
    else if (d.type === 'people') applyPeople(d);
    else if (d.type === 'test') runTest();
    else if (d.type === 'reset') resetAll();
  });
  if (isEmbed) {
    document.documentElement.classList.add('embed');
    const fit = () => document.documentElement.style.setProperty('--fit', String(Math.min(window.innerWidth / 292, window.innerHeight / 400)));
    fit(); window.addEventListener('resize', fit);
  }
  render();
  if (!isEmbed) connectWS();
})();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
