<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch7"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Alerta — Regalo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --size: 190px;
      --pink: #ff4d8d;
      --violet: #a78bfa;
      --cyan: #22d3ee;
      --name: #ffffff;
      --sub: #ffffff;
      --s: 1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: 'Poppins', sans-serif; }

    .stage { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .fit { display: flex; flex-direction: column; align-items: center; transform: scale(var(--s)); transform-origin: center; }

    /* ---------- Avatar ---------- */
    .avatar {
      position: relative; width: var(--size); height: var(--size);
      opacity: 0; transform: scale(.3) translateY(20px);
      will-change: transform, opacity;
    }
    .stage.in .avatar { animation: avatarIn .9s cubic-bezier(.2,1.3,.35,1) forwards; }
    .stage.out .avatar { animation: avatarOut .55s cubic-bezier(.5,0,.8,.4) forwards; }
    @keyframes avatarIn { to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes avatarOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.6) translateY(-10px); } }

    .glow {
      position: absolute; inset: -40px; border-radius: 50%;
      background: radial-gradient(circle closest-side, rgba(255,77,141,.55), rgba(167,139,250,.28) 50%, transparent 100%);
      will-change: transform, opacity;
      animation: breathe 2.6s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100% { transform: scale(.92); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }

    .ring-glow {
      position: absolute; inset: 0; border-radius: 50%;
      box-shadow: 0 0 10px 1px rgba(255,77,141,.8), inset 0 0 10px 1px rgba(255,77,141,.8);
    }
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--pink), var(--violet), var(--cyan), var(--violet), var(--pink));
      will-change: transform;
      animation: spin 5s linear infinite;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .photo {
      position: absolute; inset: 11px; border-radius: 50%; overflow: hidden;
      background: radial-gradient(circle at 30% 25%, #2b1b4d, #0b1020 75%);
      box-shadow: inset 0 0 22px rgba(0,0,0,.7), 0 8px 30px rgba(0,0,0,.5);
      display: grid; place-items: center;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.28) 50%, transparent 65%);
      transform: translateX(-120%);
      animation: shine 3.2s ease-in-out infinite 1s;
    }
    @keyframes shine { 0% { transform: translateX(-120%); } 45%,100% { transform: translateX(120%); } }

    .pulse { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,120,170,.85); opacity: 0; }
    .stage.in .pulse { animation: pulse 2.2s cubic-bezier(.1,.6,.3,1) infinite; }
    .stage.in .pulse.p2 { animation-delay: .7s; }
    .stage.in .pulse.p3 { animation-delay: 1.4s; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

    /* ---------- Texto ---------- */
    .text { margin-top: 34px; text-align: center; }
    .title {
      font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900;
      font-size: 46px; line-height: 1.05; letter-spacing: -.5px; white-space: nowrap;
      background: linear-gradient(90deg, var(--pink), var(--violet) 50%, var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 14px rgba(167,139,250,.45));
      opacity: 0; transform: translateY(24px);
    }
    .user {
      margin-top: 8px; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 800;
      font-size: 30px; color: var(--name); text-shadow: 0 3px 16px rgba(0,0,0,.7), 0 0 20px rgba(255,77,141,.35);
      max-width: 620px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0; transform: translateY(24px);
    }
    .gift {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
      padding: 7px 20px; border-radius: 999px;
      font-weight: 700; font-size: 19px; color: var(--sub);
      background: linear-gradient(135deg, rgba(255,77,141,.35), rgba(167,139,250,.35));
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: 0 6px 24px rgba(0,0,0,.35), inset 0 0 14px rgba(255,255,255,.08);
      opacity: 0; transform: translateY(24px) scale(.9);
    }
    .gift img { width: 24px; height: 24px; object-fit: contain; display: block; }
    .stage.in .title { animation: textIn .7s cubic-bezier(.2,1,.3,1) .35s forwards; }
    .stage.in .user { animation: textIn .7s cubic-bezier(.2,1,.3,1) .5s forwards; }
    .stage.in .gift { animation: textIn .7s cubic-bezier(.2,1.2,.3,1) .65s forwards; }
    .stage.out .title, .stage.out .user, .stage.out .gift { animation: textOut .45s ease-in forwards; }
    @keyframes textIn { to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes textOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-14px); } }

    /* ---------- Partículas ---------- */
    #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    .p { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
    .p svg { display: block; width: 100%; height: 100%; overflow: visible; }
  </style>
</head>
<body>
  <!-- Halo de las partículas dentro del SVG: se rasteriza una vez por partícula, no por cuadro. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="hgP" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#ff3c82" flood-opacity=".85"/></filter>
    <filter id="hgW" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#ffffff" flood-opacity=".9"/></filter>
  </svg>
  <div class="stage" id="stage">
    <div class="fit" id="fit">
      <div class="avatar" id="avatar">
        <div class="glow"></div>
        <div class="pulse"></div><div class="pulse p2"></div><div class="pulse p3"></div>
        <div class="ring-glow"></div>
        <div class="ring"></div>
        <div class="photo"><img id="img" alt="" referrerpolicy="no-referrer"></div>
      </div>
      <div class="text">
        <div class="title" id="title">Gracias por tu regalo</div>
        <div class="user" id="user">PreviewFan</div>
        <div class="gift" id="gift"><span id="giftIcon">🎁</span><span id="giftName">Rosa</span></div>
      </div>
    </div>
    <div id="fx"></div>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    const PREVIEW_AVATAR = '/jarron/lv.png';
    const COLORS = ['#ff2d6f', '#ff5c9a', '#ff7eb3', '#ff4d8d', '#ff8fb8', '#e83e8c'];
    /* Colores por defecto del diseño anterior → paleta del diseño nuevo. */
    const OLD_DEF = { g1: '#ff4d8d', g2: '#c084fc', g3: '#38bdf8' };
    const NEW_DEF = { g1: '#ff4d8d', g2: '#a78bfa', g3: '#22d3ee' };

    const $ = (id) => document.getElementById(id);
    const stage = $('stage'), fit = $('fit'), avatar = $('avatar'), fx = $('fx'), imgEl = $('img');

    const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#ff4d8d'/><stop offset='1' stop-color='#a78bfa'/></linearGradient></defs><rect width='100' height='100' fill='#10152b'/><g fill='url(#g)'><rect x='26' y='44' width='48' height='32' rx='4'/><rect x='22' y='34' width='56' height='14' rx='4'/><rect x='46' y='34' width='8' height='42' fill='#fff' opacity='.85'/><path d='M50 34c-8-14-22-10-18-3 3 5 12 3 18 3zm0 0c8-14 22-10 18-3-3 5-12 3-18 3z'/></g></svg>");
    const HEART = '<svg viewBox="0 0 24 24"><g filter="url(#hgP)"><path fill="currentColor" d="M12 21.2s-7.7-4.7-9.8-9.4C.7 8.3 2.9 4.8 6.3 4.8c2 0 3.6 1.1 5.7 3.3 2.1-2.2 3.7-3.3 5.7-3.3 3.4 0 5.6 3.5 4.1 7-2.1 4.7-9.8 9.4-9.8 9.4z"/><ellipse cx="7.6" cy="8" rx="2.1" ry="1.3" transform="rotate(-35 7.6 8)" fill="#fff" opacity=".55"/></g></svg>';
    const SPARK = '<svg viewBox="0 0 24 24"><path filter="url(#hgW)" fill="#fff" d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>';

    let cfg = { headline: 'Gracias por tu regalo', durationSec: 6, scale: 100, g1: OLD_DEF.g1, g2: OLD_DEF.g2, g3: OLD_DEF.g3, nameColor: '#ffffff', subColor: '#ffffff' };

    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    const easeOutQuart = (t) => 1 - Math.pow(1 - t, 4);
    const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;

    function color(key) {
      const v = String(cfg[key] || '').toLowerCase();
      if (!/^#[0-9a-f]{3,8}$/.test(v) || v === OLD_DEF[key]) return NEW_DEF[key];
      return v;
    }
    function userScale() { return Math.min(150, Math.max(50, Number(cfg.scale) || 100)) / 100; }
    function applyConfig(c) {
      if (c && typeof c === 'object') cfg = Object.assign(cfg, c);
      const r = document.documentElement.style;
      r.setProperty('--pink', color('g1')); r.setProperty('--violet', color('g2')); r.setProperty('--cyan', color('g3'));
      if (cfg.nameColor) r.setProperty('--name', cfg.nameColor);
      if (cfg.subColor) r.setProperty('--sub', cfg.subColor);
      $('title').textContent = cfg.headline || 'Gracias por tu regalo';
      resize();
    }
    function resize() {
      const s = Math.min(1, innerWidth / 680, innerHeight / 480) * userScale();
      fit.style.setProperty('--s', String(s));
      measure();
    }
    addEventListener('resize', resize);

    /* Centro del avatar cacheado: leerlo en cada cuadro forzaría layout. */
    let C = { x: innerWidth / 2, y: innerHeight / 2, R: 95 };
    function measure() {
      const r = avatar.getBoundingClientRect();
      const s = Number(fit.style.getPropertyValue('--s')) || 1;
      C = { x: r.left + r.width / 2, y: r.top + r.height / 2, R: (avatar.offsetWidth / 2) * s };
    }

    let particles = [];
    let orbitAlpha = 0, orbitTarget = 0;
    let rafId = 0;
    function kick() { if (!rafId) rafId = requestAnimationFrame(frame); }

    function makeEl(kind, size, col) {
      const d = document.createElement('div');
      d.className = 'p';
      d.style.width = d.style.height = size + 'px';
      d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px';
      d.style.color = col;
      d.innerHTML = kind === 'spark' ? SPARK : HEART;
      d.style.opacity = 0;
      fx.appendChild(d);
      return d;
    }

    function burst(count, delayBase = 0) {
      const R = C.R;
      for (let i = 0; i < count; i++) {
        const isSpark = Math.random() < .22;
        const size = isSpark ? rand(10, 18) : rand(20, 38);
        particles.push({
          type: 'burst',
          el: makeEl(isSpark ? 'spark' : 'heart', size, COLORS[(Math.random() * COLORS.length) | 0]),
          t0: performance.now() + delayBase + i * rand(30, 60),
          dur: rand(2200, 3400),
          a0: (i / count) * Math.PI * 2 + rand(-.25, .25),
          spin: rand(1.4, 2.6) * Math.PI,
          r0: R - 4,
          r1: R + rand(70, 175),
          seed: rand(0, 10),
          sway: rand(10, 24),
        });
      }
      kick();
    }

    function startOrbit(n = 8) {
      if (particles.some((p) => p.type === 'orbit')) { orbitTarget = 1; kick(); return; }
      const R = C.R;
      for (let i = 0; i < n; i++) {
        particles.push({
          type: 'orbit',
          el: makeEl('heart', rand(18, 28), COLORS[i % COLORS.length]),
          a0: (i / n) * Math.PI * 2,
          speed: rand(.55, .75),
          rad: R + 26 + (i % 2) * 16,
          seed: rand(0, 10),
        });
      }
      orbitTarget = 1;
      kick();
    }
    function stopOrbit() { orbitTarget = 0; }

    function clearParticles() {
      particles.forEach((p) => p.el.remove());
      particles = [];
      orbitAlpha = 0; orbitTarget = 0;
    }

    function frame(now) {
      rafId = 0;
      const cx = C.x, cy = C.y;
      orbitAlpha += (orbitTarget - orbitAlpha) * .06;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.type === 'burst') {
          const t = (now - p.t0) / p.dur;
          if (t < 0) continue;
          if (t >= 1) { p.el.remove(); particles.splice(i, 1); continue; }
          const e = easeOutQuart(t);
          const r = p.r0 + (p.r1 - p.r0) * e;
          const a = p.a0 + p.spin * easeOutCubic(t);
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r - t * 28;
          const scale = easeOutCubic(clamp(t / .14)) * (1 - .55 * easeInOutSine(clamp((t - .2) / .8)));
          const op = clamp(t / .08) * (1 - clamp((t - .65) / .35));
          const rot = Math.sin(t * 5 + p.seed) * p.sway;
          p.el.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${scale})`;
          p.el.style.opacity = op;
        } else {
          if (orbitTarget === 0 && orbitAlpha < .01) { p.el.remove(); particles.splice(i, 1); continue; }
          const s = now / 1000;
          const a = p.a0 + s * p.speed;
          const rad = p.rad + Math.sin(s * 1.6 + p.seed) * 5;
          const x = cx + Math.cos(a) * rad;
          const y = cy + Math.sin(a) * rad;
          const pulse = 1 + Math.sin(s * 3 + p.seed) * .12;
          p.el.style.transform = `translate(${x}px,${y}px) rotate(${Math.sin(s * 2 + p.seed) * 18}deg) scale(${pulse * orbitAlpha})`;
          p.el.style.opacity = orbitAlpha;
        }
      }
      if (particles.length) kick();
    }

    /* ---------- datos ---------- */
    function name(d) { return (d.nickname || '').trim() || (d.uniqueId ? '@' + d.uniqueId : 'Usuario'); }
    function giftLabel(n, count) {
      const b = String(n || 'Regalo').replace(/_/g, ' ');
      const cap = b.charAt(0).toUpperCase() + b.slice(1);
      const c = Math.max(1, parseInt(count, 10) || 1);
      return c > 1 ? cap + ' × ' + c : cap;
    }
    function applyData(d) {
      $('user').textContent = name(d);
      $('giftName').textContent = giftLabel(d.giftName, d.repeatCount);
      const icon = $('giftIcon');
      const gimg = String(d.giftPictureUrl || d.image || d.giftImage || '').trim();
      if (gimg) {
        const im = document.createElement('img');
        im.alt = ''; im.referrerPolicy = 'no-referrer';
        im.onerror = function () { icon.textContent = '🎁'; };
        im.src = gimg;
        icon.textContent = ''; icon.appendChild(im);
      } else icon.textContent = '🎁';
      imgEl.onerror = function () { this.onerror = null; this.src = FALLBACK_IMG; };
      imgEl.src = String(d.photo || d.profilePictureUrl || '').trim() || FALLBACK_IMG;
      imgEl.alt = name(d);
    }

    /* ---------- cola ---------- */
    const q = [];
    let busy = false;
    let timers = [];
    let idleT = null;
    function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
    function clearTimers() { timers.forEach(clearTimeout); timers = []; }

    function enter(d) {
      applyData(d);
      stage.classList.remove('out', 'in');
      void stage.offsetWidth;
      stage.classList.add('in');
      measure();
      later(() => { measure(); burst(16, 250); }, 0);
      later(() => burst(12, 0), 650);
      later(() => { measure(); burst(10, 0); }, 1300);
      later(() => startOrbit(8), 700);
    }

    function show() {
      if (busy || !q.length) return;
      busy = true;
      enter(q.shift());
      const ms = Math.min(120000, Math.max(3000, (Number(cfg.durationSec) || 6) * 1000));
      later(() => {
        stopOrbit();
        burst(14, 0);
        stage.classList.remove('in');
        stage.classList.add('out');
        later(() => { stage.classList.remove('out'); busy = false; show(); }, 1150);
      }, ms);
    }

    const DEMO = { uniqueId: 'preview_fan', nickname: 'PreviewFan', photo: PREVIEW_AVATAR, giftName: 'rosa', repeatCount: 1 };

    /* Vista previa del panel: se queda visible y repite la ráfaga. */
    function idleDemo() {
      clearTimers(); clearParticles(); q.length = 0; busy = false;
      enter(DEMO);
      if (idleT) clearInterval(idleT);
      idleT = setInterval(() => { if (!document.hidden) burst(14, 0); }, 8200);
    }

    function runTest() {
      if (isEmbed) { idleDemo(); return; }
      clearTimers(); clearParticles(); q.length = 0; busy = false;
      stage.classList.remove('in', 'out');
      q.push({ ...DEMO });
      show();
    }
    function resetAll() {
      clearTimers(); clearParticles(); q.length = 0; busy = false;
      stage.classList.remove('in', 'out');
      if (isEmbed) idleDemo();
    }

    let ws, rt;
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
      ws.onopen = () => clearTimeout(rt);
      ws.onclose = () => { rt = setTimeout(connect, 1500); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === 'settings') { if (m.payload && m.payload.alertaGift) applyConfig(m.payload.alertaGift); return; }
        if (isEmbed) return;
        if (m.type === 'gift') { if (m.payload && m.payload.streak) return; q.push(m.payload || {}); show(); }
        else if (m.type === 'alertaGiftTest') runTest();
        else if (m.type === 'alertaGiftReset') resetAll();
      };
    }
    window.addEventListener('message', (e) => {
      const d = e.data; if (!d || d.kind !== 'alertagift') return;
      if (d.type === 'config') applyConfig(d.config);
      else if (d.type === 'test') runTest();
      else if (d.type === 'reset') resetAll();
    });

    applyConfig({});
    if (isEmbed) {
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(idleDemo, 120));
    }
    connect();
  })();
  </script>
<script src="/js/overlay-keepalive.js"></script>
</body>
</html>
