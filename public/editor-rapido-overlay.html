<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay — Editor Pro</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Rubik, system-ui, sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 0;
    }
    .er-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      transform: scale(var(--er-live-zoom, 1));
      transform-origin: center center;
    }
    .er-stage.is-spread {
      transform: none;
      padding: 6px;
      width: 100%;
      height: 100%;
    }
    .er-grid {
      display: grid;
      grid-template-columns: repeat(var(--er-cols, 4), minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      box-sizing: border-box;
      padding: 2px;
      align-content: center;
    }
    .er-grid.is-fixed-cells {
      max-width: none;
      max-height: none;
      width: max-content;
      height: max-content;
      grid-template-columns: repeat(var(--er-cols, 4), var(--er-cell-w, 200px));
      align-content: start;
    }
    .er-grid.is-fixed-cells .er-cell {
      width: var(--er-cell-w, 200px);
      max-width: var(--er-cell-w, 200px);
      justify-self: stretch;
      align-self: start;
    }
    .er-grid.is-spread {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      grid-template-columns: repeat(var(--er-cols, 4), minmax(0, 1fr));
      justify-items: center;
      align-content: space-evenly;
      align-items: center;
    }
    .er-grid.is-spread:not(.is-fixed-cells) .er-cell {
      width: min(100%, var(--er-cell-w, 160px));
      max-width: min(100%, var(--er-cell-w, 160px));
      justify-self: center;
      align-self: center;
    }
    .er-grid.is-spread.is-fixed-cells {
      width: max-content;
      height: max-content;
      max-width: none;
      max-height: none;
      grid-template-columns: repeat(var(--er-cols, 4), var(--er-cell-w, 200px));
      justify-items: stretch;
      align-content: start;
      align-items: start;
    }
    .er-stage.is-fixed-cells {
      width: max-content;
      height: max-content;
      max-width: none;
      max-height: none;
      min-width: 100%;
      min-height: 100%;
    }
    .er-grid.is-tight { gap: 0; }
    .er-grid.is-tight.is-spread {
      column-gap: 0;
      row-gap: 0;
    }
    .er-grid.is-tight .er-cell {
      border-radius: 0;
      border-width: 0;
    }
    .er-cell {
      position: relative;
      aspect-ratio: 16 / 10;
      margin: 0;
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.12);
      background: #0b1220;
      width: 100%;
      min-height: 0;
      container-type: size;
      align-self: stretch;
    }
    .er-cell.is-transparent-bg {
      background: transparent;
      border-color: transparent;
      overflow: visible;
    }
    .er-cell.er-frame-solid {
      border-width: 3px !important;
      border-style: solid !important;
      border-color: var(--er-frame-color, #25f4ee) !important;
      overflow: hidden !important;
    }
    .er-cell.is-transparent-bg.er-frame-solid {
      border-style: solid !important;
      border-color: var(--er-frame-color, #25f4ee) !important;
      overflow: hidden !important;
    }
    .er-grid.is-tight .er-cell.er-frame-solid {
      border-width: 3px !important;
    }
    .er-cell.er-frame-anim,
    .er-cell.er-frame-on {
      border-color: transparent !important;
      border-width: 0 !important;
      overflow: hidden !important;
      isolation: isolate;
    }
    .er-cell.is-transparent-bg.er-frame-anim,
    .er-cell.is-transparent-bg.er-frame-on {
      overflow: hidden !important;
    }
    .er-cell.er-frame-anim::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 3px;
      pointer-events: none;
      z-index: 6;
      background-image: var(--er-frame-grad);
      background-size: 300% 100%;
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    .er-cell.er-frame-flow::before {
      animation: er-frame-flow var(--er-frame-anim-dur, 4s) linear infinite;
    }
    .er-cell.er-frame-pulse::before {
      animation: er-frame-pulse var(--er-frame-anim-dur, 5s) ease-in-out infinite;
    }
    @keyframes er-frame-flow {
      0% { background-position: 0% center; }
      100% { background-position: 300% center; }
    }
    @keyframes er-frame-pulse {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }
    .er-cell-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      border-radius: inherit;
    }
    .er-cell-fg {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      max-width: calc(72% * var(--er-fg-scale, 1));
      max-height: calc(72% * var(--er-fg-scale, 1));
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.45));
      z-index: 1;
    }
    .er-cell-fg.is-free {
      max-width: 72%;
      max-height: 72%;
      transform: translate(-50%, -50%) scale(var(--er-item-scale, 1));
    }
    .er-cell-gift {
      position: absolute;
      right: 4%;
      bottom: 4%;
      max-width: calc(40% * var(--er-gift-scale, 1));
      max-height: calc(40% * var(--er-gift-scale, 1));
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: right bottom;
      pointer-events: none;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.45));
      z-index: 2;
      --er-gift-t: translate(0, 0);
      --er-gift-origin: right bottom;
      transform: var(--er-gift-t);
      transform-origin: var(--er-gift-origin);
    }
    .er-grid[data-er-gift-pos="tl"] .er-cell-gift:not(.is-free) {
      left: 4%; right: auto; top: 4%; bottom: auto;
      --er-gift-t: translate(0, 0);
      --er-gift-origin: left top;
      object-position: left top;
    }
    .er-grid[data-er-gift-pos="top"] .er-cell-gift:not(.is-free) {
      left: 50%; right: auto; top: 4%; bottom: auto;
      --er-gift-t: translateX(-50%);
      --er-gift-origin: top center;
      object-position: top center;
    }
    .er-grid[data-er-gift-pos="tr"] .er-cell-gift:not(.is-free) {
      left: auto; right: 4%; top: 4%; bottom: auto;
      --er-gift-t: translate(0, 0);
      --er-gift-origin: right top;
      object-position: right top;
    }
    .er-grid[data-er-gift-pos="left"] .er-cell-gift:not(.is-free) {
      left: 4%; right: auto; top: 50%; bottom: auto;
      --er-gift-t: translateY(-50%);
      --er-gift-origin: left center;
      object-position: left center;
    }
    .er-grid[data-er-gift-pos="center"] .er-cell-gift:not(.is-free) {
      left: 50%; right: auto; top: 50%; bottom: auto;
      --er-gift-t: translate(-50%, -50%);
      --er-gift-origin: center center;
      object-position: center;
    }
    .er-grid[data-er-gift-pos="right"] .er-cell-gift:not(.is-free) {
      left: auto; right: 4%; top: 50%; bottom: auto;
      --er-gift-t: translateY(-50%);
      --er-gift-origin: right center;
      object-position: right center;
    }
    .er-grid[data-er-gift-pos="bl"] .er-cell-gift:not(.is-free) {
      left: 4%; right: auto; top: auto; bottom: 4%;
      --er-gift-t: translate(0, 0);
      --er-gift-origin: left bottom;
      object-position: left bottom;
    }
    .er-grid[data-er-gift-pos="bottom"] .er-cell-gift:not(.is-free) {
      left: 50%; right: auto; top: auto; bottom: 4%;
      --er-gift-t: translateX(-50%);
      --er-gift-origin: bottom center;
      object-position: bottom center;
    }
    .er-grid[data-er-gift-pos="br"] .er-cell-gift:not(.is-free) {
      left: auto; right: 4%; top: auto; bottom: 4%;
      --er-gift-t: translate(0, 0);
      --er-gift-origin: right bottom;
      object-position: right bottom;
    }
    .er-cell-gift.is-free {
      right: auto;
      bottom: auto;
      transform: translate(-50%, -50%) scale(var(--er-item-scale, 1));
      object-position: center;
    }
    .er-cell-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      max-width: 90%;
      padding: 2px 4px;
      text-align: center;
      line-height: 1.15;
      color: var(--er-text-color, #fff);
      font-weight: 800;
      font-family: Rubik, system-ui, sans-serif;
      font-size: calc(var(--er-text-scale, 1) * 9cqmin);
      text-shadow: 0 2px 8px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.8);
      pointer-events: none;
      user-select: none;
    }
    .er-cell-text-label {
      display: block;
      white-space: pre-wrap;
      word-break: break-word;
      color: inherit;
    }
    .er-cell-text-label.er-tx-rainbow,
    .er-cell-text-label.er-tx-aurora {
      text-shadow: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.7));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent !important;
      -webkit-text-fill-color: transparent;
      background-size: 220% auto;
    }
    .er-cell-text-label.er-tx-rainbow {
      background-image: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #fb5607, #ff006e);
      animation: er-tx-rainbow 5s linear infinite;
    }
    .er-cell-text-label.er-tx-aurora {
      background-image: linear-gradient(90deg, #22d3ee, #a78bfa, #34d399, #60a5fa, #c084fc, #2dd4bf, #22d3ee);
      animation: er-tx-aurora 7s ease-in-out infinite;
    }
    @keyframes er-tx-rainbow {
      0% { background-position: 0% center; }
      100% { background-position: 220% center; }
    }
    @keyframes er-tx-aurora {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }
    .er-cell-text.ied-motion-float { animation: er-tx-float 2.6s ease-in-out infinite; }
    .er-cell-text.ied-motion-bounce { animation: er-tx-bounce 1.1s ease-in-out infinite; }
    .er-cell-text.ied-motion-pulse { animation: er-tx-pulse 1.4s ease-in-out infinite; }
    .er-cell-text.ied-motion-shake { animation: er-tx-shake 0.55s linear infinite; }
    @keyframes er-tx-float {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, calc(-50% - 8%)); }
    }
    @keyframes er-tx-bounce {
      0%, 100% { transform: translate(-50%, -50%); }
      40% { transform: translate(-50%, calc(-50% - 12%)); }
      60% { transform: translate(-50%, calc(-50% - 5%)); }
    }
    @keyframes er-tx-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }
    @keyframes er-tx-shake {
      0%, 100% { transform: translate(-50%, -50%) rotate(0); }
      25% { transform: translate(calc(-50% - 3%), -50%) rotate(-2deg); }
      75% { transform: translate(calc(-50% + 3%), -50%) rotate(2deg); }
    }
    .er-cell-fg.ied-motion-float { animation: er-fg-float 2.6s ease-in-out infinite; }
    .er-cell-fg.ied-motion-bounce { animation: er-fg-bounce 1.1s ease-in-out infinite; }
    .er-cell-fg.ied-motion-pulse { animation: er-fg-pulse 1.4s ease-in-out infinite; }
    .er-cell-fg.ied-motion-shake { animation: er-fg-shake 0.55s linear infinite; }
    .er-cell-gift.ied-motion-float { animation: er-gift-float 2.6s ease-in-out infinite; }
    .er-cell-gift.ied-motion-bounce { animation: er-gift-bounce 1.1s ease-in-out infinite; }
    .er-cell-gift.ied-motion-pulse { animation: er-gift-pulse 1.4s ease-in-out infinite; }
    .er-cell-gift.ied-motion-shake { animation: er-gift-shake 0.55s linear infinite; }
    @keyframes er-fg-float {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, calc(-50% - 8%)); }
    }
    @keyframes er-fg-bounce {
      0%, 100% { transform: translate(-50%, -50%); }
      40% { transform: translate(-50%, calc(-50% - 12%)); }
      60% { transform: translate(-50%, calc(-50% - 5%)); }
    }
    @keyframes er-fg-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }
    @keyframes er-fg-shake {
      0%, 100% { transform: translate(-50%, -50%) rotate(0); }
      25% { transform: translate(calc(-50% - 3%), -50%) rotate(-2deg); }
      75% { transform: translate(calc(-50% + 3%), -50%) rotate(2deg); }
    }
    @keyframes er-gift-float {
      0%, 100% { transform: var(--er-gift-t, translate(0, 0)) translateY(0); }
      50% { transform: var(--er-gift-t, translate(0, 0)) translateY(-10%); }
    }
    @keyframes er-gift-bounce {
      0%, 100% { transform: var(--er-gift-t, translate(0, 0)) translateY(0); }
      40% { transform: var(--er-gift-t, translate(0, 0)) translateY(-14%); }
      60% { transform: var(--er-gift-t, translate(0, 0)) translateY(-6%); }
    }
    @keyframes er-gift-pulse {
      0%, 100% { transform: var(--er-gift-t, translate(0, 0)) scale(1); }
      50% { transform: var(--er-gift-t, translate(0, 0)) scale(1.1); }
    }
    @keyframes er-gift-shake {
      0%, 100% { transform: var(--er-gift-t, translate(0, 0)) rotate(0); }
      25% { transform: var(--er-gift-t, translate(0, 0)) translateX(-4%) rotate(-3deg); }
      75% { transform: var(--er-gift-t, translate(0, 0)) translateX(4%) rotate(3deg); }
    }
    /* Layout libre: conservar --er-item-scale dentro de la animación */
    .er-cell-fg.is-free.ied-motion-float { animation: er-fg-free-float 2.6s ease-in-out infinite; }
    .er-cell-fg.is-free.ied-motion-bounce { animation: er-fg-free-bounce 1.1s ease-in-out infinite; }
    .er-cell-fg.is-free.ied-motion-pulse { animation: er-fg-free-pulse 1.4s ease-in-out infinite; }
    .er-cell-fg.is-free.ied-motion-shake { animation: er-fg-free-shake 0.55s linear infinite; }
    .er-cell-gift.is-free.ied-motion-float { animation: er-fg-free-float 2.6s ease-in-out infinite; }
    .er-cell-gift.is-free.ied-motion-bounce { animation: er-fg-free-bounce 1.1s ease-in-out infinite; }
    .er-cell-gift.is-free.ied-motion-pulse { animation: er-fg-free-pulse 1.4s ease-in-out infinite; }
    .er-cell-gift.is-free.ied-motion-shake { animation: er-fg-free-shake 0.55s linear infinite; }
    @keyframes er-fg-free-float {
      0%, 100% { transform: translate(-50%, -50%) scale(var(--er-item-scale, 1)); }
      50% { transform: translate(-50%, calc(-50% - 8%)) scale(var(--er-item-scale, 1)); }
    }
    @keyframes er-fg-free-bounce {
      0%, 100% { transform: translate(-50%, -50%) scale(var(--er-item-scale, 1)); }
      40% { transform: translate(-50%, calc(-50% - 12%)) scale(var(--er-item-scale, 1)); }
      60% { transform: translate(-50%, calc(-50% - 5%)) scale(var(--er-item-scale, 1)); }
    }
    @keyframes er-fg-free-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(var(--er-item-scale, 1)); }
      50% { transform: translate(-50%, -50%) scale(calc(var(--er-item-scale, 1) * 1.08)); }
    }
    @keyframes er-fg-free-shake {
      0%, 100% { transform: translate(-50%, -50%) scale(var(--er-item-scale, 1)) rotate(0); }
      25% { transform: translate(calc(-50% - 3%), -50%) scale(var(--er-item-scale, 1)) rotate(-2deg); }
      75% { transform: translate(calc(-50% + 3%), -50%) scale(var(--er-item-scale, 1)) rotate(2deg); }
    }
    .er-empty {
      color: rgba(255,255,255,.7);
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div id="root"><div class="er-empty">Esperando Editor Pro…</div></div>
  <script>
(function () {
  const FONDOS = {
    'fondo-1': '/gif/fondo-1.gif',
    'fondo-2': '/gif/fondo-2.gif',
    'fondo-3': '/gif/fondo-3.gif',
    'art-design': '/gif/' + encodeURIComponent('Art Design GIF by jorgemariozuleta.gif'),
    'art-render': '/gif/' + encodeURIComponent('Art Render GIF by time.gif'),
    'art-render-2': '/gif/' + encodeURIComponent('Art Render GIF by time (1).gif'),
    'kimburgerly': '/gif/' + encodeURIComponent('GIF by kimburgerly.gif'),
    'uniondocs': '/gif/' + encodeURIComponent('GIF by UnionDocs (1).gif'),
    'you-bilingue': '/gif/' + encodeURIComponent('GIF by YOU Bilingue.gif'),
    'gif-corto': '/gif/gif.gif',
    'loop-space': '/gif/' + encodeURIComponent('Loop Space GIF by time.gif'),
    'loop-space-2': '/gif/' + encodeURIComponent('Loop Space GIF by time (1).gif'),
    'relaxed-mood': '/gif/' + encodeURIComponent('Relaxed Mood GIF by Kaleidadope.gif'),
  };
  const MOTIONS = ['off', 'float', 'bounce', 'pulse', 'shake'];
  const TEXT_STYLES = ['solid', 'rainbow', 'aurora'];
  const params = new URLSearchParams(location.search);
  const room = String(params.get('room') || params.get('key') || 'local').trim() || 'local';
  const root = document.getElementById('root');
  let lastUpdatedAt = 0;
  let lastSig = '';
  let hasRendered = false;
  let lastPayload = null;

  function clampMotion(m) { return MOTIONS.includes(m) ? m : 'off'; }
  function motionClass(motion) {
    const m = clampMotion(motion);
    return m && m !== 'off' ? ` ied-motion-${m}` : '';
  }
  function clampTextStyle(s) { return TEXT_STYLES.includes(s) ? s : 'solid'; }
  function clampTextColor(c) {
    const s = String(c || '').trim();
    if (/^#[0-9a-fA-F]{6}$/.test(s)) return s;
    if (/^#[0-9a-fA-F]{3}$/.test(s)) return `#${s[1]}${s[1]}${s[2]}${s[2]}${s[3]}${s[3]}`;
    return '#ffffff';
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (ch) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ));
  }
  function escapeAttr(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function layoutFor(count, gridN) {
    const fixed = Math.round(Number(gridN));
    const n = Math.max(1, Math.min(64, Number(count) || 1));
    if (Number.isFinite(fixed) && fixed >= 1 && fixed <= 64) {
      return { cols: fixed, rows: Math.max(1, Math.ceil(n / fixed)) };
    }
    if (n <= 6) return { cols: n, rows: 1 };
    const cols = Math.ceil(Math.sqrt(n));
    const rows = Math.ceil(n / cols);
    return { cols, rows };
  }
  function fondoSrc(payload) {
    if (!payload) return '';
    if (payload.fondo === 'transparent') return '';
    if (payload.fondo === 'custom') return String(payload.fondoCustomSrc || '');
    return FONDOS[payload.fondo] || '';
  }
  const FRAME_PRESETS = {
    off: { kind: 'off' },
    solid: { kind: 'solid' },
    rainbow: { kind: 'anim', anim: 'flow', dur: '4s', gradient: 'linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #fb5607, #ff006e)' },
    aurora: { kind: 'anim', anim: 'pulse', dur: '6s', gradient: 'linear-gradient(90deg, #22d3ee, #a78bfa, #34d399, #60a5fa, #c084fc, #2dd4bf, #22d3ee)' },
    fire: { kind: 'anim', anim: 'flow', dur: '3.2s', gradient: 'linear-gradient(90deg, #7f1d1d, #dc2626, #f97316, #fbbf24, #ef4444, #7f1d1d)' },
    ocean: { kind: 'anim', anim: 'pulse', dur: '5.5s', gradient: 'linear-gradient(90deg, #0c4a6e, #0284c7, #22d3ee, #67e8f9, #38bdf8, #0c4a6e)' },
    neon: { kind: 'anim', anim: 'flow', dur: '3.5s', gradient: 'linear-gradient(90deg, #ff00ff, #00ffff, #39ff14, #ff00aa, #00ffff, #ff00ff)' },
    gold: { kind: 'anim', anim: 'pulse', dur: '4.5s', gradient: 'linear-gradient(90deg, #78350f, #f59e0b, #fde68a, #d97706, #fbbf24, #78350f)' },
    candy: { kind: 'anim', anim: 'flow', dur: '4s', gradient: 'linear-gradient(90deg, #db2777, #f472b6, #c084fc, #fb7185, #e879f9, #db2777)' },
    ice: { kind: 'anim', anim: 'pulse', dur: '5s', gradient: 'linear-gradient(90deg, #e0f2fe, #7dd3fc, #a5b4fc, #cffafe, #93c5fd, #e0f2fe)' },
    sunset: { kind: 'anim', anim: 'flow', dur: '4.8s', gradient: 'linear-gradient(90deg, #4c1d95, #db2777, #f97316, #fbbf24, #ec4899, #4c1d95)' },
    matrix: { kind: 'anim', anim: 'flow', dur: '3.8s', gradient: 'linear-gradient(90deg, #052e16, #16a34a, #4ade80, #86efac, #22c55e, #052e16)' },
    plasma: { kind: 'anim', anim: 'pulse', dur: '5.2s', gradient: 'linear-gradient(90deg, #581c87, #7c3aed, #06b6d4, #ec4899, #8b5cf6, #581c87)' },
    mint: { kind: 'anim', anim: 'pulse', dur: '4.6s', gradient: 'linear-gradient(90deg, #064e3b, #10b981, #6ee7b7, #99f6e4, #34d399, #064e3b)' },
  };

  function frameClassFor(mode) {
    const p = FRAME_PRESETS[mode] || FRAME_PRESETS.off;
    if (p.kind === 'off') return '';
    if (p.kind === 'solid') return ' er-frame-on er-frame-solid';
    return ' er-frame-on er-frame-anim' + (p.anim === 'pulse' ? ' er-frame-pulse' : ' er-frame-flow');
  }

  function lightSig(payload) {
    if (!payload) return '';
    const ov = (payload.overlays || []).map((o) => o?.src ? 1 : 0).join('');
    const gf = (payload.gifts || []).map((o) => o?.src ? 1 : 0).join('');
    const tx = (payload.texts || []).map((cell) => {
      const list = Array.isArray(cell) ? cell : (cell ? [cell] : []);
      return list.map((t) => t ? `${t.text}|${t.x}|${t.y}|${t.scale}|${t.style}|${t.color}` : '').join(',');
    }).join(';');
    const ovSrc = (payload.overlays || []).map((o) => o?.src || '').join('|');
    const gfSrc = (payload.gifts || []).map((o) => o?.src || '').join('|');
    const zoom = (() => {
      const n = Number(payload.zoom);
      if (!Number.isFinite(n)) return 1;
      return Math.round(Math.max(0.5, Math.min(2, n)) * 100) / 100;
    })();
    return [payload.count, payload.gap, !!payload.spreadH, !!payload.fixedCellSize, payload.gridN || 0, zoom, payload.imgScale || 1, payload.giftScale || 1, payload.giftPos || 'br', payload.frameMode || 'off', payload.frameColor || '', payload.fondo, payload.fondoCustomSrc || '', payload.motion, payload.textMotion, ov, gf, tx, ovSrc, gfSrc, (payload.freeLayout || payload.freeMove || []).map((v) => v ? 1 : 0).join(''), (payload.overlays || []).map((o) => `${o?.x || ''},${o?.y || ''},${o?.scale || ''},${o?.z || ''}`).join('|'), (payload.gifts || []).map((o) => `${o?.x || ''},${o?.y || ''},${o?.scale || ''},${o?.z || ''}`).join('|')].join('::');
  }

  function cellWidthForSpread(cols, rows, zoom) {
    const c = Math.max(1, Number(cols) || 1);
    const r = Math.max(1, Number(rows) || 1);
    const z = Number.isFinite(Number(zoom)) ? Math.max(0.5, Math.min(2, Number(zoom))) : 1;
    const vw = Math.max(320, window.innerWidth || 1920);
    const vh = Math.max(240, window.innerHeight || 1080);
    const gap = 10;
    const maxW = Math.floor((vw - gap * (c - 1) - 16) / c);
    const maxH = Math.floor((vh - gap * (r - 1) - 16) / r);
    const maxFromH = Math.floor(maxH * 16 / 10);
    const preferred = Math.min(200, Math.max(72, Math.floor(720 / c)));
    return Math.max(48, Math.min(Math.round(preferred * z), maxW, maxFromH));
  }

  const FIXED_CELL_W = 200;
  function cellWidthFixed() {
    return FIXED_CELL_W;
  }

  function render(payload) {
    if (!payload || typeof payload !== 'object') {
      if (!hasRendered) {
        root.innerHTML = '<div class="er-empty">Abre la pestaña Editor Pro en el panel</div>';
      }
      return;
    }
    const count = Math.max(1, Math.min(64, Number(payload.count) || 4));
    const gridN = Number(payload.gridN) || 0;
    const lay = layoutFor(count, gridN);
    const gap = payload.gap !== false;
    const spreadH = !!payload.spreadH;
    const fixedCellSize = !!payload.fixedCellSize;
    const zoomN = Number(payload.zoom);
    const zoom = Number.isFinite(zoomN)
      ? Math.round(Math.max(0.5, Math.min(2, zoomN)) * 100) / 100
      : 1;
    const frameMode = FRAME_PRESETS[payload.frameMode] ? payload.frameMode : 'off';
    const framePreset = FRAME_PRESETS[frameMode] || FRAME_PRESETS.off;
    const frameColor = (() => {
      const s = String(payload.frameColor || '').trim();
      if (/^#[0-9a-fA-F]{6}$/.test(s)) return s;
      if (/^#[0-9a-fA-F]{3}$/.test(s)) return `#${s[1]}${s[1]}${s[2]}${s[2]}${s[3]}${s[3]}`;
      return '#25f4ee';
    })();
    const frameCls = frameClassFor(frameMode);
    const transparent = payload.fondo === 'transparent';
    const fondo = fondoSrc(payload);
    const motion = clampMotion(payload.motion || 'off');
    const textMotion = !!payload.textMotion;
    const overlays = Array.isArray(payload.overlays) ? payload.overlays : [];
    const gifts = Array.isArray(payload.gifts) ? payload.gifts : [];
    const texts = Array.isArray(payload.texts) ? payload.texts : [];
    const freeMove = Array.isArray(payload.freeMove) ? payload.freeMove : [];
    const freeLayout = Array.isArray(payload.freeLayout) ? payload.freeLayout : [];
    const imgScaleN = Number(payload.imgScale);
    const imgScale = Number.isFinite(imgScaleN)
      ? Math.round(Math.max(0.4, Math.min(1.6, imgScaleN)) * 100) / 100
      : 1;
    const giftScaleN = Number(payload.giftScale);
    const giftScale = Number.isFinite(giftScaleN)
      ? Math.round(Math.max(0.4, Math.min(2, giftScaleN)) * 100) / 100
      : 1;
    const giftPosRaw = String(payload.giftPos || 'br').toLowerCase();
    const giftPos = /^(tl|top|tr|left|center|right|bl|bottom|br)$/.test(giftPosRaw) ? giftPosRaw : 'br';
    const mot = motionClass(motion);
    const cells = [];
    for (let i = 0; i < count; i++) {
      const ov = overlays[i];
      const gf = gifts[i];
      const free = !!(freeLayout[i] || freeMove[i]);
      const cellMot = mot;
      const rawTx = texts[i];
      const txList = Array.isArray(rawTx) ? rawTx.filter(Boolean) : (rawTx ? [rawTx] : []);
      const ox = Math.min(92, Math.max(8, Number(ov?.x) || 50));
      const oy = Math.min(92, Math.max(8, Number(ov?.y) || 50));
      const gx = Math.min(92, Math.max(8, Number(gf?.x) || 82));
      const gy = Math.min(92, Math.max(8, Number(gf?.y) || 82));
      const oScale = (() => {
        const n = Number(ov?.scale);
        return Number.isFinite(n) ? Math.max(0.35, Math.min(2.8, n)) : 1;
      })();
      const gScale = (() => {
        const n = Number(gf?.scale);
        return Number.isFinite(n) ? Math.max(0.35, Math.min(2.8, n)) : 1;
      })();
      const oZ = Math.max(1, Number(ov?.z) || 2);
      const gZ = Math.max(1, Number(gf?.z) || 4);
      const fg = ov?.src
        ? `<img class="er-cell-fg${cellMot}${free ? ' is-free' : ''}" src="${escapeAttr(ov.src)}" alt=""${free ? ` style="left:${ox}%;top:${oy}%;--er-item-scale:${oScale};z-index:${oZ}"` : ''}>`
        : '';
      const gift = gf?.src
        ? `<img class="er-cell-gift${cellMot}${free ? ' is-free' : ''}" src="${escapeAttr(gf.src)}" alt=""${free ? ` style="left:${gx}%;top:${gy}%;--er-item-scale:${gScale};z-index:${gZ}"` : ''}>`
        : '';
      const txMot = (textMotion && motion !== 'off') ? mot : '';
      const textParts = txList.map((tx) => {
        const txStyle = clampTextStyle(tx.style);
        const txColor = clampTextColor(tx.color);
        const txStyleCls = txStyle === 'rainbow' ? ' er-tx-rainbow' : (txStyle === 'aurora' ? ' er-tx-aurora' : '');
        const scale = Math.min(3, Math.max(0.4, Number(tx?.scale) || 1));
        const x = Math.min(92, Math.max(8, Number(tx?.x) || 50));
        const y = Math.min(92, Math.max(8, Number(tx?.y) || 50));
        const tz = Math.max(1, Number(tx?.z) || 3);
        return {
          z: tz,
          html: `<div class="er-cell-text${txMot}" style="left:${x}%;top:${y}%;--er-text-scale:${scale};--er-text-color:${txColor};z-index:${tz}">
            <span class="er-cell-text-label${txStyleCls}">${escapeHtml(tx.text != null ? tx.text : '')}</span>
          </div>`,
        };
      });
      const bgHtml = (!transparent && fondo)
        ? `<img class="er-cell-bg" src="${escapeAttr(fondo)}" alt="">`
        : '';
      const sorted = [];
      if (fg) sorted.push({ z: oZ, html: fg });
      textParts.forEach((p) => sorted.push(p));
      if (gift) sorted.push({ z: gZ, html: gift });
      sorted.sort((a, b) => a.z - b.z);
      cells.push(`
        <div class="er-cell${transparent ? ' is-transparent-bg' : ''}${frameCls}${free ? ' is-free-move' : ''}">
          ${bgHtml}
          ${sorted.map((p) => p.html).join('')}
        </div>
      `);
    }
    const frameStyle = [
      `--er-cols:${lay.cols}`,
      `--er-rows:${lay.rows}`,
      `--er-frame-color:${frameColor}`,
      `--er-fg-scale:${imgScale}`,
      `--er-gift-scale:${giftScale}`,
    ];
    if (fixedCellSize) frameStyle.push(`--er-cell-w:${cellWidthFixed()}px`);
    else if (spreadH) frameStyle.push(`--er-cell-w:${cellWidthForSpread(lay.cols, lay.rows, zoom)}px`);
    if (framePreset.kind === 'anim') {
      frameStyle.push(`--er-frame-grad:${framePreset.gradient}`);
      frameStyle.push(`--er-frame-anim-dur:${framePreset.dur || '4s'}`);
    }
    const gridCls = [
      gap ? '' : ' is-tight',
      spreadH ? ' is-spread' : '',
      fixedCellSize ? ' is-fixed-cells' : '',
    ].join('');
    root.innerHTML = `<div class="er-stage${spreadH ? ' is-spread' : ''}${fixedCellSize ? ' is-fixed-cells' : ''}" style="--er-live-zoom:${zoom}"><div class="er-grid${gridCls}" data-er-gift-pos="${giftPos}" style="${frameStyle.join(';')}">${cells.join('')}</div></div>`;
    hasRendered = true;
    lastPayload = payload;
  }

  function applyLive(live) {
    if (!live) return;
    const payload = live.payload || live;
    const updatedAt = Number(live.updatedAt) || 0;
    const sig = lightSig(payload);
    if (updatedAt && updatedAt === lastUpdatedAt && sig === lastSig) return;
    if (!updatedAt && sig === lastSig) return;
    lastUpdatedAt = updatedAt || lastUpdatedAt;
    lastSig = sig;
    render(payload);
  }

  let pollDelay = 400;
  let pollTimer = null;
  let wasDown = false;

  async function poll() {
    const urls = [
      `/api/editor-rapido/live?room=${encodeURIComponent(room)}&_=${Date.now()}`,
    ];
    let ok = false;
    for (const url of urls) {
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) continue;
        const j = await r.json();
        if (j?.live?.payload) {
          if (wasDown) {
            // Tras reinicio de la app: forzar redibujado aunque el sig coincida
            lastUpdatedAt = 0;
            lastSig = '';
            wasDown = false;
            pollDelay = 400;
          }
          applyLive(j.live);
          ok = true;
          break;
        }
        // Disco vacío todavía: el panel publicará enseguida; no borrar lo dibujado
        if (j?.ok) ok = true;
      } catch {}
    }
    if (!ok) {
      wasDown = true;
      pollDelay = Math.min(4000, Math.max(800, pollDelay * 1.5));
    } else if (pollDelay !== 400) {
      pollDelay = 400;
    }
    scheduleNext();
  }

  function scheduleNext() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(() => { poll().catch(() => scheduleNext()); }, pollDelay);
  }

  try {
    const bc = new BroadcastChannel('livecoins-editor-rapido');
    bc.onmessage = (ev) => {
      const msg = ev.data;
      if (!msg || msg.type !== 'er-live') return;
      if (msg.room && room !== 'local' && String(msg.room) !== String(room)) return;
      applyLive({ payload: msg.payload, updatedAt: msg.updatedAt });
    };
  } catch {}

  poll();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      pollDelay = 400;
      poll();
    }
  });
  window.addEventListener('online', () => {
    wasDown = true;
    pollDelay = 400;
    poll();
  });
  window.addEventListener('focus', () => {
    pollDelay = 400;
    poll();
  });
  let resizeT = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      if (lastPayload && lastPayload.spreadH) render(lastPayload);
    }, 120);
  });
})();
  </script>
</body>
</html>
