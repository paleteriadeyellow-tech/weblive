<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Batalla VS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Inter:wght@600;700;800&display=swap');
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 480px; height: 300px; overflow: hidden;
      background: transparent !important;
    }
    html.embed, html.embed body {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }

    .stage {
      --circle-scale: 1;
      --text-scale: 1;
      --wins-host: #ffe566;
      --wins-rival: #4da3ff;
      --pts-host: #ffe566;
      --pts-rival: #7ec8ff;
      --name-host: #ffffff;
      --name-rival: #ffffff;
      --ring-host: transparent;
      --ring-rival: transparent;
      --ring-host-on: 0;
      --ring-rival-on: 0;
      --frame-size: calc(185px * var(--circle-scale));
      /* El ancho de la columna NO sigue al círculo: números/nombre no se comprimen al achicar el aro */
      --side-w: max(185px, var(--frame-size));
      --wins-size: calc(30px * var(--text-scale));
      --pts-size: calc(24px * var(--text-scale));
      --name-size: calc(13px * var(--text-scale));
      width: 480px; height: 300px; position: relative;
      display: flex; align-items: center; justify-content: center; gap: 2px;
      transform: scale(var(--tf-fit, 1)); transform-origin: center center;
      font-family: 'Rubik', 'Inter', system-ui, sans-serif;
      padding: 4px 6px 8px;
    }

    .side {
      flex: 0 0 auto; width: var(--side-w);
      display: flex; flex-direction: column; align-items: center; gap: 1px;
    }
    .wins {
      font-weight: 900; font-size: var(--wins-size); line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 14px rgba(0,0,0,.35);
      transition: transform .15s ease;
      z-index: 3;
    }
    .wins.is-pop { animation: winpop .32s ease; }
    @keyframes winpop { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
    .side.host .wins { color: var(--wins-host); }
    .side.rival .wins { color: var(--wins-rival); }

    .frame-hero {
      position: relative;
      width: var(--frame-size);
      height: var(--frame-size);
      background: transparent !important;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.45));
      flex: 0 0 auto;
    }
    .avatar-hole {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      overflow: hidden;
      z-index: 1;
      background: transparent;
      -webkit-clip-path: circle(50% at 50% 50%);
      clip-path: circle(50% at 50% 50%);
    }
    .side.host .avatar-hole {
      left: 50%; top: 50%;
      width: 72%; height: 72%;
    }
    .side.rival .avatar-hole {
      left: 50%; top: 48.3%;
      width: 67%; height: 67%;
    }
    .avatar-hole .avatar {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center center;
      display: block; border: 0; border-radius: 50%;
    }
    .frame-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: fill; display: block;
      z-index: 2; pointer-events: none; user-select: none;
      opacity: calc(1 - (var(--ring-on, 0) * 0.92));
      transition: opacity .15s ease;
    }
    .side.host .frame-img { --ring-on: var(--ring-host-on); }
    .side.rival .frame-img { --ring-on: var(--ring-rival-on); }
    .frame-color {
      position: absolute; inset: 0;
      z-index: 3; pointer-events: none;
      opacity: var(--ring-on, 0);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      transition: opacity .15s ease;
    }
    .side.host .frame-color {
      --ring-on: var(--ring-host-on);
      background: var(--ring-host);
      -webkit-mask-image: url('/overlays/marco-vs-host.png?v=4');
      mask-image: url('/overlays/marco-vs-host.png?v=4');
    }
    .side.rival .frame-color {
      --ring-on: var(--ring-rival-on);
      background: var(--ring-rival);
      -webkit-mask-image: url('/overlays/marco-vs-rival.png?v=4');
      mask-image: url('/overlays/marco-vs-rival.png?v=4');
    }

    .name {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800; font-size: var(--name-size);
      max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 2px 0 rgba(0,0,0,.55);
      text-align: center; padding: 0 4px;
      z-index: 3;
    }
    .side.host .name { color: var(--name-host); }
    .side.rival .name { color: var(--name-rival); }

    .points {
      font-weight: 900; font-size: var(--pts-size); line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 12px rgba(255,200,60,.3);
      transition: transform .14s ease;
      z-index: 3;
    }
    .points.is-pop { animation: winpop .28s ease; }
    .side.host .points { color: var(--pts-host); }
    .side.rival .points {
      color: var(--pts-rival);
      text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 12px rgba(80,160,255,.3);
    }

    .mid {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px; width: 100px; padding-top: 8px;
    }
    .vs-badge {
      width: 110px;
      height: 74px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.45));
      pointer-events: none;
      user-select: none;
    }
    .status {
      display: none !important;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: rgba(255,255,255,.55); min-height: 12px;
    }
    .status.is-live { color: #7dffb0; }
    .status.is-frozen { color: #ffb86a; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="side host" id="side-host">
      <div class="wins" id="wins-host">0</div>
      <div class="frame-hero">
        <div class="avatar-hole"><img class="avatar" id="avatar-host" alt="" referrerpolicy="no-referrer" /></div>
        <img class="frame-img" src="/overlays/marco-vs-host.png?v=4" alt="" />
        <div class="frame-color" aria-hidden="true"></div>
      </div>
      <div class="name" id="name-host">Esperando…</div>
      <div class="points" id="points-host">0</div>
    </div>
    <div class="mid">
      <img class="vs-badge" src="/overlays/vs-badge.png?v=2" alt="VS" />
      <div class="status" id="status-label"></div>
    </div>
    <div class="side rival" id="side-rival">
      <div class="wins" id="wins-rival">0</div>
      <div class="frame-hero">
        <div class="avatar-hole"><img class="avatar" id="avatar-rival" alt="" referrerpolicy="no-referrer" /></div>
        <img class="frame-img" src="/overlays/marco-vs-rival.png?v=4" alt="" />
        <div class="frame-color" aria-hidden="true"></div>
      </div>
      <div class="name" id="name-rival">Rival</div>
      <div class="points" id="points-rival">0</div>
    </div>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    const FALLBACK = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
    const DEMO = '/jarron/lv.png';

    (function fit() {
      function apply() {
        const k = Math.min((innerWidth || 480) / 480, (innerHeight || 300) / 300) || 1;
        document.documentElement.style.setProperty('--tf-fit', k);
      }
      apply(); addEventListener('resize', apply);
      if (isEmbed) document.documentElement.classList.add('embed');
    })();

    const el = {
      stage: document.getElementById('stage'),
      winsH: document.getElementById('wins-host'),
      winsR: document.getElementById('wins-rival'),
      ptsH: document.getElementById('points-host'),
      ptsR: document.getElementById('points-rival'),
      nameH: document.getElementById('name-host'),
      nameR: document.getElementById('name-rival'),
      avH: document.getElementById('avatar-host'),
      avR: document.getElementById('avatar-rival'),
      status: document.getElementById('status-label'),
    };

    let state = {
      live: false, frozen: false,
      host: { uniqueId: '', nickname: 'Esperando…', photo: '' },
      rival: { uniqueId: '', nickname: 'Rival', photo: '' },
      pointsHost: 0, pointsRival: 0, winsHost: 0, winsRival: 0,
    };

    let cfg = {
      winsHostColor: '#ffe566',
      winsRivalColor: '#4da3ff',
      pointsHostColor: '#ffe566',
      pointsRivalColor: '#7ec8ff',
      nameHostColor: '#ffffff',
      nameRivalColor: '#ffffff',
      ringHostColor: '',
      ringRivalColor: '',
      circleScale: 100,
      textScale: 100,
    };

    function hexOk(v, fallback) {
      const s = String(v || '').trim();
      return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(s) ? s : fallback;
    }
    function applyStyle() {
      if (!el.stage) return;
      const circle = Math.max(35, Math.min(140, Number(cfg.circleScale) || 100)) / 100;
      const text = Math.max(70, Math.min(150, Number(cfg.textScale) || 100)) / 100;
      el.stage.style.setProperty('--circle-scale', String(circle));
      el.stage.style.setProperty('--text-scale', String(text));
      el.stage.style.setProperty('--wins-host', hexOk(cfg.winsHostColor, '#ffe566'));
      el.stage.style.setProperty('--wins-rival', hexOk(cfg.winsRivalColor, '#4da3ff'));
      el.stage.style.setProperty('--pts-host', hexOk(cfg.pointsHostColor, '#ffe566'));
      el.stage.style.setProperty('--pts-rival', hexOk(cfg.pointsRivalColor, '#7ec8ff'));
      el.stage.style.setProperty('--name-host', hexOk(cfg.nameHostColor, '#ffffff'));
      el.stage.style.setProperty('--name-rival', hexOk(cfg.nameRivalColor, '#ffffff'));
      const rh = String(cfg.ringHostColor || '').trim();
      const rr = String(cfg.ringRivalColor || '').trim();
      const rhOn = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(rh);
      const rrOn = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(rr);
      el.stage.style.setProperty('--ring-host', rhOn ? rh : 'transparent');
      el.stage.style.setProperty('--ring-rival', rrOn ? rr : 'transparent');
      el.stage.style.setProperty('--ring-host-on', rhOn ? '1' : '0');
      el.stage.style.setProperty('--ring-rival-on', rrOn ? '1' : '0');
    }

    function fmt(n) { return Math.max(0, Math.round(Number(n) || 0)).toLocaleString('es-ES'); }
    function setAvatar(img, url) {
      const src = String(url || '').trim() || (isEmbed ? DEMO : FALLBACK);
      img.onerror = function () { this.onerror = null; this.src = isEmbed ? DEMO : FALLBACK; };
      img.src = src;
    }
    function bump(node) {
      if (!node) return;
      node.classList.remove('is-pop');
      void node.offsetWidth;
      node.classList.add('is-pop');
    }
    function pickSide(src, fallbackNick) {
      const s = src && typeof src === 'object' ? src : {};
      return {
        uniqueId: s.uniqueId != null ? String(s.uniqueId) : '',
        nickname: (s.nickname != null && String(s.nickname).trim())
          ? String(s.nickname)
          : fallbackNick,
        photo: s.photo != null ? String(s.photo) : '',
      };
    }
    function render(prev) {
      const p = prev || {};
      el.winsH.textContent = fmt(state.winsHost);
      el.winsR.textContent = fmt(state.winsRival);
      el.ptsH.textContent = fmt(state.pointsHost);
      el.ptsR.textContent = fmt(state.pointsRival);
      el.nameH.textContent = state.host.nickname || 'Esperando…';
      el.nameR.textContent = state.rival.nickname || 'Rival';
      setAvatar(el.avH, state.host.photo);
      setAvatar(el.avR, state.rival.photo);
      if (p.pointsHost != null && Number(p.pointsHost) !== Number(state.pointsHost)) bump(el.ptsH);
      if (p.pointsRival != null && Number(p.pointsRival) !== Number(state.pointsRival)) bump(el.ptsR);
      if (p.winsHost != null && Number(p.winsHost) !== Number(state.winsHost)) bump(el.winsH);
      if (p.winsRival != null && Number(p.winsRival) !== Number(state.winsRival)) bump(el.winsR);
      el.status.classList.toggle('is-live', !!state.live);
      el.status.classList.remove('is-frozen');
      el.status.textContent = state.live ? 'EN VIVO' : '';
    }
    function applyState(payload) {
      if (!payload || typeof payload !== 'object') return;
      const prev = {
        pointsHost: state.pointsHost, pointsRival: state.pointsRival,
        winsHost: state.winsHost, winsRival: state.winsRival,
      };
      if (payload.live != null) state.live = !!payload.live;
      if (payload.frozen != null) state.frozen = !!payload.frozen;
      if (payload.host) {
        const next = pickSide(payload.host, state.host.nickname || 'Esperando…');
        if (!next.photo && state.host.photo) next.photo = state.host.photo;
        if ((!next.nickname || next.nickname === 'Esperando…') && state.host.nickname) {
          next.nickname = state.host.nickname;
        }
        if (!next.uniqueId && state.host.uniqueId) next.uniqueId = state.host.uniqueId;
        state.host = next;
      }
      if (payload.rival) {
        const next = pickSide(payload.rival, state.rival.nickname || 'Rival');
        if (!next.photo && state.rival.photo) next.photo = state.rival.photo;
        if ((!next.nickname || next.nickname === 'Rival') && state.rival.nickname && state.rival.nickname !== 'Rival') {
          next.nickname = state.rival.nickname;
        }
        if (!next.uniqueId && state.rival.uniqueId) next.uniqueId = state.rival.uniqueId;
        if (payload.rival.photo) next.photo = String(payload.rival.photo);
        if (payload.rival.nickname && String(payload.rival.nickname).trim() && String(payload.rival.nickname) !== 'Rival') {
          next.nickname = String(payload.rival.nickname);
        }
        if (payload.rival.uniqueId && String(payload.rival.uniqueId) !== 'rival_demo') {
          if (state.rival.uniqueId === 'rival_demo' || state.rival.uniqueId === 'rival') {
            next.photo = payload.rival.photo ? String(payload.rival.photo) : (next.photo || '');
            if (payload.rival.nickname) next.nickname = String(payload.rival.nickname);
          }
        }
        state.rival = next;
      }
      if (payload.pointsHost != null) state.pointsHost = Number(payload.pointsHost) || 0;
      if (payload.pointsRival != null) state.pointsRival = Number(payload.pointsRival) || 0;
      if (payload.winsHost != null) state.winsHost = Number(payload.winsHost) || 0;
      if (payload.winsRival != null) state.winsRival = Number(payload.winsRival) || 0;
      render(prev);
    }
    function resetLocal() {
      applyState({
        live: false, frozen: false,
        host: { uniqueId: '', nickname: 'Esperando…', photo: '' },
        rival: { uniqueId: '', nickname: 'Rival', photo: '' },
        pointsHost: 0, pointsRival: 0, winsHost: 0, winsRival: 0,
      });
    }
    function demo() {
      applyState({
        live: true, frozen: false,
        host: { uniqueId: 'host', nickname: 'GABY 🏆', photo: DEMO },
        rival: { uniqueId: 'rival', nickname: 'Vianel 🔸', photo: DEMO },
        pointsHost: 210, pointsRival: 57, winsHost: 0, winsRival: 0,
      });
    }
    function startLocal() {
      const hostOk = !!(state.host.uniqueId || (state.host.nickname && state.host.nickname !== 'Esperando…'));
      const rivalOk = !!(state.rival.uniqueId || (state.rival.nickname && state.rival.nickname !== 'Rival'));
      applyState({
        live: true,
        frozen: false,
        host: hostOk ? state.host : { uniqueId: 'host', nickname: 'Tú', photo: DEMO },
        rival: rivalOk ? state.rival : { uniqueId: '', nickname: 'Rival', photo: '' },
        pointsHost: 0,
        pointsRival: 0,
        winsHost: state.winsHost,
        winsRival: state.winsRival,
      });
    }
    function stopLocal() {
      state.frozen = true;
      render();
    }

    let ws, reconnectTimer;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
      ws.onopen = () => clearTimeout(reconnectTimer);
      ws.onclose = () => { reconnectTimer = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        const { type, payload } = msg;
        if (type === 'pkBattle') applyState(payload);
        else if (type === 'pkBattleReset') resetLocal();
        else if (type === 'pkBattleTest') demo();
        else if (type === 'settings' && payload && payload.batallaVs) {
          cfg = Object.assign(cfg, payload.batallaVs);
          applyStyle();
        }
        else if (type === 'state' && payload && !state.host.photo) {
          if (payload.photo || payload.nickname) {
            state.host.photo = payload.photo || state.host.photo;
            state.host.nickname = payload.nickname || state.host.nickname;
            state.host.uniqueId = payload.username || state.host.uniqueId;
            render();
          }
        }
      };
    }
    connectWS();
    applyStyle();
    render();

    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.kind !== 'batallaVs') return;
      if (d.type === 'test') demo();
      else if (d.type === 'reset') resetLocal();
      else if (d.type === 'start') startLocal();
      else if (d.type === 'stop') stopLocal();
      else if (d.type === 'config' && d.config) {
        cfg = Object.assign(cfg, d.config);
        applyStyle();
      } else if (d.type === 'config' && d.payload) {
        applyState(Object.assign({}, state, d.payload));
      }
    });
  })();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
