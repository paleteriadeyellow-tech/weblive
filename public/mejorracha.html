<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch7"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Mejor racha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Fredoka:wght@600;700&family=Inter:wght@700;800;900&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800;900&family=Titan+One&display=swap" rel="stylesheet">
  <style>
    :root { box-sizing: border-box; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
    body { display: flex; align-items: center; justify-content: center; font-family: var(--tf-font-stack, 'Lilita One', cursive); }

    .wrap {
      position: relative;
      --title-color: #ffffff;
      --name-color: #eef0ff;
      --value-color: #ffe45c;
      --name-stroke: #1b2150;
      --value-stroke: #5e2a00;
      --tf-font-stack: 'Lilita One', cursive;
      --title-scale: 1; --title-y: 0px;
      --body-scale: 1; --body-y: 0px;
      --gift-z: 2; --text-z: 5;
    }
    .wrap--hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    #scaler {
      position: relative; z-index: 1; width: 520px; height: 490px; flex: none;
      transform-origin: center center; transform: scale(var(--fit, 1));
    }
    .stage {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .stage.is-enter { animation: enter .95s cubic-bezier(.2, 1.4, .4, 1) both; }
    @keyframes enter {
      from { opacity: 0; transform: scale(.55) translateY(40px); }
      to { opacity: 1; transform: none; }
    }

    .hero {
      position: relative; z-index: var(--gift-z);
      width: 190px; height: 190px; margin: 16px 0 10px;
      animation: sway 3.2s ease-in-out infinite;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-4deg) translateY(0) scale(1); }
      50% { transform: rotate(4deg) translateY(-10px) scale(1.06); }
    }

    .glow { position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
    .aura {
      width: 560px; height: 560px; filter: blur(16px); animation: breathe 4.5s ease-in-out infinite;
      background: radial-gradient(circle, rgba(255,255,255,.60) 0, rgba(255,226,140,.50) 9%, rgba(255,110,60,.34) 20%, rgba(255,60,150,.32) 34%, rgba(120,70,255,.26) 50%, rgba(40,120,255,.10) 62%, transparent 72%);
    }
    .core {
      width: 250px; height: 250px; filter: blur(8px); animation: breathe 2.8s ease-in-out infinite reverse;
      background: radial-gradient(circle, rgba(255,255,255,.75), rgba(255,230,160,.35) 40%, transparent 70%);
    }
    .beams {
      width: 600px; height: 600px; filter: blur(3px); animation: spinC 28s linear infinite;
      background: repeating-conic-gradient(from 0deg, rgba(255,236,190,.34) 0 3deg, transparent 3deg 14deg);
      -webkit-mask: radial-gradient(circle, #000 6%, transparent 68%);
      mask: radial-gradient(circle, #000 6%, transparent 68%);
    }
    .beams.b2 {
      width: 640px; height: 640px; filter: blur(5px); animation: spinC 42s linear infinite reverse;
      background: repeating-conic-gradient(from 8deg, rgba(130,200,255,.26) 0 6deg, transparent 6deg 29deg);
      -webkit-mask: radial-gradient(circle, #000 4%, transparent 64%);
      mask: radial-gradient(circle, #000 4%, transparent 64%);
    }
    .streak {
      width: 600px; height: 30px; border-radius: 50%; filter: blur(5px); animation: streak 2.4s ease-in-out infinite;
      background: radial-gradient(ellipse at center, rgba(255,255,255,.95) 0, rgba(255,210,140,.55) 22%, rgba(255,90,170,.25) 48%, transparent 72%);
    }
    .streak.s2 {
      width: 420px; height: 14px; filter: blur(3px); opacity: .8;
      animation: streakV 2.4s ease-in-out infinite -1.2s;
    }
    .rim {
      width: 196px; height: 196px; animation: rim 3s ease-in-out infinite;
      box-shadow: 0 0 28px 6px rgba(255,100,170,.55), 0 0 70px 18px rgba(130,80,255,.42), 0 0 130px 36px rgba(60,140,255,.22), inset 0 0 34px rgba(255,205,120,.30);
    }
    .bk {
      position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; filter: blur(1px);
      animation: drift 5s ease-in infinite;
      background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,205,135,.40) 45%, transparent 70%);
    }
    @keyframes spinC { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .9; }
      50% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
    }
    @keyframes streak {
      0%, 100% { transform: translate(-50%, -50%) scaleX(.72); opacity: .55; }
      50% { transform: translate(-50%, -50%) scaleX(1.08); opacity: 1; }
    }
    @keyframes streakV {
      0%, 100% { transform: translate(-50%, -50%) rotate(90deg) scaleX(.72); opacity: .55; }
      50% { transform: translate(-50%, -50%) rotate(90deg) scaleX(1.08); opacity: 1; }
    }
    @keyframes rim {
      0%, 100% { opacity: .75; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }
    @keyframes drift {
      0% { opacity: 0; transform: translateY(24px) scale(.5); }
      30% { opacity: .95; }
      100% { opacity: 0; transform: translateY(-110px) scale(1.15); }
    }
    @keyframes rot { to { transform: rotate(360deg); } }

    .ring { position: absolute; inset: 0; overflow: visible; animation: rot 8s linear infinite; }
    .ring .track {
      fill: none; stroke: url(#rg); stroke-width: 7; stroke-linecap: round;
      filter: drop-shadow(0 0 7px rgba(255,80,160,.9));
    }
    .ring .dots { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 2; stroke-dasharray: 1 12; stroke-linecap: round; }

    .icon-box {
      position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px;
      display: grid; place-items: center; animation: bob 1.8s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(-6deg); }
    }
    .icon {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.5)) drop-shadow(0 0 18px rgba(255,80,150,.55));
    }
    .em { display: none; font-size: 96px; filter: drop-shadow(0 10px 14px rgba(0,0,0,.5)); }
    .icon-box.pop .icon, .icon-box.pop .em { animation: pop .65s cubic-bezier(.2, 1.7, .4, 1); }
    @keyframes pop {
      0% { transform: scale(.7) rotate(-16deg); }
      55% { transform: scale(1.28) rotate(7deg); }
      100% { transform: none; }
    }
    .floor {
      position: absolute; left: 50%; bottom: -8px; width: 110px; height: 16px; margin-left: -55px;
      border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.5), transparent 70%);
      animation: floor 3s ease-in-out infinite;
    }
    @keyframes floor { 50% { transform: scale(.8); opacity: .6; } }
    .spark {
      position: absolute; pointer-events: none; animation: twinkle 2.6s ease-in-out infinite;
      filter: drop-shadow(0 0 6px #fff);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(.2) rotate(0); }
      50% { opacity: 1; transform: scale(1) rotate(90deg); }
    }

    .donor {
      position: absolute; right: -44px; bottom: -14px; width: 96px; height: 96px; z-index: 3;
      animation: bob 2.2s ease-in-out infinite reverse;
    }
    .donor::before {
      content: ""; position: absolute; inset: -6px; border-radius: 50%;
      background: conic-gradient(#ffb23f, #ff3d8b, #a855ff, #4f8cff, #19e3c1, #ffb23f);
      animation: rot 3s linear infinite; box-shadow: 0 0 24px rgba(255,61,139,.7);
    }
    .donor .pic, .donor .ini {
      position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%;
      border: 5px solid #12072a; background: linear-gradient(135deg, #ff3d8b, #6a3df0);
    }
    .donor .pic { object-fit: cover; }
    .donor .ini {
      display: none; place-items: center;
      font: 400 46px var(--tf-font-stack, 'Lilita One', cursive); color: #fff;
    }
    .crown {
      position: absolute; top: -50px; left: 50%; width: 76px; margin-left: -38px;
      z-index: 4;
      filter: drop-shadow(0 5px 6px rgba(0,0,0,.6)) drop-shadow(0 0 12px rgba(255,200,60,.75));
      animation: crown 1.6s ease-in-out infinite;
    }
    .crown svg { display: block; width: 100%; height: auto; overflow: visible; }
    .crown .sh { animation: cshine 2.2s ease-in-out infinite; }
    @keyframes cshine { 0%, 45% { transform: translateX(-70px); } 100% { transform: translateX(150px); } }
    @keyframes crown {
      0%, 100% { transform: translateY(0) rotate(12deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .t {
      position: relative; display: inline-block; line-height: 1; white-space: nowrap; text-align: center;
      font-family: var(--tf-font-stack, 'Lilita One', cursive); z-index: var(--text-z);
    }
    .t::before {
      content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%;
      color: var(--sc); -webkit-text-stroke: var(--sw) var(--sc); text-shadow: var(--ext);
    }
    .t > span {
      position: relative; color: transparent;
      -webkit-background-clip: text; background-clip: text; background-repeat: no-repeat;
    }

    .title {
      font-size: calc(54px * var(--title-scale)); letter-spacing: 2px;
      --sc: #2b0d44; --sw: 11px;
      --ext: 0 3px 0 #3d1260, 0 6px 0 #34104f, 0 9px 0 #2b0d44, 0 14px 18px rgba(0,0,0,.55);
      filter: drop-shadow(0 0 16px rgba(255,70,150,.55));
      animation: floatY 2.4s ease-in-out infinite;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(var(--title-y)); }
      50% { transform: translateY(calc(var(--title-y) - 10px)); }
    }
    .title > span {
      background-image:
        linear-gradient(105deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%),
        linear-gradient(180deg, rgba(255,255,255,.35) 0%, transparent 46%),
        linear-gradient(90deg, #b6ff2e 0%, #19e3c1 22%, #4f8cff 42%, #a855ff 60%, #ff3d8b 80%, #ffb23f 100%);
      background-size: 260% 100%, 100% 100%, 100% 100%;
      animation: shineT 2.8s ease-in-out infinite;
    }
    .title.title--solid > span {
      background-image: none;
      color: var(--title-color);
      -webkit-text-fill-color: var(--title-color);
      animation: none;
    }
    @keyframes shineT {
      0% { background-position: 0% 0, 0 0, 0 0; }
      55%, 100% { background-position: 100% 0, 0 0, 0 0; }
    }

    .name {
      margin-top: 12px; font-size: calc(74px * var(--body-scale)); letter-spacing: 1px;
      --sc: var(--name-stroke); --sw: 14px;
      --ext: 0 4px 0 color-mix(in srgb, var(--name-stroke) 80%, #2d3677), 0 8px 0 color-mix(in srgb, var(--name-stroke) 70%, #232a5e), 0 12px 0 var(--name-stroke), 0 18px 22px rgba(0,0,0,.55);
      filter: drop-shadow(0 0 22px rgba(120,150,255,.5));
      max-width: 470px;
      animation: floatBody 2.8s ease-in-out infinite .2s;
    }
    .name > span {
      background-image:
        linear-gradient(105deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%),
        linear-gradient(180deg, #ffffff 0%, #eef0ff 45%, #b9c2f2 52%, #e4e8ff 100%);
      background-size: 260% 100%, 100% 100%;
      animation: shineC 2.6s ease-in-out infinite .4s;
    }
    .count {
      margin-top: 14px; font-size: calc(50px * var(--body-scale)); letter-spacing: 3px;
      --sc: var(--value-stroke); --sw: 11px;
      --ext: 0 3px 0 color-mix(in srgb, var(--value-stroke) 80%, #7a3a00), 0 6px 0 color-mix(in srgb, var(--value-stroke) 70%, #6a3000), 0 9px 0 var(--value-stroke), 0 14px 18px rgba(0,0,0,.55);
      filter: drop-shadow(0 0 22px rgba(255,190,40,.6));
      animation: floatBody 2.8s ease-in-out infinite .45s;
    }
    .count > span {
      background-image:
        linear-gradient(105deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%),
        linear-gradient(180deg, #fffbd2 0%, #ffe45c 30%, #ffc400 49%, #ff9500 51%, #ffc928 78%, #ffb000 100%);
      background-size: 260% 100%, 100% 100%;
      animation: shineC 2.6s ease-in-out infinite .8s;
    }
    @keyframes floatBody {
      0%, 100% { transform: translateY(var(--body-y)); }
      50% { transform: translateY(calc(var(--body-y) - 8px)); }
    }
    @keyframes shineC {
      0% { background-position: 0% 0, 0 0; }
      55%, 100% { background-position: 100% 0, 0 0; }
    }
    .bump { animation: bump .55s cubic-bezier(.2, 1.9, .4, 1); }
    @keyframes bump {
      0%, 100% { transform: translateY(var(--body-y)) scale(1) rotate(0); }
      40% { transform: translateY(var(--body-y)) scale(1.18) rotate(-2deg); }
    }
    .gift-tag {
      position: relative; z-index: var(--text-z); margin-top: 6px; max-width: 470px;
      font: 700 calc(18px * var(--body-scale)) var(--tf-font-stack, 'Lilita One', cursive);
      color: rgba(255,255,255,.62); text-align: center; letter-spacing: .04em;
      text-shadow: 0 2px 8px rgba(0,0,0,.45);
      animation: floatBody 2.8s ease-in-out infinite .6s;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="wrap wrap--hidden" id="root">
    <div id="scaler">
      <div class="stage" id="stage">
        <div class="t title" id="el-title" data-text="MEJOR RACHA"><span id="titleS">MEJOR RACHA</span></div>

        <div class="hero" id="hero">
          <div class="glow aura"></div>
          <div class="glow beams"></div>
          <div class="glow beams b2"></div>
          <div class="glow core"></div>
          <div class="glow streak"></div>
          <div class="glow streak s2"></div>
          <div class="glow rim"></div>
          <svg class="ring" viewBox="0 0 190 190" width="190" height="190" aria-hidden="true">
            <defs>
              <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff9f43"/><stop offset=".35" stop-color="#ff3d8b"/>
                <stop offset=".7" stop-color="#4f8cff"/><stop offset="1" stop-color="#19e3c1"/>
              </linearGradient>
            </defs>
            <circle class="dots" cx="95" cy="95" r="93"/>
            <circle class="track" cx="95" cy="95" r="86"/>
          </svg>
          <div class="floor"></div>
          <div class="icon-box" id="iconBox">
            <img class="icon" id="gift-img" alt="" referrerpolicy="no-referrer">
            <span class="em" id="gift-ph">🎁</span>
          </div>
          <div class="donor">
            <span class="crown" aria-hidden="true"><svg viewBox="0 0 100 80">
              <defs>
                <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6b8"/><stop offset=".35" stop-color="#ffd23f"/><stop offset=".7" stop-color="#ff9d00"/><stop offset="1" stop-color="#c26200"/></linearGradient>
                <linearGradient id="cg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb000" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></linearGradient>
                <radialGradient id="jr" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffd0d9"/><stop offset=".35" stop-color="#ff2f5e"/><stop offset="1" stop-color="#8a0627"/></radialGradient>
                <radialGradient id="jb" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#d4ecff"/><stop offset=".35" stop-color="#3f8cff"/><stop offset="1" stop-color="#0d2f9a"/></radialGradient>
                <radialGradient id="jg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#d8ffee"/><stop offset=".35" stop-color="#19e3a1"/><stop offset="1" stop-color="#05724f"/></radialGradient>
                <clipPath id="cc"><path d="M9 64 L3 22 L30 42 L50 8 L70 42 L97 22 L91 64 Z"/></clipPath>
              </defs>
              <path d="M9 64 L3 22 L30 42 L50 8 L70 42 L97 22 L91 64 Z" fill="url(#cg)" stroke="#7a3a00" stroke-width="3.5" stroke-linejoin="round"/>
              <path d="M50 8 L30 42 L9 64 L24 64 L42 34 Z" fill="#fff" opacity=".22"/>
              <path d="M50 14 L50 62" stroke="#a85200" stroke-width="2" opacity=".35"/>
              <g clip-path="url(#cc)"><rect class="sh" x="0" y="0" width="26" height="80" fill="url(#cg2)" transform="skewX(-20)"/></g>
              <rect x="7" y="60" width="86" height="16" rx="6" fill="url(#cg)" stroke="#7a3a00" stroke-width="3.5"/>
              <rect x="11" y="62.5" width="78" height="4" rx="2" fill="#fff" opacity=".45"/>
              <circle cx="3" cy="20" r="6.5" fill="url(#cg)" stroke="#7a3a00" stroke-width="3"/><circle cx="1.5" cy="18" r="1.8" fill="#fff"/>
              <circle cx="50" cy="7" r="7.5" fill="url(#cg)" stroke="#7a3a00" stroke-width="3"/><circle cx="48" cy="5" r="2.2" fill="#fff"/>
              <circle cx="97" cy="20" r="6.5" fill="url(#cg)" stroke="#7a3a00" stroke-width="3"/><circle cx="95.5" cy="18" r="1.8" fill="#fff"/>
              <circle cx="50" cy="68" r="6" fill="url(#jr)" stroke="#5a0418" stroke-width="1.6"/><circle cx="48" cy="66" r="1.8" fill="#fff" opacity=".9"/>
              <circle cx="28" cy="68" r="4.4" fill="url(#jb)" stroke="#0a1f66" stroke-width="1.4"/><circle cx="26.7" cy="66.6" r="1.3" fill="#fff" opacity=".9"/>
              <circle cx="72" cy="68" r="4.4" fill="url(#jg)" stroke="#04452f" stroke-width="1.4"/><circle cx="70.7" cy="66.6" r="1.3" fill="#fff" opacity=".9"/>
            </svg></span>
            <img class="pic" id="pic" alt="" referrerpolicy="no-referrer">
            <div class="ini" id="ini"></div>
          </div>
        </div>

        <div class="t name" id="el-name" data-text=""><span id="nameS"></span></div>
        <div class="t count" id="el-value" data-text=""><span id="valueS"></span></div>
        <div class="gift-tag" id="el-gift"></div>
      </div>
    </div>
  </div>

  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const isEmbed = params.get('embed') === '1';
  const FONTS = {
    luckiest: "'Luckiest Guy', system-ui, sans-serif",
    bangers: "'Bangers', system-ui, sans-serif",
    lilita: "'Lilita One', cursive",
    titan: "'Titan One', system-ui, sans-serif",
    fredoka: "'Fredoka', system-ui, sans-serif",
    bungee: "'Bungee', system-ui, sans-serif",
    rubik: "'Rubik', system-ui, sans-serif",
    oswald: "'Oswald', system-ui, sans-serif",
    bebas: "'Bebas Neue', Impact, sans-serif",
    montserrat: "'Montserrat', system-ui, sans-serif",
    poppins: "'Poppins', system-ui, sans-serif",
    orbitron: "'Orbitron', system-ui, sans-serif",
    inter: "'Inter', system-ui, sans-serif",
    system: "system-ui, sans-serif",
  };
  let cfg = {
    title: 'MEJOR RACHA', titleRainbow: true, titleColor: '#ffffff',
    nameColor: '#e4e4ee', valueColor: '#e8c4a0',
    nameStroke: '#1b2150', valueStroke: '#5e2a00',
    font: 'lilita',
    titleScale: 100, titleY: 0, bodyScale: 100, bodyY: 0, textLayer: 'front',
  };
  let best = { streak: 0, nickname: '', giftName: '', image: '', photo: '' };

  const $ = (id) => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  function setOutlined(elId, spanId, text) {
    const el = $(elId); const sp = $(spanId); if (!el || !sp) return;
    el.dataset.text = text; sp.textContent = text;
  }
  function fitName() {
    const el = $('el-name'); if (!el) return;
    let s = Math.round(74 * (Math.max(50, Math.min(180, Number(cfg.bodyScale) || 100)) / 100));
    el.style.fontSize = s + 'px';
    while (el.offsetWidth > 470 && s > 26) { s -= 2; el.style.fontSize = s + 'px'; }
  }
  function popGift() {
    const b = $('iconBox'); if (!b) return;
    b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  }
  function playEnter() {
    const st = $('stage'); if (!st) return;
    st.classList.remove('is-enter'); void st.offsetWidth; st.classList.add('is-enter');
  }
  function bumpText(ids) {
    (ids || ['el-name', 'el-value']).forEach((id) => {
      const c = $(id); if (!c) return;
      c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
    });
  }
  function setAvatar(name, photo) {
    const pic = $('pic'), ini = $('ini'); if (!pic || !ini) return;
    const clean = String(name || 'U').replace(/^@+/, '');
    ini.textContent = (clean.charAt(0) || 'U').toUpperCase();
    const url = String(photo || '').trim();
    pic.style.display = 'block'; ini.style.display = 'none';
    pic.onerror = () => { pic.style.display = 'none'; ini.style.display = 'grid'; };
    if (url) pic.src = url; else pic.onerror();
  }
  function applyStyleBase(defaultTitle) {
    const root = $('root');
    root.style.setProperty('--tf-font-stack', FONTS[cfg.font] || FONTS.lilita);
    root.style.setProperty('--title-color', cfg.titleColor || '#ffffff');
    root.style.setProperty('--name-color', cfg.nameColor || '#eef0ff');
    root.style.setProperty('--value-color', cfg.valueColor || '#ffe45c');
    root.style.setProperty('--name-stroke', cfg.nameStroke || '#1b2150');
    root.style.setProperty('--value-stroke', cfg.valueStroke || '#5e2a00');
    const titleScale = Math.max(50, Math.min(180, Number(cfg.titleScale ?? cfg.textScale) || 100)) / 100;
    const bodyScale = Math.max(50, Math.min(180, Number(cfg.bodyScale ?? cfg.textScale) || 100)) / 100;
    const titleY = Math.max(-80, Math.min(80, Number(cfg.titleY ?? cfg.textY) || 0));
    const bodyY = Math.max(-80, Math.min(80, Number(cfg.bodyY ?? cfg.textY) || 0));
    root.style.setProperty('--title-scale', String(titleScale));
    root.style.setProperty('--body-scale', String(bodyScale));
    root.style.setProperty('--title-y', titleY + 'px');
    root.style.setProperty('--body-y', bodyY + 'px');
    const behind = String(cfg.textLayer || 'front') === 'behind';
    root.style.setProperty('--gift-z', behind ? '8' : '2');
    root.style.setProperty('--text-z', behind ? '1' : '5');
    const title = String(cfg.title || defaultTitle);
    setOutlined('el-title', 'titleS', title);
    $('el-title').classList.toggle('title--solid', !cfg.titleRainbow);
  }
  function setGiftImage(url) {
    const img = $('gift-img'), ph = $('gift-ph');
    img.style.display = 'block'; ph.style.display = 'none';
    img.onerror = () => { img.style.display = 'none'; ph.style.display = 'block'; };
    if (url) img.src = url; else img.onerror();
  }
  function initFx() {
    const hero = $('hero');
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.random() * .6;
      const r = 88 + Math.random() * 34; const sz = 12 + Math.random() * 16;
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('viewBox', '0 0 24 24'); s.classList.add('spark');
      s.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (95 + Math.cos(a) * r - sz / 2) + 'px;top:' + (95 + Math.sin(a) * r - sz / 2) + 'px;animation-delay:' + (Math.random() * 2.6).toFixed(2) + 's';
      s.innerHTML = '<path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z" fill="#fff"/>';
      hero.appendChild(s);
    }
    for (let i = 0; i < 10; i++) {
      const b = document.createElement('i'); const sz = rnd(6, 18);
      b.className = 'bk';
      b.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + rnd(-90, 280) + 'px;top:' + rnd(30, 230) + 'px;animation-delay:' + rnd(0, 5).toFixed(2) + 's;animation-duration:' + rnd(4, 7).toFixed(2) + 's';
      hero.appendChild(b);
    }
    function fit() { document.documentElement.style.setProperty('--fit', String(Math.min(innerWidth / 520, innerHeight / 490, 2.2))); }
    addEventListener('resize', fit); fit();
  }

  function applyStyle() { applyStyleBase('MEJOR RACHA'); }
  function applyUI(opts) {
    const animate = !!(opts && opts.animate);
    const root = $('root');
    const has = best.streak > 0;
    const wasHidden = root.classList.contains('wrap--hidden');
    root.classList.toggle('wrap--hidden', !has);
    if (!has) return;
    const name = String(best.nickname || 'Usuario').replace(/^@+/, '');
    setOutlined('el-name', 'nameS', name);
    fitName();
    setOutlined('el-value', 'valueS', '× ' + String(best.streak));
    const gn = String(best.giftName || '').replace(/_/g, ' ');
    const tag = $('el-gift');
    if (tag) { tag.textContent = gn || ''; tag.style.display = gn ? '' : 'none'; }
    setAvatar(name, best.photo);
    setGiftImage(String(best.image || '').trim());
    if (animate || wasHidden) {
      if (wasHidden) playEnter();
      bumpText(['el-name', 'el-value']);
      popGift();
    }
  }
  function considerGift(d) {
    if (d && d.streak) return;
    const rc = Math.max(0, parseInt(d.repeatCount, 10) || 0);
    if (rc <= 0 || rc <= best.streak) return;
    best = {
      streak: rc,
      nickname: d.nickname || d.uniqueId || 'Usuario',
      giftName: d.giftName || '',
      image: d.image || '',
      photo: d.photo || d.profilePictureUrl || '',
    };
    applyUI({ animate: true });
  }
  function runTest(gift) {
    const g = gift || {};
    const streak = 5 + Math.floor(Math.random() * 146);
    best = {
      streak, nickname: 'PreviewFan', giftName: g.name || 'Rose', image: g.image || '',
      photo: g.photo || 'https://api.dicebear.com/7.x/bottts/svg?seed=PreviewFan',
    };
    applyUI({ animate: true });
  }
  function resetBest() { best = { streak: 0, nickname: '', giftName: '', image: '', photo: '' }; applyUI(); }
  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'gift') { if (!isEmbed) considerGift(m.payload); }
      else if (m.type === 'settings') { if (m.payload && m.payload.topStreak) { cfg = Object.assign(cfg, m.payload.topStreak); applyStyle(); applyUI(); } }
      else if (m.type === 'topStreakTest') { if (!isEmbed) runTest(m.payload && m.payload.gift); }
      else if (m.type === 'topStreakReset') { if (!isEmbed) resetBest(); }
      else if (m.type === 'sessionOverlays') {
        if (!isEmbed && m.payload && m.payload.topStreak && m.payload.topStreak.streak > 0) {
          const ts = m.payload.topStreak;
          best = { streak: ts.streak, nickname: ts.nickname, giftName: ts.giftName || '', image: ts.image || '', photo: ts.photo || '' };
          applyUI();
        }
      }
    };
  }
  window.addEventListener('message', (e) => {
    const d = e.data; if (!d || d.kind !== 'topstreak') return;
    if (d.type === 'config') { cfg = Object.assign(cfg, d.config); applyStyle(); applyUI(); }
    else if (d.type === 'test') runTest(d.gift);
    else if (d.type === 'reset') { isEmbed ? runTest() : resetBest(); }
  });
  initFx();
  applyStyle();
  if (isEmbed) runTest(); else applyUI();
  connectWS();
})();
  </script>
  <script src="/js/overlay-idle.js?v=oi1"></script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
