<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch7"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Meta Heart Me</title>
  <link id="heart-font-link" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
      font-family: var(--heart-font, 'Bangers', Impact, sans-serif);
    }
    .title, .pill .num { font-family: var(--heart-font, 'Bangers', Impact, sans-serif); }
    html { --tf-fit: 0.01; }
    body.preview-bg { background: radial-gradient(circle at 50% 40%, #2a2030, #0e0c12 70%) !important; }

    .stage {
      width: 420px; height: 500px; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(var(--tf-fit, 0.01)); transform-origin: center center;
      opacity: 0; text-align: center; color: #fff;
    }
    html.tf-ready .stage { opacity: 1; }

    .title {
      font-size: 40px; letter-spacing: 2px; line-height: 1;
      transform: skew(-4deg) rotate(-1.5deg);
      -webkit-text-stroke: 1.5px #7a0c3d; paint-order: stroke fill;
      text-shadow: 0 3px 0 #d81b6a, 0 6px 0 #7a0c3d, 0 10px 14px rgba(0,0,0,.6), 0 0 22px rgba(255,80,160,.5);
    }
    /* Crossfade entre skins (evita corte display:none → flash a la anterior) */
    .skin-panel {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .28s ease, visibility 0s linear .28s;
      z-index: 0;
    }
    .skin-panel.is-on {
      opacity: 1; visibility: visible; pointer-events: auto;
      transition: opacity .28s ease, visibility 0s;
      z-index: 1;
    }
    .figure { position: relative; width: 380px; height: 360px; margin: 4px auto 0; display: grid; place-items: center; }
    .heart-stage { position: relative; width: 300px; height: 290px; margin: 0; }
    .halo {
      position: absolute; left: 50%; top: 48%; width: 260px; height: 260px; margin: -130px 0 0 -130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,60,140,.22), rgba(255,60,140,0) 68%);
      animation: halo 2.8s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes halo { 50% { transform: scale(1.12); opacity: .7; } }
    #svg, #svg-h, .skin-svg {
      position: relative; width: 100%; height: 100%; overflow: visible;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.35));
    }
    .bump { animation: bump .6s cubic-bezier(.3,1.6,.5,1); }
    @keyframes bump {
      30% { transform: scale(1.08, .94); }
      60% { transform: scale(.97, 1.04); }
    }
    /* Nivel del agua: atributo SVG transform (animado por rAF en JS). */
    .water { transition: none; }
    .wv1 { animation: wv 3.2s linear infinite; }
    .wv2 { animation: wv 5s linear infinite reverse; }
    @keyframes wv { to { transform: translateX(-60px); } }
    .bub { animation: rise 3.4s ease-in infinite; }
    @keyframes rise {
      0% { transform: translateY(0) scale(.6); opacity: 0; }
      15% { opacity: .85; }
      100% { transform: translateY(-55px) scale(1.1); opacity: 0; }
    }
    .spark { animation: tw 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes tw { 50% { transform: scale(.4) rotate(35deg); opacity: .45; } }
    .crown { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    .eye { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    .shine { animation: shine 3.5s ease-in-out infinite; }
    @keyframes shine { 50% { opacity: .55; } }
    .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    .fx i {
      position: absolute; font-style: normal; font-size: 20px; color: #ff5fa3;
      text-shadow: 0 0 8px #ff2d85; animation: fly 1.4s ease-out forwards;
    }
    @keyframes fly {
      to { transform: translate(var(--x), -130px) scale(.4) rotate(var(--r)); opacity: 0; }
    }
    .pill {
      display: inline-flex; align-items: center; gap: 12px; height: 40px;
      padding: 0 20px 0 0; border-radius: 22px; margin-top: -6px; position: relative; overflow: hidden;
      background: linear-gradient(#1c0f17, #0b0508); border: 2px solid #ffcf4a;
      box-shadow: 0 0 0 2px #7a4a00, 0 6px 16px rgba(0,0,0,.6), 0 0 20px rgba(255,60,140,.45), inset 0 2px 6px rgba(255,255,255,.12);
    }
    .pill .bar {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      transition: width .28s cubic-bezier(.2,.9,.3,1);
      background: linear-gradient(#ff6aa8, #c4124f);
    }
    .pill .bar:after {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 45%;
      background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,0));
    }
    .pill .ic {
      position: relative; width: 44px; height: 40px; display: grid; place-items: center;
      flex: 0 0 44px; z-index: 1;
    }
    .pill .ic-ring {
      width: 40px; height: 40px;
      background: transparent; border: 0; box-shadow: none;
      display: grid; place-items: center; overflow: visible;
    }
    .pill .ic-gift {
      width: 38px; height: 38px; object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.55));
      pointer-events: none;
    }
    .pill .num {
      position: relative; font-size: 26px; letter-spacing: 1.5px;
      text-shadow: 0 2px 0 #000, 0 0 8px rgba(0,0,0,.6);
    }
    .pop { animation: pop .5s; }
    @keyframes pop { 40% { transform: scale(1.14); } }
    .full .halo {
      background: radial-gradient(circle, rgba(255,200,60,.7), rgba(255,60,140,0) 65%);
      animation-duration: 1.2s;
    }
    .full .spark { animation-duration: .9s; }

    /* Toast Gracias (config Livecoins) */
    .gift-toasts {
      position: absolute; left: -8px; top: 28%;
      width: 120px; max-height: 52%; z-index: 8; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; gap: 10px; overflow: hidden;
    }
    .gift-toast {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      width: 100%; font-family: system-ui, sans-serif;
      animation: gt-in .38s cubic-bezier(.22,1.1,.36,1) both;
    }
    .gift-toast.is-out { animation: gt-out .28s ease forwards; }
    @keyframes gt-in { 0% { opacity: 0; transform: translateY(12px) scale(.92); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes gt-out { to { opacity: 0; transform: translateY(-8px) scale(.94); } }
    .gt-avatar {
      width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
      border: 2px solid rgba(255, 200, 140, .85);
      box-shadow: 0 4px 12px rgba(0,0,0,.45);
      background: rgba(20,12,10,.55);
    }
    .gt-copy {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      width: 100%; text-align: center; padding: 3px 6px 5px; border-radius: 10px;
      background: var(--gifttoast-bg, rgba(18, 12, 10, .55));
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .gt-thanks {
      font-size: 9px; font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; color: #ffb86a;
    }
    .gt-name {
      font-size: 11px; font-weight: 900; color: #fff8f0; max-width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>

  (function () {
    const params = new URLSearchParams(location.search);

    // Escala para OBS / iframe del panel
    document.documentElement.setAttribute('data-os-selffit', '1');
    (function fit() {
      const SW = 420, SH = 500;
      let lastK = -1;
      let resizeTimer = null;
      function apply() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (!(w > 0 && h > 0)) return false;
        const k = Math.max(0.05, Math.min(w / SW, h / SH));
        if (Math.abs(k - lastK) < 0.01) {
          document.documentElement.classList.add('tf-ready');
          return true;
        }
        lastK = k;
        document.documentElement.style.setProperty('--tf-fit', String(k));
        document.documentElement.classList.add('tf-ready');
        return true;
      }
      const tryFit = () => { if (!apply()) requestAnimationFrame(tryFit); };
      tryFit();
      requestAnimationFrame(() => { apply(); requestAnimationFrame(apply); });
      const schedule = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(apply, 60);
      };
      addEventListener('resize', schedule);
      if (typeof ResizeObserver !== 'undefined') {
        try { new ResizeObserver(schedule).observe(document.documentElement); } catch {}
      }
    })();

        '<animateMotion dur="' + dur + 's" repeatCount="indefinite" path="M' + (-rx) + ' 0 a' + rx + ' ' + ry + ' 0 1 ' + sw + ' ' + (2 * rx) + ' 0 a' + rx + ' ' + ry + ' 0 1 ' + sw + ' ' + (-2 * rx) + ' 0"/></g></g>';
      const RINGS = [[142, 34, -16, 9, 1, 'planet-o', 8], [118, 24, 26, 6.5, 0, 'planet2-o', 6]];
      back.innerHTML = RINGS.map((a) => ring(a[0], a[1], a[2], a[3], 'cU-o', a[4], a[5], a[6])).join('');

    function ensureFont(key) {
      const k = String(key || 'bangers');

    function normHex(raw, fallback) {
      let h = String(raw || '').trim();
      if (!h) return fallback;
      if (h.charAt(0) !== '#') h = '#' + h;
      if (/^#[0-9a-fA-F]{3}$/.test(h)) h = '#' + h.slice(1).split('').map((c) => c + c).join('');
      return /^#[0-9a-fA-F]{6}$/.test(h) ? h.toLowerCase() : fallback;
    }
    function hexToRgb(hex) {
      const h = normHex(hex, '#000000').slice(1);
      return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
    }
    function rgbToHex(r, g, b) {
      const c = (n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
      return '#' + c(r) + c(g) + c(b);
    }
    function mixHex(a, b, t) {
      const A = hexToRgb(a), B = hexToRgb(b);
      return rgbToHex(A.r + (B.r - A.r) * t, A.g + (B.g - A.g) * t, A.b + (B.b - A.b) * t);
    }
    function shadeHex(hex, amt) {
      // amt > 0 aclara, < 0 oscurece
      return mixHex(hex, amt >= 0 ? '#ffffff' : '#000000', Math.min(1, Math.abs(amt)));
    }
    function setGradStops(id, stops) {
      const g = document.getElementById(id);
      if (!g) return;
      const els = g.querySelectorAll('stop');
      stops.forEach((c, i) => { if (els[i]) els[i].setAttribute('stop-color', c); });
    }
    function applyHeartColors(cfg) {
      if (cfg && cfg.waterColor != null) colors.water = normHex(cfg.waterColor, colors.water);
      if (cfg && cfg.borderColor != null) colors.border = normHex(cfg.borderColor, colors.border);
      const w = colors.water;
      const b = colors.border;
      const waterStops = [shadeHex(w, 0.35), w, shadeHex(w, -0.35)];
      const goldStops = [shadeHex(b, 0.55), shadeHex(b, 0.15), shadeHex(b, -0.25), shadeHex(b, 0.2)];
      const goldDStops = [shadeHex(b, -0.35), shadeHex(b, -0.65)];
      ['waterG', 'waterG-h', 'waterG-p', 'waterG-o', 'waterG-a'].forEach((id) => setGradStops(id, waterStops));
      ['w2', 'w2-h', 'w2-p', 'w2-o', 'w2-a'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.setAttribute('fill', shadeHex(w, 0.45));
      });
      setGradStops('gold', goldStops);
      setGradStops('gold-h', goldStops);
      setGradStops('gold-o', goldStops);
      setGradStops('gold-a', goldStops);
      setGradStops('goldD', goldDStops);
      setGradStops('goldD-h', goldDStops);
      setGradStops('goldV-o', goldDStops);

      setGradStops('frame-a', [shadeHex(b, 0.55), shadeHex(b, 0.15), shadeHex(b, -0.25), shadeHex(b, 0.2)]);
      setGradStops('frameD-a', [shadeHex(b, -0.35), shadeHex(b, -0.65)]);

      if (bar) bar.style.background = 'linear-gradient(' + shadeHex(w, 0.25) + ',' + shadeHex(w, -0.3) + ')';

      if (pill) {
        const wr = hexToRgb(w);
        pill.style.borderColor = b;
        pill.style.boxShadow = '0 0 0 2px ' + shadeHex(b, -0.55) + ',0 6px 16px rgba(0,0,0,.6),0 0 20px rgba(' + wr.r + ',' + wr.g + ',' + wr.b + ',.45),inset 0 2px 6px rgba(255,255,255,.12)';
      }
      const title = document.getElementById('title');
      if (title) {
        const wr = hexToRgb(w);
        title.style.webkitTextStrokeColor = shadeHex(w, -0.45);
        title.style.textShadow = '0 3px 0 ' + shadeHex(w, 0.1) + ',0 6px 0 ' + shadeHex(w, -0.45) + ',0 10px 14px rgba(0,0,0,.6),0 0 22px rgba(' + wr.r + ',' + wr.g + ',' + wr.b + ',.5)';
      }
    }
    function paintHalo(isFull) {
      const base = isFull ? colors.border : colors.water;
      const rgb = hexToRgb(base);
      const fade = hexToRgb(colors.water);
      const a = isFull ? 0.45 : 0.2;
      const bg = 'radial-gradient(circle, rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + a + '), rgba(' + fade.r + ',' + fade.g + ',' + fade.b + ',0) 68%)';
      document.querySelectorAll('.halo').forEach((halo) => {
        halo.style.background = bg;
        halo.style.animationDuration = isFull ? '1.2s' : '2.8s';

    }
    let designHoldUntil = 0;
    let designHeld = null;
    function applyDesign(skin, opts) {
      const next = SKINS[skin] ? skin : 'heart';
      const fromLocal = !!(opts && opts.local);
      // postMessage del panel gana unos segundos frente al eco WS con skin vieja
      if (fromLocal) {
        designHeld = next;
        designHoldUntil = Date.now() + 2200;

      if (next === design) {
        document.querySelectorAll('.skin-panel').forEach((el) => {
          el.classList.toggle('is-on', el.getAttribute('data-skin') === next);

      document.querySelectorAll('.skin-panel').forEach((el) => {
        el.classList.toggle('is-on', el.getAttribute('data-skin') === next);
      });
      document.documentElement.setAttribute('data-heart-skin', next);
      // Solo repinta el agua en todas las skins; NO stopWaterAnim (no corta Testear/regalos)
      paintLevel(displayMeta, false);

    const DEFAULT_FILTER = {
      id: '7934',
      name: 'Heart Me',
      image: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/d56945782445b0b8c8658ed44f894c7b~tplv-obj.webp',

    let filterGift = Object.assign({}, DEFAULT_FILTER);

    function fmt(n) {
      return Math.max(0, Math.round(Number(n) || 0)).toLocaleString('es-ES');
    }
    function burst() {
      const fx = $('fx');
      if (!fx) return;
      for (let i = 0; i < 7; i++) {
        const e = document.createElement('i');
        e.textContent = Math.random() > .4 ? '♥' : '✦';
        e.style.left = (110 + Math.random() * 80) + 'px';

        setTimeout(() => e.remove(), 1700);

    function schedulePersist() {

    }
    function savePersistState() {
      if (isEmbed || isPreview) return;
      try {
        localStorage.setItem(lsKey, JSON.stringify({ v: 3, t: metaCurrent }));
      } catch {}
    }
    function clearPersistState() {
      try { localStorage.removeItem(lsKey); } catch {}
      try { localStorage.removeItem('lc_corazonlava_meta_' + (params.get('room') || 'default')); } catch {}
    }
    function paintWaterY(pct) {
      for (const key of SKIN_ORDER) {
        const cfg = SKIN_FILL[key];
        const el = cfg && $(cfg.water);
        if (!el) continue;
        const empty = Number(cfg.empty);
        const rise = Number(cfg.rise);
        const y = empty - pct * rise;
        if (!Number.isFinite(y)) continue;
        el.setAttribute('transform', 'translate(0,' + y + ')');
        el.style.removeProperty('transform');
      }
    }
    function paintLevel(waterShown, pop) {
      const goal = Math.max(1, metaCfg.goal || 50);
      const pct = Math.max(0, Math.min(1, waterShown / goal));
      $('title').textContent = String(metaCfg.label || 'Heart Me Goal').trim() || 'Heart Me Goal';
      paintWaterY(pct);
      // Contador = regalos reales; agua/barra siguen el lerp (se ve el llenado)
      $('num').textContent = fmt(Math.min(metaCurrent, goal)) + ' / ' + fmt(goal);
      $('bar').style.width = (pct * 100) + '%';
      const isFull = metaCurrent >= goal;
      $('wrap').classList.toggle('full', isFull);
      paintHalo(isFull);
      if (pop) {
        const pill = $('pill');
        if (pill) {
          pill.classList.remove('pop');
          void pill.offsetWidth;
          pill.classList.add('pop');
        }
      }
    }
    function stopWaterAnim() {
      if (waterRaf) { cancelAnimationFrame(waterRaf); waterRaf = null; }
      if (fillRaf) { cancelAnimationFrame(fillRaf); fillRaf = null; }
      if (fillTimer) { clearTimeout(fillTimer); fillTimer = null; }
    }
    function pumpWater(popOnce) {
      if (waterRaf) cancelAnimationFrame(waterRaf);
      let didPop = false;
      const tick = () => {
        const diff = metaCurrent - displayMeta;
        if (Math.abs(diff) < 0.05) {
          displayMeta = metaCurrent;
          paintLevel(displayMeta, !!(popOnce && !didPop));
          waterRaf = null;
          return;
        }
        // Sigue rápido cada regalo (+1) para que se vea subir el agua
        displayMeta += diff * WATER_FOLLOW;
        paintLevel(displayMeta, !!(popOnce && !didPop));
        didPop = true;
        waterRaf = requestAnimationFrame(tick);
      };
      waterRaf = requestAnimationFrame(tick);
    }
    function render(pop, instant) {
      if (instant) {
        stopWaterAnim();
        displayMeta = metaCurrent;
        paintLevel(displayMeta, !!pop);
        return;
      }
      pumpWater(!!pop);
    }
    function setMeta(n, pop, skipPersist, instant) {
      metaCurrent = Math.max(0, Math.round(Number(n) || 0));
      render(!!pop, !!instant);
      if (!skipPersist) schedulePersist();
    }
    function addMetaProgress(giftCount, diamonds, opts) {
      const g = Math.max(0, Math.round(Number(giftCount) || 0));
      const d = Math.max(0, Math.round(Number(diamonds) || 0));
      const add = metaCfg.mode === 'coins' ? d : g;
      if (add <= 0) return;
      const silent = !!(opts && opts.silent);
      setMeta(metaCurrent + add, !silent);
    }
    function resetMeta() {
      stopWaterAnim();
      setMeta(0, false, true, true);
      clearPersistState();
    }
    function applyMetaSettings(cfg) {
      if (!cfg) return;
      if (cfg.metaLabel != null) metaCfg.label = String(cfg.metaLabel).trim() || 'Heart Me Goal';
      if (cfg.metaGoal != null) {
        const g = Math.round(Number(cfg.metaGoal));
        metaCfg.goal = Number.isFinite(g) && g > 0 ? Math.min(9999999, g) : 50;
      }
      if (cfg.metaMode === 'coins' || cfg.metaMode === 'gifts') metaCfg.mode = cfg.metaMode;
      render(false);
    }
    function normGiftName(s) {
      return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }
    const giftImgById = new Map();
    function giftImgUrl(u) {
      if (!u) return '';
      try {
        if (new URL(u, location.href).origin === location.origin) return u;
      } catch {}
      return '/api/img-proxy?url=' + encodeURIComponent(u);
    }
    function paintPillGift() {
      const img = document.getElementById('pill-gift');
      if (!img) return;
      let raw = filterGift.image || '';
      if (!raw && filterGift.id && giftImgById.has(String(filterGift.id))) {
        raw = giftImgById.get(String(filterGift.id)) || '';
      }
      if (!raw) raw = DEFAULT_FILTER.image;
      const src = giftImgUrl(raw) || raw;
      if (img.getAttribute('src') === src) return;
      img.onerror = function () {
        this.onerror = null;
        this.src = giftImgUrl(DEFAULT_FILTER.image) || DEFAULT_FILTER.image;
      };
      img.src = src;
      img.alt = filterGift.name || 'Gift';
      img.title = filterGift.name || '';
    }
    function applyFilterGiftSettings(cfg) {
      if (!cfg) return;
      const id = cfg.filterGiftId != null ? String(cfg.filterGiftId).trim()
        : (cfg.giftId != null ? String(cfg.giftId).trim()
          : (cfg.id != null ? String(cfg.id).trim() : filterGift.id));
      const name = cfg.filterGiftName != null ? String(cfg.filterGiftName).trim()
        : (cfg.giftName != null ? String(cfg.giftName).trim()
          : (cfg.name != null ? String(cfg.name).trim() : filterGift.name));
      const image = cfg.filterGiftImage != null ? String(cfg.filterGiftImage).trim()
        : (cfg.image != null ? String(cfg.image).trim()
          : (cfg.giftImage != null ? String(cfg.giftImage).trim() : filterGift.image));
      const diamonds = cfg.filterGiftDiamonds != null ? Number(cfg.filterGiftDiamonds)
        : (cfg.diamonds != null ? Number(cfg.diamonds) : filterGift.diamonds);
      filterGift = {
        id: id || DEFAULT_FILTER.id,
        name: name || DEFAULT_FILTER.name,
        image: image || DEFAULT_FILTER.image,
        diamonds: Number.isFinite(diamonds) && diamonds > 0 ? diamonds : DEFAULT_FILTER.diamonds,
      };
      if (filterGift.image && filterGift.id) giftImgById.set(String(filterGift.id), filterGift.image);
      paintPillGift();
    }
    function giftMatchesFilter(p) {
      if (!p) return false;
      const id = String(p.giftId || p.id || '').trim();
      const name = normGiftName(p.giftName || p.name || '');
      if (filterGift.id && id && id === String(filterGift.id)) return true;
      if (filterGift.name && name && name === normGiftName(filterGift.name)) return true;
      return false;
    }

    // Toasts
    const giftToastsEl = $('gift-toasts');
    let giftToastEnabled = true;
    let giftToastStyle = { color: '#1c1e26', opacity: 90 };
    function hexToRgba(hex, opacityPct, fallbackHex) {
      let h = String(hex || '').replace('#', '').trim();
      if (h.length === 3) h = h.split('').map((c) => c + c).join('');
      if (!/^[0-9a-fA-F]{6}$/.test(h)) h = String(fallbackHex || '161820').replace('#', '');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      const a = Math.max(0, Math.min(100, Number(opacityPct))) / 100;
      if (!Number.isFinite(a)) return 'rgba(' + r + ',' + g + ',' + b + ',0.88)';
      return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }
    function applyGiftToastStyle(cfg) {
      if (!cfg) return;
      if (cfg.giftToastColor !== undefined) giftToastStyle.color = cfg.giftToastColor || '#1c1e26';
      else if (cfg.color !== undefined) giftToastStyle.color = cfg.color || '#1c1e26';
      if (cfg.giftToastOpacity !== undefined) {
        const n = Number(cfg.giftToastOpacity);
        giftToastStyle.opacity = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 90;
      } else if (cfg.opacity !== undefined) {
        const n = Number(cfg.opacity);
        giftToastStyle.opacity = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 90;
      }
      const bg = hexToRgba(giftToastStyle.color, Math.min(100, giftToastStyle.opacity * 0.72), '1c1e26');
      document.documentElement.style.setProperty('--gifttoast-bg', bg);
    }
    function applyGiftToastSettings(cfg) {
      if (!cfg) return;
      if (cfg.giftToastEnabled !== undefined) giftToastEnabled = cfg.giftToastEnabled !== false;
      applyGiftToastStyle(cfg);
      if (!giftToastEnabled && giftToastsEl) giftToastsEl.innerHTML = '';
    }
    function showGiftToast(info) {
      if (!giftToastsEl || !giftToastEnabled) return;
      const name = String(info && (info.nickname || info.uniqueId) || 'Alguien').trim() || 'Alguien';
      const avatar = String(info && (info.profilePictureUrl || info.photo) || '').trim()
        || (isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC);
      const el = document.createElement('div');
      el.className = 'gift-toast';
      el.innerHTML =
        '<img class="gt-avatar" alt="" referrerpolicy="no-referrer">' +
        '<div class="gt-copy">' +
          '<span class="gt-thanks">Gracias</span>' +
          '<span class="gt-name"></span>' +
        '</div>';
      const av = el.querySelector('.gt-avatar');
      av.src = avatar;
      av.onerror = function () { this.onerror = null; this.src = isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC; };
      el.querySelector('.gt-name').textContent = name;
      giftToastsEl.insertBefore(el, giftToastsEl.firstChild);
      while (giftToastsEl.children.length > 6) {
        const last = giftToastsEl.lastElementChild;
        if (last) giftToastsEl.removeChild(last);
      }
      setTimeout(() => {
        el.classList.add('is-out');
        setTimeout(() => { try { el.remove(); } catch {} }, 300);
      }, 4200);
    }

    function dropOneGift(payload) {
      const p = payload || {};
      if ((p.giftId || p.giftName) && !giftMatchesFilter(p)) return;
      const d = Math.max(0, Number(p.diamonds) || filterGift.diamonds || 1);
      showGiftToast({
        nickname: p.nickname || 'Tester',
        giftName: filterGift.name || p.giftName || 'Gift',
        diamonds: d,
        photo: p.photo || (isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC),
      });
      addMetaProgress(1, d, {});
    }
    function onGift(p) {
      if (!p || p.streak) return;
      if (!giftMatchesFilter(p)) return;
      const n = Math.min(99, Math.max(1, p.repeatCount || 1));
      showGiftToast(p);
      addMetaProgress(n, (Number(p.diamonds) || filterGift.diamonds || 0) * n, {});
    }
    function runFill(total, payload) {
      stopWaterAnim();
      resetMeta();
      if (payload) applyFilterGiftSettings(payload);
      const d = Math.max(1, Number((payload && payload.diamonds) || filterGift.diamonds) || 15);
      const goal = Math.max(1, metaCfg.goal || 50);
      // Test: simula regalos uno a uno para que el agua se vea llenarse
      const max = Math.max(1, Math.min(goal, parseInt(total, 10) || goal));
      showGiftToast({
        nickname: 'Tester',
        giftName: filterGift.name || 'Heart Me',
        diamonds: d,
        photo: isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC,
      });
      let i = 0;
      const stepMs = metaCfg.mode === 'coins' ? 70 : 110;
      (function tick() {
        if (i >= max) { fillTimer = null; return; }
        const step = metaCfg.mode === 'coins' ? d : 1;
        // No instant: el agua hace lerp hacia cada nuevo nivel
        setMeta(metaCurrent + step, i % 4 === 0 || i === max - 1, true, false);
        if (i % 8 === 0) burst();
        i++;
        fillTimer = setTimeout(tick, stepMs);
      })();
    }

    function restorePersist() {
      if (isEmbed || isPreview) { render(false); return; }
      try {
        const raw = localStorage.getItem(lsKey);
        if (raw == null || raw === '') {
          const old = localStorage.getItem('lc_corazonlava_meta_' + (params.get('room') || 'default'));
          if (old != null) setMeta(parseInt(old, 10) || 0, false, true);
          else render(false);
          return;
        }
        const trimmed = String(raw).trim();
        if (trimmed.charAt(0) === '{') {
          const data = JSON.parse(trimmed);
          setMeta(Math.max(0, Math.round(Number(data.t) || 0)), false, true);
        } else {
          setMeta(parseInt(trimmed, 10) || 0, false, true);
        }
      } catch { render(false); }
    }

    // WebSocket Livecoins (no TikFinity)
    let ws, reconnectTimer;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
      ws.onopen = () => clearTimeout(reconnectTimer);
      ws.onclose = () => { reconnectTimer = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        const { type, payload } = msg;
        if (type === 'gift') { if (!isEmbed) onGift(payload); }
        else if (type === 'corazonLavaTest') { if (!isEmbed) runFill((payload && payload.count) || metaCfg.goal, payload); }
        else if (type === 'corazonLavaDropOne') { if (!isEmbed) dropOneGift(payload); }
        else if (type === 'corazonLavaReset') { if (!isEmbed) resetMeta(); }
        else if (type === 'settings') {
          if (payload && payload.corazonLava) {
            applyMetaSettings(payload.corazonLava);
            applyFilterGiftSettings(payload.corazonLava);
            applyGiftToastSettings(payload.corazonLava);
            applyHeartColors(payload.corazonLava);
            if (payload.corazonLava.font != null) applyHeartFont(payload.corazonLava.font);
            if (payload.corazonLava.skin != null || payload.corazonLava.design != null) {
              applyDesign(payload.corazonLava.skin || payload.corazonLava.design, { local: false });
            }
          }
        }
      };
    }
    connectWS();
    applyGiftToastStyle(giftToastStyle);
    applyHeartColors(colors);
    applyHeartFont(fontKey);
    applyDesign(design);
    paintPillGift();
    fetch('/api/gifts').then((r) => r.json()).then((d) => {
      (d.results || []).forEach((g) => { if (g.image) giftImgById.set(String(g.id), g.image); });
      if (!filterGift.image && filterGift.id && giftImgById.has(String(filterGift.id))) {
        filterGift.image = giftImgById.get(String(filterGift.id));
      }
      paintPillGift();
    }).catch(() => {});
    restorePersist();

    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.kind !== 'corazonLava') return;
      if (d.type === 'test') runFill(d.count || metaCfg.goal, d);
      else if (d.type === 'dropOne') dropOneGift(d);
      else if (d.type === 'reset') resetMeta();
      else if (d.type === 'config') {
        if (d.metaLabel !== undefined || d.metaGoal !== undefined || d.metaMode !== undefined) {
          applyMetaSettings({
            metaLabel: d.metaLabel !== undefined ? d.metaLabel : metaCfg.label,
            metaGoal: d.metaGoal !== undefined ? d.metaGoal : metaCfg.goal,
            metaMode: d.metaMode !== undefined ? d.metaMode : metaCfg.mode,
          });
        }
        if (d.waterColor !== undefined || d.borderColor !== undefined) applyHeartColors(d);
        if (d.font !== undefined) applyHeartFont(d.font);
        if (d.skin !== undefined || d.design !== undefined) applyDesign(d.skin || d.design, { local: true });
        if (d.filterGiftId !== undefined || d.filterGiftName !== undefined || d.filterGiftImage !== undefined || d.filterGiftDiamonds !== undefined
            || d.giftId !== undefined || d.giftName !== undefined || d.image !== undefined) {
          applyFilterGiftSettings(d);
        }
        if (d.giftToastEnabled !== undefined || d.giftToastColor !== undefined || d.giftToastOpacity !== undefined) {
          applyGiftToastSettings({
            giftToastEnabled: d.giftToastEnabled !== undefined ? d.giftToastEnabled : giftToastEnabled,
            giftToastColor: d.giftToastColor !== undefined ? d.giftToastColor : giftToastStyle.color,
            giftToastOpacity: d.giftToastOpacity !== undefined ? d.giftToastOpacity : giftToastStyle.opacity,
          });
        }
      }
    });

    // Vista previa standalone (?preview=1)
    if (isPreview) {
      document.body.classList.add('preview-bg');
      const demo = () => {
        runFill(Math.max(1, metaCfg.goal || 30), null);
        const goal = Math.max(1, metaCfg.goal || 30);
        const wait = 900 + goal * 110 + 1800;
        setTimeout(() => { resetMeta(); demo(); }, wait);
      };
      setTimeout(demo, 600);
    }

    // Embed del panel: un poco de agua para que se vea el diseño
    if (isEmbed && !isPreview) {
      setTimeout(() => {
        if (metaCurrent === 0) {
          const g = Math.max(1, metaCfg.goal || 50);
          setMeta(Math.round(g * 0.35), false, true);
        }
      }, 400);
    }
  })();
  </script>
  <script src="/js/overlay-idle.js?v=oi1"></script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
