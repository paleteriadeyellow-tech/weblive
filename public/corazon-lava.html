<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Meta Heart Me</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
    html { --tf-fit: 0.01; }

    .stage {
      width: 720px; height: 620px; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(var(--tf-fit, 0.01)); transform-origin: center center;
      opacity: 0;
    }
    html.tf-ready .stage { opacity: 1; }
    .jar {
      position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
      width: 700px; height: 466px; pointer-events: none;
    }

    /* Marco del corazón (hueco; regalos se ven por dentro) */
    .jar-shell {
      position: absolute; inset: 0; z-index: 5; width: 100%; height: 100%;
      object-fit: contain; object-position: center center; pointer-events: none;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
    }

    /* Regalos solo dentro del hueco del corazón */
    .jar-interior {
      position: absolute; inset: 0; z-index: 2; isolation: isolate; overflow: hidden;
      -webkit-mask-image: url('/corazon-lava/heart-mask.png?v=14'); mask-image: url('/corazon-lava/heart-mask.png?v=14');
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center center; mask-position: center center;
      -webkit-mask-origin: border-box; mask-origin: border-box;
      -webkit-mask-clip: border-box; mask-clip: border-box;
      -webkit-mask-mode: alpha; mask-mode: alpha;
    }
    .gifts-layer { position: absolute; inset: 0; overflow: hidden; }
    .gift-body {
      position: absolute; top: 0; left: 0; object-fit: contain; pointer-events: none; will-change: transform;
      transform: translate3d(-999px, -999px, 0); filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); transition: opacity .2s linear;
    }

    /* Tinte opcional del marco */
    .jar-tint {
      position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background: var(--jar-tint, transparent); mix-blend-mode: color;
      opacity: var(--jar-tint-opacity, 0);
      -webkit-mask-image: url('/corazon-lava/heart-shell.png?v=14'); mask-image: url('/corazon-lava/heart-shell.png?v=14');
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center center; mask-position: center center;
    }
    /* Arcoíris: hue-rotate (estable; evita thrash de layout) */
    html.jar-rainbow .jar-tint {
      background: #ff2bd6 !important;
      opacity: 1 !important;
      mix-blend-mode: color;
      animation: jarRainbowHue 2.8s linear infinite;
    }
    @keyframes jarRainbowHue {
      to { filter: hue-rotate(360deg); }
    }

    /* HUD Meta (solo Corazón lava) */
    .meta-hud {
      position: absolute; left: 50%; top: 488px; transform: translateX(-50%);
      z-index: 7; pointer-events: none; text-align: center;
      min-width: 140px; padding: 10px 22px 12px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(28, 16, 12, .72) 0%, rgba(12, 8, 8, .55) 100%);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      box-shadow:
        0 10px 28px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(255, 170, 90, .22),
        inset 0 1px 0 rgba(255,220,160,.12);
      font-family: 'Rubik', system-ui, sans-serif;
    }
    .meta-label {
      display: block; font-size: 12px; font-weight: 800; letter-spacing: .28em;
      text-transform: uppercase; color: #ffb86a;
      text-shadow: 0 1px 0 rgba(0,0,0,.55), 0 0 18px rgba(255,140,60,.35);
      margin-bottom: 4px;
    }
    .meta-value {
      display: block; font-weight: 900; font-size: 30px; line-height: 1.05;
      color: #fff8f0; letter-spacing: .02em; font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 20px rgba(255,160,70,.25);
      transition: transform .14s ease, color .2s ease;
    }
    .meta-value .meta-sep { opacity: .42; margin: 0 .08em; font-weight: 700; }
    .meta-value .meta-goal { color: #ffd59a; }
    .meta-hud.is-done .meta-label { color: #ffe082; }
    .meta-hud.is-done .meta-value { color: #ffe566; }
    .meta-value.bump { animation: metabump .28s ease; }
    @keyframes metabump {
      0% { transform: scale(1); }
      40% { transform: scale(1.14); }
      100% { transform: scale(1); }
    }

    /* Gracias: avatar circular + nombre (solo este overlay) */
    .gift-toasts {
      position: absolute; left: 10px; top: 28%;
      width: min(180px, 40%); max-height: 52%; z-index: 8; pointer-events: none;
      display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 14px;
      overflow: hidden;
    }
    .gift-toast {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      width: 100%; max-width: 160px; padding: 0;
      background: transparent; box-shadow: none;
      font-family: 'Rubik', system-ui, sans-serif;
      animation: gt-in .38s cubic-bezier(.22,1.1,.36,1) both;
    }
    .gift-toast.is-out { animation: gt-out .28s ease forwards; }
    @keyframes gt-in { 0% { opacity: 0; transform: translateY(12px) scale(.92); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes gt-out { to { opacity: 0; transform: translateY(-8px) scale(.94); } }
    .gt-avatar {
      width: 64px; height: 64px; border-radius: 50%; flex: 0 0 auto; object-fit: cover;
      border: 3px solid rgba(255, 200, 140, .85);
      box-shadow:
        0 6px 18px rgba(0,0,0,.45),
        0 0 0 2px rgba(255,140,60,.25),
        inset 0 0 0 1px rgba(255,255,255,.15);
      background: rgba(20,12,10,.55);
    }
    .gt-copy {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-width: 0; width: 100%; text-align: center;
      padding: 4px 8px 6px; border-radius: 12px;
      background: var(--gifttoast-bg, rgba(18, 12, 10, .55));
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }
    .gt-thanks {
      font-size: 11px; font-weight: 800; letter-spacing: .18em;
      text-transform: uppercase; color: #ffb86a;
      text-shadow: 0 1px 0 rgba(0,0,0,.55), 0 0 12px rgba(255,140,60,.35);
    }
    .gt-name {
      font-size: 14px; font-weight: 900; line-height: 1.15;
      color: #fff8f0; max-width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 14px rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="jar">
      <div class="jar-interior" id="bowl">
        <div class="gifts-layer" id="gifts-layer"></div>
      </div>
      <img class="jar-shell" src="/corazon-lava/heart-shell.png?v=14" alt="" draggable="false" />
      <div class="jar-tint" id="jar-tint" aria-hidden="true"></div>
    </div>
    <div class="gift-toasts" id="gift-toasts" aria-live="polite"></div>
    <div class="meta-hud" id="meta-hud" aria-live="polite">
      <span class="meta-label" id="meta-label">Meta</span>
      <span class="meta-value" id="meta-value"><span id="meta-cur">0</span><span class="meta-sep">/</span><span class="meta-goal" id="meta-goal">50</span></span>
    </div>
  </div>

  <script src="/js/matter.min.js"></script>
  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isPreview = params.get('preview') === '1';
    const isEmbed = params.get('embed') === '1'; // vista previa dentro del panel (fija)

    // ---- Tinte (color / arcoíris) ----
    let jarTintColor = '';
    let jarRainbowOn = false;
    function applyJarTint(color) {
      const root = document.documentElement;
      const c = String(color || '').trim();
      jarTintColor = c;
      if (jarRainbowOn) return;
      if (!c || /^#?fff(fff)?$/i.test(c) || c === 'none' || c === 'transparent') {
        root.style.removeProperty('--jar-tint');
        root.style.removeProperty('--jar-tint-opacity');
        return;
      }
      root.style.setProperty('--jar-tint', c.charAt(0) === '#' ? c : '#' + c);
      root.style.setProperty('--jar-tint-opacity', '1');
    }
    function applyJarRainbow(on) {
      const next = !!on;
      const root = document.documentElement;
      jarRainbowOn = next;
      if (next) {
        root.classList.add('jar-rainbow');
        root.style.setProperty('--jar-tint-opacity', '1');
      } else {
        root.classList.remove('jar-rainbow');
        applyJarTint(jarTintColor);
      }
    }
    function rootSafeRainbow() {
      if (!jarRainbowOn) return;
      document.documentElement.classList.add('jar-rainbow');
      document.documentElement.style.setProperty('--jar-tint-opacity', '1');
    }
    applyJarTint(params.get('jc'));
    if (params.get('jr') === '1') applyJarRainbow(true);

    // Escala para que el corazonlava se vea completo (sin recortes).
    // No usar tamaño de diseño como fallback: si el iframe aún mide 0,
    // eso dejaba scale=1 y el preview salía gigante un frame.
    (function fit() {
      const SW = 720, SH = 620;
      let lastK = -1;
      let resizeTimer = null;
      function apply() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (!(w > 0 && h > 0)) return false;
        const k = Math.max(0.05, Math.min(w / SW, h / SH));
        if (Math.abs(k - lastK) < 0.01) {
          document.documentElement.classList.add('tf-ready');
          return true;
        }
        lastK = k;
        document.documentElement.style.setProperty('--tf-fit', String(k));
        document.documentElement.classList.add('tf-ready');
        return true;
      }
      const tryFit = () => {
        if (!apply()) requestAnimationFrame(tryFit);
      };
      tryFit();
      requestAnimationFrame(() => { apply(); requestAnimationFrame(apply); });
      const schedule = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(apply, 60);
      };
      addEventListener('resize', schedule);
      if (typeof ResizeObserver !== 'undefined') {
        try { new ResizeObserver(schedule).observe(document.documentElement); } catch {}
      }
    })();

    let FALLBACK_IMG = '/corazon-lava/heart-shell.png';
    const TD_DEFAULT_PIC = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
    const TD_PREVIEW_PIC = '/jarron/lv.png';

    // ---- Meta configurable (solo este overlay) ----
    const metaHud = document.getElementById('meta-hud');
    const metaLabelEl = document.getElementById('meta-label');
    const metaCurEl = document.getElementById('meta-cur');
    const metaGoalEl = document.getElementById('meta-goal');
    const metaValueEl = document.getElementById('meta-value');
    const lsKey = 'lc_corazonlava_' + (params.get('room') || 'default');
    let metaCfg = { label: 'Meta', goal: 50, mode: 'gifts' }; // mode: gifts | coins
    let metaCurrent = 0;
    const PERSIST_MAX = 400;
    let persistTimer = null;
    let restoringGifts = false;

    function fmtMeta(n) {
      return Math.max(0, Math.round(Number(n) || 0)).toLocaleString('es-ES');
    }
    function schedulePersist() {
      if (isEmbed || isPreview || restoringGifts) return;
      clearTimeout(persistTimer);
      persistTimer = setTimeout(savePersistState, 220);
    }
    function savePersistState() {
      if (isEmbed || isPreview) return;
      try {
        const g = gifts.slice(-PERSIST_MAX).map((x) => ({
          u: String((x.img && (x.img.currentSrc || x.img.src)) || x.src || FALLBACK_IMG),
          d: Math.max(0, Math.round(Number(x.diamonds) || 0)),
          s: Math.max(14, Math.round(Number(x.sizePx) || 28)),
        }));
        localStorage.setItem(lsKey, JSON.stringify({ v: 2, t: metaCurrent, g }));
      } catch {
        try {
          const g = gifts.slice(-120).map((x) => ({
            u: String((x.img && (x.img.currentSrc || x.img.src)) || x.src || FALLBACK_IMG),
            d: Math.max(0, Math.round(Number(x.diamonds) || 0)),
            s: Math.max(14, Math.round(Number(x.sizePx) || 28)),
          }));
          localStorage.setItem(lsKey, JSON.stringify({ v: 2, t: metaCurrent, g }));
        } catch { /* quota */ }
      }
    }
    function renderMeta(bump) {
      if (metaLabelEl) metaLabelEl.textContent = String(metaCfg.label || 'Meta').trim() || 'Meta';
      if (metaCurEl) metaCurEl.textContent = fmtMeta(metaCurrent);
      if (metaGoalEl) metaGoalEl.textContent = fmtMeta(metaCfg.goal);
      if (metaHud) metaHud.classList.toggle('is-done', metaCurrent >= metaCfg.goal && metaCfg.goal > 0);
      if (bump && metaValueEl) {
        metaValueEl.classList.remove('bump');
        void metaValueEl.offsetWidth;
        metaValueEl.classList.add('bump');
      }
    }
    function setMeta(n, bump, skipPersist) {
      metaCurrent = Math.max(0, Math.round(Number(n) || 0));
      renderMeta(bump);
      if (!skipPersist) schedulePersist();
    }
    function addMetaProgress(giftCount, diamonds, opts) {
      const g = Math.max(0, Math.round(Number(giftCount) || 0));
      const d = Math.max(0, Math.round(Number(diamonds) || 0));
      const add = metaCfg.mode === 'coins' ? d : g;
      if (add <= 0) return;
      const silent = !!(opts && opts.silent);
      setMeta(metaCurrent + add, !silent);
    }
    function applyMetaSettings(cfg) {
      if (!cfg) return;
      if (cfg.metaLabel != null) metaCfg.label = String(cfg.metaLabel).trim() || 'Meta';
      if (cfg.metaGoal != null) {
        const g = Math.round(Number(cfg.metaGoal));
        metaCfg.goal = Number.isFinite(g) && g > 0 ? Math.min(9999999, g) : 50;
      }
      if (cfg.metaMode === 'coins' || cfg.metaMode === 'gifts') metaCfg.mode = cfg.metaMode;
      renderMeta(false);
    }
    function clearPersistState() {
      try { localStorage.removeItem(lsKey); } catch {}
      // Compat: clave antigua solo-meta
      try { localStorage.removeItem('lc_corazonlava_meta_' + (params.get('room') || 'default')); } catch {}
    }
    function resetMeta() {
      setMeta(0, false, true);
      clearPersistState();
    }

    // ---- Filtro: solo 1 regalo cae / cuenta / test ----
    const DEFAULT_FILTER = {
      id: '7934',
      name: 'Heart Me',
      image: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/d56945782445b0b8c8658ed44f894c7b~tplv-obj.webp',
      diamonds: 15,
    };
    let filterGift = Object.assign({}, DEFAULT_FILTER);

    function normGiftName(s) {
      return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }
    function applyFilterGiftSettings(cfg) {
      if (!cfg) return;
      const id = cfg.filterGiftId != null ? String(cfg.filterGiftId).trim()
        : (cfg.giftId != null ? String(cfg.giftId).trim()
          : (cfg.id != null ? String(cfg.id).trim() : filterGift.id));
      const name = cfg.filterGiftName != null ? String(cfg.filterGiftName).trim()
        : (cfg.giftName != null ? String(cfg.giftName).trim()
          : (cfg.name != null ? String(cfg.name).trim() : filterGift.name));
      const image = cfg.filterGiftImage != null ? String(cfg.filterGiftImage).trim()
        : (cfg.image != null ? String(cfg.image).trim()
          : (cfg.giftImage != null ? String(cfg.giftImage).trim() : filterGift.image));
      const diamonds = cfg.filterGiftDiamonds != null ? Number(cfg.filterGiftDiamonds)
        : (cfg.diamonds != null ? Number(cfg.diamonds) : filterGift.diamonds);
      filterGift = {
        id: id || DEFAULT_FILTER.id,
        name: name || DEFAULT_FILTER.name,
        image: image || DEFAULT_FILTER.image,
        diamonds: Number.isFinite(diamonds) && diamonds > 0 ? diamonds : DEFAULT_FILTER.diamonds,
      };
    }
    function giftMatchesFilter(p) {
      if (!p) return false;
      const id = String(p.giftId || p.id || '').trim();
      const name = normGiftName(p.giftName || p.name || '');
      if (filterGift.id && id && id === String(filterGift.id)) return true;
      if (filterGift.name && name && name === normGiftName(filterGift.name)) return true;
      return false;
    }
    function filteredGiftSrc(extra) {
      const raw = (extra && (extra.image || extra.giftImage)) || filterGift.image || '';
      if (raw) {
        try { return giftImgUrl(raw) || raw; } catch { return raw; }
      }
      try {
        if (filterGift.id && giftImgById.has(String(filterGift.id))) {
          return giftImgUrl(giftImgById.get(String(filterGift.id))) || FALLBACK_IMG;
        }
      } catch {}
      return FALLBACK_IMG;
    }

    function hexToRgba(hex, opacityPct, fallbackHex) {
      let h = String(hex || '').replace('#', '').trim();
      if (h.length === 3) h = h.split('').map((c) => c + c).join('');
      if (!/^[0-9a-fA-F]{6}$/.test(h)) h = String(fallbackHex || '161820').replace('#', '');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      const a = Math.max(0, Math.min(100, Number(opacityPct))) / 100;
      if (!Number.isFinite(a)) return 'rgba(' + r + ',' + g + ',' + b + ',0.88)';
      return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }

    // Contorno del corazón (paredes físicas = forma real, no rectángulo/pirámide)
    const HEART_EDGES = {"L":[[34.08,19.35],[29.2,21.11],[27.05,23.17],[25.59,24.93],[24.61,26.69],[23.73,28.45],[22.95,30.5],[22.46,32.26],[22.17,34.02],[21.97,35.78],[21.78,37.83],[21.78,39.59],[21.78,41.35],[21.97,43.11],[22.17,45.16],[22.46,46.92],[22.75,48.68],[23.14,50.44],[23.73,52.49],[24.22,54.25],[25.0,56.01],[25.68,57.77],[26.76,59.82],[27.73,61.58],[28.81,63.34],[29.88,65.1],[31.35,67.16],[32.81,68.91],[34.18,70.67],[36.04,72.43],[38.18,74.49],[40.14,76.25],[42.29,78.01],[44.53,79.77],[47.27,81.82],[49.45,83.58]],"R":[[67.58,19.35],[71.58,21.11],[73.63,23.17],[75.0,24.93],[76.07,26.69],[76.86,28.45],[77.64,30.5],[78.22,32.26],[78.61,34.02],[78.81,35.78],[79.0,37.83],[79.1,39.59],[79.1,41.35],[79.1,43.11],[79.0,45.16],[78.71,46.92],[78.52,48.68],[78.12,50.44],[77.54,52.49],[77.05,54.25],[76.37,56.01],[75.68,57.77],[74.71,59.82],[73.83,61.58],[72.85,63.34],[71.78,65.1],[70.31,67.16],[68.95,68.91],[67.48,70.67],[65.82,72.43],[63.67,74.49],[61.72,76.25],[59.47,78.01],[57.13,79.77],[54.1,81.82],[50.65,83.58]]};
    const STAGE_W = 700, STAGE_H = 466, IMG_W = 700, IMG_H = 466, IMG_TOP = 0;
    const artX = (p) => (p / 100) * IMG_W;
    const artY = (p) => IMG_TOP + (p / 100) * IMG_H;
    const SLOT_CX = artX(50), SLOT_HW = 110, SPAWN_Y = artY(17);
    const TOPY = artY(18);
    const JAR_CAPACITY = 160, HARD_CAP = 420;

    const M = window.Matter;
    if (!M) { console.warn('[corazonlava] Matter.js no disponible.'); return; }
    const { Engine, World, Bodies, Body, Runner, Events } = M;

    const engine = Engine.create();
    engine.gravity.y = 0.72; engine.enableSleeping = true;
    const world = engine.world;

    const wallOpts = { isStatic: true, friction: 0.42, restitution: 0.18 };
    const wallSegs = [];
    function addEdgeWalls(pts, outwardSign) {
      // Pared fuera del hueco: el borde de la máscara = cara interna jugable
      const thick = 20;
      for (let i = 0; i < pts.length - 1; i++) {
        const x1 = artX(pts[i][0]), y1 = artY(pts[i][1]);
        const x2 = artX(pts[i + 1][0]), y2 = artY(pts[i + 1][1]);
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const angle = Math.atan2(dy, dx);
        let ox = -dy / len, oy = dx / len;
        if (ox * outwardSign < 0) { ox = -ox; oy = -oy; }
        const mx = (x1 + x2) / 2 + ox * (thick * 0.5);
        const my = (y1 + y2) / 2 + oy * (thick * 0.5);
        wallSegs.push(Bodies.rectangle(mx, my, len + 6, thick, Object.assign({ angle: angle }, wallOpts)));
      }
    }
    addEdgeWalls(HEART_EDGES.L, -1);
    addEdgeWalls(HEART_EDGES.R, 1);
    const tipY = artY(HEART_EDGES.L[HEART_EDGES.L.length - 1][1]);
    wallSegs.push(Bodies.rectangle(artX(50.5), tipY + 9, artX(14), 18, wallOpts));
    World.add(world, wallSegs);

    const giftsLayer = document.getElementById('gifts-layer');
    const gifts = [];
    let spawnSeq = 0;

    Runner.run(Runner.create(), engine);
    Events.on(engine, 'afterUpdate', function () {
      for (let i = 0; i < gifts.length; i++) {
        const g = gifts[i];
        if (!g.body.isSleeping) {
          const v = g.body.velocity, sp = Math.hypot(v.x, v.y);
          if (sp > 10) { const s = 10 / sp; Body.setVelocity(g.body, { x: v.x * s, y: v.y * s }); }
        }
        if (g.body.isSleeping && g.awakeSynced) continue;
        const p = g.body.position, half = g.sizePx / 2;
        g.img.style.transform = 'translate3d(' + (p.x - half).toFixed(1) + 'px,' + (p.y - half).toFixed(1) + 'px,0) rotate(' + g.body.angle.toFixed(3) + 'rad)';
        g.awakeSynced = g.body.isSleeping;
      }
    });

    const rnd = (a, b) => a + Math.random() * (b - a);
    function zIndexFromDiamonds(d, seq) {
      const bump = seq % 18;
      if (d >= 5000) return 900 + bump; if (d >= 1000) return 600 + bump;
      if (d >= 100) return 250 + bump; if (d >= 30) return 90 + bump; return 30 + bump;
    }

    // Tabla de tamaños configurable: [{ t, sz }] de mayor a menor umbral.
    let sizeTable = null;
    function setSizeTable(raw) {
      if (!Array.isArray(raw)) { sizeTable = null; return; }
      const out = raw
        .map((r) => ({ t: Number(r && r.t), sz: Number(r && r.sz) }))
        .filter((r) => Number.isFinite(r.t) && Number.isFinite(r.sz) && r.sz > 0)
        .sort((a, b) => b.t - a.t);
      sizeTable = out.length ? out : null;
    }
    function sizeFromTable(d) {
      if (!sizeTable) return null;
      for (const row of sizeTable) {
        if (d >= row.t) { const j = row.sz * 0.06; return Math.max(8, Math.min(200, row.sz + rnd(-j, j))); }
      }
      return sizeTable[sizeTable.length - 1].sz;
    }
    function giftSizeForFill(d) {
      let base, maxPx = 40, shrink = 1;
      const tbl = sizeFromTable(d);
      if (tbl != null) { base = tbl; maxPx = Math.max(40, tbl + 8); }
      else if (d >= 5000) { base = rnd(76, 92); maxPx = 92; shrink = 0.97; }
      else if (d >= 1000) { base = rnd(50, 62); maxPx = 64; shrink = 0.95; }
      else if (d >= 100) { base = rnd(38, 46); maxPx = 48; }
      else if (d >= 30) { base = rnd(32, 40); maxPx = 42; }
      else base = rnd(28, 36);
      const fill = Math.min(1, gifts.length / JAR_CAPACITY);
      if (fill > 0.5) base *= 0.94 * shrink;
      if (fill > 0.75) base *= 0.9;
      if (fill > 0.9) base *= 0.88;
      return Math.round(Math.max(14, Math.min(maxPx, base)));
    }

    function removeGiftAt(i, skipPersist) {
      const g = gifts[i]; if (!g) return;
      try { World.remove(world, g.body); } catch {}
      if (g.img && g.img.parentNode) g.img.parentNode.removeChild(g.img);
      gifts.splice(i, 1);
      if (!skipPersist && !restoringGifts) schedulePersist();
    }
    function pruneJar() {
      for (let i = gifts.length - 1; i >= 0; i--) {
        const g = gifts[i], p = g.body.position, r = g.sizePx / 2;
        if ((p.y - r) > (STAGE_H + 80) || (p.x + r) < -180 || (p.x - r) > (STAGE_W + 180)) { removeGiftAt(i); continue; }
        if (g.body.isSleeping && (p.y + r) < (TOPY - 4)) removeGiftAt(i);
      }
      if (gifts.length > HARD_CAP) {
        const sorted = gifts.slice().sort((a, b) => a.body.position.y - b.body.position.y);
        let toRemove = gifts.length - HARD_CAP;
        for (let k = 0; k < sorted.length && toRemove > 0; k++) {
          const idx = gifts.indexOf(sorted[k]);
          if (idx !== -1) { removeGiftAt(idx); toRemove--; }
        }
      }
    }
    setInterval(pruneJar, 1300);

    function addGiftBody(src, sizePx, diamonds, opts) {
      if (!src) src = FALLBACK_IMG;
      opts = opts || {};
      // Radio de colisión un poco menor que el tamaño visual: las imágenes se
      // solapan y rellenan los huecos para que no quede espacio vacío.
      const r = Math.max(6, (sizePx / 2) * 0.80);
      let x, y, vx;
      if (opts.x != null) { x = opts.x; y = opts.y != null ? opts.y : SPAWN_Y; vx = 0; }
      else { x = rnd(SLOT_CX - SLOT_HW, SLOT_CX + SLOT_HW); y = SPAWN_Y + rnd(-8, 8); vx = rnd(-1.3, 1.3); }
      // Los regalos más grandes (más diamantes) pesan más: se hunden y compactan el montón.
      const density = 0.0012 * (1 + Math.min(2.5, (diamonds || 0) / 1500));
      const body = Bodies.circle(x, y, r, {
        density,
        restitution: 0.40,
        friction: 0.16,
        frictionStatic: 0.2,
        frictionAir: 0.012,
        sleepThreshold: 22,
      });
      if (opts.angle != null) Body.setAngle(body, opts.angle);
      // Misma velocidad de caída; el rebote viene de restitution.
      if (!opts.settled) { Body.setVelocity(body, { x: vx, y: rnd(0.3, 1.2) }); Body.setAngularVelocity(body, rnd(-0.12, 0.12)); }
      const img = document.createElement('img');
      img.className = 'gift-body'; img.src = src; img.alt = ''; img.referrerPolicy = 'no-referrer';
      img.style.width = sizePx + 'px'; img.style.height = sizePx + 'px';
      img.style.zIndex = String(zIndexFromDiamonds(diamonds || 0, ++spawnSeq));
      img.onerror = function () { this.onerror = null; this.src = FALLBACK_IMG; };
      img.style.transform = 'translate3d(' + (x - r).toFixed(1) + 'px,' + (y - r).toFixed(1) + 'px,0) rotate(' + (opts.angle || 0).toFixed(3) + 'rad)';
      giftsLayer.appendChild(img);
      World.add(world, body);
      gifts.push({
        body, img, sizePx,
        diamonds: Math.max(0, Number(diamonds) || 0),
        src,
        awakeSynced: false,
      });
      // Restauración: la meta ya viene de localStorage; no sumar otra vez.
      if (!opts.restore) {
        addMetaProgress(1, diamonds || 0, { silent: !!(opts && opts.silentMeta) });
      } else if (!opts.skipPersist) {
        schedulePersist();
      }
    }
    function spawnMany(src, count, gap, diamonds) {
      const n = Math.max(0, parseInt(count, 10) || 0);
      if (n < 1 || !src) return;
      gap = Math.max(70, gap || 150);
      for (let i = 0; i < n; i++) (function (idx) {
        setTimeout(() => addGiftBody(src, giftSizeForFill(diamonds || 0), diamonds || 0, {}), idx * gap);
      })(i);
    }
    function clearJar(skipPersist) {
      for (let i = gifts.length - 1; i >= 0; i--) removeGiftAt(i, true);
      if (!skipPersist) schedulePersist();
    }
    /** Recupera meta + imágenes tras reload / apagón (OBS). */
    function restorePersistedGifts() {
      if (isEmbed || isPreview) { renderMeta(false); return; }
      let data = null;
      let raw = null;
      try {
        raw = localStorage.getItem(lsKey);
        if (raw == null || raw === '') {
          // Compat clave antigua solo-meta
          const old = localStorage.getItem('lc_corazonlava_meta_' + (params.get('room') || 'default'));
          if (old != null) {
            setMeta(parseInt(old, 10) || 0, false, true);
            savePersistState();
          } else renderMeta(false);
          return;
        }
        const trimmed = String(raw).trim();
        if (trimmed.charAt(0) === '{') data = JSON.parse(trimmed);
        else {
          setMeta(parseInt(trimmed, 10) || 0, false, true);
          savePersistState();
          return;
        }
      } catch { renderMeta(false); return; }
      const t = Math.max(0, Math.round(Number(data.t) || 0));
      const list = Array.isArray(data.g) ? data.g.slice(-PERSIST_MAX) : [];
      setMeta(t, false, true);
      if (!list.length) return;
      restoringGifts = true;
      let i = 0;
      (function batch() {
        const end = Math.min(i + 28, list.length);
        for (; i < end; i++) {
          const it = list[i] || {};
          const d = Math.max(0, Number(it.d) || 0);
          const src = it.u || FALLBACK_IMG;
          const sizePx = Math.max(14, Number(it.s) || giftSizeForFill(d));
          const r = Math.max(6, (sizePx / 2) * 0.80);
          const x = rnd(SLOT_CX - SLOT_HW + r + 8, SLOT_CX + SLOT_HW - r - 8);
          const y = rnd(artY(38) + r, artY(72) - r);
          addGiftBody(src, sizePx, d, { restore: true, settled: true, x, y, angle: rnd(-0.35, 0.35) });
        }
        if (i < list.length) setTimeout(batch, 0);
        else { restoringGifts = false; schedulePersist(); }
      })();
    }

    // ---- Catálogo de regalos (id -> imagen) ----
    const giftImgById = new Map();
    fetch('/api/gifts').then((r) => r.json()).then((d) => {
      (d.results || []).forEach((g) => { if (g.image) giftImgById.set(String(g.id), g.image); });
      if (filterGift.image) FALLBACK_IMG = giftImgUrl(filterGift.image) || filterGift.image;
      else if (filterGift.id && giftImgById.has(String(filterGift.id))) {
        FALLBACK_IMG = giftImgUrl(giftImgById.get(String(filterGift.id))) || FALLBACK_IMG;
      } else {
        const first = [...giftImgById.values()][0];
        if (first) FALLBACK_IMG = first;
      }
    }).catch(() => {});

    function giftImgUrl(u) {
      if (!u) return '';
      try {
        if (new URL(u, location.href).origin === location.origin) return u;
      } catch {}
      return '/api/img-proxy?url=' + encodeURIComponent(u);
    }
    function resolveGiftImg(p) {
      if (p.image && p.giftId) giftImgById.set(String(p.giftId), p.image);
      const raw = p.image || giftImgById.get(String(p.giftId)) || '';
      return giftImgUrl(raw) || FALLBACK_IMG;
    }

    // ---- Toast «NAME DONATED» + regalo + monedas ----
    const giftToastsEl = document.getElementById('gift-toasts');
    const GT_MAX = 6;
    const GT_TTL_MS = 4200;
    let giftToastEnabled = true;
    let giftToastStyle = { color: '#1c1e26', opacity: 90 };
    function applyGiftToastStyle(cfg) {
      if (!cfg) return;
      if (cfg.giftToastColor !== undefined) giftToastStyle.color = cfg.giftToastColor || '#1c1e26';
      else if (cfg.color !== undefined) giftToastStyle.color = cfg.color || '#1c1e26';
      if (cfg.giftToastOpacity !== undefined) {
        const n = Number(cfg.giftToastOpacity);
        giftToastStyle.opacity = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 90;
      } else if (cfg.opacity !== undefined) {
        const n = Number(cfg.opacity);
        giftToastStyle.opacity = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 90;
      }
      const bg = hexToRgba(giftToastStyle.color, Math.min(100, giftToastStyle.opacity * 0.72), '1c1e26');
      document.documentElement.style.setProperty('--gifttoast-bg', bg);
      if (giftToastsEl) giftToastsEl.style.setProperty('--gifttoast-bg', bg);
    }
    function applyGiftToastSettings(cfg) {
      if (!cfg) return;
      if (cfg.giftToastEnabled !== undefined) giftToastEnabled = cfg.giftToastEnabled !== false;
      applyGiftToastStyle(cfg);
      if (!giftToastEnabled && giftToastsEl) giftToastsEl.innerHTML = '';
    }
    function showGiftToast(info) {
      if (!giftToastsEl || !giftToastEnabled) return;
      const name = String(info && (info.nickname || info.uniqueId) || 'Alguien').trim() || 'Alguien';
      const avatar = String(info && (info.profilePictureUrl || info.photo) || '').trim()
        || (isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC);

      const el = document.createElement('div');
      el.className = 'gift-toast';
      el.innerHTML =
        '<img class="gt-avatar" alt="" referrerpolicy="no-referrer">' +
        '<div class="gt-copy">' +
          '<span class="gt-thanks">Gracias</span>' +
          '<span class="gt-name"></span>' +
        '</div>';
      const av = el.querySelector('.gt-avatar');
      av.src = avatar;
      av.onerror = function () { this.onerror = null; this.src = isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC; };
      el.querySelector('.gt-name').textContent = name;

      giftToastsEl.insertBefore(el, giftToastsEl.firstChild);
      while (giftToastsEl.children.length > GT_MAX) {
        const last = giftToastsEl.lastElementChild;
        if (last) giftToastsEl.removeChild(last);
      }
      setTimeout(() => {
        el.classList.add('is-out');
        setTimeout(() => { try { el.remove(); } catch {} }, 300);
      }, GT_TTL_MS);
    }

    function sampleImg() {
      const arr = [...giftImgById.values()];
      return arr.length ? arr[Math.floor(Math.random() * arr.length)] : FALLBACK_IMG;
    }
    function dropOneGift(payload) {

      const p = payload || {};
      // Solo el regalo filtrado (o el mismo id/nombre) puede caer.
      if ((p.giftId || p.giftName) && !giftMatchesFilter(p)) return;
      const src = filteredGiftSrc(p);
      const d = Math.max(0, Number(p.diamonds) || filterGift.diamonds || 1);
      showGiftToast({
        nickname: p.nickname || 'Tester',
        giftName: filterGift.name || p.giftName || 'Gift',
        diamonds: d,
        repeatCount: 1,
        image: src,
        giftImage: src,
        giftId: filterGift.id,
        photo: p.photo || (isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC),
      });
      addGiftBody(src, giftSizeForFill(d), d, {});
    }

    // ---- WebSocket nativo del panel ----
    let ws, reconnectTimer, fillTimer = null;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
      ws.onopen = () => clearTimeout(reconnectTimer);
      ws.onclose = () => { reconnectTimer = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        const { type, payload } = msg;
        if (type === 'gift') { if (!isEmbed) onGift(payload); }
        else if (type === 'panic') clearJar();
        else if (type === 'corazonLavaTest') { if (!isEmbed) runFill((payload && payload.count) || 36, payload); }
        else if (type === 'corazonLavaDropOne') { if (!isEmbed) dropOneGift(payload); }
        else if (type === 'corazonLavaReset') { if (!isEmbed) { if (fillTimer) clearTimeout(fillTimer); clearJar(true); resetMeta(); rootSafeRainbow(); } }
        else if (type === 'settings') {
          if (payload && payload.corazonLava) {
            if (!params.get('jc')) applyJarTint(payload.corazonLava.tint);
            if (payload.corazonLava.tintRainbow !== undefined) applyJarRainbow(!!payload.corazonLava.tintRainbow);
            if (payload.corazonLava.sizes) setSizeTable(payload.corazonLava.sizes);
            applyMetaSettings(payload.corazonLava);
            applyFilterGiftSettings(payload.corazonLava);
            applyGiftToastSettings(payload.corazonLava);
          }
        }
      };
    }
    function onGift(p) {
      if (!p || p.streak) return;
      if (!giftMatchesFilter(p)) return;
      const n = Math.min(99, Math.max(1, p.repeatCount || 1));
      showGiftToast(p);
      spawnMany(filteredGiftSrc(p), n, 165, p.diamonds || filterGift.diamonds || 0);
    }
    connectWS();
    applyGiftToastStyle(giftToastStyle);
    if (isEmbed) renderMeta(false);
    else restorePersistedGifts();

    function runFill(total, payload) {

      if (fillTimer) { clearTimeout(fillTimer); fillTimer = null; }
      clearJar(true); resetMeta();
      if (payload) applyFilterGiftSettings(payload);
      const src = filteredGiftSrc(payload);
      const d = Math.max(1, Number((payload && payload.diamonds) || filterGift.diamonds) || 15);
      // Test ligero: bastan ~40 para ver el hueco; 200 congelaba el panel (Matter + DOM).
      const max = Math.max(8, Math.min(48, parseInt(total, 10) || 36));
      showGiftToast({
        nickname: 'Tester',
        giftName: filterGift.name || 'Heart Me',
        diamonds: d,
        image: src,
        giftId: filterGift.id,
        photo: isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC,
      });
      // Precarga 1 vez para no decodificar N veces en paralelo
      try { const pre = new Image(); pre.src = src; } catch {}
      let i = 0;
      (function tick() {
        if (i >= max) { renderMeta(true); fillTimer = null; return; }
        addGiftBody(src, giftSizeForFill(d), d, { silentMeta: true });
        i++;
        // Cada 4 regalos refresca la meta sin animar (barato)
        if (i % 4 === 0) renderMeta(false);
        fillTimer = setTimeout(tick, 95);
      })();
    }
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.kind !== 'corazonLava') return;
      if (d.type === 'test') runFill(d.count || 36, d);
      else if (d.type === 'dropOne') dropOneGift(d);
      else if (d.type === 'reset') { if (fillTimer) clearTimeout(fillTimer); clearJar(true); resetMeta(); rootSafeRainbow(); }
      else if (d.type === 'config') {
        if (d.tint !== undefined) applyJarTint(d.tint);
        if (d.tintRainbow !== undefined) applyJarRainbow(!!d.tintRainbow);
        if (d.sizes !== undefined) setSizeTable(d.sizes);
        if (d.metaLabel !== undefined || d.metaGoal !== undefined || d.metaMode !== undefined) {
          applyMetaSettings({
            metaLabel: d.metaLabel !== undefined ? d.metaLabel : metaCfg.label,
            metaGoal: d.metaGoal !== undefined ? d.metaGoal : metaCfg.goal,
            metaMode: d.metaMode !== undefined ? d.metaMode : metaCfg.mode,
          });
        }
        if (d.filterGiftId !== undefined || d.filterGiftName !== undefined || d.filterGiftImage !== undefined || d.filterGiftDiamonds !== undefined
            || d.giftId !== undefined || d.giftName !== undefined || d.image !== undefined) {
          applyFilterGiftSettings(d);
        }
        if (d.giftToastEnabled !== undefined || d.giftToastColor !== undefined || d.giftToastOpacity !== undefined) {
          applyGiftToastSettings({
            giftToastEnabled: d.giftToastEnabled !== undefined ? d.giftToastEnabled : giftToastEnabled,
            giftToastColor: d.giftToastColor !== undefined ? d.giftToastColor : giftToastStyle.color,
            giftToastOpacity: d.giftToastOpacity !== undefined ? d.giftToastOpacity : giftToastStyle.opacity,
          });
        }
      }
    });

    // ---- Vista previa standalone (?preview=1): llena en bucle ----
    if (isPreview) {
      const demo = () => {
        let i = 0; const total = 36; resetMeta();
        const src = filteredGiftSrc();
        const d = filterGift.diamonds || 15;
        (function tick() {
          if (i >= total) { setTimeout(() => { clearJar(); demo(); }, 6000); return; }
          addGiftBody(src, giftSizeForFill(d), d, { silentMeta: true });
          i++; if (i % 4 === 0) renderMeta(false);
          setTimeout(tick, 95);
        })();
      };
      setTimeout(demo, 1200);
    }
  })();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
