<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Ronda baile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; background: transparent !important; font-family: 'Inter', system-ui, sans-serif; }
    html.embed, html.embed body { width: 100%; height: 100%; }
    html.embed body { display: flex; align-items: center; justify-content: center; }
    html.embed .root { transform: scale(var(--fit, 1)); transform-origin: center center; }
    .root {
      --accent: #f5c542;
      --hud-h: 96px;
      position: relative;
      width: 520px; min-height: 178px;
    }
    .stage { position: relative; width: 100%; }
    .hud {
      position: relative;
      width: 100%;
      padding-top: 38px;
      min-height: calc(38px + var(--hud-h));
    }
    .hud.is-shake { animation: shake .22s ease; }
    .hud.is-boom { animation: boom .38s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-.4deg); }
      50% { transform: translateX(6px) rotate(.4deg); }
      80% { transform: translateX(-3px); }
    }
    @keyframes boom {
      0% { transform: scale(1); }
      30% { transform: scale(1.045); }
      100% { transform: scale(1); }
    }
    .av-wrap {
      position: absolute; left: 0; top: 38px; z-index: 4;
      width: var(--hud-h); height: var(--hud-h);
    }
    .av-stack { position: relative; width: 100%; height: 100%; z-index: 1; isolation: isolate; }
    .av {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
      background: #1a1a1a;
      border: 3px solid var(--accent, #f5c542);
      box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 0 14px rgba(245,197,66,.7), 0 8px 16px rgba(0,0,0,.5);
      transition: opacity .7s cubic-bezier(.22,.78,.18,1), transform .7s cubic-bezier(.22,.78,.18,1), filter .7s ease;
    }
    .av.is-back {
      opacity: 0;
      transform: scale(1.04);
      filter: blur(2px);
    }
    .av.is-front {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }
    .av.is-front { z-index: 2; }
    .av.is-back { z-index: 1; }
    .av.is-enter {
      z-index: 2;
      opacity: 0;
      transform: scale(.9);
      filter: blur(3px);
    }
    .is-live .av { border-color: #ff4d6d; box-shadow: 0 0 0 2px rgba(255,255,255,.25), 0 0 14px rgba(255,77,109,.55); }
    .av-ring {
      position: absolute; inset: -5px; border-radius: 50%; z-index: 2;
      border: 2px solid var(--accent, #f5c542); opacity: 0; pointer-events: none;
      box-shadow: 0 0 16px rgba(245,197,66,.7);
    }
    .is-live .av-ring { opacity: 1; animation: ringpulse 1.4s ease-in-out infinite; }
    .is-mvp .av-ring { opacity: 1; }
    @keyframes ringpulse {
      0%,100% { transform: scale(1); opacity: .85; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .crown {
      display: block; position: absolute; top: -22px; left: 50%; z-index: 8;
      font-size: 26px; filter: drop-shadow(0 2px 4px #000);
      opacity: 0; pointer-events: none;
      transform: translateX(-50%) translateY(-10px) scale(.7);
      transition: opacity .55s cubic-bezier(.22,.78,.18,1) .12s, transform .55s cubic-bezier(.16,.84,.18,1) .12s;
    }
    .is-mvp .crown {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .mvp-tag {
      display: block; position: absolute; left: 50%; bottom: 18px; z-index: 6; transform: translateX(-50%);
      font-size: 11px; font-weight: 900; letter-spacing: .14em; color: #f5c542;
      text-shadow: 0 1px 2px #000, 0 0 8px rgba(245,197,66,.8);
      opacity: 0; pointer-events: none;
      transition: opacity .5s ease .18s;
    }
    .is-mvp .mvp-tag { opacity: 1; }
    .scorechip {
      position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
      z-index: 10;
      min-width: 36px; padding: 2px 8px;
      background: #000; border-radius: 8px; border: 1px solid rgba(245,197,66,.45);
      color: #ffe566; font-size: 12px; font-weight: 900; text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,.45);
    }
    .plusfx {
      position: absolute; left: 112px; top: 8px; z-index: 8; pointer-events: none;
      font-size: 20px; font-weight: 900; color: #86efac;
      text-shadow: 0 2px 0 #000, 0 0 10px rgba(134,239,172,.5);
      animation: plusup .9s ease forwards;
    }
    @keyframes plusup {
      0% { opacity: 1; transform: translateY(8px) scale(.9); }
      100% { opacity: 0; transform: translateY(-42px) scale(1.15); }
    }
    .topline {
      position: absolute; left: 86px; top: 4px; z-index: 5;
      display: flex; align-items: flex-end; gap: 8px; max-width: 420px;
    }
    .nametab {
      position: static; max-width: 180px;
      padding: 4px 12px 5px;
      background: #000;
      border-radius: 10px;
      color: #fff; font-size: 13px; font-weight: 800; letter-spacing: .05em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.15;
      box-shadow: 0 6px 14px rgba(0,0,0,.4);
    }
    .nametab-h { font-size: 12px; }
    .donors { display: flex; align-items: flex-end; gap: 6px; }
    .donor { position: relative; width: 28px; height: 28px; flex: 0 0 28px; }
    .donor img {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover; display: block;
      background: #222; border: 1.5px solid rgba(255,255,255,.55);
    }
    .donor b {
      position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%);
      font-size: 8px; font-weight: 900; color: #fff; background: #000;
      padding: 0 3px; border-radius: 4px; white-space: nowrap;
    }
    .donor b.is-x { color: #ffe566; }
    .rect {
      position: relative;
      margin: 0 0 0 48px;
      width: 430px;
      height: var(--hud-h);
      min-height: var(--hud-h);
      padding: 0;
      background: #000;
      border-radius: 28px;
      box-shadow: 0 10px 24px rgba(0,0,0,.5);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .rect-body {
      position: relative; flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 8px 22px 26px 58px;
    }
    .delta {
      position: absolute; left: 58px; top: 50%; transform: translateY(-50%);
      font-size: 16px; font-weight: 900; color: #4ade80;
      text-shadow: 0 1px 2px #000;
      opacity: 0; pointer-events: none;
    }
    .delta.is-on { opacity: 1; }
    .phase {
      font-size: 32px; font-weight: 900; color: #fff; letter-spacing: .04em; line-height: 1;
      text-transform: uppercase; text-align: center; width: 100%;
    }
    .phase.is-timer {
      font-size: 42px; letter-spacing: .02em; color: transparent;
      background: linear-gradient(180deg, #ffe566 0%, #f5c542 42%, #b8860b 100%);
      -webkit-background-clip: text; background-clip: text;
    }
    .phase.is-low { color: #ff3b4e; background: none; -webkit-text-fill-color: #ff3b4e; }
    .phase.is-urgent { animation: heartbeat .45s ease-in-out infinite; color: #ff3b4e; background: none; -webkit-text-fill-color: #ff3b4e; }
    .phase.is-gold {
      font-size: 30px; letter-spacing: .06em;
      background: linear-gradient(180deg, #ffe566, #d4a017);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .phase.is-call {
      position: relative;
      font-size: 42px; letter-spacing: .1em;
      background: linear-gradient(180deg, #fff4a8 0%, #ffe566 28%, #f5c542 62%, #c9a227 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 10px rgba(255,229,102,.55));
      animation: callpop .32s ease;
    }
    .phase.is-call.is-long { font-size: 26px; letter-spacing: .06em; }
    .phase.is-call::before {
      content: ''; position: absolute; left: 50%; top: 50%;
      width: 140px; height: 36px; transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(255,229,102,.4), transparent 72%);
      pointer-events: none; z-index: -1;
    }
    @keyframes callpop {
      0% { transform: scale(.72); opacity: .4; filter: drop-shadow(0 0 0 rgba(255,229,102,0)); }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .phase.is-cyan { color: #5eead4; font-size: 36px; }
    .phase.is-ok { color: #ffe566; font-size: 34px; background: none; }
    .phase.is-fail { color: #ff6b8a; font-size: 22px; background: none; }
    .phase.is-sum { color: #fff; font-size: 28px; letter-spacing: .08em; }
    .phase small { display: block; font-size: 11px; letter-spacing: .16em; margin-top: 4px; font-weight: 800; color: #fff; -webkit-text-fill-color: #fff; background: none; }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      40% { transform: scale(1.22); filter: drop-shadow(0 0 10px #ff3b4e); }
    }
    .meta {
      position: absolute; right: 16px; bottom: 22px;
      font-size: 12px; font-weight: 800; color: #fff; letter-spacing: .02em;
      z-index: 2;
    }
    .meta.is-gold { color: #f5c542; }
    .barwrap {
      position: absolute; left: 0; right: 0; bottom: 0; height: 18px;
      background: rgba(255,255,255,.1);
      overflow: hidden;
    }
    .bar {
      position: relative;
      height: 100%; width: 0;
      background: linear-gradient(90deg, #ffd24a 0%, #ffe566 38%, #f5c542 100%);
      box-shadow: 2px 0 12px rgba(245,197,66,.38);
      transition: width .72s cubic-bezier(.16, .84, .18, 1);
      will-change: width;
    }
    .bar::after {
      content: '';
      position: absolute; right: 0; top: 0; bottom: 0;
      width: 28px;
      background: linear-gradient(90deg, transparent, rgba(255,248,200,.55) 55%, rgba(255,255,255,.12));
      pointer-events: none;
    }
    .barwrap.is-goal {
      background: linear-gradient(90deg, #f472b6, #e9d5ff, #7dd3fc);
      box-shadow: 0 0 16px rgba(244,114,182,.5), 0 0 22px rgba(125,211,252,.35);
    }
    .barwrap.is-goal::before {
      content: '';
      position: absolute; top: 0; bottom: 0; left: 0;
      width: 42%;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(105deg,
        transparent 0%,
        rgba(255,255,255,.0) 28%,
        rgba(255,255,255,.55) 46%,
        rgba(255,255,255,.95) 50%,
        rgba(255,255,255,.55) 54%,
        rgba(255,255,255,0) 72%,
        transparent 100%);
      animation: barshine 2.1s ease-in-out infinite;
    }
    .barwrap.is-goal .bar {
      width: 100% !important; background: transparent; box-shadow: none;
      transition: width .9s cubic-bezier(.16, .84, .18, 1);
    }
    .barwrap.is-goal .bar::after { display: none; }
    @keyframes barshine {
      0% { transform: translateX(-140%); opacity: .35; }
      18% { opacity: 1; }
      100% { transform: translateX(320%); opacity: .25; }
    }
    .barwrap span {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-size: 11px; font-weight: 900; color: #fff;
      text-shadow: 0 1px 2px #000; z-index: 2;
    }
    .footbar { display: none !important; }
    .banner {
      display: flex; justify-content: center;
      margin: 0 0 0 48px; width: 430px;
      background: transparent; box-shadow: none; padding: 0;
      opacity: 0; transform: translateY(8px) scale(.94);
      max-height: 0; overflow: hidden;
      pointer-events: none;
      transition: opacity .42s cubic-bezier(.22,.78,.18,1), transform .42s cubic-bezier(.22,.78,.18,1), max-height .42s ease, margin .42s ease;
    }
    .banner.is-on {
      opacity: 1; transform: translateY(0) scale(1);
      max-height: 52px; margin-top: 16px;
    }
    .banner-pill {
      display: flex; align-items: stretch; position: relative;
      overflow: hidden; background: #c81e3a; color: #fff;
      border-radius: 999px; box-shadow: 0 3px 10px rgba(200,30,58,.35);
      font-weight: 800; line-height: 1;
      transition: border-radius .35s ease, background .35s ease, box-shadow .35s ease;
    }
    .banner-pill.is-pop { animation: banpop .45s cubic-bezier(.16,.84,.18,1); }
    @keyframes banpop {
      0% { transform: scale(.9); filter: brightness(.85); }
      62% { transform: scale(1.045); filter: brightness(1.12); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    #bantxt, #bantime { transition: opacity .22s ease; }
    .banner.is-msg .banner-pill { padding: 4px 12px; font-size: 10px; }
    .banner.is-chip .banner-pill { font-size: 11px; }
    .banner.is-boost .banner-pill {
      border-radius: 5px; font-size: 13px; background: #e31b3c;
      box-shadow: 0 2px 8px rgba(0,0,0,.28);
    }
    .banner.is-boost .ban-left { padding: 7px 12px 7px 11px; gap: 0; font-weight: 700; }
    .banner.is-boost .ban-grid { display: none; }
    .banner.is-boost .ban-time {
      display: flex; align-items: center; justify-content: center;
      background: #7a1022; padding: 7px 10px; min-width: 44px;
      font-size: 13px; font-weight: 800; letter-spacing: .02em;
    }
    .banner.is-summary .banner-pill {
      border-radius: 5px; padding: 7px 14px; font-size: 13px;
      background: #c81e3a; font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.28);
    }
    .banner.is-summary .ban-left { padding: 0; }
    .banner.is-summary .ban-grid { display: none; }
    .banner .fill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      background: rgba(0,0,0,.22); pointer-events: none;
    }
    .ban-left {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: 5px;
      padding: 3px 9px;
    }
    .banner.is-msg .ban-left { padding: 0; }
    .ban-grid {
      display: none; grid-template-columns: 1fr 1fr; gap: 1.5px;
      width: 9px; height: 9px; flex: 0 0 9px;
    }
    .banner.is-chip .ban-grid { display: grid; }
    .ban-grid i { display: block; background: rgba(255,255,255,.38); border-radius: 1px; }
    .ban-grid i.on { background: #fff; }
    .ban-time {
      display: none; position: relative; z-index: 1;
      background: #8b1428; padding: 3px 8px;
      font-variant-numeric: tabular-nums;
    }
    .banner.has-time .ban-time { display: flex; align-items: center; }
    .banner i { font-style: normal; color: #ffe566; }
    .combo {
      display: none; position: absolute; inset: 0; z-index: 9;
      align-items: center; justify-content: center; pointer-events: none;
    }
    .combo.is-on { display: flex; }
    .combo b {
      font-size: 72px; font-weight: 900; color: #fff; letter-spacing: .04em;
      text-shadow: 0 4px 0 #000, 0 0 22px #f5c542;
      animation: combopop .16s ease;
    }
    .combo i { font-style: normal; display: block; font-size: 18px; letter-spacing: .2em; color: #f5c542; text-align: center; }
    @keyframes combopop { from { transform: scale(.55); } to { transform: scale(1); } }
    .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .spark {
      position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #ffe566;
      animation: spark .7s ease-out forwards;
    }
    @keyframes spark { to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); } }
  </style>
</head>
<body>
  <div class="root" id="root">
    <div class="stage">
      <div class="hud" id="hud">
        <div class="topline">
          <div class="nametab" id="hostwrap"><span class="nametab-n">TU LIVE</span> <span class="nametab-h">❤️</span></div>
          <div class="donors" id="donors"></div>
        </div>
        <div class="av-wrap">
          <div class="crown">👑</div>
          <div class="av-ring"></div>
          <div class="av-stack">
            <img class="av is-front" id="av" alt="">
            <img class="av is-back" id="av2" alt="">
          </div>
          <div class="mvp-tag">MVP</div>
          <div class="scorechip" id="badge">1</div>
        </div>
        <div class="rect" id="rect">
          <div class="rect-body">
            <div class="delta" id="delta">+1</div>
            <div class="phase" id="phase">PREPÁRATE</div>
            <div class="meta" id="meta">100</div>
            <div class="combo" id="combo"><div><i>COMBO</i><b id="combn">1</b></div></div>
          </div>
          <div class="barwrap" id="barwrap"><div class="bar" id="bar"></div><span id="foottxt"></span></div>
        </div>
      </div>
      <div id="plusbox"></div>
    </div>
    <div class="banner" id="banner">
      <div class="banner-pill">
        <div class="fill" id="banfill"></div>
        <span class="ban-left"><span class="ban-grid" id="bangrid"></span><span id="bantxt"></span></span>
        <span class="ban-time" id="bantime"></span>
      </div>
    </div>
  </div>
  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const isEmbed = params.get('embed') === '1';
  const FALLBACK_AV = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="#222"/><circle cx="40" cy="30" r="14" fill="#666"/><ellipse cx="40" cy="68" rx="22" ry="16" fill="#666"/></svg>');
  const DEMO_MVP_PHOTO = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="#6d28d9"/><circle cx="40" cy="28" r="14" fill="#fde68a"/><ellipse cx="40" cy="68" rx="22" ry="16" fill="#fde68a"/></svg>');
  let cfg = { durationSec: 90, prepSec: 5, recapSec: 2, meta: 100, multiplier: 2, multiplierSec: 40, multiplierDelaySec: 0, likesPerPoint: 25, hostName: '', hostPhoto: '', accent: '#f5c542' };
  let hostName = 'TU LIVE';
  let hostPhoto = '';
  let snap = { phase: 'idle', remain: 0, points: 0, taps: 0, meta: 100, reached: false, multiplier: 3, multLeft: 0, hostName: '', hostPhoto: '' };
  let demoTimer = 0;
  let demoRaf = 0;
  function stopDemo() {
    clearInterval(demoTimer);
    demoTimer = 0;
    if (demoRaf) cancelAnimationFrame(demoRaf);
    demoRaf = 0;
    if (avSwapTimer) { clearTimeout(avSwapTimer); avSwapTimer = 0; }
    if (mvpTimer) { clearTimeout(mvpTimer); mvpTimer = 0; }
    mvpRevealAt = 0;
  }
  let donors = new Map();
  let lastPts = 0;
  let comboQ = Promise.resolve();
  let ac = null;
  let mvpShown = false;
  let lastCallWord = '';
  let lastBanKey = '';
  let mvpRevealAt = 0;
  let mvpTimer = 0;
  const MVP_DELAY_MS = 1600;

  const $ = (id) => document.getElementById(id);
  function fmt(n) {
    return Math.round(Math.max(0, Number(n) || 0)).toLocaleString('de-DE');
  }
  function needLine(points, meta) {
    return fmt(meta);
  }
  function setHostName(name) {
    const el = $('hostwrap');
    if (!el) return;
    const n = String(name || 'TU LIVE').replace(/^@+/, '').trim() || 'TU LIVE';
    el.replaceChildren();
    const nm = document.createElement('span');
    nm.className = 'nametab-n';
    nm.textContent = n.toUpperCase();
    const ht = document.createElement('span');
    ht.className = 'nametab-h';
    ht.textContent = ' ❤️';
    el.append(nm, ht);
  }
  let boostDemo = 0;
  function runBoost(mult, sec) {
    const s = Math.max(1, Number(sec) || 10);
    const m = Number(mult) === 3 ? 3 : 2;
    snap.boostMult = m;
    snap.boostLeft = s;
    snap.boostSec = s;
    clearInterval(boostDemo);
    const t0 = Date.now();
    boostDemo = setInterval(() => {
      const left = s - (Date.now() - t0) / 1000;
      snap.boostLeft = Math.max(0, left);
      if (left <= 0) {
        clearInterval(boostDemo);
        snap.boostMult = 1;
        snap.boostLeft = 0;
      }
      render();
    }, 100);
    render();
  }
  function clock(sec) {
    const s = Math.max(0, Math.ceil(Number(sec) || 0));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + String(r).padStart(2, '0');
  }
  const CALL_WORDS = ['PREPÁRATE', 'READY', 'SET', 'GO'];
  function prepCallWord(s) {
    const total = Math.max(4, Number(s && s.prepSec) || Number(cfg.prepSec) || 4);
    const left = Math.max(0, Number(s && s.remain) || 0);
    const elapsed = Math.max(0, total - left);
    const idx = Math.min(CALL_WORDS.length - 1, Math.floor((elapsed / total) * CALL_WORDS.length));
    return CALL_WORDS[idx] || CALL_WORDS[0];
  }
  function beep(freq, dur, type) {
    if (isEmbed) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.07, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch {}
  }
  function giftCoins(d) {
    const each = Number(d.diamonds || d.diamondCount || 0) || 0;

    const lerp = (a, b, u) => a + (b - a) * u;
    const t0 = performance.now();
    let lastPhase = '';
    let lastSeats = -1;
    const loop = (now) => {
      const elapsed = (now - t0) / 1000;
      if (elapsed >= endAt) {
        snap.phase = 'result';
        snap.reached = true;
        snap.remain = 0;
        snap.boostLeft = 0;
        snap.armLeft = 0;
        mvpShown = true;
        render();
        demoRaf = 0;
        return;
      }
      let i = 0;
      while (i < keys.length - 1 && keys[i + 1].at <= elapsed) i += 1;
      const a = keys[i];
      const b = keys[i + 1] || a;
      const span = Math.max(0.0001, b.at - a.at);
      const u = b === a ? 1 : Math.min(1, Math.max(0, (elapsed - a.at) / span));
      const same = a.phase === b.phase;
      const num = (k) => {
        const av = Number(a[k]);
        const bv = Number(b[k]);
        if (!Number.isFinite(av)) return Number.isFinite(bv) ? bv : 0;
        if (!same || !Number.isFinite(bv)) return av;
        return lerp(av, bv, u);
      };
      if (a.phase !== lastPhase) {
        if (a.phase === 'live') beep(740, 0.08);
        if (a.phase === 'result' && a.reached) { sparks(); beep(880, 0.25); }
        lastPhase = a.phase;
      }
      if (a.seats !== lastSeats) {
        if (lastSeats >= 0 && a.seats > lastSeats) {
          floatPlus(a.delta || 1);
          shake(false);
          beep(880, 0.07);
        }
        lastSeats = a.seats;
      }
      Object.assign(snap, {
        phase: a.phase,
        remain: num('remain'),
        points: Math.round(num('points')),
        seats: a.seats,
        seatsNeed,
        multiplier: bono,
        meta,
        delta: (elapsed - a.at) < 0.7 ? (Number(a.delta) || 0) : 0,
        boostLeft: num('boostLeft'),
        boostMult: Number(a.boostMult) || 1,
        boostSec: Number(a.boostSec) || 10,
        armLeft: num('armLeft'),
        prepSec: Number(a.prepSec) || Number(b.prepSec) || 4,
        boostSummaryLeft: num('boostSummaryLeft'),
        boostSummaryPts: Number(a.boostSummaryPts) || Number(b.boostSummaryPts) || 0,
        taps: Number(a.taps) || 0,
        likePts: Number(a.likePts) || 0,
        giftPts: Number(a.giftPts) || 0,
        startPts: Number(a.startPts) || 0,
        reached: !!a.reached,
        mvp: a.mvp || b.mvp || null,
        hostName, hostPhoto,
      });
      render();
      demoRaf = requestAnimationFrame(loop);
    };
    render();
    demoRaf = requestAnimationFrame(loop);
  }

  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'settings' && m.payload) {
        if (m.payload.baileRonda) applyCfg(m.payload.baileRonda);
        if (m.payload.tiktokUser) hostName = String(m.payload.tiktokUser).replace(/^@+/, '');
        if (m.payload.tiktokPhoto) hostPhoto = String(m.payload.tiktokPhoto || '');
        render();
      } else if (m.type === 'baileRondaState' || m.type === 'baileRondaStart') {
        if (!isEmbed) applySnap(m.payload);
      } else if (m.type === 'baileRondaReset') {
        if (!isEmbed) {
          donors = new Map(); mvpShown = false;
          snap = { phase: 'idle', remain: 0, points: 0, taps: 0, meta: cfg.meta, reached: false, multiplier: cfg.multiplier, multLeft: 0, hostName, hostPhoto };
          render();
        }
      } else if (m.type === 'baileRondaTest') {
        if (!isEmbed) runDemo();
      } else if (m.type === 'gift') {
        onGift(m.payload);
      } else if (m.type === 'like') {
        onLike(m.payload);
      }
    };
  }
  window.addEventListener('message', (e) => {
    const d = e.data; if (!d || d.kind !== 'baileronda') return;
    if (d.type === 'config') applyCfg(d.config);
    else if (d.type === 'snap') applySnap(d.snap);
    else if (d.type === 'boost') runBoost(d.mult, d.sec);
    else if (d.type === 'test') runDemo();
    else if (d.type === 'start') {
      stopDemo();
      donors = new Map();
      mvpShown = false;
    }
    else if (d.type === 'reset') {
      stopDemo();
      donors = new Map(); mvpShown = false;
      snap = { phase: 'idle', remain: 0, points: 0, taps: 0, meta: cfg.meta, reached: false, multiplier: cfg.multiplier, multLeft: 0, hostName, hostPhoto };
      render();
    }
  });
  if (isEmbed) {
    document.documentElement.classList.add('embed');
    const fit = () => document.documentElement.style.setProperty('--fit', String(Math.min(window.innerWidth / 520, window.innerHeight / 245)));
    fit(); window.addEventListener('resize', fit);
  }
  render();
  connectWS();
})();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
