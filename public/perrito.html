<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Perrito (regalos)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }

    .stage {
      width: 540px; height: 785px; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(var(--tf-fit, 1)); transform-origin: center center;
    }
    .jar {
      position: absolute; left: 50%; top: 0; transform: translateX(-50%);
      width: 100%; height: 720px; pointer-events: none;
    }

    /* Silueta del perrito detrás de los regalos (profundidad) */
    .jar-glass-back {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; object-position: center bottom; pointer-events: none; z-index: 1;
    }

    /* Regalos recortados a la silueta del perrito (máscara con su propia imagen) */
    .jar-interior {
      position: absolute; inset: 0; z-index: 3; isolation: isolate;
      -webkit-mask-image: url('/jarron/perrito.png'); mask-image: url('/jarron/perrito.png');
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center bottom; mask-position: center bottom;
      -webkit-mask-origin: border-box; mask-origin: border-box; mask-mode: alpha;
    }
    .gifts-layer { position: absolute; inset: 0; overflow: visible; }
    .gift-body {
      position: absolute; top: 0; left: 0; object-fit: contain; pointer-events: none; will-change: transform;
      transform: translate3d(-999px, -999px, 0); filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); transition: opacity .2s linear;
    }

    /* Tinte opcional: colorea el perrito con el color elegido */
    .jar-tint {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: var(--jar-tint, transparent); mix-blend-mode: color;
      opacity: var(--jar-tint-opacity, 0);
      -webkit-mask-image: url('/jarron/perrito.png'); mask-image: url('/jarron/perrito.png');
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center bottom; mask-position: center bottom;
    }
    /* Arcoíris: hue-rotate (estable; evita thrash de layout) */
    html.jar-rainbow .jar-tint {
      background: #ff2bd6 !important;
      opacity: 1 !important;
      mix-blend-mode: color;
      animation: jarRainbowHue 2.8s linear infinite;
    }
    @keyframes jarRainbowHue {
      to { filter: hue-rotate(360deg); }
    }

    /* HUD debajo del perrito */
    .hud-stack {
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      z-index: 7; pointer-events: none; width: min(100%, 420px);
    }
    /* Sin barra rotativa: monedas pegadas bajo la alcancía */
    .hud-stack.is-coins-only {
      bottom: auto; top: 726px;
    }
    .top-donor-bar {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px 10px 8px 12px; border-radius: 999px;
      background: var(--topbar-bg, rgba(22, 24, 32, .88)); -webkit-backdrop-filter: var(--topbar-blur, blur(6px)); backdrop-filter: var(--topbar-blur, blur(6px));
      box-shadow: 0 6px 20px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08);
      font-family: 'Press Start 2P', 'Rubik', system-ui, sans-serif;
      transition: opacity .25s ease, transform .25s ease;
    }
    .top-donor-bar[hidden] { display: none !important; }
    .top-donor-bar.is-switch { animation: tdSwitch .35s ease; }
    @keyframes tdSwitch { 0% { opacity: .35; transform: translateY(4px); } 100% { opacity: 1; transform: translateY(0); } }
    .td-medal { font-size: 22px; line-height: 1; flex: 0 0 auto; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
    .td-avatar {
      width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; object-fit: cover;
      border: 2px solid rgba(255,255,255,.22); box-shadow: 0 2px 8px rgba(0,0,0,.4);
      background: rgba(255,255,255,.08);
    }
    .td-info {
      flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center;
    }
    .td-name {
      font-family: 'Rubik', system-ui, sans-serif; font-size: 14px; font-weight: 800;
      color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 2px 0 rgba(0,0,0,.55);
    }
    .td-amount-wrap {
      display: flex; align-items: center; gap: 7px; flex: 0 0 auto;
      padding: 6px 12px 6px 8px; border-radius: 999px;
      background: rgba(8, 10, 16, .72); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .td-coin {
      width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto;
      background: radial-gradient(circle at 35% 30%, #ffe9a0 0%, #f7c948 45%, #e0a92e 72%, #b07d1a 100%);
      box-shadow: inset 0 0 0 2px rgba(255,236,170,.45), inset 0 -2px 5px rgba(140,85,10,.5), 0 1px 3px rgba(0,0,0,.45);
    }
    .td-amount {
      font-size: 11px; font-weight: 400; color: #fff; letter-spacing: .02em;
      text-shadow: 0 2px 0 rgba(0,0,0,.55); font-variant-numeric: tabular-nums; min-width: 2ch;
    }

    /* Contador de diamantes debajo del perrito */
    .coin-total {
      position: relative; left: auto; bottom: auto; transform: none;
      display: flex; align-items: center; gap: 9px; pointer-events: none;
      padding: 7px 18px 7px 9px; border-radius: 999px;
      background: rgba(16,18,26,.72); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      box-shadow: 0 6px 18px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
      font-family: 'Rubik', system-ui, sans-serif;
    }
    .coin-ico {
      width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto;
      background: radial-gradient(circle at 35% 30%, #ffe9a0 0%, #f7c948 45%, #e0a92e 72%, #b07d1a 100%);
      box-shadow: inset 0 0 0 2px rgba(255,236,170,.45), inset 0 -3px 6px rgba(140,85,10,.5), 0 1px 3px rgba(0,0,0,.45);
    }
    .coin-num {
      font-weight: 900; font-size: 26px; color: #ffd54a; letter-spacing: .02em;
      -webkit-text-stroke: 1.5px rgba(60,45,15,.55); paint-order: stroke fill;
      text-shadow: 0 2px 4px rgba(0,0,0,.4); font-variant-numeric: tabular-nums;
      display: inline-block; transition: transform .12s ease;
    }
    .coin-num.bump { animation: coinbump .25s ease; }
    @keyframes coinbump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

    /* Toast de regalo: pegados a la alcancía (pueden montarse encima) */
    .gift-toasts {
      position: absolute; left: 6px; top: 32%;
      width: min(300px, 92%); max-height: 48%; z-index: 8; pointer-events: none;
      display: flex; flex-direction: column; justify-content: flex-start; gap: 6px;
      overflow: hidden;
    }
    .gift-toast {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px 7px 8px; border-radius: 999px;
      background: var(--gifttoast-bg, rgba(28, 30, 38, .9)); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      box-shadow: 0 4px 16px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.07);
      font-family: 'Rubik', system-ui, sans-serif;
      animation: gt-in .32s cubic-bezier(.22,1.1,.36,1) both;
      max-width: 100%;
    }
    .gift-toast.is-out { animation: gt-out .28s ease forwards; }
    @keyframes gt-in { 0% { opacity: 0; transform: translateX(-18px) scale(.96); } 100% { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes gt-out { to { opacity: 0; transform: translateX(-14px) scale(.97); } }
    .gt-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto; object-fit: cover;
      border: 1.5px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06);
    }
    .gt-text {
      flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 800; letter-spacing: .02em;
      color: #fff; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 0 rgba(0,0,0,.55);
    }
    .gt-gift {
      width: 28px; height: 28px; object-fit: contain; flex: 0 0 auto;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.35));
    }
    .gt-meta {
      flex: 0 1 auto; min-width: 0; font-size: 12px; font-weight: 800;
      color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 0 rgba(0,0,0,.55);
    }
    .gt-meta .gt-coins { color: #ffd54a; margin-left: .2em; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="jar">
      <img class="jar-glass-back" src="/jarron/perrito.png" alt="" draggable="false" />
      <div class="jar-tint" id="jar-tint" aria-hidden="true"></div>
      <div class="jar-interior" id="bowl">
        <div class="gifts-layer" id="gifts-layer"></div>
      </div>
    </div>
    <div class="gift-toasts" id="gift-toasts" aria-live="polite"></div>
    <div class="hud-stack" id="hud-stack">
      <div class="top-donor-bar" id="top-donor-bar">
        <span class="td-medal" id="td-medal" aria-hidden="true">🥇</span>
        <img class="td-avatar" id="td-avatar" alt="" referrerpolicy="no-referrer" />
        <div class="td-info">
          <span class="td-name" id="td-name">—</span>
        </div>
        <div class="td-amount-wrap">
          <span class="td-coin" aria-hidden="true"></span>
          <span class="td-amount" id="td-amount">0</span>
        </div>
      </div>
      <div class="coin-total" id="coin-total" aria-hidden="true">
        <span class="coin-ico"></span>
        <span class="coin-num" id="coin-num">0</span>
      </div>
    </div>
  </div>

  <script src="/js/matter.min.js"></script>
  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isPreview = params.get('preview') === '1';
    const isEmbed = params.get('embed') === '1'; // vista previa dentro del panel (fija)

    // ---- Tinte (color / arcoíris) ----
    let jarTintColor = '';
    let jarRainbowOn = false;
    function applyJarTint(color) {
      const root = document.documentElement;
      const c = String(color || '').trim();
      jarTintColor = c;
      if (jarRainbowOn) return;
      if (!c || /^#?fff(fff)?$/i.test(c) || c === 'none' || c === 'transparent') {
        root.style.removeProperty('--jar-tint');
        root.style.removeProperty('--jar-tint-opacity');
        return;
      }
      root.style.setProperty('--jar-tint', c.charAt(0) === '#' ? c : '#' + c);
      root.style.setProperty('--jar-tint-opacity', '1');
    }
    function applyJarRainbow(on) {
      const next = !!on;
      const root = document.documentElement;
      jarRainbowOn = next;
      if (next) {
        root.classList.add('jar-rainbow');
        root.style.setProperty('--jar-tint-opacity', '1');
      } else {
        root.classList.remove('jar-rainbow');
        applyJarTint(jarTintColor);
      }
    }
    function rootSafeRainbow() {
      if (!jarRainbowOn) return;
      document.documentElement.classList.add('jar-rainbow');
      document.documentElement.style.setProperty('--jar-tint-opacity', '1');
    }
    applyJarTint(params.get('jc'));
    if (params.get('jr') === '1') applyJarRainbow(true);

    // Escala para que el perrito se vea completo (sin recortes).
    (function fit() {
      let lastK = -1;
      let resizeTimer = null;
      function apply() {
        const k = Math.min((innerWidth || 540) / 540, (innerHeight || 785) / 785) || 1;
        if (Math.abs(k - lastK) < 0.01) return;
        lastK = k;
        document.documentElement.style.setProperty('--tf-fit', String(k));
      }
      apply();
      addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(apply, 60);
      });
    })();

    // El PNG del perrito es de cristal: su interior es TRANSPARENTE y solo el
    // contorno es opaco. Generamos una "silueta rellena" (flood-fill desde los
    // bordes) que usamos para DOS cosas:
    //   1) Como máscara, para que los regalos se vean dentro de todo el cuerpo.
    //   2) Para crear paredes de colisión que siguen el contorno real del perro,
    //      así los regalos chocan con el borde y NO se van a los huecos (vacío).
    function buildPerritoShape() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        try {
          const w = img.naturalWidth, h = img.naturalHeight;
          if (!w || !h) return;
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const data = ctx.getImageData(0, 0, w, h).data;
          const N = w * h, A = 24; // umbral de opacidad para detectar el contorno
          const outside = new Uint8Array(N); // 1 = fondo exterior
          const stack = [];
          function push(x, y) {
            if (x < 0 || y < 0 || x >= w || y >= h) return;
            const i = y * w + x;
            if (outside[i]) return;
            if (data[i * 4 + 3] >= A) return; // el contorno opaco corta el relleno
            outside[i] = 1; stack.push(i);
          }
          for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
          for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
          while (stack.length) {
            const i = stack.pop(), x = i % w, y = (i / w) | 0;
            push(x - 1, y); push(x + 1, y); push(x, y - 1); push(x, y + 1);
          }
          // --- Máscara rellena ---
          const out = ctx.createImageData(w, h), od = out.data;
          for (let i = 0; i < N; i++) {
            const a = outside[i] ? 0 : 255; // opaco en todo lo que NO es fondo
            od[i * 4] = 255; od[i * 4 + 1] = 255; od[i * 4 + 2] = 255; od[i * 4 + 3] = a;
          }
          ctx.putImageData(out, 0, 0);
          const url = cv.toDataURL('image/png');
          ['bowl', 'jar-tint'].forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.style.webkitMaskImage = 'url(' + url + ')';
            el.style.maskImage = 'url(' + url + ')';
          });

          // --- Colisiones que siguen la silueta ---
          // Mapeo de píxeles de la imagen (cuadrada) al stage: la imagen ocupa los
          // 540px inferiores (IMG_TOP..720). Reducimos a una rejilla para no crear
          // demasiados cuerpos.
          const inAt = (px, py) => (px < 0 || py < 0 || px >= w || py >= h) ? 0 : (outside[py * w + px] ? 0 : 1);
          const CELL = 9;
          const gw = Math.ceil(w / CELL), gh = Math.ceil(h / CELL);
          const ins = new Uint8Array(gw * gh);
          for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
            const cx = Math.min(w - 1, gx * CELL + (CELL >> 1));
            const cy = Math.min(h - 1, gy * CELL + (CELL >> 1));
            ins[gy * gw + gx] = inAt(cx, cy);
          }
          const sX = (px) => (px / w) * IMG_SIZE;
          const sY = (py) => IMG_TOP + (py / h) * IMG_SIZE;
          const cw = sX(CELL), ch = sY(CELL) - IMG_TOP; // tamaño de celda en stage
          const wallOptsS = { isStatic: true, friction: 0.36, restitution: 0.42 };
          const bodies = [];
          // Una celda EXTERIOR contigua a una INTERIOR se convierte en pared: forma
          // un muro que abraza la silueta por fuera y contiene los regalos dentro.
          for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
            if (ins[gy * gw + gx]) continue;
            const i = gy * gw + gx;
            const nb = (ins[i - 1] && gx > 0) || (ins[i + 1] && gx < gw - 1) ||
                       (ins[i - gw] && gy > 0) || (ins[i + gw] && gy < gh - 1);
            if (!nb) continue;
            const px = gx * CELL + (CELL / 2), py = gy * CELL + (CELL / 2);
            bodies.push(Bodies.rectangle(sX(px), sY(py), cw + 1, ch + 1, wallOptsS));
          }
          if (bodies.length) World.add(world, bodies);

          // --- Punto de aparición: dentro del cuerpo, en la parte más ancha (torso) ---
          // 1) Buscamos la fila con el tramo continuo más ancho => el torso.
          let bestRow = -1, bestW = 0, bestL = 0, bestR = 0;
          for (let gy = 0; gy < gh; gy++) {
            let runStart = -1, bL = 0, bR = -1;
            for (let gx = 0; gx <= gw; gx++) {
              const on = gx < gw && ins[gy * gw + gx];
              if (on) { if (runStart < 0) runStart = gx; }
              else { if (runStart >= 0 && (gx - runStart) > (bR - bL)) { bL = runStart; bR = gx - 1; } runStart = -1; }
            }
            if (bR - bL > bestW) { bestW = bR - bL; bestRow = gy; bestL = bL; bestR = bR; }
          }
          if (bestRow >= 0) {
            const midGx = Math.round((bestL + bestR) / 2);
            // 2) Subimos por la columna central hasta el lomo para soltar desde arriba.
            let topRow = bestRow;
            while (topRow > 0 && ins[(topRow - 1) * gw + midGx]) topRow--;
            SLOT_CX = sX(midGx * CELL + CELL / 2);
            SLOT_HW = Math.max(20, sX((bestR - bestL) * CELL) * 0.30);
            SPAWN_Y = sY((topRow + 2) * CELL);
          }
        } catch (e) { console.warn('[perrito] no se pudo generar la silueta/colisiones', e); }
      };
      img.src = '/jarron/perrito.png';
    }

    let FALLBACK_IMG = '/jarron/perrito.png';

    // ---- Contador + regalos persistidos (sobreviven apagón / reload de OBS) ----
    const coinNumEl = document.getElementById('coin-num');
    let totalDiamonds = 0;
    const lsKey = 'lc_perrito_' + (params.get('room') || 'default');
    const PERSIST_MAX = 400;
    let persistTimer = null;
    let restoringGifts = false;
    function schedulePersist() {
      if (isEmbed || isPreview || restoringGifts) return;
      clearTimeout(persistTimer);
      persistTimer = setTimeout(savePersistState, 220);
    }
    function savePersistState() {
      if (isEmbed || isPreview) return;
      try {
        const g = gifts.slice(-PERSIST_MAX).map((x) => ({
          u: String((x.img && (x.img.currentSrc || x.img.src)) || x.src || FALLBACK_IMG),
          d: Math.max(0, Math.round(Number(x.diamonds) || 0)),
          s: Math.max(14, Math.round(Number(x.sizePx) || 28)),
        }));
        localStorage.setItem(lsKey, JSON.stringify({ v: 2, t: totalDiamonds, g }));
      } catch {
        try {
          const g = gifts.slice(-120).map((x) => ({
            u: String((x.img && (x.img.currentSrc || x.img.src)) || x.src || FALLBACK_IMG),
            d: Math.max(0, Math.round(Number(x.diamonds) || 0)),
            s: Math.max(14, Math.round(Number(x.sizePx) || 28)),
          }));
          localStorage.setItem(lsKey, JSON.stringify({ v: 2, t: totalDiamonds, g }));
        } catch { /* quota */ }
      }
    }
    function setDiamonds(n, bump, skipPersist) {
      totalDiamonds = Math.max(0, Math.round(Number(n) || 0));
      if (!coinNumEl) return;
      coinNumEl.textContent = totalDiamonds.toLocaleString('es-ES');
      if (bump) { coinNumEl.classList.remove('bump'); void coinNumEl.offsetWidth; coinNumEl.classList.add('bump'); }
      if (!skipPersist) schedulePersist();
    }
    function clearPersistState() {
      try { localStorage.removeItem(lsKey); } catch {}
    }

    // ---- Barra rotativa TOP DONATOR (encima del contador) ----
    const topBarEl = document.getElementById('top-donor-bar');
    const tdMedal = document.getElementById('td-medal');
    const tdAvatar = document.getElementById('td-avatar');
    const tdName = document.getElementById('td-name');
    const tdAmount = document.getElementById('td-amount');
    const TD_DEFAULT_PIC = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
    const TD_PREVIEW_PIC = '/jarron/lv.png';
    const TOP_MEDALS = ['🥇', '🥈', '🥉', '🏅', '🏅', '🏅', '🏅', '🏅', '🏅', '🏅'];
    let topGifters = [];
    let topBarCfg = { enabled: true, limit: 3, color: '#161820', opacity: 88 };
    let topCycleIdx = 0;
    let topCycleTimer = null;


    function hexToRgba(hex, opacityPct, fallbackHex) {
      let h = String(hex || '').replace('#', '').trim();
      if (h.length === 3) h = h.split('').map((c) => c + c).join('');
      if (!/^[0-9a-fA-F]{6}$/.test(h)) h = String(fallbackHex || '161820').replace('#', '');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      const a = Math.max(0, Math.min(100, Number(opacityPct))) / 100;
      if (!Number.isFinite(a)) return 'rgba(' + r + ',' + g + ',' + b + ',0.88)';
      return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }
    function applyTopBarStyle(cfg) {
      if (!cfg) return;
      if (cfg.topBarColor !== undefined) topBarCfg.color = cfg.topBarColor || '#161820';
      else if (cfg.color !== undefined) topBarCfg.color = cfg.color || '#161820';
      if (cfg.topBarOpacity !== undefined) {
        const n = Number(cfg.topBarOpacity);
        topBarCfg.opacity = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 88;
      } else if (cfg.opacity !== undefined) {
        const n = Number(cfg.opacity);
        topBarCfg.opacity = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 88;
      }
      const bg = hexToRgba(topBarCfg.color, topBarCfg.opacity, '161820');
      const a = Math.max(0, Math.min(100, Number(topBarCfg.opacity))) / 100;
      document.documentElement.style.setProperty('--topbar-bg', bg);
      document.documentElement.style.setProperty('--topbar-blur', a < 0.08 ? 'none' : 'blur(6px)');
      if (topBarEl) {
        topBarEl.style.background = bg;
        topBarEl.style.backdropFilter = a < 0.08 ? 'none' : 'blur(6px)';
        topBarEl.style.webkitBackdropFilter = a < 0.08 ? 'none' : 'blur(6px)';
        topBarEl.style.boxShadow = a < 0.05
          ? 'none'
          : ('0 6px 20px rgba(0,0,0,' + (0.45 * a).toFixed(2) + '), inset 0 0 0 1px rgba(255,255,255,' + (0.08 * Math.max(a, 0.2)).toFixed(2) + ')');
        const chip = topBarEl.querySelector('.td-amount-wrap');
        if (chip) {
          chip.style.background = hexToRgba(topBarCfg.color, Math.min(100, topBarCfg.opacity * 0.82), '161820');
        }
      }
    }

    function applyTopBarSettings(jarron) {
      if (!jarron) return;
      topBarCfg.enabled = jarron.topBarEnabled !== false;
      topBarCfg.limit = Math.max(1, Math.min(10, Number(jarron.topBarLimit) || 3));
      applyTopBarStyle(jarron);
      updateTopBarVisibility();
      renderTopBarSlot(false);
      restartTopCycle();
    }

    function activeTopList() {
      return topGifters.slice(0, topBarCfg.limit);
    }

    function updateTopBarVisibility() {
      if (!topBarEl) return;
      const show = topBarCfg.enabled && activeTopList().length > 0;
      topBarEl.hidden = !show;
      const hud = document.getElementById('hud-stack');
      if (hud) hud.classList.toggle('is-coins-only', !show);
    }

    function renderTopBarSlot(animate) {
      const list = activeTopList();
      if (!list.length || !topBarCfg.enabled || !tdAmount) {
        updateTopBarVisibility();
        return;
      }
      if (topCycleIdx >= list.length) topCycleIdx = 0;
      const g = list[topCycleIdx];
      tdAmount.textContent = (g.diamonds || 0).toLocaleString('es-ES');
      if (tdMedal) tdMedal.textContent = TOP_MEDALS[topCycleIdx] || '🏅';
      if (tdName) tdName.textContent = g.nickname || g.uniqueId || '—';
      if (tdAvatar) {
        const pic = String(g.photo || g.profilePictureUrl || '').trim();
        tdAvatar.src = pic || (isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC);
        tdAvatar.onerror = function () {
          this.onerror = null;
          this.src = isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC;
        };
      }
      updateTopBarVisibility();
      if (animate && topBarEl) {
        topBarEl.classList.remove('is-switch');
        void topBarEl.offsetWidth;
        topBarEl.classList.add('is-switch');
      }
    }

    function restartTopCycle() {
      if (topCycleTimer) clearInterval(topCycleTimer);
      topCycleTimer = null;
      if (!topBarCfg.enabled) return;
      const list = activeTopList();
      if (list.length < 2) return;
      topCycleTimer = setInterval(() => {
        const cur = activeTopList();
        if (cur.length < 2) return;
        topCycleIdx = (topCycleIdx + 1) % cur.length;
        renderTopBarSlot(true);
      }, 4200);
    }

    function onTopGiftersState(list) {
      topGifters = Array.isArray(list) ? list.filter((g) => (g.diamonds || 0) > 0) : [];
      topCycleIdx = 0;
      renderTopBarSlot(false);
      restartTopCycle();
    }

    function demoTopGifters() {
      onTopGiftersState([
        { nickname: 'Donador 1', diamonds: 12500, photo: TD_PREVIEW_PIC },
        { nickname: 'Donador 2', diamonds: 8200, photo: TD_PREVIEW_PIC },
        { nickname: 'Donador 3', diamonds: 4100, photo: TD_PREVIEW_PIC },
      ]);
    }

    // ---- Geometría del interior (stage 540×720; PNG cuadrado en los 540 inferiores) ----
    const STAGE_W = 540, STAGE_H = 720, IMG_SIZE = 540, IMG_TOP = 180;
    const artX = (p) => (p / 100) * IMG_SIZE;
    const artY = (p) => IMG_TOP + (p / 100) * IMG_SIZE;
    // Valores por defecto; la silueta real ajusta el spawn al cargar la imagen.
    let SLOT_CX = artX(53), SLOT_HW = 46, SPAWN_Y = artY(38);
    const JAR_CAPACITY = 140, HARD_CAP = 460;

    const M = window.Matter;
    if (!M) { console.warn('[perrito] Matter.js no disponible.'); return; }
    const { Engine, World, Bodies, Body, Runner, Events } = M;

    const engine = Engine.create();
    engine.gravity.y = 0.8; engine.enableSleeping = true;
    engine.positionIterations = isEmbed ? 6 : 10;
    engine.velocityIterations = isEmbed ? 4 : 8;
    const world = engine.world;

    // Límites de seguridad muy lejanos (por si algún regalo se escapa); la
    // contención real la dan las colisiones generadas a partir de la silueta.
    const WT = 60;
    const wallOpts = { isStatic: true, friction: 0.36, restitution: 0.42 };
    World.add(world, [
      Bodies.rectangle(STAGE_W / 2, STAGE_H + 200, STAGE_W * 3, WT, wallOpts),
      Bodies.rectangle(-260, STAGE_H / 2, WT, STAGE_H * 3, wallOpts),
      Bodies.rectangle(STAGE_W + 260, STAGE_H / 2, WT, STAGE_H * 3, wallOpts),
    ]);

    // Genera la máscara rellena y las colisiones que siguen la silueta del perro.
    buildPerritoShape();

    const giftsLayer = document.getElementById('gifts-layer');
    const gifts = [];
    let spawnSeq = 0;

    Runner.run(Runner.create(), engine);
    Events.on(engine, 'afterUpdate', function () {
      for (let i = 0; i < gifts.length; i++) {
        const g = gifts[i];
        if (!g.body.isSleeping) {
          const v = g.body.velocity, sp = Math.hypot(v.x, v.y);
          if (sp > 10) { const s = 10 / sp; Body.setVelocity(g.body, { x: v.x * s, y: v.y * s }); }
        }
        if (g.body.isSleeping && g.awakeSynced) continue;
        const p = g.body.position, half = g.sizePx / 2;
        g.img.style.transform = 'translate3d(' + (p.x - half).toFixed(1) + 'px,' + (p.y - half).toFixed(1) + 'px,0) rotate(' + g.body.angle.toFixed(3) + 'rad)';
        g.awakeSynced = g.body.isSleeping;
      }
    });

    const rnd = (a, b) => a + Math.random() * (b - a);
    function zIndexFromDiamonds(d, seq) {
      const bump = seq % 18;
      if (d >= 5000) return 900 + bump; if (d >= 1000) return 600 + bump;
      if (d >= 100) return 250 + bump; if (d >= 30) return 90 + bump; return 30 + bump;
    }

    // Tabla de tamaños configurable: [{ t, sz }] de mayor a menor umbral.
    let sizeTable = null;
    function setSizeTable(raw) {
      if (!Array.isArray(raw)) { sizeTable = null; return; }
      const out = raw
        .map((r) => ({ t: Number(r && r.t), sz: Number(r && r.sz) }))
        .filter((r) => Number.isFinite(r.t) && Number.isFinite(r.sz) && r.sz > 0)
        .sort((a, b) => b.t - a.t);
      sizeTable = out.length ? out : null;
    }
    function sizeFromTable(d) {
      if (!sizeTable) return null;
      for (const row of sizeTable) {
        if (d >= row.t) { const j = row.sz * 0.06; return Math.max(8, Math.min(200, row.sz + rnd(-j, j))); }
      }
      return sizeTable[sizeTable.length - 1].sz;
    }
    function giftSizeForFill(d) {
      let base, maxPx = 40, shrink = 1;
      const tbl = sizeFromTable(d);
      if (tbl != null) { base = tbl; maxPx = Math.max(40, tbl + 8); }
      else if (d >= 5000) { base = rnd(76, 92); maxPx = 92; shrink = 0.97; }
      else if (d >= 1000) { base = rnd(50, 62); maxPx = 64; shrink = 0.95; }
      else if (d >= 100) { base = rnd(38, 46); maxPx = 48; }
      else if (d >= 30) { base = rnd(32, 40); maxPx = 42; }
      else base = rnd(28, 36);
      const fill = Math.min(1, gifts.length / JAR_CAPACITY);
      if (fill > 0.5) base *= 0.94 * shrink;
      if (fill > 0.75) base *= 0.9;
      if (fill > 0.9) base *= 0.88;
      return Math.round(Math.max(14, Math.min(maxPx, base)));
    }

    function removeGiftAt(i, skipPersist) {
      const g = gifts[i]; if (!g) return;
      try { World.remove(world, g.body); } catch {}
      if (g.img && g.img.parentNode) g.img.parentNode.removeChild(g.img);
      gifts.splice(i, 1);
      if (!skipPersist && !restoringGifts) schedulePersist();
    }
    function pruneJar() {
      // Solo quitamos los que ya salieron de la pantalla (tras desbordarse).
      for (let i = gifts.length - 1; i >= 0; i--) {
        const g = gifts[i], p = g.body.position, r = g.sizePx / 2;
        if ((p.y - r) > (STAGE_H + 120) || (p.x + r) < -220 || (p.x - r) > (STAGE_W + 220)) removeGiftAt(i);
      }
      if (gifts.length > HARD_CAP) {
        const sorted = gifts.slice().sort((a, b) => a.body.position.y - b.body.position.y);
        let toRemove = gifts.length - HARD_CAP;
        for (let k = 0; k < sorted.length && toRemove > 0; k++) {
          const idx = gifts.indexOf(sorted[k]);
          if (idx !== -1) { removeGiftAt(idx); toRemove--; }
        }
      }
    }
    setInterval(pruneJar, 1300);

    function addGiftBody(src, sizePx, diamonds, opts) {
      if (!src) src = FALLBACK_IMG;
      opts = opts || {};
      // Radio de colisión un poco menor que el tamaño visual: las imágenes se
      // solapan y rellenan los huecos para que no quede espacio vacío.
      const r = Math.max(6, (sizePx / 2) * 0.80);
      let x, y, vx;
      if (opts.x != null) { x = opts.x; y = opts.y != null ? opts.y : SPAWN_Y; vx = 0; }
      else { x = rnd(SLOT_CX - SLOT_HW, SLOT_CX + SLOT_HW); y = SPAWN_Y + rnd(-8, 8); vx = rnd(-1.3, 1.3); }
      // Los regalos más grandes (más diamantes) pesan más: se hunden y compactan el montón.
      const density = 0.0012 * (1 + Math.min(2.5, (diamonds || 0) / 1500));
      const body = Bodies.circle(x, y, r, {
        density,
        restitution: 0.40,
        friction: 0.16,
        frictionStatic: 0.2,
        frictionAir: 0.012,
        sleepThreshold: 22,
      });
      if (opts.angle != null) Body.setAngle(body, opts.angle);
      // Misma velocidad de caída; el rebote viene de restitution.
      if (!opts.settled) { Body.setVelocity(body, { x: vx, y: rnd(0.3, 1.2) }); Body.setAngularVelocity(body, rnd(-0.12, 0.12)); }
      const img = document.createElement('img');
      img.className = 'gift-body'; img.src = src; img.alt = ''; img.referrerPolicy = 'no-referrer';
      img.style.width = sizePx + 'px'; img.style.height = sizePx + 'px';
      img.style.zIndex = String(zIndexFromDiamonds(diamonds || 0, ++spawnSeq));
      img.onerror = function () { this.onerror = null; this.src = FALLBACK_IMG; };
      img.style.transform = 'translate3d(' + (x - r).toFixed(1) + 'px,' + (y - r).toFixed(1) + 'px,0) rotate(' + (opts.angle || 0).toFixed(3) + 'rad)';
      giftsLayer.appendChild(img);
      World.add(world, body);
      gifts.push({
        body, img, sizePx,
        diamonds: Math.max(0, Number(diamonds) || 0),
        src,
        awakeSynced: false,
      });
      // Restauración: el total ya viene de localStorage; no sumar otra vez.
      if (!opts.restore && !opts.skipCount) setDiamonds(totalDiamonds + (diamonds || 0), true);
      else if (!opts.restore) schedulePersist();
    }
    function spawnMany(src, count, gap, diamonds) {
      const n = Math.max(0, parseInt(count, 10) || 0);
      if (n < 1 || !src) return;
      gap = Math.max(70, gap || 150);
      for (let i = 0; i < n; i++) (function (idx) {
        setTimeout(() => addGiftBody(src, giftSizeForFill(diamonds || 0), diamonds || 0, {}), idx * gap);
      })(i);
    }
    function clearJar(skipPersist) {
      for (let i = gifts.length - 1; i >= 0; i--) removeGiftAt(i, true);
      if (!skipPersist) schedulePersist();
    }
    /** Recupera total + imágenes tras reload / apagón (OBS). */
    function restorePersistedGifts() {
      if (isEmbed || isPreview) return;
      let data = null;
      try {
        const raw = localStorage.getItem(lsKey);
        if (raw == null || raw === '') return;
        const trimmed = String(raw).trim();
        if (trimmed.charAt(0) === '{') data = JSON.parse(trimmed);
        else {
          setDiamonds(parseInt(trimmed, 10) || 0, false, true);
          savePersistState();
          return;
        }
      } catch { return; }
      const t = Math.max(0, Math.round(Number(data.t) || 0));
      const list = Array.isArray(data.g) ? data.g.slice(-PERSIST_MAX) : [];
      setDiamonds(t, false, true);
      if (!list.length) return;
      restoringGifts = true;
      let i = 0;
      (function batch() {
        const end = Math.min(i + 28, list.length);
        for (; i < end; i++) {
          const it = list[i] || {};
          const d = Math.max(0, Number(it.d) || 0);
          const src = it.u || FALLBACK_IMG;
          const sizePx = Math.max(14, Number(it.s) || giftSizeForFill(d));
          const r = Math.max(6, (sizePx / 2) * 0.80);
          const x = rnd(SLOT_CX - SLOT_HW + r, SLOT_CX + SLOT_HW - r);
          const y = rnd(SPAWN_Y + r + 20, STAGE_H - r - 40);
          addGiftBody(src, sizePx, d, { restore: true, settled: true, x, y, angle: rnd(-0.35, 0.35) });
        }
        if (i < list.length) setTimeout(batch, 0);
        else { restoringGifts = false; schedulePersist(); }
      })();
    }

    // ---- Catálogo de regalos (id -> imagen) ----
    const giftImgById = new Map();
    fetch('/api/gifts').then((r) => r.json()).then((d) => {
      (d.results || []).forEach((g) => { if (g.image) giftImgById.set(String(g.id), g.image); });
      const first = [...giftImgById.values()][0];
      if (first) FALLBACK_IMG = first;
    }).catch(() => {});

    function giftImgUrl(u) {
      if (!u) return '';
      try {
        if (new URL(u, location.href).origin === location.origin) return u;
      } catch {}
      return '/api/img-proxy?url=' + encodeURIComponent(u);
    }
    function resolveGiftImg(p) {
      if (p.image && p.giftId) giftImgById.set(String(p.giftId), p.image);
      const raw = p.image || giftImgById.get(String(p.giftId)) || '';
      return giftImgUrl(raw) || FALLBACK_IMG;
    }

    // ---- Toast «NAME DONATED» + regalo + monedas ----
    const giftToastsEl = document.getElementById('gift-toasts');
    const GT_MAX = 6;
    const GT_TTL_MS = 4200;
    let giftToastEnabled = true;
    let giftToastStyle = { color: '#1c1e26', opacity: 90 };
    function applyGiftToastStyle(cfg) {
      if (!cfg) return;
      if (cfg.giftToastColor !== undefined) giftToastStyle.color = cfg.giftToastColor || '#1c1e26';
      else if (cfg.color !== undefined) giftToastStyle.color = cfg.color || '#1c1e26';
      if (cfg.giftToastOpacity !== undefined) {
        const n = Number(cfg.giftToastOpacity);
        giftToastStyle.opacity = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 90;
      } else if (cfg.opacity !== undefined) {
        const n = Number(cfg.opacity);
        giftToastStyle.opacity = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 90;
      }
      const bg = hexToRgba(giftToastStyle.color, giftToastStyle.opacity, '1c1e26');
      const a = Math.max(0, Math.min(100, Number(giftToastStyle.opacity))) / 100;
      document.documentElement.style.setProperty('--gifttoast-bg', bg);
      if (giftToastsEl) {
        giftToastsEl.style.setProperty('--gifttoast-bg', bg);
        giftToastsEl.querySelectorAll('.gift-toast').forEach((el) => {
          el.style.background = bg;
          el.style.backdropFilter = a < 0.08 ? 'none' : 'blur(6px)';
          el.style.webkitBackdropFilter = a < 0.08 ? 'none' : 'blur(6px)';
        });
      }
    }
    function applyGiftToastSettings(cfg) {
      if (!cfg) return;
      if (cfg.giftToastEnabled !== undefined) giftToastEnabled = cfg.giftToastEnabled !== false;
      applyGiftToastStyle(cfg);
      if (!giftToastEnabled && giftToastsEl) giftToastsEl.innerHTML = '';
    }
    function showGiftToast(info) {
      if (!giftToastsEl || !giftToastEnabled) return;
      const name = String(info && (info.nickname || info.uniqueId) || 'Alguien').trim() || 'Alguien';
      const giftName = String(info && (info.giftName || info.name) || 'Gift').trim() || 'Gift';
      const per = Math.max(0, Number(info && (info.diamonds != null ? info.diamonds : info.diamondCount)) || 0);
      const reps = Math.max(1, Number(info && info.repeatCount) || 1);
      const coins = Math.max(1, (per > 0 ? per : 1) * reps);
      const avatar = String(info && (info.profilePictureUrl || info.photo) || '').trim()
        || (isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC);
      let giftSrc = FALLBACK_IMG;
      if (info && (info.giftImage || info.image)) {
        giftSrc = giftImgUrl(info.giftImage || info.image) || FALLBACK_IMG;
      } else if (info && info.giftId) {
        giftSrc = giftImgUrl(giftImgById.get(String(info.giftId)) || '') || FALLBACK_IMG;
      }

      const el = document.createElement('div');
      el.className = 'gift-toast';
      el.style.background = hexToRgba(giftToastStyle.color, giftToastStyle.opacity, '1c1e26');

      el.innerHTML =
        '<img class="gt-avatar" alt="" referrerpolicy="no-referrer">' +
        '<span class="gt-text"></span>' +
        '<img class="gt-gift" alt="" referrerpolicy="no-referrer">' +
        '<span class="gt-meta"><span class="gt-gname"></span><span class="gt-coins"></span></span>';
      const av = el.querySelector('.gt-avatar');
      const gi = el.querySelector('.gt-gift');
      av.src = avatar;
      av.onerror = function () { this.onerror = null; this.src = isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC; };
      gi.src = giftSrc;
      gi.onerror = function () { this.onerror = null; this.src = FALLBACK_IMG; };
      el.querySelector('.gt-text').textContent = name.toUpperCase() + ' DONATED';
      el.querySelector('.gt-gname').textContent = giftName;
      el.querySelector('.gt-coins').textContent = '(' + coins.toLocaleString('es-ES') + ' COIN' + (coins === 1 ? '' : 'S') + ')';

      giftToastsEl.insertBefore(el, giftToastsEl.firstChild);
      while (giftToastsEl.children.length > GT_MAX) {
        const last = giftToastsEl.lastElementChild;
        if (last) giftToastsEl.removeChild(last);
      }
      setTimeout(() => {
        el.classList.add('is-out');
        setTimeout(() => { try { el.remove(); } catch {} }, 300);
      }, GT_TTL_MS);
    }

    function sampleImg() {
      const arr = [...giftImgById.values()];
      return arr.length ? arr[Math.floor(Math.random() * arr.length)] : FALLBACK_IMG;
    }
    function dropOneGift(payload) {

      const p = payload || {};
      let src = '';
      if (p.image) {
        if (p.giftId) giftImgById.set(String(p.giftId), p.image);
        src = giftImgUrl(p.image) || '';
      }
      if (!src) src = sampleImg();
      const d = Math.max(0, Number(p.diamonds) || 1);
      showGiftToast({
        nickname: p.nickname || 'Tester',
        giftName: p.giftName || 'Gift',
        diamonds: d,
        repeatCount: 1,
        image: src,
        giftImage: src,
        photo: p.photo || (isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC),
      });
      addGiftBody(src, giftSizeForFill(d), d, {});
    }

    // ---- WebSocket nativo del panel ----
    let ws, reconnectTimer, fillTimer = null;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
      ws.onopen = () => clearTimeout(reconnectTimer);
      ws.onclose = () => { reconnectTimer = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        const { type, payload } = msg;
        if (type === 'gift') { if (!isEmbed) onGift(payload); }
        else if (type === 'state') { if (!isEmbed && payload) onTopGiftersState(payload.topGifters); }
        else if (type === 'panic') clearJar();
        else if (type === 'perritoTest') { if (!isEmbed) runFill((payload && payload.count) || 200); }
        else if (type === 'perritoDropOne') { if (!isEmbed) dropOneGift(payload); }
        else if (type === 'perritoReset') { if (!isEmbed) { if (fillTimer) clearTimeout(fillTimer); clearJar(true); setDiamonds(0, false, true); clearPersistState(); rootSafeRainbow(); } }
        else if (type === 'settings') {
          if (payload && payload.perrito) {
            if (!params.get('jc')) applyJarTint(payload.perrito.tint);
            if (payload.perrito.tintRainbow !== undefined) applyJarRainbow(!!payload.perrito.tintRainbow);
            if (payload.perrito.sizes) setSizeTable(payload.perrito.sizes);
            applyTopBarSettings(payload.perrito);
            applyGiftToastSettings(payload.perrito);
          }
        }
      };
    }
    function onGift(p) {
      if (!p || p.streak) return;
      const n = Math.min(99, Math.max(1, p.repeatCount || 1));
      showGiftToast(p);
      spawnMany(resolveGiftImg(p), n, 165, p.diamonds || 0);
    }
    connectWS();
    applyTopBarStyle(topBarCfg);
    applyGiftToastStyle(giftToastStyle);
    if (isEmbed) demoTopGifters();
    else restorePersistedGifts();

    function runFill(total) {

      if (fillTimer) { clearTimeout(fillTimer); fillTimer = null; }
      clearJar(true); setDiamonds(0, false, true); clearPersistState();
      showGiftToast({
        nickname: 'Tester',
        giftName: 'GG',
        diamonds: 1,
        image: sampleImg(),
        photo: isEmbed ? TD_PREVIEW_PIC : TD_DEFAULT_PIC,
      });
      let i = 0;
      // Vista previa del panel: pocos cuerpos. OBS puede pedir más, pero con tope sano.
      let max = Math.max(1, Number(total) || 200);
      if (isEmbed) max = Math.min(max, 40);
      else max = Math.min(max, 120);
      const gapMs = isEmbed ? 70 : 55;
      (function tick() {
        if (i >= max) return;
        const roll = Math.random();
        const d = roll > 0.975 ? 8000 : roll > 0.9 ? 2200 : roll > 0.68 ? 180 : 1;
        addGiftBody(sampleImg(), giftSizeForFill(d), d, {});
        i++; fillTimer = setTimeout(tick, gapMs);
      })();
    }
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.kind !== 'perrito') return;
      if (d.type === 'test') runFill(d.count || (isEmbed ? 40 : 80));
      else if (d.type === 'dropOne') dropOneGift(d);
      else if (d.type === 'reset') { if (fillTimer) clearTimeout(fillTimer); clearJar(true); setDiamonds(0, false, true); clearPersistState(); rootSafeRainbow(); }
      else if (d.type === 'config') {
        if (d.tint !== undefined) applyJarTint(d.tint);
        if (d.tintRainbow !== undefined) applyJarRainbow(!!d.tintRainbow);
        if (d.sizes !== undefined) setSizeTable(d.sizes);
        if (d.topBarEnabled !== undefined || d.topBarLimit !== undefined || d.topBarColor !== undefined || d.topBarOpacity !== undefined) {
          applyTopBarSettings({
            topBarEnabled: d.topBarEnabled !== undefined ? d.topBarEnabled : topBarCfg.enabled,
            topBarLimit: d.topBarLimit !== undefined ? d.topBarLimit : topBarCfg.limit,
            topBarColor: d.topBarColor !== undefined ? d.topBarColor : topBarCfg.color,
            topBarOpacity: d.topBarOpacity !== undefined ? d.topBarOpacity : topBarCfg.opacity,
          });
        }
        if (d.giftToastEnabled !== undefined || d.giftToastColor !== undefined || d.giftToastOpacity !== undefined) {
          applyGiftToastSettings({
            giftToastEnabled: d.giftToastEnabled !== undefined ? d.giftToastEnabled : giftToastEnabled,
            giftToastColor: d.giftToastColor !== undefined ? d.giftToastColor : giftToastStyle.color,
            giftToastOpacity: d.giftToastOpacity !== undefined ? d.giftToastOpacity : giftToastStyle.opacity,
          });
        }
      } else if (d.type === 'topDemo') demoTopGifters();
    });

    // ---- Vista previa standalone (?preview=1): llena en bucle ----
    if (isPreview) {
      const demo = () => {
        let i = 0; const total = 200; setDiamonds(0);
        (function tick() {
          if (i >= total) { setTimeout(() => { clearJar(); demo(); }, 6000); return; }
          const roll = Math.random();
          const d = roll > 0.975 ? 8000 : roll > 0.9 ? 2200 : roll > 0.68 ? 180 : 1;
          addGiftBody(sampleImg(), giftSizeForFill(d), d, {});
          i++; setTimeout(tick, 55);
        })();
      };
      setTimeout(demo, 1200);
    }
  })();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
