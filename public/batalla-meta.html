<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay — Meta de la ronda (PK)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Exo+2:wght@700;800;900&family=Fredoka:wght@600;700&family=Inter:wght@600;700;800&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Press+Start+2P&family=Rubik:wght@700;800;900&family=Titan+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
      font-family: var(--tf-font-stack, 'Rubik', system-ui, sans-serif);
    }
    /* Canvas fijo Live Studio / OBS — Browser Source 800×600 */
    html.stage-800x600, html.stage-800x600 body {
      width: 800px; height: 600px;
    }
    html.embed, html.embed body { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    /* En preview del panel: el stage se ajusta al contenido */
    html.embed .stage {
      width: max-content;
      height: max-content;
      max-width: 760px;
      padding: 20px 24px;
    }
    .stage {
      width: 800px; height: 600px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 28px 36px;
      transform: scale(var(--tf-fit, 1)); transform-origin: center center;
      opacity: 0; transition: opacity .28s ease;
      pointer-events: none;
      --title-color: #ffffff;
      --sub-color: rgba(255,255,255,.82);
      --behind-color: #ff8f6b;
      --ahead-color: #7dffb0;
      --tie-color: #7ec8ff;
      --win-color: #7dffb0;
      --lose-color: #ff8f6b;
      --host-color: #7ec8ff;
      --rival-color: #ffe566;
      --tc1: #ff00aa; --tc2: #00ddff; --tc3: #ffcc00;
      --tf-font-stack: 'Rubik', system-ui, sans-serif;
      --title-size: 52px;
    }
    .stage.is-on { opacity: 1; }
    .stage.is-pop .title { animation: metapop .42s cubic-bezier(.2,1.4,.3,1); }
    @keyframes metapop {
      0% { transform: scale(.86); opacity: .55; }
      55% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }
    .badge {
      display: none !important;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      padding: 6px 14px; border-radius: 999px;
      background: rgba(0,0,0,.45); color: rgba(255,255,255,.72);
      text-shadow: 0 1px 0 rgba(0,0,0,.4);
    }
    .badge.is-live { color: #7dffb0; background: rgba(20,80,50,.55); }
    .badge.is-end { color: #ffe566; background: rgba(80,60,10,.55); }
    .title {
      margin: 0; text-align: center; max-width: 100%;
      font-family: var(--tf-font-stack);
      font-weight: 900; font-size: var(--title-size); line-height: 1.15;
      letter-spacing: .01em;
      text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 28px rgba(0,0,0,.35);
      color: var(--title-color);
      -webkit-text-fill-color: var(--title-color);
      background: none;
    }
    .title.title--rainbow {
      background: linear-gradient(90deg, var(--tc1), var(--tc2), var(--tc3), var(--tc1), var(--tc2), var(--tc3), var(--tc1));
      background-size: 280% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
      text-shadow: none;
      animation: title-rainbow-move 3.2s linear infinite;
      filter: drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 6px 14px rgba(0,0,0,.35));
    }
    @keyframes title-rainbow-move {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .stage.behind .title:not(.title--rainbow) { color: var(--behind-color); -webkit-text-fill-color: var(--behind-color); }
    .stage.ahead .title:not(.title--rainbow) { color: var(--ahead-color); -webkit-text-fill-color: var(--ahead-color); }
    .stage.tie .title:not(.title--rainbow) { color: var(--tie-color); -webkit-text-fill-color: var(--tie-color); }
    .stage.win .title:not(.title--rainbow) { color: var(--win-color); -webkit-text-fill-color: var(--win-color); }
    .stage.lose .title:not(.title--rainbow) { color: var(--lose-color); -webkit-text-fill-color: var(--lose-color); }
    .stage.win.is-pop .title, .stage.lose.is-pop .title { animation: endpop .55s cubic-bezier(.2,1.45,.3,1); }
    @keyframes endpop {
      0% { transform: scale(.7); opacity: 0; filter: blur(6px); }
      55% { transform: scale(1.1); opacity: 1; filter: blur(0); }
      100% { transform: scale(1); }
    }
      .sub {
      margin: 0; text-align: center;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700; font-size: 22px; color: var(--sub-color);
      text-shadow: 0 2px 0 rgba(0,0,0,.5);
    }
    .scores {
      display: flex; align-items: center; gap: 16px; margin-top: 4px;
      font-variant-numeric: tabular-nums;
      font-weight: 900; font-size: 34px;
      text-shadow: 0 2px 0 rgba(0,0,0,.5);
    }
    .scores .h { color: var(--host-color); }
    .scores .r { color: var(--rival-color); }
    .scores .sep { color: rgba(255,255,255,.45); font-size: 18px; font-weight: 800; }
    .scores.bump { animation: scorebump .35s ease; }
    @keyframes scorebump {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" aria-live="polite">
    <div class="badge" id="badge">ESPERANDO PK</div>
    <h1 class="title" id="title">Meta de la ronda</h1>
    <p class="sub" id="sub">Se activa sola al empezar la batalla</p>
    <div class="scores" id="scores" hidden>
      <span class="h" id="score-h">0</span>
      <span class="sep">VS</span>
      <span class="r" id="score-r">0</span>
    </div>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    const STAGE_W = 800;
    const STAGE_H = 600;
    if (isEmbed) document.documentElement.classList.add('embed');
    else document.documentElement.classList.add('stage-800x600');

    const FONTS = {
      pressstart: "'Press Start 2P', monospace",
      exo2: "'Exo 2', system-ui, sans-serif",
      luckiest: "'Luckiest Guy', system-ui, sans-serif",
      bangers: "'Bangers', system-ui, sans-serif",
      lilita: "'Lilita One', system-ui, sans-serif",
      titan: "'Titan One', system-ui, sans-serif",
      fredoka: "'Fredoka', system-ui, sans-serif",
      bungee: "'Bungee', system-ui, sans-serif",
      rubik: "'Rubik', system-ui, sans-serif",
      oswald: "'Oswald', system-ui, sans-serif",
      bebas: "'Bebas Neue', Impact, sans-serif",
      montserrat: "'Montserrat', system-ui, sans-serif",
      poppins: "'Poppins', system-ui, sans-serif",
      orbitron: "'Orbitron', system-ui, sans-serif",
      inter: "'Inter', system-ui, sans-serif",
      system: 'system-ui, sans-serif',
    };

    let embedFit = null;
    (function fit() {
      function apply() {
        if (!isEmbed) {
          document.documentElement.style.setProperty('--tf-fit', '1');
          return;
        }
        const stage = document.getElementById('stage');
        if (!stage) return;
        document.documentElement.style.setProperty('--tf-fit', '1');
        void stage.offsetWidth;
        const pad = 20;
        const w = Math.max(stage.scrollWidth, stage.offsetWidth, 280);
        const h = Math.max(stage.scrollHeight, stage.offsetHeight, 200);
        const k = Math.min(
          ((innerWidth || 1) - pad) / w,
          ((innerHeight || 1) - pad) / h,
          2.6
        );
        document.documentElement.style.setProperty('--tf-fit', String(Math.max(0.4, k) || 1));
      }
      embedFit = apply;
      apply();
      addEventListener('resize', apply);
      setTimeout(apply, 120);
      setTimeout(apply, 450);
    })();

    let cfg = {
      titleWaiting: 'Meta de la ronda',
      subWaiting: 'Se activa sola al empezar la batalla',
      labelWaiting: 'ESPERANDO PK',
      labelLive: 'EN VIVO',
      labelDemo: 'DEMO',
      labelEnd: 'FIN DE RONDA',
      subBehind: '¡Motiva al chat a empujar!',
      subAhead: 'No aflojes la presión',
      subTie: 'El siguiente punto decide la ronda',
      titleWin: 'Felicidades',
      subWin: '¡Ganaste la batalla!',
      titleLose: 'Suerte en la siguiente',
      subLose: 'La próxima es tuya',
      titleDraw: '¡Empate!',
      subDraw: 'La batalla terminó igualada',
      font: 'rubik',
      titleRainbow: true,
      tc1: '#ff00aa', tc2: '#00ddff', tc3: '#ffcc00',
      titleColor: '#ffffff',
      subColor: '#d2d2d8',
      behindColor: '#ff8f6b',
      aheadColor: '#7dffb0',
      tieColor: '#7ec8ff',
      winColor: '#7dffb0',
      loseColor: '#ff8f6b',
      hostScoreColor: '#7ec8ff',
      rivalScoreColor: '#ffe566',
      titleSize: 52,
    };

    const el = {
      stage: document.getElementById('stage'),
      badge: document.getElementById('badge'),
      title: document.getElementById('title'),
      sub: document.getElementById('sub'),
      scores: document.getElementById('scores'),
      scoreH: document.getElementById('score-h'),
      scoreR: document.getElementById('score-r'),
    };

    let demo = false;
    let lastSig = '';
    let wasLive = false;
    let state = { live: false, ending: null, pointsHost: 0, pointsRival: 0 };
    let testTimers = [];

    function fmt(n) {
      return Math.max(0, Math.round(Number(n) || 0)).toLocaleString('es-ES');
    }
    function clearTest() {
      testTimers.forEach(clearTimeout);
      testTimers = [];
    }
    function applyStyle() {
      const fontKey = FONTS[cfg.font] ? cfg.font : 'rubik';
      const stack = FONTS[fontKey];
      el.stage.style.setProperty('--tf-font-stack', stack);
      document.documentElement.style.setProperty('--tf-font-stack', stack);
      document.documentElement.dataset.font = fontKey;
      el.stage.style.setProperty('--title-color', cfg.titleColor || '#ffffff');
      el.stage.style.setProperty('--sub-color', cfg.subColor || '#d2d2d8');
      el.stage.style.setProperty('--behind-color', cfg.behindColor || '#ff8f6b');
      el.stage.style.setProperty('--ahead-color', cfg.aheadColor || '#7dffb0');
      el.stage.style.setProperty('--tie-color', cfg.tieColor || '#7ec8ff');
      el.stage.style.setProperty('--win-color', cfg.winColor || '#7dffb0');
      el.stage.style.setProperty('--lose-color', cfg.loseColor || '#ff8f6b');
      el.stage.style.setProperty('--host-color', cfg.hostScoreColor || '#7ec8ff');
      el.stage.style.setProperty('--rival-color', cfg.rivalScoreColor || '#ffe566');
      el.stage.style.setProperty('--tc1', cfg.tc1 || '#ff00aa');
      el.stage.style.setProperty('--tc2', cfg.tc2 || '#00ddff');
      el.stage.style.setProperty('--tc3', cfg.tc3 || '#ffcc00');
      el.stage.style.setProperty('--title-size', Math.max(28, Math.min(72, Number(cfg.titleSize) || 52)) + 'px');
      el.title.classList.toggle('title--rainbow', !!cfg.titleRainbow);
    }
    function buildMeta(host, rival) {
      const h = Math.max(0, Math.round(Number(host) || 0));
      const r = Math.max(0, Math.round(Number(rival) || 0));
      const diff = Math.abs(h - r);
      if (h === r) {
        return { kind: 'tie', title: '¡Empate!', sub: cfg.subTie || 'El siguiente punto decide la ronda' };
      }
      if (h < r) {
        return { kind: 'behind', title: `Faltan ${fmt(diff)} para empatar`, sub: cfg.subBehind || '¡Motiva al chat a empujar!' };
      }
      return { kind: 'ahead', title: `Mantén ${fmt(diff)} de ventaja`, sub: cfg.subAhead || 'No aflojes la presión' };
    }
    function buildEnding(host, rival) {
      const h = Math.max(0, Math.round(Number(host) || 0));
      const r = Math.max(0, Math.round(Number(rival) || 0));
      if (h > r) {
        return {
          kind: 'win',
          title: cfg.titleWin || 'Felicidades',
          sub: cfg.subWin || '¡Ganaste la batalla!',
        };
      }
      if (h < r) {
        return {
          kind: 'lose',
          title: cfg.titleLose || 'Suerte en la siguiente',
          sub: cfg.subLose || 'La próxima es tuya',
        };
      }
      return {
        kind: 'tie',
        title: cfg.titleDraw || '¡Empate!',
        sub: cfg.subDraw || 'La batalla terminó igualada',
      };
    }
    function pop(sig) {
      if (sig === lastSig) return;
      lastSig = sig;
      el.stage.classList.remove('is-pop');
      el.scores.classList.remove('bump');
      void el.stage.offsetWidth;
      el.stage.classList.add('is-pop');
      el.scores.classList.add('bump');
    }
    function render() {
      const active = demo || !!state.live || !!state.ending;
      el.stage.classList.toggle('is-on', active);
      el.badge.classList.remove('is-live', 'is-end');
      el.stage.classList.remove('behind', 'ahead', 'tie', 'win', 'lose');

      if (!active) {
        el.badge.textContent = cfg.labelWaiting || 'ESPERANDO PK';
        el.title.textContent = cfg.titleWaiting || 'Meta de la ronda';
        el.sub.textContent = cfg.subWaiting || 'Se activa sola al empezar la batalla';
        el.scores.hidden = true;
        el.stage.classList.remove('is-pop');
        return;
      }

      let meta;
      if (state.ending) {
        meta = buildEnding(state.pointsHost, state.pointsRival);
        el.badge.textContent = demo ? (cfg.labelDemo || 'DEMO') : (cfg.labelEnd || 'FIN DE RONDA');
        el.badge.classList.add('is-end');
      } else {
        meta = buildMeta(state.pointsHost, state.pointsRival);
        el.badge.textContent = demo ? (cfg.labelDemo || 'DEMO') : (cfg.labelLive || 'EN VIVO');
        el.badge.classList.add('is-live');
      }

      el.stage.classList.add(meta.kind);
      el.title.textContent = meta.title;
      el.sub.textContent = meta.sub;
      el.scoreH.textContent = fmt(state.pointsHost);
      el.scoreR.textContent = fmt(state.pointsRival);
      el.scores.hidden = false;
      pop(`${state.ending ? 'end' : 'live'}|${meta.kind}|${meta.title}|${state.pointsHost}|${state.pointsRival}`);
      if (typeof embedFit === 'function') requestAnimationFrame(embedFit);
    }
    function applyPk(payload) {
      if (!payload || typeof payload !== 'object') return;
      if (demo) return;
      const live = !!payload.live;
      const nextH = payload.pointsHost != null ? Number(payload.pointsHost) || 0 : state.pointsHost;
      const nextR = payload.pointsRival != null ? Number(payload.pointsRival) || 0 : state.pointsRival;

      // Ignorar borrado a 0–0 a media pelea (paquetes incompletos → parpadeo EMPATE)
      const wipeScores = live
        && (state.pointsHost > 0 || state.pointsRival > 0)
        && nextH === 0 && nextR === 0;
      if (!wipeScores) {
        if (payload.pointsHost != null) state.pointsHost = nextH;
        if (payload.pointsRival != null) state.pointsRival = nextR;
      }

      // Fin de ronda: mantener Felicidades/Suerte hasta que empiece otra batalla de verdad
      if (payload.ending || (state.ending && !live)) {
        state.ending = true;
        state.live = false;
        wasLive = false;
        render();
        return;
      }
      if (state.ending && live) {
        // Solo aquí se limpia el fin: nueva batalla live
        state.ending = null;
      }

      if (live && !wasLive) {
        state.ending = null;
      } else if (wasLive && !live) {
        state.ending = true;
      }
      if (live) {
        state.ending = null;
        state.live = true;
      } else {
        state.live = false;
        if (state.ending) {
          wasLive = false;
          render();
          return;
        }
      }
      wasLive = live;
      render();
    }
    function applyPkEnd(payload) {
      if (demo) return;
      if (payload && typeof payload === 'object') {
        if (payload.pointsHost != null) state.pointsHost = Number(payload.pointsHost) || 0;
        if (payload.pointsRival != null) state.pointsRival = Number(payload.pointsRival) || 0;
        if (payload.scoreHost != null) state.pointsHost = Number(payload.scoreHost) || 0;
        if (payload.scoreRival != null) state.pointsRival = Number(payload.scoreRival) || 0;
      }
      state.live = false;
      state.ending = true;
      wasLive = false;
      render();
    }
    function setDemoScores(h, r, ending) {
      demo = true;
      state.live = !ending;
      state.ending = !!ending;
      state.pointsHost = h;
      state.pointsRival = r;
      render();
    }
    function runFullTest() {
      clearTest();
      lastSig = '';
      wasLive = false;
      // Animación completa: abajo → arriba → empate → ventaja → Felicidades
      setDemoScores(44, 244, false);
      testTimers.push(setTimeout(() => setDemoScores(180, 244, false), 1500));
      testTimers.push(setTimeout(() => setDemoScores(244, 244, false), 3000));
      testTimers.push(setTimeout(() => setDemoScores(500, 244, false), 4500));
      testTimers.push(setTimeout(() => setDemoScores(820, 410, false), 6000));
      testTimers.push(setTimeout(() => setDemoScores(820, 410, true), 7600));
      // Luego muestra derrota también un momento en el test
      testTimers.push(setTimeout(() => setDemoScores(210, 500, true), 9800));
      testTimers.push(setTimeout(() => setDemoScores(820, 410, true), 11800));
    }
    function resetLocal() {
      clearTest();
      demo = false;
      lastSig = '';
      wasLive = false;
      state = { live: false, ending: null, pointsHost: 0, pointsRival: 0 };
      render();
    }

    let ws, reconnectTimer;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
      ws.onopen = () => clearTimeout(reconnectTimer);
      ws.onclose = () => { reconnectTimer = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'pkBattle') applyPk(msg.payload || {});
        if (msg.type === 'pkBattleEnd') applyPkEnd(msg.payload || {});
        if (msg.type === 'pkBattleReset' || msg.type === 'batallaMetaReset') resetLocal();
        if (msg.type === 'batallaMetaTest') runFullTest();
        if (msg.type === 'settings' && msg.payload?.batallaMeta) {
          cfg = Object.assign(cfg, msg.payload.batallaMeta);
          applyStyle();
          render();
        }
      };
    }
    connectWS();

    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.kind !== 'batallaMeta') return;
      if (d.type === 'config' && d.config) {
        cfg = Object.assign(cfg, d.config);
        applyStyle();
        render();
      } else if (d.type === 'test') runFullTest();
      else if (d.type === 'reset') resetLocal();
    });

    applyStyle();
    if (isEmbed) setTimeout(runFullTest, 350);
    else render();
  })();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
