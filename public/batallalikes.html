<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Batalla de likes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Exo+2:wght@700;800;900&family=Fredoka:wght@600;700&family=Inter:wght@700;800;900&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Press+Start+2P&family=Rubik:wght@700;800;900&family=Titan+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bat-gap: 4px;
      --bat-a: 0.45;
      --bat-font: 'Inter', system-ui, sans-serif;
      --bat-name: #ffffff;
      --bat-row-bg: rgba(22,38,46,var(--bat-a));
      --bat-row-bd: rgba(148,163,184,.55);
      --bat-row-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
      --bat-row-shadow-first: inset 0 0 0 1px rgba(0,0,0,.25), inset 6px 0 18px -6px var(--bat-c1-inset1), inset -6px 0 18px -6px var(--bat-c1-inset2);
      --bat-row-shadow-rest: inset 0 0 0 1px rgba(0,0,0,.3), inset 4px 0 12px -6px rgba(180,140,80,.08);
      --bat-c1-bg: rgba(36,48,64,var(--bat-a)); --bat-c1-bd: rgba(148,163,184,.5);
      --bat-c1-inset1: rgba(56,189,248,.08); --bat-c1-inset2: rgba(148,163,184,.06);
      --bat-c2-bg: rgba(22,26,34,var(--bat-a)); --bat-c2-bd: rgba(100,110,125,.75);
      --bat-cr-bg: rgba(18,22,30,var(--bat-a)); --bat-cr-bd: rgba(90,100,118,.55);
      --bat-ng1: #ff006e; --bat-ng2: #3a86ff; --bat-ng3: #ffbe0b;
      --bat-vc: #fecaca; --bat-vg: rgba(248,113,113,.45);
      --bat-coin-glow: rgba(239,68,68,.55);
      --bat-vs1: #fff5e6; --bat-vs2: #ff6b35; --bat-vs3: #c41e3a;
      --bat-vs-g1: rgba(56,189,248,.55); --bat-vs-g2: rgba(250,204,21,.35);
      --bat-a1-bd: rgba(186,230,253,.5); --bat-a1-sh: rgba(56,189,248,.22);
      --bat-a2-bd: rgba(180,195,210,.65); --bat-a2-sh: rgba(180,200,220,.2);
      --bat-ar-bd: rgba(160,170,185,.45); --bat-ar-sh: rgba(160,170,185,.12);
      --bat-ph: rgba(226,232,240,.88); --bat-ph-glow: rgba(56,189,248,.3);
    }
    body { background-color: transparent !important; font-family: var(--bat-font); margin: 0; padding: 6px; overflow: hidden; }
    html.embed, html.embed body { width: 100%; height: 100%; }
    html.embed body { display: flex; align-items: center; justify-content: center; padding: 0; }
    html.embed .battle-root { transform: scale(var(--fit, 1)); transform-origin: center center; }
    .battle-root { display: inline-block; position: relative; }
    .battle-container { position: relative; width: 404px; padding: 0; overflow: visible; }
    .battle-duel { display: flex; flex-direction: column; gap: var(--bat-gap); position: relative; overflow: visible; }
    .battle-duel__row { display: grid; grid-template-columns: 122px 1fr; gap: 12px; align-items: center; min-height: 64px; padding: 8px 12px; border-radius: 12px; position: relative; z-index: 1; background-color: var(--bat-row-bg); border: 1px solid var(--bat-row-bd); box-shadow: var(--bat-row-shadow); overflow: visible; }
    .battle-duel__icons { display: flex; flex-direction: row; align-items: center; gap: 14px; justify-content: flex-start; }
    .battle-card--first { background-color: var(--bat-row-bg); border-color: var(--bat-row-bd); box-shadow: var(--bat-row-shadow-first); z-index: 2; }
    .battle-card--second { background-color: var(--bat-row-bg); border-color: var(--bat-row-bd); }
    .battle-card--rest { background-color: var(--bat-row-bg); border-color: var(--bat-row-bd); box-shadow: var(--bat-row-shadow-rest); }
    .bat-rank-badge { width: 50px; height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 38px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,.55)); }
    .hexagon { width: 30px; height: 34px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); display: flex; justify-content: center; align-items: center; color: #1a1206; font-weight: 900; font-size: 16px; flex-shrink: 0; background: linear-gradient(160deg, #efebe9 0%, #a1887f 45%, #6d4c41 100%); filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
    .avatar-wrap { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background-color: #111; border: 2px solid rgba(255,255,255,.2); }
    .battle-card--first .avatar { border-color: var(--bat-a1-bd); box-shadow: 0 0 10px var(--bat-a1-sh); }
    .battle-card--second .avatar { border-color: var(--bat-a2-bd); box-shadow: 0 0 10px var(--bat-a2-sh); }
    .battle-card--rest .avatar { border-color: var(--bat-ar-bd); box-shadow: 0 0 8px var(--bat-ar-sh); }
    .info { display: flex; flex-direction: column; justify-content: center; gap: 4px; flex-grow: 1; min-width: 0; overflow: hidden; }
    .battle-nombre--rainbow,
    .battle-nombre--solid { font-family: var(--bat-font); font-weight: 900; font-size: 16px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .battle-nombre--rainbow { background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #fb5607, #ff006e); background-size: 220% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: rainbow-flow 4s linear infinite; filter: drop-shadow(0 1px 2px rgba(0,0,0,.8)); }
    .battle-nombre--solid { color: var(--bat-name); -webkit-text-fill-color: var(--bat-name); text-shadow: 0 1px 2px rgba(0,0,0,.85); }
    @keyframes rainbow-flow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    .stat-line { color: var(--bat-vc); font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 6px; text-shadow: 0 0 12px var(--bat-vg); }
    .stat-ico { font-size: 17px; line-height: 1; flex-shrink: 0; filter: drop-shadow(0 0 4px var(--bat-coin-glow)); }
    .vs-logo-img {
      position: absolute;
      left: 18px;
      bottom: -18px;
      z-index: 30;
      width: 108px;
      height: auto;
      max-height: none;
      object-fit: contain;
      transform: translate(var(--vs-x, 0px), calc(50% + var(--vs-y, 0px))) rotate(-5deg) scale(var(--vs-scale, 1));
      transform-origin: center center;
      filter: drop-shadow(0 0 10px var(--bat-vs-g1)) drop-shadow(0 0 16px var(--bat-vs-g2)) drop-shadow(1px 2px 0 rgba(0,0,0,.4));
      pointer-events: none;
      user-select: none;
    }
    .vs-logo-img--s2,
    .vs-logo-img--s3 {
      width: 72px;
      left: 28px;
      bottom: -12px;
    }
    .battle-duel__vs-spacer {
      height: 32px;
      flex-shrink: 0;
      pointer-events: none;
    }
    .battle-duel--sequential .battle-duel__row,
    .battle-duel--sequential .battle-duel__vs-spacer { opacity: 0; transform: translateY(10px); transition: opacity .4s ease, transform .4s ease; }
    .battle-duel--sequential .battle-duel__row.bat-seq-visible,
    .battle-duel--sequential .battle-duel__vs-spacer.bat-seq-visible { opacity: 1; transform: translateY(0); }
    .battle-placeholder { color: var(--bat-ph); font-weight: 800; font-size: 14px; text-align: center; padding: 24px 12px; text-shadow: 0 0 12px var(--bat-ph-glow); }
</style>
</head>
<body>
  <div class="battle-root">
    <div class="battle-container" id="lista-ranking">
      <div class="battle-placeholder">Esperando combatientes...</div>
    </div>
  </div>

  <script>
(function () {
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1';
    let cfg = { limit: 2, nameRainbow: true, placeholder: 'Esperando combatientes...', valueColor: '#fecaca', likesIcon: '❤️', bgOpacity: 45, vsStyle: 2, vsScale: 40, vsX: -19, vsY: 3, nameColor: '#ffffff', font: 'inter', cardBg: '#16262e', cardBorder: '#94a3b8' };
    const FONTS = {
      pressstart: "'Press Start 2P', monospace",
      exo2: "'Exo 2', system-ui, sans-serif",
      luckiest: "'Luckiest Guy', 'Arial Black', Impact, sans-serif",
      bangers: "'Bangers', 'Arial Black', Impact, sans-serif",
      lilita: "'Lilita One', system-ui, sans-serif",
      titan: "'Titan One', system-ui, sans-serif",
      fredoka: "'Fredoka', system-ui, sans-serif",
      bungee: "'Bungee', system-ui, sans-serif",
      rubik: "'Rubik', system-ui, sans-serif",
      oswald: "'Oswald', system-ui, sans-serif",
      bebas: "'Bebas Neue', Impact, sans-serif",
      montserrat: "'Montserrat', system-ui, sans-serif",
      poppins: "'Poppins', system-ui, sans-serif",
      orbitron: "'Orbitron', system-ui, sans-serif",
      inter: "'Inter', system-ui, sans-serif",
      system: 'system-ui, sans-serif',
    };
    function hexRgb(hex, fallback) {
      const m = String(hex || '').trim().replace('#', '');
      if (!/^[0-9a-fA-F]{6}$/.test(m)) return fallback;
      return {
        r: parseInt(m.slice(0, 2), 16),
        g: parseInt(m.slice(2, 4), 16),
        b: parseInt(m.slice(4, 6), 16),
      };
    }
    function vsImgSrc() {
      const n = Math.max(1, Math.min(3, parseInt(cfg.vsStyle, 10) || 1));
      return '/img/vs-battle-' + n + '.png';
    }
    function vsImgClass() {
      const n = Math.max(1, Math.min(3, parseInt(cfg.vsStyle, 10) || 1));
      return 'vs-logo-img' + (n > 1 ? ' vs-logo-img--s' + n : '');
    }
    function applyVsPos() {
      const r = document.documentElement.style;
      const scale = Math.max(40, Math.min(180, Number(cfg.vsScale) || 100)) / 100;
      const x = Math.max(-80, Math.min(80, Number(cfg.vsX) || 0));
      const y = Math.max(-80, Math.min(80, Number(cfg.vsY) || 0));
      r.setProperty('--vs-scale', String(scale));
      r.setProperty('--vs-x', x + 'px');
      r.setProperty('--vs-y', y + 'px');
    }
    let ranking = {};
    let seqTimers = [];
    let fitFn = null;

    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function safeId(s) { return String(s == null ? '' : s).replace(/[^a-zA-Z0-9_-]/g, '_'); }
    function applyStyle() {
      const r = document.documentElement.style;
      r.setProperty('--bat-vc', cfg.valueColor || '#fecaca');
      r.setProperty('--bat-name', cfg.nameColor || '#ffffff');
      r.setProperty('--bat-font', FONTS[cfg.font] || FONTS.inter);
      const op = Math.max(10, Math.min(100, Number(cfg.bgOpacity) || 45)) / 100;
      r.setProperty('--bat-a', String(op));
      const bg = hexRgb(cfg.cardBg, { r: 22, g: 38, b: 46 });
      const bd = hexRgb(cfg.cardBorder, { r: 148, g: 163, b: 184 });
      r.setProperty('--bat-row-bg', 'rgba(' + bg.r + ',' + bg.g + ',' + bg.b + ',var(--bat-a))');
      r.setProperty('--bat-row-bd', 'rgba(' + bd.r + ',' + bd.g + ',' + bd.b + ',.65)');
      r.setProperty('--bat-row-shadow', 'inset 0 0 0 1px rgba(0,0,0,.25)');
      r.setProperty('--bat-row-shadow-first', 'inset 0 0 0 1px rgba(0,0,0,.25), inset 6px 0 18px -6px var(--bat-c1-inset1), inset -6px 0 18px -6px var(--bat-c1-inset2)');
      r.setProperty('--bat-row-shadow-rest', 'inset 0 0 0 1px rgba(0,0,0,.3), inset 4px 0 12px -6px rgba(180,140,80,.08)');
      applyVsPos();
      const ph = document.querySelector('.battle-placeholder');
      if (ph && !Object.keys(ranking).length) ph.textContent = cfg.placeholder || 'Esperando combatientes...';
    }
    function icoHtml() { const t = (cfg.likesIcon && String(cfg.likesIcon).trim()) ? String(cfg.likesIcon).slice(0, 8) : '❤️'; return '<span class="stat-ico">' + esc(t) + '</span>'; }
    function rankBadge(rank) { const m = { 1: '👑', 2: '🥈', 3: '🥉' }; if (m[rank]) return '<div class="bat-rank-badge">' + m[rank] + '</div>'; return '<div class="hexagon">' + rank + '</div>'; }
    function cardClass(i) { return i === 0 ? 'battle-card--first' : i === 1 ? 'battle-card--second' : 'battle-card--rest'; }
    function nameClass() { return cfg.nameRainbow ? 'battle-nombre--rainbow' : 'battle-nombre--solid'; }
    function clearSeq() { seqTimers.forEach((t) => clearTimeout(t)); seqTimers = []; }
    function runSeq(cont) { clearSeq(); const wrap = cont.querySelector('.battle-duel--sequential'); if (!wrap) return; wrap.querySelectorAll('.battle-duel__row, .battle-duel__vs-spacer').forEach((el, i) => { seqTimers.push(setTimeout(() => el.classList.add('bat-seq-visible'), i * 420)); }); }

    function render(opts) {
      opts = opts || {};
      clearSeq();
      const maxRows = Math.max(2, Math.min(10, parseInt(cfg.limit, 10) || 2));
      const arr = Object.entries(ranking).map(([id, d]) => ({ id, ...d })).sort((a, b) => b.likes - a.likes).slice(0, maxRows);
      const cont = document.getElementById('lista-ranking');
      if (!arr.length) { cont.innerHTML = '<div class="battle-placeholder">' + esc(cfg.placeholder || 'Esperando combatientes...') + '</div>'; applyStyle(); return; }
      const useSeq = !!opts.seq;
      const showVs = arr.length >= 2;
      const parts = [];
      arr.forEach((u, i) => {
        const vsImg = (i === 0 && showVs)
          ? '<img class="' + vsImgClass() + '" src="' + vsImgSrc() + '" alt="VS">'
          : '';
        parts.push('<div class="battle-duel__row ' + cardClass(i) + '" id="card-' + safeId(u.id) + '">' +
          '<div class="battle-duel__icons">' + rankBadge(i + 1) +
          '<div class="avatar-wrap"><img src="' + esc(u.pic) + '" class="avatar" referrerpolicy="no-referrer" onerror="this.style.visibility=\'hidden\'"></div></div>' +
          '<div class="info"><div class="' + nameClass() + '">' + esc(u.name) + '</div>' +
          '<div class="stat-line">' + icoHtml() + ' ' + u.likes.toLocaleString('es-ES') + '</div></div>' +
          vsImg + '</div>');
        if (i === 0 && showVs) parts.push('<div class="battle-duel__vs-spacer" aria-hidden="true"></div>');
      });
      cont.innerHTML = '<div class="battle-duel' + (useSeq ? ' battle-duel--sequential' : '') + '">' + parts.join('') + '</div>';
      if (useSeq) runSeq(cont);
      if (fitFn) fitFn();
    }
    function demo() {
      const names = ['Fan Alpha','Fan Beta','Fan Gamma','Fan Delta','Fan Epsilon','Fan Zeta','Fan Eta','Fan Theta','Fan Iota','Fan Kappa'];
      const likes = [500, 420, 350, 300, 250, 200, 150, 100, 70, 40];
      names.forEach((name, i) => {
        const id = 'l_' + (i + 1);
        ranking[id] = { name, likes: likes[i], pic: isEmbed ? '/jarron/lv.png' : ('https://randomuser.me/api/portraits/' + (i % 2 ? 'men' : 'women') + '/' + (30 + i) + '.jpg') };
      });
    }
    function onLike(data) {
      const uid = data.uniqueId; if (!uid) return;
      const n = parseInt(data.count, 10) || 1;
      if (!ranking[uid]) ranking[uid] = { name: data.nickname || uid, likes: 0, pic: data.photo || '' };
      ranking[uid].likes += n;
      if (data.photo) ranking[uid].pic = data.photo;
      render();
    }

    let ws, rt;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
      ws.onopen = () => clearTimeout(rt);
      ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === 'like') { if (!isEmbed) onLike(m.payload); }
        else if (m.type === 'settings') { if (m.payload && m.payload.batallaLikes) { cfg = Object.assign(cfg, m.payload.batallaLikes); applyStyle(); render(); } }
        else if (m.type === 'batallaLikesTest') { if (!isEmbed) { ranking = {}; demo(); render({ seq: true }); } }
        else if (m.type === 'batallaLikesReset') { if (!isEmbed) { ranking = {}; render(); } }
        else if (m.type === 'sessionOverlays') {
          if (!isEmbed && m.payload && m.payload.batallaLikes) { ranking = m.payload.batallaLikes; render(); }
        }
      };
    }
    window.addEventListener('message', (e) => {
      const d = e.data; if (!d || d.kind !== 'batlikes') return;
      if (d.type === 'config') { cfg = Object.assign(cfg, d.config); applyStyle(); render(); }
      else if (d.type === 'test') { ranking = {}; demo(); render({ seq: true }); }
      else if (d.type === 'reset') { ranking = {}; if (isEmbed) demo(); render(); }
    });

    if (isEmbed) {
      document.documentElement.classList.add('embed');
      const root = document.querySelector('.battle-root');
      fitFn = () => { root.style.transform = 'none'; const s = Math.min(window.innerWidth / (root.offsetWidth + 6), window.innerHeight / (root.offsetHeight + 6), 1); root.style.transform = 'scale(' + s + ')'; };
      window.addEventListener('resize', fitFn);
    }
    applyStyle();
    if (isEmbed) { demo(); render(); } else render();
    connectWS();
  })();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
