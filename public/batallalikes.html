  <meta charset="UTF-8">

  <title>Overlay — Batalla de likes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Outfit:wght@500;600;700;800;900&family=Cinzel:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --magenta: #ff2bd6; --violet: #7b2cff; --cyan: #19e6ff; --gold: #f4c64e;
      --bat-gap: 10px; --bat-rh: 68px; --bat-rh1: 72px;
      --vs-scale: 1; --vs-x: 0px; --vs-y: 0px;
      --bat-vs-g1: rgba(56,189,248,.55); --bat-vs-g2: rgba(250,204,21,.35);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: transparent !important; overflow: hidden; }
    body { font-family: 'Outfit', system-ui, sans-serif; color: #fff; padding: 6px; }
    html.embed, html.embed body { width: 100%; height: 100%; }
    html.embed body { display: flex; align-items: center; justify-content: center; padding: 0; }
    html.embed .battle-root { transform: scale(var(--fit, 1)); transform-origin: center center; }
    .battle-root { display: inline-block; position: relative; }
    .battle-container { position: relative; width: 480px; overflow: visible; }
    .battle-duel { display: flex; flex-direction: column; gap: var(--bat-gap); position: relative; overflow: visible; }
    .battle-duel[data-t=b] { --bat-gap: 10px; --bat-rh: 64px; --bat-rh1: 96px; }
    .battle-duel[data-t=c] { --bat-gap: 12px; --bat-rh: 66px; --bat-rh1: 70px; }
    .battle-duel[data-t=d] { --bat-gap: 8px; --bat-rh: 64px; --bat-rh1: 74px; }
    .battle-duel__row {
      position: relative; z-index: 1; height: var(--bat-rh); min-height: var(--bat-rh);
    }
    .battle-duel__row[data-rank="1"] { height: var(--bat-rh1); min-height: var(--bat-rh1); z-index: 2; }
    .battle-duel__row.up .in::after { animation: flash .9s ease-out; }
    .in {
      position: relative; height: 100%;
      display: grid; grid-template-columns: 50px 50px 1fr auto; align-items: center; gap: 14px;
      padding: 0 18px 8px;
    }
    .in::after {
      content: ""; position: absolute; inset: 0; opacity: 0; pointer-events: none; border-radius: inherit;
      background: rgba(255,255,255,.4);
    }
    @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
    .intro .in { animation: enter .7s var(--ease, cubic-bezier(.2,.9,.3,1)) both; animation-delay: calc(var(--i) * .08s); }
    @keyframes enter { from { opacity: 0; transform: translateX(-70px); } to { opacity: 1; transform: none; } }
    .rk {
      position: relative; width: 50px !important; height: 54px !important;
      background: none !important; box-shadow: none !important; clip-path: none !important; border-radius: 0 !important;
    }
    .rk svg { position: absolute; inset: 0; width: 100%; height: 100%; display: none; filter: drop-shadow(0 4px 6px #000a); background: none !important; }
    .rk .hx { display: block; }
    [data-rank="1"] .cr, [data-rank="2"] .m2, [data-rank="3"] .m3 { display: block; }
    [data-rank="1"] .hx, [data-rank="2"] .hx, [data-rank="3"] .hx { display: none; }
    [data-rank="1"] .cr { filter: drop-shadow(0 0 10px rgba(255,200,60,.9)) drop-shadow(0 4px 5px #000a); }
    .rk span {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #fff !important; text-shadow: 0 2px 3px #000c; padding-top: 1px; font-weight: 800;
      background: none !important;
    }
    [data-rank="1"] .rk span, [data-rank="2"] .rk span, [data-rank="3"] .rk span { display: none; }
    .av { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: #0b0a1c; flex-shrink: 0; }
    .av img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .cn { display: flex; align-items: center; gap: 9px; }
    .coin, .like-ico { width: 28px; height: 28px; flex-shrink: 0; filter: drop-shadow(0 0 7px rgba(255,80,140,.75)) drop-shadow(0 2px 3px #000a); }
    .like-ico { display: grid; place-items: center; font-size: 22px; line-height: 1; width: auto; height: auto; }
    .bar { position: absolute; left: 146px; right: 18px; bottom: 9px; height: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
    .bar u { display: block; height: 100%; width: 0; transition: width .9s cubic-bezier(.3,1,.4,1); }

    /* D · NEUTRO (principal) */
    [data-t=d] { --flash: rgba(255,255,255,.22); }
    [data-t=d] .in::after { background: var(--flash); }
    [data-t=d] .nm { font: 600 17px 'Outfit', system-ui, sans-serif; color: #f1f1f1; letter-spacing: .01em; }
    [data-t=d] .cn b { font: 600 22px 'Outfit', system-ui, sans-serif; color: #fff; font-variant-numeric: tabular-nums; }
    [data-t=d] .in {
      border-radius: 12px; background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.13); backdrop-filter: blur(8px);
    }
    [data-t=d] [data-rank="1"] .in { background: rgba(255,255,255,.1); border-color: rgba(214,200,160,.5); }
    [data-t=d] .rk svg, [data-t=d] .coin, [data-t=d] .like-ico { filter: saturate(.5) brightness(.96) drop-shadow(0 3px 5px #0009); }
    [data-t=d] .av { filter: saturate(.5) brightness(.95); box-shadow: 0 0 0 2px #121316, 0 0 0 3px rgba(255,255,255,.3); }
    [data-t=d] [data-rank="1"] .av { box-shadow: 0 0 0 2px #121316, 0 0 0 3px rgba(214,200,160,.85); }
    [data-t=d] .bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); }
    [data-t=d] .bar u { background: linear-gradient(90deg, #6c7787, #d3dae4); }
    [data-t=d].intro .in { animation-name: enterd; }
    @keyframes enterd { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* A · NEÓN */
    [data-t=a] .nm { font: 800 15px 'Unbounded', sans-serif; color: #fff; }
    [data-t=a] .cn b { font: 600 24px 'Outfit', sans-serif; color: #aef6ff; text-shadow: 0 0 14px #19e6ffaa; }
    [data-t=a] .in {
      border-radius: 16px;
      background: linear-gradient(100deg, rgba(25,230,255,.10), rgba(123,44,255,.16));
      border: 1px solid rgba(130,150,255,.4); backdrop-filter: blur(6px);
    }
    [data-t=a] [data-rank="1"] .in { border-color: var(--magenta); box-shadow: 0 0 28px rgba(255,43,214,.4), inset 0 0 26px rgba(255,43,214,.14); }
    [data-t=a] [data-rank="2"] .in { border-color: var(--cyan); box-shadow: 0 0 22px rgba(25,230,255,.3); }
    [data-t=a] .rk span { font: 800 18px 'Unbounded', sans-serif; }
    [data-t=a] .av { box-shadow: 0 0 0 3px #0a0c24, 0 0 0 5px var(--violet); }
    [data-t=a] [data-rank="1"] .av { box-shadow: 0 0 0 3px #0a0c24, 0 0 0 5px var(--magenta), 0 0 20px var(--magenta); }
    [data-t=a] .bar { border-radius: 3px; }
    [data-t=a] .bar u { background: linear-gradient(90deg, var(--cyan), var(--magenta)); box-shadow: 0 0 10px var(--magenta); }

    /* B · ORO */
    [data-t=b] { --ease: cubic-bezier(.2,.8,.2,1); }
    [data-t=b] .nm {
      font: 700 18px 'Cinzel', serif; letter-spacing: .04em;
      background: linear-gradient(#fff2c4,#e0ac3a); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    [data-t=b] .cn { padding: 4px 14px 4px 10px; border-radius: 30px; background: #241a08; box-shadow: 0 0 0 1px #8a6a22; }
    [data-t=b] .cn b { font: 600 21px 'Outfit', sans-serif; color: #ffe9a6; }
    [data-t=b] .in {
      border-radius: 6px; background: linear-gradient(#17120a,#0b0905);
      box-shadow: inset 0 0 0 1px #2c2210, 0 0 0 1px #7a5d1e, 0 8px 18px #0008;
    }
    [data-t=b] [data-rank="1"] .in {
      background: linear-gradient(120deg,#6d4c0f,#f1c453 40%,#ffeaa0 55%,#b8862b);
      box-shadow: 0 0 0 2px #fff0b5, 0 0 34px rgba(244,198,78,.55);
    }
    [data-t=b] [data-rank="1"] .nm { background: none; -webkit-text-fill-color: #2a1a02; color: #2a1a02; font-size: 22px; }
    [data-t=b] [data-rank="1"] .cn { background: #2a1a02; box-shadow: 0 0 0 1px #2a1a02; }
    [data-t=b] .rk span { font: 900 18px 'Cinzel', serif; color: #e8c46a !important; }
    [data-t=b] .av { box-shadow: 0 0 0 3px #100c05, 0 0 0 5px #c9a13f; filter: saturate(.85); }
    [data-t=b] .bar { height: 3px; }
    [data-t=b] .bar u { background: linear-gradient(90deg,#8a6a22,#ffe08a); }
    [data-t=b] [data-rank="1"] .bar { background: #0003; }
    [data-t=b] [data-rank="1"] .bar u { background: #2a1a02; }

    /* C · ARCADE */
    [data-t=c] { --ease: steps(7); }
    [data-t=c] .nm { font: 400 11px 'Press Start 2P', monospace; color: #ffe14a; text-shadow: 2px 2px 0 #000; }
    [data-t=c] .cn b { font: 400 14px 'Press Start 2P', monospace; color: #3ef0ff; text-shadow: 2px 2px 0 #000; }
    [data-t=c] .in { background: #1e0e4c; box-shadow: 0 0 0 3px #ff3e9d, 6px 6px 0 3px #07021a; }
    [data-t=c] [data-rank="1"] .in { box-shadow: 0 0 0 3px #ffe14a, 6px 6px 0 3px #07021a; background: #2d1070; }
    [data-t=c] [data-rank="1"] .nm::before { content: "▶ "; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    [data-t=c] .rk span { font: 400 16px 'Press Start 2P', monospace; text-shadow: 2px 2px 0 #000; }
    [data-t=c] .av { border-radius: 0; box-shadow: 0 0 0 3px #07021a, 0 0 0 6px #3ef0ff; }
    [data-t=c] .bar { height: 8px; background: #07021a; }
    [data-t=c] .bar u { background: repeating-linear-gradient(90deg, #3ef0ff 0 9px, transparent 9px 12px); }
    [data-t=c] .battle-container::after {
      content: ""; position: absolute; inset: -6px; pointer-events: none; z-index: 40;
      background: repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.18) 3px 4px);
    }

    .vs-logo-img {
      position: absolute; left: 18px; bottom: -18px; z-index: 30;
      width: 108px; height: auto; max-height: none; object-fit: contain;
      transform: translate(var(--vs-x, 0px), calc(50% + var(--vs-y, 0px))) rotate(-5deg) scale(var(--vs-scale, 1));
      transform-origin: center center;
      filter: drop-shadow(0 0 10px var(--bat-vs-g1)) drop-shadow(0 0 16px var(--bat-vs-g2)) drop-shadow(1px 2px 0 rgba(0,0,0,.4));
      pointer-events: none; user-select: none;
    }
    .vs-logo-img--s2, .vs-logo-img--s3 { width: 72px; left: 28px; bottom: -12px; }
    .battle-duel__vs-spacer { height: 28px; flex-shrink: 0; pointer-events: none; }
    .battle-duel--sequential .battle-duel__row,
    .battle-duel--sequential .battle-duel__vs-spacer { opacity: 0; transform: translateY(10px); transition: opacity .4s ease, transform .4s ease; }
    .battle-duel--sequential .battle-duel__row.bat-seq-visible,
    .battle-duel--sequential .battle-duel__vs-spacer.bat-seq-visible { opacity: 1; transform: translateY(0); }
    .battle-placeholder { color: rgba(226,232,240,.88); font: 700 14px 'Outfit', sans-serif; text-align: center; padding: 24px 12px; }
    @media (prefers-reduced-motion: reduce) {
      .bar u { transition-duration: .01s; }
      .intro .in { animation-duration: .01s; }
    }
  </style>
</head>

  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const isEmbed = params.get('embed') === '1';
  let cfg = {
    limit: 2, nameRainbow: true, placeholder: 'Esperando combatientes...',
    valueColor: '#fecaca', likesIcon: '💕', bgOpacity: 45,
    vsStyle: 2, vsScale: 40, vsX: -19, vsY: 3,
    nameColor: '#ffffff', font: 'inter', cardBg: '#16262e', cardBorder: '#94a3b8',
    skin: 'neutro',
  };
  const THEME_MAP = { neutro: 'd', neon: 'a', oro: 'b', arcade: 'c', gold: 'b', classic: 'd', crimson: 'a', cyber: 'a' };
  function themeOf() {
    const s = String(cfg.skin || 'neutro').toLowerCase();
    return THEME_MAP[s] || 'd';
  }
  function normalizeSkin(s) {
    const k = String(s || 'neutro').toLowerCase();
    if (k === 'oro' || k === 'gold') return 'oro';
    if (k === 'arcade') return 'arcade';
    if (k === 'neon' || k === 'crimson' || k === 'cyber') return 'neon';
    return 'neutro';
  }
  let skinHoldUntil = 0;
  let heldSkin = '';
  function applyThemeOnly() {
    const duel = document.querySelector('.battle-duel');
    if (duel) duel.setAttribute('data-t', themeOf());
  }
  function refreshVsDom() {
    const img = document.querySelector('.vs-logo-img, .vs-logo-img--s2, .vs-logo-img--s3');
    if (!img) return;
    const src = vsImgSrc();
    const cls = vsImgClass();
    if (img.getAttribute('src') !== src) img.src = src;
    if (img.className !== cls) img.className = cls;
  }
  function mergeCfg(partial, fromLocal) {
    const bag = partial && typeof partial === 'object' ? { ...partial } : {};
    const keys = Object.keys(bag);
    if (!keys.length) return;
    if (bag.skin != null) bag.skin = normalizeSkin(bag.skin);
    const skinOnly = keys.every((k) => k === 'skin' || k === 'top1Skin');
    const prevSkin = normalizeSkin(cfg.skin);
    const prevLimit = parseInt(cfg.limit, 10) || 2;
    const prevVs = [cfg.vsStyle, cfg.vsScale, cfg.vsX, cfg.vsY, cfg.placeholder].join('|');

    if (fromLocal && skinOnly && bag.skin != null) {
      cfg.skin = bag.skin;
      heldSkin = bag.skin;
      skinHoldUntil = Date.now() + 12000;
      applyThemeOnly();
      if (fitFn) fitFn();
      return;
    }

    if (Date.now() < skinHoldUntil) {
      delete bag.skin;
      delete bag.top1Skin;
    }

    Object.assign(cfg, bag);
    if (Date.now() < skinHoldUntil) cfg.skin = heldSkin || prevSkin;
    cfg.skin = normalizeSkin(cfg.skin);

    applyStyle();
    const duel = document.querySelector('.battle-duel');
    const limitNow = parseInt(cfg.limit, 10) || 2;
    const vsNow = [cfg.vsStyle, cfg.vsScale, cfg.vsX, cfg.vsY, cfg.placeholder].join('|');
    const needRender = !duel || limitNow !== prevLimit;
    if (needRender) {
      render({ soft: true });
      return;
    }
    applyThemeOnly();
    if (vsNow !== prevVs) refreshVsDom();
    if (fitFn) fitFn();
  }
  function vsImgSrc() {
    const n = Math.max(1, Math.min(3, parseInt(cfg.vsStyle, 10) || 1));
    return '/img/vs-battle-' + n + '.png';
  }
  function vsImgClass() {
    const n = Math.max(1, Math.min(3, parseInt(cfg.vsStyle, 10) || 1));
    return 'vs-logo-img' + (n > 1 ? ' vs-logo-img--s' + n : '');
  }
  function applyVsPos() {
    const r = document.documentElement.style;
    const scale = Math.max(40, Math.min(180, Number(cfg.vsScale) || 100)) / 100;
    const x = Math.max(-80, Math.min(80, Number(cfg.vsX) || 0));
    const y = Math.max(-80, Math.min(80, Number(cfg.vsY) || 0));
    r.setProperty('--vs-scale', String(scale));
    r.setProperty('--vs-x', x + 'px');
    r.setProperty('--vs-y', y + 'px');
  }
  let ranking = {};
  let seqTimers = [];
  let fitFn = null;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function safeId(s) { return String(s == null ? '' : s).replace(/[^a-zA-Z0-9_-]/g, '_'); }
  function applyStyle() {
    applyVsPos();
    const ph = document.querySelector('.battle-placeholder');
    if (ph && !Object.keys(ranking).length) ph.textContent = cfg.placeholder || 'Esperando combatientes...';
  }
  function icoHtml() {
    const t = (cfg.likesIcon && String(cfg.likesIcon).trim()) ? String(cfg.likesIcon).slice(0, 8) : '💕';
    return '<span class="like-ico">' + esc(t) + '</span>';
  }
  function rankHtml(rank) {
    return '<div class="rk">' +
      '<svg class="hx" viewBox="0 0 50 54"><use href="#hx"/></svg>' +
      '<svg class="cr" viewBox="0 0 64 58"><use href="#crown"/></svg>' +
      '<svg class="md m2" viewBox="0 0 44 62"><use href="#m2"/></svg>' +
      '<svg class="md m3" viewBox="0 0 44 62"><use href="#m3"/></svg>' +
      '<span>' + rank + '</span></div>';
  }
  function clearSeq() { seqTimers.forEach((t) => clearTimeout(t)); seqTimers = []; }
  function runSeq(cont) {
    clearSeq();
    const wrap = cont.querySelector('.battle-duel--sequential');
    if (!wrap) return;
    wrap.querySelectorAll('.battle-duel__row, .battle-duel__vs-spacer').forEach((el, i) => {
      seqTimers.push(setTimeout(() => el.classList.add('bat-seq-visible'), i * 420));
    });
  }

  function render(opts) {
    opts = opts || {};
    clearSeq();
    const maxRows = Math.max(2, Math.min(10, parseInt(cfg.limit, 10) || 2));
    const arr = Object.entries(ranking).map(([id, d]) => ({ id, ...d })).sort((a, b) => b.likes - a.likes).slice(0, maxRows);
    const cont = document.getElementById('lista-ranking');
    if (!arr.length) {
      cont.innerHTML = '<div class="battle-placeholder">' + esc(cfg.placeholder || 'Esperando combatientes...') + '</div>';
      applyStyle();
      return;
    }
    const useSeq = !!opts.seq;
    const useIntro = useSeq || !!opts.intro;
    const showVs = arr.length >= 2;
    const maxVal = Math.max(...arr.map((u) => u.likes), 1);
    const parts = [];
    arr.forEach((u, i) => {
      const rank = i + 1;
      const vsImg = (i === 0 && showVs)
        ? '<img class="' + vsImgClass() + '" src="' + vsImgSrc() + '" alt="VS">'
        : '';
      const pct = Math.max(4, Math.round((u.likes / maxVal) * 100));
      parts.push(
        '<div class="battle-duel__row" data-rank="' + rank + '" id="card-' + safeId(u.id) + '" style="--i:' + i + '">' +
          '<div class="in">' +
            rankHtml(rank) +
            '<div class="av"><img src="' + esc(u.pic) + '" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility=\'hidden\'"></div>' +
            '<div class="nm">' + esc(u.name) + '</div>' +
            '<div class="cn">' + icoHtml() + '<b>' + u.likes.toLocaleString('es-ES') + '</b></div>' +
            '<div class="bar"><u style="width:' + pct + '%"></u></div>' +
          '</div>' +
          vsImg +
        '</div>'
      );
      if (i === 0 && showVs) parts.push('<div class="battle-duel__vs-spacer" aria-hidden="true"></div>');
    });
    const cls = 'battle-duel' + (useSeq ? ' battle-duel--sequential' : '') + (useIntro ? ' intro' : '');
    cont.innerHTML = '<div class="' + cls + '" data-t="' + themeOf() + '">' + parts.join('') + '</div>';
    if (useSeq) runSeq(cont);
    else if (useIntro) setTimeout(() => cont.querySelector('.battle-duel')?.classList.remove('intro'), 1200);
    if (fitFn) fitFn();
  }
  function demo() {
    const names = ['Fan Alpha','Fan Beta','Fan Gamma','Fan Delta','Fan Epsilon','Fan Zeta','Fan Eta','Fan Theta','Fan Iota','Fan Kappa'];
    const likes = [500, 420, 350, 300, 250, 200, 150, 100, 70, 40];
    names.forEach((name, i) => {
      const id = 'l_' + (i + 1);
      ranking[id] = { name, likes: likes[i], pic: isEmbed ? '/jarron/lv.png' : ('https://randomuser.me/api/portraits/' + (i % 2 ? 'men' : 'women') + '/' + (30 + i) + '.jpg') };
    });
  }
  function onLike(data) {
    const uid = data.uniqueId; if (!uid) return;
    const n = parseInt(data.count, 10) || 1;
    if (!ranking[uid]) ranking[uid] = { name: data.nickname || uid, likes: 0, pic: data.photo || '' };
    ranking[uid].likes += n;
    if (data.photo) ranking[uid].pic = data.photo;
    render({ soft: true });
  }

  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'like') { if (!isEmbed) onLike(m.payload); }
      else if (m.type === 'settings') { if (m.payload && m.payload.batallaLikes) mergeCfg(m.payload.batallaLikes, false); }
      else if (m.type === 'batallaLikesTest') { if (!isEmbed) { ranking = {}; demo(); render({ seq: true }); } }
      else if (m.type === 'batallaLikesReset') { if (!isEmbed) { ranking = {}; render(); } }
      else if (m.type === 'sessionOverlays') {
        if (!isEmbed && m.payload && m.payload.batallaLikes) { ranking = m.payload.batallaLikes; render({ soft: true }); }
      }
    };
  }
  window.addEventListener('message', (e) => {
    const d = e.data; if (!d || d.kind !== 'batlikes') return;
    if (d.type === 'config') { mergeCfg(d.config || {}, true); }
    else if (d.type === 'test') { ranking = {}; demo(); render({ seq: true }); }
    else if (d.type === 'reset') { ranking = {}; if (isEmbed) demo(); render(isEmbed ? { intro: true } : {}); }
  });

  if (isEmbed) {
    document.documentElement.classList.add('embed');
    const root = document.querySelector('.battle-root');
    fitFn = () => {
      root.style.transform = 'none';
      const s = Math.min(window.innerWidth / (root.offsetWidth + 6), window.innerHeight / (root.offsetHeight + 6), 1);
      root.style.transform = 'scale(' + s + ')';
    };
    window.addEventListener('resize', fitFn);
  }
  applyStyle();
  if (isEmbed) { demo(); render({ intro: true }); } else render();
  connectWS();
})();
  </script>
  <script src="/js/overlay-idle.js?v=oi1"></script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
