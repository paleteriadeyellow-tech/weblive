<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Meta de regalos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; background: transparent !important; }
    html.embed, html.embed body { width: 100%; height: 100%; }
    html.embed body { display: flex; align-items: center; justify-content: center; }
    html.embed .stage { transform: scale(var(--fit, 1)); transform-origin: center center; }
    .stage { width: 760px; height: 220px; }
    .banner {
      width: 760px; height: 220px; position: relative; overflow: hidden;
      border-radius: 28px;
      border: 2px solid var(--glow, #5ad4ff);
      box-shadow:
        0 0 0 1px var(--glow, #5ad4ff),
        0 0 18px var(--glow, #5ad4ff),
        inset 0 0 0 1px rgba(255,255,255,.08);
      background-color: #0a1018;
      background-image: var(--bg-img, none);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 18px 32px 16px; gap: 12px;
      --title-color: #ffffff; --counter-color: #ffffff; --bar-color: #5ad4ff; --glow: #5ad4ff;
    }
    .banner::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.32) 100%);
    }
    .title, .bar-wrap, .count { position: relative; z-index: 1; }
    .title {
      margin: 0; text-align: center; text-transform: uppercase;
      font-family: 'Montserrat', system-ui, sans-serif;
      font-weight: 900; font-size: 28px; letter-spacing: .08em; line-height: 1.15;
      color: var(--title-color);
      text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.55);
    }
    .bar-wrap {
      width: 88%; height: 22px; border-radius: 999px;
      background: rgba(12, 16, 22, .62);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: inset 0 1px 4px rgba(0,0,0,.45);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%; width: 0%;
      border-radius: inherit;
      background: var(--bar-color);
      box-shadow: 0 0 10px var(--bar-color);
      transition: width .35s ease;
    }
    .banner.is-reached .bar-fill {
      animation: bar-glow 1.4s ease-in-out infinite;
    }
    @keyframes bar-glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }
    .count {
      margin: 0; text-align: center;
      font-family: 'Montserrat', system-ui, sans-serif;
      font-weight: 800; font-size: 22px; letter-spacing: .02em;
      color: var(--counter-color);
      text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.5);
    }
    .count.bump { animation: count-bump .22s ease; }
    @keyframes count-bump {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="banner" id="banner">
      <h1 class="title" id="el-title">🎁 META DE REGALOS</h1>
      <div class="bar-wrap"><div class="bar-fill" id="el-bar"></div></div>
      <p class="count" id="el-count">0 / 50,000 💎</p>
    </div>
  </div>

  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const isEmbed = params.get('embed') === '1';

  const KIND = {
    hype: { title: 'META HYPE', icon: '✨', suffix: '✨' },
    likes: { title: 'META DE LIKES', icon: '❤️', suffix: '❤️' },
    follow: { title: 'META DE SEGUIDORES', icon: '👤', suffix: '👤' },
    share: { title: 'META DE COMPARTIDOS', icon: '↪️', suffix: '↪️' },
    gift: { title: 'META DE REGALOS', icon: '🎁', suffix: '💎' },
    member: { title: 'META DE MIEMBROS', icon: '⭐', suffix: '⭐' },
    viewers: { title: 'META DE ESPECTADORES', icon: '👁', suffix: '👁' },
  };

  let cfg = {
    title: 'META DE REGALOS',
    goalKind: 'gift',
    goal: 50000,
    bgUrl: '',
    titleColor: '#ffffff',
    counterColor: '#ffffff',
    barColor: '#5ad4ff',
    glowColor: '#5ad4ff',
  };
  let count = 0;

  const $ = (id) => document.getElementById(id);

  function kindMeta() {
    return KIND[String(cfg.goalKind || 'gift').toLowerCase()] || KIND.gift;
  }

  function fmt(n) {
    return Math.max(0, Math.floor(Number(n) || 0)).toLocaleString('en-US');
  }

  function mergeCfg(next) {
    if (!next || typeof next !== 'object') return;
    const prevBg = cfg.bgUrl;
    Object.assign(cfg, next);
    if (!Object.prototype.hasOwnProperty.call(next, 'bgUrl')) cfg.bgUrl = prevBg;
  }

  function applyStyle() {
    const root = $('banner');
    root.style.setProperty('--title-color', cfg.titleColor || '#ffffff');
    root.style.setProperty('--counter-color', cfg.counterColor || '#ffffff');
    root.style.setProperty('--bar-color', cfg.barColor || '#5ad4ff');
    root.style.setProperty('--glow', cfg.glowColor || '#5ad4ff');
    const url = String(cfg.bgUrl || '').trim();
    root.style.setProperty('--bg-img', url ? 'url("' + url.replace(/"/g, '\\"') + '")' : 'none');
    const meta = kindMeta();
    const t = String(cfg.title || meta.title).trim();
    $('el-title').textContent = /^[🎁✨❤❤️👤↪️⭐🌟👁💎🪙]/.test(t) ? t : (meta.icon + ' ' + t);
  }

  function render(bump) {
    const goal = Math.max(1, Number(cfg.goal) || 50000);
    const pct = Math.max(0, Math.min(100, (count / goal) * 100));
    $('el-bar').style.width = pct + '%';
    $('el-count').textContent = fmt(count) + ' / ' + fmt(goal) + ' ' + kindMeta().suffix;
    $('banner').classList.toggle('is-reached', count >= goal);
    if (bump) {
      const el = $('el-count');
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }
  }

  function setCount(n, goal, bump) {
    count = Math.max(0, Number(n) || 0);
    if (goal != null) cfg.goal = goal;
    render(bump);
  }

  let testTimer;
  function runTest() {
    clearTimeout(testTimer);
    count = 0;
    render();
    const goal = Math.max(1, Number(cfg.goal) || 50000);
    const step = () => {
      count = Math.min(goal, count + Math.max(1, Math.round(goal / 10)));
      render(true);
      if (count < goal) testTimer = setTimeout(step, 280);
    };
    testTimer = setTimeout(step, 220);
  }

  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'giftPhotoGoal') {
        if (String(cfg.goalKind || 'gift').toLowerCase() === 'viewers') return;
        setCount(m.payload.count, m.payload.goal, true);
      } else if (m.type === 'settings') {
        if (m.payload && m.payload.giftPhotoGoal) {
          mergeCfg(m.payload.giftPhotoGoal);
          applyStyle();
          render();
        }
      } else if (m.type === 'state') {
        if (String(cfg.goalKind || '').toLowerCase() === 'viewers' && m.payload && m.payload.stats) {
          const v = Number(m.payload.stats.viewers);
          if (Number.isFinite(v) && v >= 0) setCount(v, cfg.goal, true);
        }
      } else if (m.type === 'giftPhotoGoalTest') {
        if (!isEmbed) runTest();
      }
    };
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.kind !== 'giftbanner') return;
    if (d.type === 'config') { mergeCfg(d.config); applyStyle(); render(); }
    else if (d.type === 'test') runTest();
    else if (d.type === 'reset') { count = 0; render(); }
  });

  if (isEmbed) {
    document.documentElement.classList.add('embed');
    const fit = () => document.documentElement.style.setProperty('--fit', Math.min(window.innerWidth / 760, window.innerHeight / 220));
    fit();
    window.addEventListener('resize', fit);
  }
  applyStyle();
  render();
  connectWS();
})();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
