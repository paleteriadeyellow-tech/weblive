<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay — Top 3 Puntos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Fredoka:wght@600;700&family=Inter:wght@600;700;800;900&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800;900&family=Titan+One&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; background: transparent !important; font-family: var(--tf-font-stack, 'Inter', system-ui, sans-serif); color: #fff; }
    html[data-embed="1"] body { display: flex; justify-content: center; align-items: flex-start; width: 100%; min-height: 100%; }
    html[data-embed="1"] .stage { overflow: hidden; margin: 0 auto; }
    html[data-embed="1"] .widget { width: 920px; max-width: none; transform: scale(var(--ol-scale, 1)); transform-origin: top left; }
    .widget { position: relative; width: 920px; max-width: 96vw; transform: scale(var(--ol-scale, 1)); transform-origin: top center; }
    .sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
    .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, rgba(255,255,255,.2) 50%, transparent 70%); animation: sparkle 2.5s ease-in-out infinite; opacity: 0; }
    @keyframes sparkle { 0%,100% { opacity: 0; transform: scale(.4) rotate(0deg); } 50% { opacity: 1; transform: scale(1.2) rotate(180deg); } }
    .title {
      position: relative; z-index: 1; text-align: center; font-weight: 900; font-size: 42px; letter-spacing: .04em;
      margin: 0 0 12px; padding: 6px 0;
      background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #fb5607, #ff006e);
      background-size: 220% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.75)); animation: rainbow-flow 5s linear infinite;
    }
    @keyframes rainbow-flow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    html[data-titlefx="0"] .title { animation: none; background: none; -webkit-text-fill-color: var(--ol-accent, #ffd54f); color: var(--ol-accent, #ffd54f); filter: none; }
    html[data-title="0"] .title { display: none; }
    .list { position: relative; z-index: 1; display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45); border: 2px solid transparent; background-clip: padding-box; }
    html[data-glitter="1"] .list { border-image: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #fb5607) 1; animation: border-glow 4s linear infinite; }
    @keyframes border-glow { 0%,100% { filter: drop-shadow(0 0 8px rgba(255,0,110,.4)); } 50% { filter: drop-shadow(0 0 16px rgba(58,134,255,.6)); } }
    .row {
      display: grid; grid-template-columns: 72px 68px minmax(0, 1fr); align-items: center; gap: 0 12px;
      padding: 10px 14px 10px 8px; background: var(--row-bg, rgba(12,28,38,.88)); border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .row:last-child { border-bottom: none; }
    .row[data-rank="1"] { background: linear-gradient(90deg, rgba(255,215,0,.18), var(--row-bg, rgba(12,28,38,.88)) 40%); }
    .rank { display: flex; align-items: center; justify-content: center; min-height: 64px; border-right: 1px solid rgba(255,255,255,.1); padding-right: 4px; }
    .rank-num { font-size: 36px; font-weight: 800; color: rgba(255,255,255,.9); }
    .medal { font-size: 52px; line-height: 1; filter: drop-shadow(0 3px 10px rgba(0,0,0,.55)); }
    .av-wrap { position: relative; width: 68px; height: 68px; flex-shrink: 0; }
    .av { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,.25); background: #111; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    .row[data-rank="1"] .av { border-color: #ffd54f; box-shadow: 0 0 22px rgba(255,215,0,.45); }
    .row[data-rank="2"] .av { border-color: #cfd8dc; }
    .row[data-rank="3"] .av { border-color: #ffab73; }
    html[data-glitter="1"] .row[data-rank="1"] .av-wrap::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%; pointer-events: none;
      background: conic-gradient(from 0deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #ff006e);
      animation: spin-ring 3s linear infinite; z-index: -1; opacity: .85;
    }
    @keyframes spin-ring { to { transform: rotate(360deg); } }
    .meta { display: flex; align-items: center; min-width: 0; }
    .name-row { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .name {
      font-weight: 800; font-size: 28px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
      background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #fb5607, #ff006e);
      background-size: 220% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.8)); animation: rainbow-flow 5s linear infinite;
    }
    html[data-namefx="0"] .name { animation: none; background: none; -webkit-text-fill-color: var(--ol-accent, #ffd54f); color: var(--ol-accent, #ffd54f); filter: none; }
    .valwrap { display: flex; align-items: center; gap: 6px; }
    .ico { font-size: 22px; line-height: 0; filter: drop-shadow(0 0 8px rgba(255,213,79,.7)); }
    .num { font-size: 24px; font-weight: 900; color: var(--ol-accent, #ffd54f); letter-spacing: -.02em; white-space: nowrap; text-shadow: 0 2px 10px rgba(0,0,0,.55); font-variant-numeric: tabular-nums; }
    .empty { padding: 28px; text-align: center; font-size: 18px; color: rgba(255,255,255,.55); background: var(--row-bg, rgba(12,28,38,.88)); }
    html[data-bg="1"] .row, html[data-bg="1"] .empty { background: transparent !important; }
    html[data-bg="1"] .list { box-shadow: none; border: none; animation: none; }
    html[data-shadows="0"] .list, html[data-shadows="0"] .num, html[data-shadows="0"] .medal, html[data-shadows="0"] .ico, html[data-shadows="0"] .name, html[data-shadows="0"] .title { filter: none; text-shadow: none; box-shadow: none; }
    html[data-lines="0"] .row { border-bottom-color: transparent; }
    html[data-glitter="0"] .sparkles { display: none; }
    .list--seq .row { opacity: 0; transform: translateY(14px); transition: opacity .45s ease, transform .45s ease; }
    .list--seq .row.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="widget">
      <div class="sparkles" id="sparkles"></div>
      <h1 class="title" id="title">Top Puntos</h1>
      <div class="list" id="list"></div>
    </div>
  </div>
  <script src="/js/points-top-overlay.js"></script>
  <script>
    PointsTopOverlay.init({
      kind: 'toppoints',
      settingsKey: 'topPointsRank',
      defaults: {
        rows: 3, title: 'Top Puntos', accent: '#ffd54f', rowBg: '#0c1c26', scale: 100,
        font: 'inter', transparent: false, nameRainbow: true, titleRainbow: true,
        lines: true, shadows: true, glitter: true, showLevel: false, showTitle: true,
      },
    });
  </script>
</body>
</html>
