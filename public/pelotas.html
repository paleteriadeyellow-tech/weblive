<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/js/overlay-channel.js?v=ovch1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Overlay — Pelotas de fans</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }

    .stage {
      width: 540px; height: 720px; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(var(--tf-fit, 1)); transform-origin: center center;
    }
    .jar { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; height: 100%; pointer-events: none; }
    /* Piso y aro trasero del frasco: van DETRÁS de las pelotas para dar profundidad */
    .jar-back { position: absolute; inset: 0; z-index: 1; pointer-events: none; isolation: isolate; }
    .jar-back img.jar-classic { position: absolute; left: 50%; transform: translate(-50%, -50%); height: auto; pointer-events: none; }
    .jar-back .jb-rim { top: 246px; width: 266px; }
    .jar-back .jb-floor { top: 616px; width: 300px; }
    .jar-themed-img {
      display: none;
      position: absolute !important; inset: 0 !important;
      transform: none !important; width: 100%; height: 100%;
      object-fit: contain; object-position: center bottom; pointer-events: none;
    }
    html.jar-themed .jar-classic { display: none !important; }
    html.jar-themed .jar-themed-img {
      display: block;
      inset: auto !important;
      top: 180px !important;
      left: 0 !important;
      width: 540px !important;
      height: 605px !important;
      object-fit: fill;
    }
    html.jar-themed .jar-tint {
      -webkit-mask-image: var(--jar-skin-url); mask-image: var(--jar-skin-url);
      inset: auto; top: 180px; left: 0; width: 540px; height: 605px;
      -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
      -webkit-mask-position: 0 0; mask-position: 0 0;
    }
    html.jar-themed .jar-back .tint-themed {
      display: block;
      left: 0; top: 180px; width: 540px; height: 605px;
      transform: none;
      -webkit-mask-image: var(--jar-skin-back-url); mask-image: var(--jar-skin-back-url);
      -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: 0 0; mask-position: 0 0;
    }
    .jar-back .tint-themed { display: none; }
    /* Tinte del aro y el piso: cambian de color junto con el frasco */
    .jar-back .tint {
      position: absolute; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
      background: var(--jar-tint, transparent); mix-blend-mode: color; opacity: var(--jar-tint-opacity, 0);
      -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    }
    .jar-back .tint-rim { top: 246px; width: 266px; height: 35px; -webkit-mask-image: url('/jarron/jar-top-bg-2.png'); mask-image: url('/jarron/jar-top-bg-2.png'); }
    .jar-back .tint-floor { top: 616px; width: 300px; height: 80px; -webkit-mask-image: url('/jarron/jar-bottom.png'); mask-image: url('/jarron/jar-bottom.png'); }
    .jar-glass-rim img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; pointer-events: none; }
    .jar-interior { position: absolute; inset: 0; z-index: 3; isolation: isolate; }
    .gifts-layer { position: absolute; inset: 0; overflow: visible; }
    /* Pelota con la foto de perfil del fan */
    .fan-ball {
      position: absolute; top: 0; left: 0; border-radius: 50%; object-fit: cover; pointer-events: none; will-change: transform;
      border: 2px solid rgba(255,255,255,.85); box-shadow: 0 2px 6px rgba(0,0,0,.45);
      background: #2a2f3a; transform: translate3d(-999px, -999px, 0); transition: opacity .2s linear;
    }
    /* Pelota dorada del super fan */
    .fan-ball.golden {
      border: 3px solid #ffd34a;
      box-shadow: 0 0 10px 2px rgba(255,200,60,.85), 0 0 20px 4px rgba(255,170,30,.45), 0 2px 6px rgba(0,0,0,.45);
    }
    .jar-glass-rim { position: absolute; inset: 0; z-index: 5; pointer-events: none; isolation: isolate; }
    .jar-tint {
      position: absolute; inset: 0; pointer-events: none;
      background: var(--jar-tint, transparent); mix-blend-mode: color;
      opacity: var(--jar-tint-opacity, 0);
      -webkit-mask-image: url('/jarron/jar-top.png'); mask-image: url('/jarron/jar-top.png');
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center bottom; mask-position: center bottom;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="jar">
      <div class="jar-back" aria-hidden="true">
        <img class="jb-floor jar-classic" src="/jarron/jar-bottom.png" alt="" draggable="false" />
        <img class="jb-rim jar-classic" src="/jarron/jar-top-bg-2.png" alt="" draggable="false" />
        <div class="tint tint-floor jar-classic"></div>
        <div class="tint tint-rim jar-classic"></div>
        <img class="jar-themed-img" id="jar-skin-back" alt="" draggable="false" />
        <div class="tint tint-themed" id="jar-tint-back" aria-hidden="true"></div>
      </div>
      <div class="jar-interior" id="bowl">
        <div class="gifts-layer" id="gifts-layer"></div>
      </div>
      <div class="jar-glass-rim" aria-hidden="true">
        <img class="jar-classic" src="/jarron/jar-top.png" alt="" draggable="false" />
        <img class="jar-themed-img" id="jar-skin-front" alt="" draggable="false" />
        <div class="jar-tint" id="jar-tint"></div>
      </div>
    </div>
  </div>

  <script src="/js/matter.min.js"></script>
  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const isPreview = params.get('preview') === '1';
    const isEmbed = params.get('embed') === '1'; // vista previa dentro del panel (fija)

    // ---- Tinte del frasco (color del cristal) ----
    function applyJarTint(color) {
      const root = document.documentElement;
      const c = String(color || '').trim();
      if (!c || /^#?fff(fff)?$/i.test(c) || c === 'none' || c === 'transparent') {
        root.style.removeProperty('--jar-tint');
        root.style.removeProperty('--jar-tint-opacity');
        return;
      }
      root.style.setProperty('--jar-tint', c.charAt(0) === '#' ? c : '#' + c);
      root.style.setProperty('--jar-tint-opacity', '1');
    }
    applyJarTint(params.get('jc'));

    const JAR_SKIN_SRC = {
      crown: { back: '/jarron/skin-crown.png?v=13', front: '/jarron/skin-crown-front.png?v=13' },
      heart: { back: '/jarron/skin-heart.png?v=13', front: '/jarron/skin-heart-front.png?v=13' },
      cosmos: { back: '/jarron/skin-cosmos.png?v=13', front: '/jarron/skin-cosmos-front.png?v=13' },
      lava: { back: '/jarron/skin-lava.png?v=13', front: '/jarron/skin-lava-front.png?v=13' },
      cyber: { back: '/jarron/skin-cyber.png?v=13', front: '/jarron/skin-cyber-front.png?v=13' },
      ice: { back: '/jarron/skin-ice.png?v=13', front: '/jarron/skin-ice-front.png?v=13' },
      ocean: { back: '/jarron/skin-ocean.png?v=13', front: '/jarron/skin-ocean-front.png?v=13' },
      crystal: { back: '/jarron/skin-crystal.png?v=13', front: '/jarron/skin-crystal-front.png?v=13' },
      royal: { back: '/jarron/skin-royal.png?v=13', front: '/jarron/skin-royal-front.png?v=13' },
      forest: { back: '/jarron/skin-forest.png?v=13', front: '/jarron/skin-forest-front.png?v=13' },
      minecraft: { back: '/jarron/skin-minecraft.png?v=27', front: '/jarron/skin-minecraft-front.png?v=27' },
      padrinos: { back: '/jarron/skin-padrinos.png?v=27', front: '/jarron/skin-padrinos-front.png?v=27' },
      sao: { back: '/jarron/skin-sao.png?v=27', front: '/jarron/skin-sao-front.png?v=27' },
      onepiece: { back: '/jarron/skin-onepiece.png?v=27', front: '/jarron/skin-onepiece-front.png?v=27' },
      godofwar: { back: '/jarron/skin-godofwar.png?v=27', front: '/jarron/skin-godofwar-front.png?v=27' },
      dbz: { back: '/jarron/skin-dbz.png?v=27', front: '/jarron/skin-dbz-front.png?v=27' },
      sololeveling: { back: '/jarron/skin-sololeveling.png?v=27', front: '/jarron/skin-sololeveling-front.png?v=27' },
    };
    function applyJarSkin(id) {
      const next = String(id || '').trim();
      if (applyJarSkin._cur === next) return;
      applyJarSkin._cur = next;
      const pack = JAR_SKIN_SRC[next];
      const root = document.documentElement;
      const back = document.getElementById('jar-skin-back');
      const front = document.getElementById('jar-skin-front');
      if (!pack) {
        root.classList.remove('jar-themed');
        root.style.removeProperty('--jar-skin-url');
        root.style.removeProperty('--jar-skin-back-url');
        if (back) { back.removeAttribute('src'); back.alt = ''; }
        if (front) { front.removeAttribute('src'); front.alt = ''; }
        return;
      }
      root.style.setProperty('--jar-skin-url', 'url("' + pack.front + '")');
      root.style.setProperty('--jar-skin-back-url', 'url("' + pack.back + '")');
      root.classList.add('jar-themed');
      if (back) back.src = pack.back;
      if (front) front.src = pack.front;
    }
    if (params.get('skin')) applyJarSkin(params.get('skin'));

    // Ajusta el escenario para que el frasco se vea completo (sin recortes).
    (function fit() {
      function apply() {
        const k = Math.min((innerWidth || 540) / 540, (innerHeight || 720) / 720) || 1;
        document.documentElement.style.setProperty('--tf-fit', k);
      }
      apply(); addEventListener('resize', apply);
    })();

    // ---- Tamaño de la pelota (configurable desde el panel) ----
    let ballSize = 64;
    function setBallSize(n) {
      const v = Number(n);
      if (Number.isFinite(v) && v > 0) ballSize = Math.max(20, Math.min(160, v));
    }
    if (params.get('bs')) setBallSize(params.get('bs'));

    // Avatar de respaldo (cuando no hay foto): círculo de color con silueta.
    function avatarDataUri(hue) {
      const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'>"
        + "<defs><radialGradient id='g' cx='50%' cy='35%' r='75%'>"
        + "<stop offset='0%' stop-color='hsl(" + hue + ",70%,66%)'/>"
        + "<stop offset='100%' stop-color='hsl(" + hue + ",58%,40%)'/></radialGradient></defs>"
        + "<circle cx='50' cy='50' r='50' fill='url(#g)'/>"
        + "<circle cx='50' cy='41' r='17' fill='rgba(255,255,255,.92)'/>"
        + "<path d='M22 84 a28 24 0 0 1 56 0 z' fill='rgba(255,255,255,.92)'/></svg>";
      return 'data:image/svg+xml,' + encodeURIComponent(svg);
    }
    const FALLBACK_IMG = avatarDataUri(210);

    // ---- Pelotas persistidas (sobreviven apagón / reload de OBS) ----
    const lsKey = 'lc_pelotas_' + (params.get('room') || 'default');
    const PERSIST_MAX = 400;
    let persistTimer = null;
    let restoringBalls = false;
    function schedulePersist() {
      if (isEmbed || isPreview || restoringBalls) return;
      clearTimeout(persistTimer);
      persistTimer = setTimeout(savePersistState, 220);
    }
    function savePersistState() {
      if (isEmbed || isPreview) return;
      try {
        const g = balls.slice(-PERSIST_MAX).map((x) => ({
          u: String((x.img && (x.img.currentSrc || x.img.src)) || x.src || FALLBACK_IMG),
          s: Math.max(16, Math.round(Number(x.sizePx) || ballSize)),
          g: !!x.golden,
        }));
        localStorage.setItem(lsKey, JSON.stringify({ v: 2, g }));
      } catch {
        try {
          const g = balls.slice(-120).map((x) => ({
            u: String((x.img && (x.img.currentSrc || x.img.src)) || x.src || FALLBACK_IMG),
            s: Math.max(16, Math.round(Number(x.sizePx) || ballSize)),
            g: !!x.golden,
          }));
          localStorage.setItem(lsKey, JSON.stringify({ v: 2, g }));
        } catch { /* quota */ }
      }
    }
    function clearPersistState() {
      try { localStorage.removeItem(lsKey); } catch {}
    }

    // ---- Geometría del frasco (px del stage 540×720) ----
    const STAGE_W = 540, STAGE_H = 720;
    const IMG_SIZE = Math.min(STAGE_W, STAGE_H);
    const IMG_TOP = STAGE_H - IMG_SIZE, IMG_LEFT = (STAGE_W - IMG_SIZE) / 2;
    const artX = (p) => IMG_LEFT + (p / 100) * IMG_SIZE;
    const artY = (p) => IMG_TOP + (p / 100) * IMG_SIZE;
    const NECK_L = artX(26), NECK_R = artX(74);
    const BODY_L = artX(21.5), BODY_R = artX(78.5);
    const FLOOR_FLAT_L = artX(27), FLOOR_FLAT_R = artX(73);
    const SHOULDER_Y1 = artY(25), SHOULDER_Y2 = artY(31);
    const BODY_BOT_Y = artY(80), FLOOR_Y = artY(86);
    // Spawn un poco por encima del borde (como el jarrón), no tan alto que se atasquen fuera.
    const SPAWN_Y_TOP = artY(-8), SPAWN_Y_BOT = artY(6);
    const SPAWN_Y = (SPAWN_Y_TOP + SPAWN_Y_BOT) / 2;
    const JAR_CAPACITY = 150, HARD_CAP = 520;

    const M = window.Matter;
    if (!M) { console.warn('[pelotas] Matter.js no disponible.'); return; }
    const { Engine, World, Bodies, Body, Runner, Events } = M;

    const engine = Engine.create();
    engine.gravity.y = 0.8; engine.enableSleeping = true;
    const world = engine.world;

    const WT_GLASS = 24, WT_SOLID = 60;
    const wallOpts = { isStatic: true, friction: 0.36, restitution: 0.42 };
    const glassV = (x, yT, yB) => Bodies.rectangle(x, (yT + yB) / 2, WT_GLASS, (yB - yT), wallOpts);
    function glassSlant(x1, y1, x2, y2) {
      const b = Bodies.rectangle((x1 + x2) / 2, (y1 + y2) / 2, Math.hypot(x2 - x1, y2 - y1), WT_GLASS, wallOpts);
      Body.setAngle(b, Math.atan2(y2 - y1, x2 - x1)); return b;
    }
    const floorAt = (x1, x2, y, th) => Bodies.rectangle((x1 + x2) / 2, y + th / 2, (x2 - x1), th, wallOpts);

    const RIM_Y = artY(15), GROUND_Y = artY(93);
    World.add(world, [
      glassV(NECK_L, RIM_Y, SHOULDER_Y1), glassV(NECK_R, RIM_Y, SHOULDER_Y1),
      glassSlant(NECK_L, SHOULDER_Y1, BODY_L, SHOULDER_Y2), glassSlant(NECK_R, SHOULDER_Y1, BODY_R, SHOULDER_Y2),
      glassV(BODY_L, SHOULDER_Y2 - 4, BODY_BOT_Y), glassV(BODY_R, SHOULDER_Y2 - 4, BODY_BOT_Y),
      glassSlant(BODY_L, BODY_BOT_Y, FLOOR_FLAT_L, FLOOR_Y), glassSlant(BODY_R, BODY_BOT_Y, FLOOR_FLAT_R, FLOOR_Y),
      floorAt(FLOOR_FLAT_L - WT_GLASS, FLOOR_FLAT_R + WT_GLASS, FLOOR_Y, 40),
      floorAt(-200, STAGE_W + 200, GROUND_Y, WT_SOLID),
      Bodies.rectangle(-WT_SOLID / 2, STAGE_H / 2, WT_SOLID, STAGE_H * 2, wallOpts),
      Bodies.rectangle(STAGE_W + WT_SOLID / 2, STAGE_H / 2, WT_SOLID, STAGE_H * 2, wallOpts),
    ]);

    const giftsLayer = document.getElementById('gifts-layer');
    const balls = [];
    let spawnSeq = 0;
    const rnd = (a, b) => a + Math.random() * (b - a);

    Runner.run(Runner.create(), engine);

    // Devuelve al interior pelotas que rebotan / explotan hacia arriba o se atascan
    // en un montón encima de la boca (bug reportado en lives con muchas pelotas).
    function constrainBallInJar(g) {
      const p = g.body.position;
      const r = Math.max(8, (g.sizePx / 2) * 0.92);
      const inNeckX = p.x >= NECK_L - r && p.x <= NECK_R + r;
      const vy = g.body.velocity.y;
      const sp = Math.hypot(g.body.velocity.x, vy);

      if (p.y > SHOULDER_Y1) g.wasInside = true;

      if (!g.body.isStatic && g.wasInside && inNeckX && p.y < RIM_Y + r) {
        if (vy < 0.15) {
          const tuckY = Math.max(SHOULDER_Y2 + r, Math.min(FLOOR_Y - r, BODY_BOT_Y));
          Body.setPosition(g.body, {
            x: Math.max(BODY_L + r, Math.min(BODY_R - r, p.x)),
            y: tuckY,
          });
          Body.setVelocity(g.body, { x: g.body.velocity.x * 0.15, y: 0.4 });
          Body.setAngularVelocity(g.body, g.body.angularVelocity * 0.2);
          g.awakeSynced = false;
        } else if (vy < 0) {
          Body.setVelocity(g.body, { x: g.body.velocity.x * 0.45, y: vy * 0.08 });
        }
        return;
      }

      // Atasco en la boca: aún no entraron y están casi quietas encima del borde.
      if (!g.body.isStatic && !g.wasInside && inNeckX && (p.y + r) < RIM_Y + 12 && sp < 1.2) {
        const mid = (NECK_L + NECK_R) / 2;
        Body.setPosition(g.body, {
          x: Math.max(NECK_L + r + 2, Math.min(NECK_R - r - 2, mid + rnd(-10, 10))),
          y: RIM_Y + r + 8,
        });
        Body.setVelocity(g.body, { x: rnd(-0.4, 0.4), y: rnd(1.6, 3.2) });
        Body.setAngularVelocity(g.body, rnd(-0.08, 0.08));
        g.awakeSynced = false;
      }
    }

    Events.on(engine, 'afterUpdate', function () {
      for (let i = 0; i < balls.length; i++) {
        const g = balls[i];
        if (!g.body.isSleeping) {
          const v = g.body.velocity, sp = Math.hypot(v.x, v.y);
          if (sp > 10) { const s = 10 / sp; Body.setVelocity(g.body, { x: v.x * s, y: v.y * s }); }
        }
        constrainBallInJar(g);
        if (g.body.isSleeping && g.awakeSynced) continue;
        const p = g.body.position, half = g.sizePx / 2;
        g.img.style.transform = 'translate3d(' + (p.x - half).toFixed(1) + 'px,' + (p.y - half).toFixed(1) + 'px,0) rotate(' + g.body.angle.toFixed(3) + 'rad)';
        g.awakeSynced = g.body.isSleeping;
      }
    });

    function ballSizeForFill() {
      let base = ballSize * rnd(0.94, 1.06);
      const fill = Math.min(1, balls.length / JAR_CAPACITY);
      if (fill > 0.5) base *= 0.94;
      if (fill > 0.75) base *= 0.9;
      if (fill > 0.9) base *= 0.88;
      return Math.round(Math.max(16, Math.min(160, base)));
    }

    function removeBallAt(i, skipPersist) {
      const g = balls[i]; if (!g) return;
      try { World.remove(world, g.body); } catch {}
      if (g.img && g.img.parentNode) g.img.parentNode.removeChild(g.img);
      balls.splice(i, 1);
      if (!skipPersist && !restoringBalls) schedulePersist();
    }
    function pruneJar() {
      for (let i = balls.length - 1; i >= 0; i--) {
        const p = balls[i].body.position, r = balls[i].sizePx / 2;
        const inNeckX = p.x >= NECK_L - r && p.x <= NECK_R + r;
        if (inNeckX && (p.y + r) < RIM_Y - 6 && balls[i].wasInside && !balls[i].body.isStatic) {
          const tuckY = Math.max(SHOULDER_Y2 + r, Math.min(FLOOR_Y - r, BODY_BOT_Y));
          Body.setPosition(balls[i].body, {
            x: Math.max(BODY_L + r, Math.min(BODY_R - r, p.x)),
            y: tuckY,
          });
          Body.setVelocity(balls[i].body, { x: 0, y: 0 });
          Body.setAngularVelocity(balls[i].body, 0);
          balls[i].awakeSynced = false;
          continue;
        }
        if ((p.y - r) > (STAGE_H + 80) || (p.x + r) < -180 || (p.x - r) > (STAGE_W + 180)) removeBallAt(i);
      }
      if (balls.length > HARD_CAP) {
        let toRemove = balls.length - HARD_CAP;
        const order = balls.map((g, idx) => ({ idx, outside: (g.body.position.x < BODY_L - 2 || g.body.position.x > BODY_R + 2) ? 0 : 1, y: g.body.position.y }))
          .sort((a, b) => a.outside !== b.outside ? a.outside - b.outside : b.y - a.y);
        const idxs = [];
        for (let k = 0; k < order.length && toRemove > 0; k++) { idxs.push(order[k].idx); toRemove--; }
        idxs.sort((a, b) => b - a).forEach(removeBallAt);
      }
    }
    setInterval(pruneJar, 1200);

    function pickSpawnSpot(r) {
      // Caen desde 3 puntos (izquierda, centro y derecha) dentro de la boca del frasco.
      const margin = r + 6;
      const minX = NECK_L + margin, maxX = NECK_R - margin;
      const mid = (NECK_L + NECK_R) / 2, span = NECK_R - NECK_L;
      const lanes = [NECK_L + span * 0.2, mid, NECK_R - span * 0.2];
      let cx = lanes[Math.floor(Math.random() * lanes.length)] + rnd(-8, 8);
      cx = Math.max(minX, Math.min(maxX, cx));
      const vx = (mid - cx) / 70 + rnd(-0.25, 0.25);
      const y = Math.max(28, rnd(SPAWN_Y_TOP, SPAWN_Y_BOT));
      return { x: cx, y, vx };
    }
    function addBall(photo, sizePx, golden, opts) {
      opts = opts || {};
      const src = photo || FALLBACK_IMG;
      // La pelota dorada del super fan es algo más grande para que destaque.
      if (golden && !opts.restore) sizePx = Math.round(sizePx * 1.25);
      const r = Math.max(8, (sizePx / 2) * 0.92);
      let x, y, vx;
      if (opts.x != null) { x = opts.x; y = opts.y != null ? opts.y : SPAWN_Y; vx = 0; }
      else {
        const s = pickSpawnSpot(r);
        x = s.x; y = s.y; vx = s.vx;
      }
      const body = Bodies.circle(x, y, r, {
        density: 0.0014,
        restitution: 0.38,
        friction: 0.18,
        frictionStatic: 0.22,
        frictionAir: 0.012,
        sleepThreshold: 22,
      });
      if (opts.angle != null) Body.setAngle(body, opts.angle);
      // Misma velocidad de caída; el rebote viene de restitution.
      if (!opts.settled) {
        Body.setVelocity(body, { x: vx, y: rnd(1.4, 3.2) });
        Body.setAngularVelocity(body, rnd(-0.12, 0.12));
      }
      const img = document.createElement('img');
      img.className = golden ? 'fan-ball golden' : 'fan-ball'; img.src = src; img.alt = ''; img.referrerPolicy = 'no-referrer';
      img.style.width = sizePx + 'px'; img.style.height = sizePx + 'px';
      img.style.zIndex = String((golden ? 230 : 30) + (++spawnSeq % 200));
      img.onerror = function () { this.onerror = null; this.src = FALLBACK_IMG; };
      img.style.transform = 'translate3d(' + (x - r).toFixed(1) + 'px,' + (y - r).toFixed(1) + 'px,0) rotate(' + (opts.angle || 0).toFixed(3) + 'rad)';
      giftsLayer.appendChild(img);
      World.add(world, body);
      balls.push({ body, img, sizePx, src, golden: !!golden, awakeSynced: false, wasInside: !!(opts.restore || opts.settled) });
      if (!opts.restore) schedulePersist();
    }
    function dropBalls(photo, count, gap, golden) {
      const n = Math.max(0, parseInt(count, 10) || 0);
      if (n < 1) return;
      // Espaciado adaptativo: con muchas pelotas se acelera, pero no tanto
      // como para atascarlas todas en la boca del frasco.
      gap = gap || (n > 40 ? 70 : n > 20 ? 95 : n > 10 ? 110 : 130);
      gap = Math.max(55, gap);
      for (let i = 0; i < n; i++) (function (idx) {
        setTimeout(() => addBall(photo, ballSizeForFill(), golden), idx * gap);
      })(i);
    }
    function clearJar(skipPersist) {
      for (let i = balls.length - 1; i >= 0; i--) removeBallAt(i, true);
      if (!skipPersist) schedulePersist();
    }
    function restorePersistedBalls() {
      if (isEmbed || isPreview) return;
      let data = null;
      try {
        const raw = localStorage.getItem(lsKey);
        if (raw == null || raw === '') return;
        data = JSON.parse(String(raw).trim());
      } catch { return; }
      const list = Array.isArray(data && data.g) ? data.g.slice(-PERSIST_MAX) : [];
      if (!list.length) return;
      restoringBalls = true;
      // Empaque desde el piso hacia arriba (sin solapes fuertes) para evitar la
      // explosión de Matter que empuja el montón fuera de la boca.
      let i = 0;
      (function batch() {
        const end = Math.min(i + 24, list.length);
        for (; i < end; i++) {
          const it = list[i] || {};
          const sizePx = Math.max(16, Number(it.s) || ballSize);
          const r = Math.max(8, (sizePx / 2) * 0.92);
          const stepX = Math.max(r * 1.85, 18);
          const stepY = Math.max(r * 1.7, 16);
          const usableW = Math.max(stepX, (BODY_R - BODY_L) - 2 * r - 10);
          const cols = Math.max(1, Math.floor(usableW / stepX));
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x0 = BODY_L + r + 6;
          const x = cols <= 1
            ? (BODY_L + BODY_R) / 2
            : x0 + col * ((BODY_R - BODY_L - 2 * r - 12) / (cols - 1));
          const y = FLOOR_Y - r - 6 - row * stepY;
          const clampedY = Math.max(SHOULDER_Y2 + r + 2, Math.min(FLOOR_Y - r - 4, y));
          const clampedX = Math.max(BODY_L + r + 2, Math.min(BODY_R - r - 2, x));
          addBall(it.u || FALLBACK_IMG, sizePx, !!it.g, {
            restore: true,
            settled: true,
            x: clampedX + rnd(-1.5, 1.5),
            y: clampedY + rnd(-1, 1),
            angle: rnd(-0.25, 0.25),
          });
        }
        if (i < list.length) setTimeout(batch, 0);
        else { restoringBalls = false; schedulePersist(); }
      })();
    }

    // ---- WebSocket nativo del panel ----
    let ws, reconnectTimer, fillTimer = null;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws${location.search}`);
      ws.onopen = () => clearTimeout(reconnectTimer);
      ws.onclose = () => { reconnectTimer = setTimeout(connectWS, 1500); };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        const { type, payload } = msg;
        if (type === 'fanBallDrop') { if (!isEmbed && payload) dropBalls(payload.photo, payload.count || 1); }
        else if (type === 'goldenBall') { if (!isEmbed && payload) dropBalls(payload.photo, payload.count || 1, 0, true); }
        else if (type === 'panic') clearJar();
        else if (type === 'pelotasTest') { if (!isEmbed) runDemo((payload && payload.count) || 16); }
        else if (type === 'pelotasReset') { if (!isEmbed) { if (fillTimer) clearTimeout(fillTimer); clearJar(true); clearPersistState(); } }
        else if (type === 'settings') {
          if (payload && payload.pelotas) {
            if (!params.get('jc')) applyJarTint(payload.pelotas.tint);
            if (payload.pelotas.ballSize != null) setBallSize(payload.pelotas.ballSize);
            if (payload.pelotas.skin !== undefined) applyJarSkin(payload.pelotas.skin);
          }
        }
      };
    }
    connectWS();
    if (!isEmbed) restorePersistedBalls();

    // ---- Demo / prueba: deja caer pelotas con FOTOS de personas de muestra ----
    // (si no hay internet, cada imagen cae al avatar local por su onerror).
    function demoPhoto() {
      return 'https://i.pravatar.cc/150?img=' + Math.floor(rnd(1, 71));
    }
    function runDemo(total) {
      if (fillTimer) { clearTimeout(fillTimer); fillTimer = null; }
      clearJar(true); clearPersistState();
      let i = 0; const max = total || 16;
      (function tick() {
        if (i >= max) {
          // Cierra la demo soltando una pelota dorada (super fan) de muestra.
          fillTimer = setTimeout(() => addBall(demoPhoto(), ballSizeForFill(), true), 250);
          return;
        }
        addBall(demoPhoto(), ballSizeForFill());
        i++; fillTimer = setTimeout(tick, 180);
      })();
    }
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.kind !== 'pelotas') return;
      if (d.type === 'test') runDemo(d.count || 16);
      else if (d.type === 'reset') { if (fillTimer) clearTimeout(fillTimer); clearJar(true); clearPersistState(); }
      else if (d.type === 'config') {
        if (d.tint !== undefined) applyJarTint(d.tint);
        if (d.ballSize !== undefined) setBallSize(d.ballSize);
        if (d.skin !== undefined) applyJarSkin(d.skin);
      }
    });

    // ---- Vista previa standalone (?preview=1): cae en bucle ----
    if (isPreview) {
      const demo = () => {
        runDemo(20);
        setTimeout(() => { clearJar(); demo(); }, 9000);
      };
      setTimeout(demo, 800);
    }
  })();
  </script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
