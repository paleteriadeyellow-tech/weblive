<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay — Habibi Top Donador</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Fredoka:wght@600;700&family=Inter:wght@700;800&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800;900&family=Titan+One&display=swap');

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: transparent !important;
  overflow: hidden;
  font-family: 'Inter', system-ui, sans-serif;
  width: 420px; height: 520px;
}
html.embed, html.embed body { width: 100%; height: 100%; }
html.embed body { display: flex; align-items: center; justify-content: center; }
html.embed .stage { transform: scale(calc(var(--ol-scale, 1) * var(--fit, 1))); transform-origin: center center; }

:root {
  --tc1: #ff6eb4; --tc2: #ffd700; --tc3: #6ee7ff;
  --name-color: #ffffff; --name-stroke: rgba(74, 0, 32, 0.85);
  --value-color: #ffe8f0; --value-stroke: rgba(42, 0, 16, 0.9);
  --coin-color: #ffd700;
  --ol-scale: 1;
  --font-stack: 'Luckiest Guy', system-ui, sans-serif;
}

.stage {
  width: 420px; height: 520px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 8px 12px 16px;
  transform: scale(var(--ol-scale)); transform-origin: top center;
}

.title {
  margin: 0 0 6px;
  font-family: var(--font-stack);
  font-weight: 800;
  font-size: 26px;
  line-height: 1.1;
  text-align: center;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  max-width: 96%;
}

.title--gradient {
  background: linear-gradient(95deg, var(--tc1), var(--tc2), var(--tc3));
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px rgba(255, 255, 255, 0.95);
  paint-order: stroke fill;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}

.title--rainbow-fixed,
.title--rainbow-move,
.name.rainbow-text-fixed,
.name.rainbow-text-move,
.points-val.rainbow-text-fixed,
.points-val.rainbow-text-move {
  background: linear-gradient(92deg, #ff6b6b, #ffb74d, #fff176, #81c784, #4fc3f7, #ba68c8, #ff6b6b);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.95);
  paint-order: stroke fill;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.55));
}

.title--rainbow-move,
.rainbow-text-move {
  background-size: 300% 100%;
  animation: rainbow-shift 3.5s linear infinite;
}

@keyframes rainbow-shift {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

.frame-wrap {
  position: relative;
  width: 340px; height: 340px;
  flex-shrink: 0;
}

.avatar-hole {
  position: absolute;
  z-index: 1;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle, #2a1838 0%, #120818 100%);
  pointer-events: none;
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: contain;
  object-position: center center;
  display: block;
  background: #120818;
}

.frame-img {
  position: relative;
  z-index: 2;
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
}

.info { text-align: center; margin-top: 4px; max-width: 96%; }

.name {
  font-family: var(--font-stack);
  font-weight: 800;
  font-size: 28px;
  line-height: 1.05;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 380px;
}

.name.rainbow-text-fixed,
.name.rainbow-text-move {
  text-shadow: none;
}

.name.text--solid {
  color: var(--name-color);
  -webkit-text-stroke: 1px var(--name-stroke);
  paint-order: stroke fill;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
}

.points {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; margin-top: 6px;
  font-family: var(--font-stack);
  font-weight: 800; font-size: 24px;
}

.points-val.text--solid {
  color: var(--value-color);
  -webkit-text-stroke: 0.8px var(--value-stroke);
  paint-order: stroke fill;
  text-shadow: 0 2px 5px rgba(0,0,0,0.45);
}

.coin {
  width: 22px; height: 22px; flex-shrink: 0; display: block;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.45));
  pointer-events: none;
}

.stage[data-empty="1"] .avatar-hole { opacity: 0.4; }
.stage[data-empty="1"] .name { opacity: 0.6; }
</style>
</head>
<body>
<div class="stage" id="stage" data-empty="1">
  <h1 class="title title--gradient" id="title">HABIBI DEL MES</h1>
  <div class="frame-wrap">
    <div class="avatar-hole">
      <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer">
    </div>
    <img class="frame-img" id="frame" src="/habibis/top9.png" alt="">
  </div>
  <div class="info">
    <div class="name text--solid" id="name">Esperando...</div>
    <div class="points" id="points">
      <svg class="coin" id="coin-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="11" fill="var(--coin-color)"/>
        <circle cx="12" cy="12" r="5" fill="none" stroke="#fff" stroke-width="2.5"/>
      </svg>
      <span class="points-val text--solid" id="points-val">0 diamantes</span>
    </div>
  </div>
</div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const isEmbed = params.get('embed') === '1';
  const DEFAULT_PIC = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
  const PREVIEW_PIC = '/jarron/lv.png';
  const FONTS = {
    luckiest: "'Luckiest Guy', system-ui, sans-serif", bangers: "'Bangers', system-ui, sans-serif",
    lilita: "'Lilita One', system-ui, sans-serif", titan: "'Titan One', system-ui, sans-serif",
    fredoka: "'Fredoka', system-ui, sans-serif", bungee: "'Bungee', system-ui, sans-serif",
    rubik: "'Rubik', system-ui, sans-serif", oswald: "'Oswald', system-ui, sans-serif",
    bebas: "'Bebas Neue', Impact, sans-serif", montserrat: "'Montserrat', system-ui, sans-serif",
    poppins: "'Poppins', system-ui, sans-serif", orbitron: "'Orbitron', system-ui, sans-serif",
    inter: "'Inter', system-ui, sans-serif", system: "system-ui, sans-serif",
  };

  const AVATAR_LAYOUT = { top: 0.415, left: 0.5, size: 0.56 };

  let cfg = {
    headerTitle: 'HABIBI DEL MES', resetPeriod: 'month', coinLabel: 'diamantes',
    font: 'luckiest', rainbowMode: 'move',
    tc1: '#ff6eb4', tc2: '#ffd700', tc3: '#6ee7ff',
    nameColor: '#ffffff', nameStroke: '#4a0020',
    valueColor: '#ffe8f0', valueStroke: '#2a0010', coinColor: '#ffd700',
    scale: 100,
  };
  let topData = null;
  let previewMode = false;

  const $ = (id) => document.getElementById(id);

  function hex(v, def) {
    if (v == null) return def;
    let s = String(v).trim().replace(/^#/, '');
    if (/^[0-9a-fA-F]{3}$/.test(s)) s = s.split('').map((c) => c + c).join('');
    return /^[0-9a-fA-F]{6}$/.test(s) ? ('#' + s.toLowerCase()) : def;
  }

  function applyFrameLayout() {
    const lay = AVATAR_LAYOUT;
    const frame = $('frame');
    const hole = document.querySelector('.avatar-hole');
    const wrap = document.querySelector('.frame-wrap');
    if (!frame || !hole || !wrap || !frame.naturalWidth) return;

    const boxW = wrap.clientWidth;
    const boxH = wrap.clientHeight;
    const imgW = frame.naturalWidth;
    const imgH = frame.naturalHeight;
    const scale = Math.min(boxW / imgW, boxH / imgH);
    const dispW = imgW * scale;
    const dispH = imgH * scale;
    const offX = (boxW - dispW) / 2;
    const offY = (boxH - dispH) / 2;
    const cx = offX + lay.left * dispW;
    const cy = offY + lay.top * dispH;
    const size = lay.size * Math.min(dispW, dispH);

    hole.style.width = size + 'px';
    hole.style.height = size + 'px';
    hole.style.left = (cx - size / 2) + 'px';
    hole.style.top = (cy - size / 2) + 'px';
  }

  function applyRainbowText(el, rm) {
    if (!el) return;
    el.classList.remove('rainbow-text-fixed', 'rainbow-text-move', 'text--solid');
    if (rm === 'move') el.classList.add('rainbow-text-move');
    else if (rm === 'fixed') el.classList.add('rainbow-text-fixed');
    else el.classList.add('text--solid');
  }

  function applyStyle() {
    const root = document.documentElement;
    const stack = FONTS[cfg.font] || FONTS.luckiest;
    root.style.setProperty('--font-stack', stack);
    root.style.setProperty('--tc1', hex(cfg.tc1, '#ff6eb4'));
    root.style.setProperty('--tc2', hex(cfg.tc2, '#ffd700'));
    root.style.setProperty('--tc3', hex(cfg.tc3, '#6ee7ff'));
    root.style.setProperty('--name-color', hex(cfg.nameColor, '#ffffff'));
    root.style.setProperty('--name-stroke', hex(cfg.nameStroke, '#4a0020'));
    root.style.setProperty('--value-color', hex(cfg.valueColor, '#ffe8f0'));
    root.style.setProperty('--value-stroke', hex(cfg.valueStroke, '#2a0010'));
    root.style.setProperty('--coin-color', hex(cfg.coinColor, '#ffd700'));
    let sc = parseInt(cfg.scale, 10);
    if (!Number.isFinite(sc)) sc = 100;
    root.style.setProperty('--ol-scale', String(Math.min(150, Math.max(60, sc)) / 100));

    const t = $('title');
    t.textContent = (cfg.headerTitle || 'HABIBI DEL MES').trim();
    const rm = String(cfg.rainbowMode || 'off').toLowerCase();
    t.classList.remove('title--gradient', 'title--rainbow-fixed', 'title--rainbow-move');
    if (rm === 'move') t.classList.add('title--rainbow-move');
    else if (rm === 'fixed') t.classList.add('title--rainbow-fixed');
    else t.classList.add('title--gradient');

    applyRainbowText($('name'), rm);
    applyRainbowText($('points-val'), rm);

    const fr = $('frame');
    if (fr) {
      fr.onload = () => applyFrameLayout();
      if (fr.complete) applyFrameLayout();
    }
  }

  function render() {
    const label = (cfg.coinLabel || 'diamantes').trim();
    const suffix = label ? (' ' + label) : '';
    const valEl = $('points-val');
    const img = $('avatar');
    const top = previewMode
      ? { nickname: 'Habibi Preview', profilePictureUrl: PREVIEW_PIC, coins: 12500 }
      : topData;

    if (!top) {
      $('stage').dataset.empty = '1';
      $('name').textContent = 'Esperando...';
      valEl.textContent = '0' + suffix;
      img.onerror = null;
      img.src = DEFAULT_PIC;
      return;
    }
    $('stage').dataset.empty = '0';
    $('name').textContent = (top.nickname || 'Usuario').replace(/^@+/, '');
    img.onerror = function () { this.onerror = null; this.src = DEFAULT_PIC; };
    img.src = top.profilePictureUrl || top.photo || DEFAULT_PIC;
    valEl.textContent = (top.coins || 0).toLocaleString('es-ES') + suffix;
  }

  function applyPayload(payload) {
    if (previewMode) return;
    topData = payload && payload.top ? payload.top : null;
    render();
  }

  function runTest() { previewMode = true; render(); }
  function resetTop() { previewMode = false; topData = null; render(); }

  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'settings') {
        if (m.payload && m.payload.habibiTop) {
          cfg = Object.assign(cfg, m.payload.habibiTop);
          applyStyle(); render();
        }
      } else if (m.type === 'habibiTop') {
        applyPayload(m.payload);
      } else if (m.type === 'habibiTopTest') {
        if (!isEmbed) runTest();
      } else if (m.type === 'habibiTopReset') {
        if (!isEmbed && cfg.resetPeriod === 'live') resetTop();
      }
    };
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.kind !== 'habibitop') return;
    if (d.type === 'config') {
      cfg = Object.assign(cfg, d.config);
      applyStyle(); render();
    }
    else if (d.type === 'test') runTest();
    else if (d.type === 'reset') { previewMode = false; isEmbed ? runTest() : resetTop(); }
  });

  if (isEmbed) {
    document.documentElement.classList.add('embed');
    const fit = () => {
      document.documentElement.style.setProperty('--fit', Math.min(window.innerWidth / 420, window.innerHeight / 520));
      applyFrameLayout();
    };
    fit();
    window.addEventListener('resize', fit);
  }

  window.addEventListener('resize', () => applyFrameLayout());

  applyStyle();
  if (isEmbed) runTest(); else render();
  connectWS();
})();
</script>
</body>
</html>
