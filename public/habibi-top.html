<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Overlay — Habibi Top Donador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Bebas+Neue&family=Bungee&family=Fredoka:wght@600;700&family=Inter:wght@700;800&family=Lilita+One&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800;900&family=Titan+One&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: transparent !important;
  overflow: hidden;
  font-family: 'Inter', system-ui, sans-serif;
  width: 420px; height: 520px;
}
html.embed, html.embed body { width: 100%; height: 100%; }
html.embed body { display: flex; align-items: center; justify-content: center; }
html.embed .stage { transform: scale(calc(var(--ol-scale, 1) * var(--fit, 1))); transform-origin: center center; }

:root {
  --hc1: #ff6b35; --hc2: #ff4500; --hc3: #ffd700;
  --ng1: #fff8f0; --ng2: #ffb347; --ng3: #ff4500;
  --vc: #ffe8d6; --vs: #2a0a00;
  --ol-scale: 1;
  --tf-font-stack: 'Luckiest Guy', 'Arial Black', Impact, sans-serif;
  --tf-name-font-stack: 'Luckiest Guy', 'Arial Black', Impact, sans-serif;
}

.stage {
  width: 420px; height: 520px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 8px 12px 16px;
  transform: scale(var(--ol-scale)); transform-origin: top center;
}

.mvp-header {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 6px; max-width: 96%;
}

.mvp-header-title {
  margin: 0;
  font-family: var(--tf-font-stack);
  font-weight: 800;
  font-size: 26px;
  letter-spacing: 0.02em;
  line-height: 1.15;
  text-align: center;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mvp-header-title--rainbow {
  background: linear-gradient(92deg, #ff1744, #ff9100, #ffea00, #00e676, #00b0ff, #e040fb, #ff1744);
  background-size: 300% 100%;
  animation: title-rainbow 4.5s linear infinite;
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.5));
}

.mvp-header-title--rainbow-fixed {
  background: linear-gradient(92deg, #ff1744, #ff9100, #ffea00, #00e676, #00b0ff, #e040fb, #ff1744);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.5));
}

.mvp-header-title--gradient {
  background: linear-gradient(100deg, var(--hc1), var(--hc2), var(--hc3));
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.45));
}

@keyframes title-rainbow {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

.frame-wrap {
  position: relative;
  width: 340px; height: 340px;
  flex-shrink: 0;
}

.avatar-hole {
  position: absolute; z-index: 1;
  top: 0; left: 0;
  width: 0; height: 0;
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle, #2a1838 0%, #120818 100%);
  pointer-events: none;
}

.avatar {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: contain;
  object-position: center center;
  display: block;
  background: #120818;
}

.frame-img {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
}

.info { text-align: center; margin-top: 4px; max-width: 96%; }

.nombre {
  font-family: var(--tf-name-font-stack);
  font-weight: 900;
  font-size: 28px;
  letter-spacing: 0.04em;
  text-align: center;
  max-width: 380px;
  line-height: 1.2;
  margin: 0 auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: linear-gradient(180deg, var(--ng1) 0%, var(--ng2) 45%, var(--ng3) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.95)) drop-shadow(0 0 12px rgba(255, 100, 0, 0.45));
}

.monedas {
  margin-top: 8px;
  color: var(--vc);
  font-family: var(--tf-font-stack);
  font-weight: 800;
  font-size: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  text-shadow: 0 2px 0 var(--vs), 0 2px 6px rgba(0,0,0,0.9), 0 0 14px rgba(255, 120, 40, 0.35);
}

.moneda {
  width: 22px; height: 22px;
  flex-shrink: 0;
}

.stage[data-empty="1"] .avatar-hole { opacity: 0.4; }
</style>
</head>
<body>
<div class="stage" id="stage" data-empty="1">
  <header class="mvp-header">
    <h1 class="mvp-header-title mvp-header-title--rainbow" id="title">HABIBI DEL MES</h1>
  </header>
  <div class="frame-wrap">
    <div class="avatar-hole">
      <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer">
    </div>
    <img class="frame-img" id="frame" src="/habibis/top9.png" alt="">
  </div>
  <div class="info">
    <div class="nombre" id="nombre">Esperando...</div>
    <div class="monedas" id="monedas"><span id="monedas-inner"></span></div>
  </div>
</div>

<script>
(function () {
  const OV_BUILD = '4';
  const params = new URLSearchParams(location.search);
  const isEmbed = params.get('embed') === '1';
  const DEFAULT_PIC = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
  const PREVIEW_PIC = '/jarron/lv.png';
  const FONTS = {
    luckiest: "'Luckiest Guy', 'Arial Black', Impact, sans-serif",
    bangers: "'Bangers', 'Arial Black', Impact, sans-serif",
    lilita: "'Lilita One', system-ui, sans-serif",
    titan: "'Titan One', system-ui, sans-serif",
    fredoka: "'Fredoka', system-ui, sans-serif",
    bungee: "'Bungee', system-ui, sans-serif",
    rubik: "'Rubik', system-ui, sans-serif",
    oswald: "'Oswald', system-ui, sans-serif",
    bebas: "'Bebas Neue', Impact, sans-serif",
    montserrat: "'Montserrat', system-ui, sans-serif",
    poppins: "'Poppins', system-ui, sans-serif",
    orbitron: "'Orbitron', system-ui, sans-serif",
    inter: "'Inter', system-ui, sans-serif",
    system: "system-ui, sans-serif",
  };

  const AVATAR_LAYOUT = { top: 0.415, left: 0.5, size: 0.56 };

  let cfg = {
    headerTitle: 'HABIBI DEL MES',
    resetPeriod: 'month',
    coinLabel: 'diamantes',
    font: 'luckiest',
    rainbowMode: 'move',
    tc1: '#ff6b35', tc2: '#ff4500', tc3: '#ffd700',
    ng1: '#fff8f0', ng2: '#ffb347', ng3: '#ff4500',
    valueColor: '#ffe8d6', valueStroke: '#2a0a00', coinColor: '#ffd700',
    scale: 100,
  };
  let topData = null;
  let previewMode = false;

  const $ = (id) => document.getElementById(id);

  function hex(v, def) {
    if (v == null) return def;
    let s = String(v).trim().replace(/^#/, '');
    if (/^[0-9a-fA-F]{3}$/.test(s)) s = s.split('').map((c) => c + c).join('');
    return /^[0-9a-fA-F]{6}$/.test(s) ? ('#' + s.toLowerCase()) : def;
  }

  function applyFrameLayout() {
    const lay = AVATAR_LAYOUT;
    const frame = $('frame');
    const hole = document.querySelector('.avatar-hole');
    const wrap = document.querySelector('.frame-wrap');
    if (!frame || !hole || !wrap || !frame.naturalWidth) return;

    const boxW = wrap.clientWidth;
    const boxH = wrap.clientHeight;
    const imgW = frame.naturalWidth;
    const imgH = frame.naturalHeight;
    const scale = Math.min(boxW / imgW, boxH / imgH);
    const dispW = imgW * scale;
    const dispH = imgH * scale;
    const offX = (boxW - dispW) / 2;
    const offY = (boxH - dispH) / 2;
    const cx = offX + lay.left * dispW;
    const cy = offY + lay.top * dispH;
    const size = lay.size * Math.min(dispW, dispH);

    hole.style.width = size + 'px';
    hole.style.height = size + 'px';
    hole.style.left = (cx - size / 2) + 'px';
    hole.style.top = (cy - size / 2) + 'px';
  }

  function coinSvg() {
    const c = hex(cfg.coinColor, '#ffd700');
    return '<svg class="moneda" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="11" fill="' + c + '"/>' +
      '<circle cx="12" cy="12" r="5" fill="none" stroke="#fff" stroke-width="2.5"/></svg>';
  }

  function applyStyle() {
    const root = document.documentElement;
    const stack = FONTS[cfg.font] || FONTS.luckiest;
    root.style.setProperty('--tf-font-stack', stack);
    root.style.setProperty('--tf-name-font-stack', stack);
    root.style.setProperty('--hc1', hex(cfg.tc1, '#ff6b35'));
    root.style.setProperty('--hc2', hex(cfg.tc2, '#ff4500'));
    root.style.setProperty('--hc3', hex(cfg.tc3, '#ffd700'));
    root.style.setProperty('--ng1', hex(cfg.ng1, '#fff8f0'));
    root.style.setProperty('--ng2', hex(cfg.ng2, '#ffb347'));
    root.style.setProperty('--ng3', hex(cfg.ng3, '#ff4500'));
    root.style.setProperty('--vc', hex(cfg.valueColor, '#ffe8d6'));
    root.style.setProperty('--vs', hex(cfg.valueStroke, '#2a0a00'));
    let sc = parseInt(cfg.scale, 10);
    if (!Number.isFinite(sc)) sc = 100;
    root.style.setProperty('--ol-scale', String(Math.min(150, Math.max(60, sc)) / 100));

    const t = $('title');
    t.textContent = (cfg.headerTitle || 'HABIBI DEL MES').trim();
    const rm = String(cfg.rainbowMode || 'move').toLowerCase();
    t.classList.remove('mvp-header-title--gradient', 'mvp-header-title--rainbow', 'mvp-header-title--rainbow-fixed');
    if (rm === 'off') t.classList.add('mvp-header-title--gradient');
    else if (rm === 'fixed') t.classList.add('mvp-header-title--rainbow-fixed');
    else t.classList.add('mvp-header-title--rainbow');

    const fr = $('frame');
    if (fr) {
      fr.onload = () => applyFrameLayout();
      if (fr.complete) applyFrameLayout();
    }
  }

  function render() {
    const label = (cfg.coinLabel || 'diamantes').trim();
    const suffix = label ? (' ' + label) : '';
    const inner = $('monedas-inner');
    const img = $('avatar');
    const top = previewMode
      ? { nickname: 'Habibi Preview', profilePictureUrl: PREVIEW_PIC, coins: 12500 }
      : topData;

    if (!top) {
      $('stage').dataset.empty = '1';
      $('nombre').textContent = 'Esperando...';
      inner.innerHTML = coinSvg() + ' <span>0' + suffix + '</span>';
      img.onerror = null;
      img.src = DEFAULT_PIC;
      return;
    }
    $('stage').dataset.empty = '0';
    $('nombre').textContent = (top.nickname || 'Usuario').replace(/^@+/, '');
    img.onerror = function () { this.onerror = null; this.src = DEFAULT_PIC; };
    img.src = top.profilePictureUrl || top.photo || DEFAULT_PIC;
    inner.innerHTML = coinSvg() + ' <span>' + (top.coins || 0).toLocaleString('es-ES') + suffix + '</span>';
  }

  function applyPayload(payload) {
    if (previewMode) return;
    topData = payload && payload.top ? payload.top : null;
    render();
  }

  function runTest() { previewMode = true; render(); }
  function resetTop() { previewMode = false; topData = null; render(); }

  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'settings') {
        if (m.payload && m.payload.habibiTop) {
          cfg = Object.assign(cfg, m.payload.habibiTop);
          applyStyle(); render();
        }
      } else if (m.type === 'habibiTop') {
        applyPayload(m.payload);
      } else if (m.type === 'habibiTopTest') {
        if (!isEmbed) runTest();
      } else if (m.type === 'habibiTopReset') {
        if (!isEmbed && cfg.resetPeriod === 'live') resetTop();
      }
    };
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.kind !== 'habibitop') return;
    if (d.type === 'config') {
      cfg = Object.assign(cfg, d.config);
      applyStyle(); render();
    } else if (d.type === 'test') runTest();
    else if (d.type === 'reset') { previewMode = false; isEmbed ? runTest() : resetTop(); }
  });

  if (isEmbed) {
    document.documentElement.classList.add('embed');
    const fit = () => {
      document.documentElement.style.setProperty('--fit', Math.min(window.innerWidth / 420, window.innerHeight / 520));
      applyFrameLayout();
    };
    fit();
    window.addEventListener('resize', fit);
  }

  window.addEventListener('resize', () => applyFrameLayout());

  if (params.get('v') !== OV_BUILD) {
    const u = new URL(location.href);
    u.searchParams.set('v', OV_BUILD);
    location.replace(u.toString());
    return;
  }

  applyStyle();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { applyStyle(); render(); });
  }
  if (isEmbed) runTest(); else render();
  connectWS();
})();
</script>
</body>
</html>
