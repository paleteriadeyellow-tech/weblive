<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Overlay — Habibi Top Donador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Bebas+Neue&family=Bungee&family=Fredoka:wght@600;700&family=Inter:wght@700;800&family=Lilita+One&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Rubik:wght@700;800;900&family=Titan+One&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: transparent !important;
  overflow: hidden;
  font-family: 'Inter', system-ui, sans-serif;
  width: 420px; height: 520px;
}
html.embed, html.embed body { width: 100%; height: 100%; }
html.embed body { display: flex; align-items: center; justify-content: center; }
html.embed .stage { transform: scale(calc(var(--ol-scale, 1) * var(--fit, 1))); transform-origin: center center; }

:root {
  --hc1: #ff6b35; --hc2: #ff4500; --hc3: #ffd700;
  --ng1: #fff8f0; --ng2: #ffb347; --ng3: #ff4500;
  --vc: #ffe8d6; --vs: #2a0a00;
  --ol-scale: 1;
  --tf-font-stack: 'Luckiest Guy', 'Arial Black', Impact, sans-serif;
  --tf-name-font-stack: 'Luckiest Guy', 'Arial Black', Impact, sans-serif;
}

.stage {
  width: 420px; height: 520px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 8px 12px 16px;
  transform: scale(var(--ol-scale)); transform-origin: top center;
}

.mvp-header {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 6px; max-width: 96%;
}

.mvp-header-title {
  margin: 0;
  font-family: var(--tf-font-stack);
  font-weight: 800;
  font-size: calc(26px * var(--title-scale, 1));
  letter-spacing: 0.02em;
  line-height: 1.15;
  text-align: center;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mvp-header-title--rainbow {
  background: linear-gradient(92deg, #ff1744, #ff9100, #ffea00, #00e676, #00b0ff, #e040fb, #ff1744);
  background-size: 300% 100%;
  animation: title-rainbow 4.5s linear infinite;
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.5));
}

.mvp-header-title--rainbow-fixed {
  background: linear-gradient(92deg, #ff1744, #ff9100, #ffea00, #00e676, #00b0ff, #e040fb, #ff1744);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.5));
}

.mvp-header-title--gradient {
  background: linear-gradient(100deg, var(--hc1), var(--hc2), var(--hc3));
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.45));
}

@keyframes title-rainbow {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

.frame-wrap {
  position: relative;
  width: 340px; height: 340px;
  flex-shrink: 0;
  overflow: visible;
}

.fw-canvas {
  position: absolute;
  left: -70px; top: -70px;
  width: calc(100% + 140px);
  height: calc(100% + 140px);
  z-index: 0;
  pointer-events: none;
}

.frame-float {
  position: absolute;
  inset: 0;
  z-index: 1;
  transform-origin: center center;
  animation: frame-float 4.8s ease-in-out infinite;
  will-change: transform;
}

@keyframes frame-float {
  0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
  25% { transform: translateY(-10px) rotate(-0.8deg) scale(1.01); }
  50% { transform: translateY(-14px) rotate(0deg) scale(1.015); }
  75% { transform: translateY(-7px) rotate(0.8deg) scale(1.008); }
}

.avatar-hole {
  position: absolute; z-index: 1;
  top: 0; left: 0;
  width: 0; height: 0;
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle, #2a1838 0%, #120818 100%);
  pointer-events: none;
}

.avatar {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: contain;
  object-position: center center;
  display: block;
  background: #120818;
}

.frame-img {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
}

.info { text-align: center; margin-top: 4px; max-width: 96%; }

.nombre {
  font-family: var(--tf-name-font-stack);
  font-weight: 900;
  font-size: 28px;
  letter-spacing: 0.04em;
  text-align: center;
  max-width: 380px;
  line-height: 1.2;
  margin: 0 auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: linear-gradient(180deg, var(--ng1) 0%, var(--ng2) 45%, var(--ng3) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.95)) drop-shadow(0 0 12px rgba(255, 100, 0, 0.45));
}

.monedas {
  margin-top: 8px;
  color: var(--vc);
  font-family: var(--tf-font-stack);
  font-weight: 800;
  font-size: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  text-shadow: 0 2px 0 var(--vs), 0 2px 6px rgba(0,0,0,0.9), 0 0 14px rgba(255, 120, 40, 0.35);
}

.moneda {
  width: 22px; height: 22px;
  flex-shrink: 0;
}

.stage[data-empty="1"] .avatar-hole { opacity: 0.4; }
</style>
</head>
<body>
<div class="stage" id="stage" data-empty="1">
  <header class="mvp-header">
    <h1 class="mvp-header-title mvp-header-title--rainbow" id="title">HABIBI DEL MES</h1>
  </header>
  <div class="frame-wrap">
    <canvas class="fw-canvas" id="fw-canvas" aria-hidden="true"></canvas>
    <div class="frame-float">
      <div class="avatar-hole">
        <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer">
      </div>
      <img class="frame-img" id="frame" src="/habibis/top9.png" alt="">
    </div>
  </div>
  <div class="info">
    <div class="nombre" id="nombre">Esperando...</div>
    <div class="monedas" id="monedas"><span id="monedas-inner"></span></div>
  </div>
</div>

<script>
(function () {
  const OV_BUILD = '12';
  const FW_PAD = 70;
  const params = new URLSearchParams(location.search);
  const TOP_CACHE_KEY = 'habibitop_v1_' + (params.get('room') || 'local');
  const isEmbed = params.get('embed') === '1';
  const DEFAULT_PIC = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';
  const PREVIEW_PIC = '/jarron/lv.png';
  const FONTS = {
    luckiest: "'Luckiest Guy', 'Arial Black', Impact, sans-serif",
    bangers: "'Bangers', 'Arial Black', Impact, sans-serif",
    lilita: "'Lilita One', system-ui, sans-serif",
    titan: "'Titan One', system-ui, sans-serif",
    fredoka: "'Fredoka', system-ui, sans-serif",
    bungee: "'Bungee', system-ui, sans-serif",
    rubik: "'Rubik', system-ui, sans-serif",
    oswald: "'Oswald', system-ui, sans-serif",
    bebas: "'Bebas Neue', Impact, sans-serif",
    montserrat: "'Montserrat', system-ui, sans-serif",
    poppins: "'Poppins', system-ui, sans-serif",
    orbitron: "'Orbitron', system-ui, sans-serif",
    inter: "'Inter', system-ui, sans-serif",
    system: "system-ui, sans-serif",
  };

  const DESIGNS = {
    '1': { src: '/habibis/top9.png', layout: { top: 0.415, left: 0.5, size: 0.56 } },
    '2': { src: '/habibis/design2.png', layout: { top: 0.415, left: 0.5, size: 0.54 } },
    '3': { src: '/habibis/design3.png', layout: { top: 0.415, left: 0.5, size: 0.54 } },
  };

  function resolveDesign(id) {
    const key = String(id == null ? '1' : id);
    return DESIGNS[key] || DESIGNS['1'];
  }

  let cfg = {
    headerTitle: 'HABIBI DEL MES',
    resetPeriod: 'month',
    design: '1',
    coinLabel: 'diamantes',
    font: 'luckiest',
    rainbowMode: 'move',
    tc1: '#ff6b35', tc2: '#ff4500', tc3: '#ffd700',
    ng1: '#fff8f0', ng2: '#ffb347', ng3: '#ff4500',
    valueColor: '#ffe8d6', valueStroke: '#2a0a00', coinColor: '#ffd700',
    titleSize: 100,
    scale: 100,
  };
  let topData = null;
  let previewMode = false;

  const $ = (id) => document.getElementById(id);

  function pickPhoto() {
    for (let i = 0; i < arguments.length; i++) {
      const p = String(arguments[i] || '').trim();
      if (p) return p;
    }
    return '';
  }

  function loadTopCache() {
    try {
      const raw = localStorage.getItem(TOP_CACHE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    return null;
  }

  function saveTopCache(top) {
    try {
      if (top && (top.nickname || top.uniqueId)) {
        localStorage.setItem(TOP_CACHE_KEY, JSON.stringify(top));
      }
    } catch {}
  }

  function clearTopCache() {
    try { localStorage.removeItem(TOP_CACHE_KEY); } catch {}
  }

  function mergeTopData(incoming, cached) {
    if (!incoming) return cached || null;
    if (!cached || String(cached.uniqueId || '') !== String(incoming.uniqueId || '')) {
      const photo = pickPhoto(incoming.profilePictureUrl, incoming.photo);
      return { ...incoming, profilePictureUrl: photo, photo };
    }
    const photo = pickPhoto(incoming.profilePictureUrl, incoming.photo, cached.profilePictureUrl, cached.photo);
    return {
      ...cached,
      ...incoming,
      uniqueId: incoming.uniqueId || cached.uniqueId,
      nickname: incoming.nickname || cached.nickname,
      coins: incoming.coins != null ? incoming.coins : cached.coins,
      profilePictureUrl: photo,
      photo,
    };
  }

  function hex(v, def) {
    if (v == null) return def;
    let s = String(v).trim().replace(/^#/, '');
    if (/^[0-9a-fA-F]{3}$/.test(s)) s = s.split('').map((c) => c + c).join('');
    return /^[0-9a-fA-F]{6}$/.test(s) ? ('#' + s.toLowerCase()) : def;
  }

  function applyFrameLayout() {
    const lay = resolveDesign(cfg.design).layout;
    const frame = $('frame');
    const hole = document.querySelector('.avatar-hole');
    const wrap = document.querySelector('.frame-wrap');
    if (!frame || !hole || !wrap || !frame.naturalWidth) return;

    const boxW = wrap.clientWidth;
    const boxH = wrap.clientHeight;
    const imgW = frame.naturalWidth;
    const imgH = frame.naturalHeight;
    const scale = Math.min(boxW / imgW, boxH / imgH);
    const dispW = imgW * scale;
    const dispH = imgH * scale;
    const offX = (boxW - dispW) / 2;
    const offY = (boxH - dispH) / 2;
    const cx = offX + lay.left * dispW;
    const cy = offY + lay.top * dispH;
    const size = lay.size * Math.min(dispW, dispH);

    hole.style.width = size + 'px';
    hole.style.height = size + 'px';
    hole.style.left = (cx - size / 2) + 'px';
    hole.style.top = (cy - size / 2) + 'px';
  }

  function coinSvg() {
    const c = hex(cfg.coinColor, '#ffd700');
    return '<svg class="moneda" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="11" fill="' + c + '"/>' +
      '<circle cx="12" cy="12" r="5" fill="none" stroke="#fff" stroke-width="2.5"/></svg>';
  }

  function applyStyle() {
    const root = document.documentElement;
    const stack = FONTS[cfg.font] || FONTS.luckiest;
    root.style.setProperty('--tf-font-stack', stack);
    root.style.setProperty('--tf-name-font-stack', stack);
    root.style.setProperty('--hc1', hex(cfg.tc1, '#ff6b35'));
    root.style.setProperty('--hc2', hex(cfg.tc2, '#ff4500'));
    root.style.setProperty('--hc3', hex(cfg.tc3, '#ffd700'));
    root.style.setProperty('--ng1', hex(cfg.ng1, '#fff8f0'));
    root.style.setProperty('--ng2', hex(cfg.ng2, '#ffb347'));
    root.style.setProperty('--ng3', hex(cfg.ng3, '#ff4500'));
    root.style.setProperty('--vc', hex(cfg.valueColor, '#ffe8d6'));
    root.style.setProperty('--vs', hex(cfg.valueStroke, '#2a0a00'));
    let sc = parseInt(cfg.scale, 10);
    if (!Number.isFinite(sc)) sc = 100;
    root.style.setProperty('--ol-scale', String(Math.min(150, Math.max(60, sc)) / 100));
    let ts = parseInt(cfg.titleSize, 10);
    if (!Number.isFinite(ts)) ts = 100;
    root.style.setProperty('--title-scale', String(Math.min(200, Math.max(50, ts)) / 100));

    const design = resolveDesign(cfg.design);
    const fr = $('frame');
    if (fr) {
      const nextSrc = design.src;
      const applyLayout = () => applyFrameLayout();
      fr.onload = applyLayout;
      if (fr.getAttribute('src') !== nextSrc) {
        fr.src = nextSrc;
      } else if (fr.complete) {
        applyLayout();
      }
    }

    const t = $('title');
    t.textContent = (cfg.headerTitle || 'HABIBI DEL MES').trim();
    const rm = String(cfg.rainbowMode || 'move').toLowerCase();
    t.classList.remove('mvp-header-title--gradient', 'mvp-header-title--rainbow', 'mvp-header-title--rainbow-fixed');
    if (rm === 'off') t.classList.add('mvp-header-title--gradient');
    else if (rm === 'fixed') t.classList.add('mvp-header-title--rainbow-fixed');
    else t.classList.add('mvp-header-title--rainbow');
  }

  function render() {
    const label = (cfg.coinLabel || 'diamantes').trim();
    const suffix = label ? (' ' + label) : '';
    const inner = $('monedas-inner');
    const img = $('avatar');
    const top = previewMode
      ? { nickname: 'Habibi Preview', profilePictureUrl: PREVIEW_PIC, coins: 12500 }
      : topData;

    if (!top) {
      $('stage').dataset.empty = '1';
      $('nombre').textContent = 'Esperando...';
      inner.innerHTML = coinSvg() + ' <span>0' + suffix + '</span>';
      img.onerror = null;
      img.src = DEFAULT_PIC;
      return;
    }
    $('stage').dataset.empty = '0';
    $('nombre').textContent = (top.nickname || 'Usuario').replace(/^@+/, '');
    img.onerror = function () {
      const cached = pickPhoto(top.profilePictureUrl, top.photo);
      if (this.src !== DEFAULT_PIC && cached && this.src === cached) {
        this.onerror = null;
        this.src = DEFAULT_PIC;
        return;
      }
      this.onerror = null;
      this.src = DEFAULT_PIC;
    };
    const photo = pickPhoto(top.profilePictureUrl, top.photo, loadTopCache()?.profilePictureUrl, loadTopCache()?.photo);
    img.src = photo || DEFAULT_PIC;
    inner.innerHTML = coinSvg() + ' <span>' + (top.coins || 0).toLocaleString('es-ES') + suffix + '</span>';
  }

  function applyPayload(payload) {
    if (previewMode) return;
    const cached = loadTopCache();
    const periodStart = payload && payload.periodStart != null ? payload.periodStart : null;
    const cacheStale = cached && periodStart != null && cached._periodStart != null
      && cached._periodStart !== periodStart;
    if (cacheStale) clearTopCache();

    const incoming = payload && payload.top ? payload.top : null;
    if (incoming) {
      topData = mergeTopData(incoming, cacheStale ? null : cached);
      if (periodStart != null) topData._periodStart = periodStart;
      if (payload.period) topData._period = payload.period;
      saveTopCache(topData);
    } else if (!cacheStale && cached && (cached.coins > 0 || cached.nickname)) {
      topData = cached;
    } else {
      topData = null;
      clearTopCache();
    }
    render();
  }

  function runTest() { previewMode = true; render(); launchFireworksShow('big'); }
  function resetTop() { previewMode = false; topData = null; clearTopCache(); render(); }

  /* --- Fuegos artificiales (detrás del marco) --- */
  const FW_COLORS = ['#ff1744', '#ff9100', '#ffea00', '#00e676', '#00b0ff', '#e040fb', '#ffd700', '#ff6b35', '#f50057', '#76ff03'];
  let fwCanvas, fwCtx, fwParticles = [], fwRockets = [], fwAnim = 0, fwAutoTimer = null;

  function fwPick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  function fwResize() {
    const wrap = document.querySelector('.frame-wrap');
    if (!wrap || !fwCanvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pad2 = FW_PAD * 2;
    const w = wrap.clientWidth + pad2;
    const h = wrap.clientHeight + pad2;
    fwCanvas.width = Math.round(w * dpr);
    fwCanvas.height = Math.round(h * dpr);
    fwCanvas.style.width = w + 'px';
    fwCanvas.style.height = h + 'px';
    fwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function fwRand(min, max) { return min + Math.random() * (max - min); }

  function fwBurst(cx, cy, count, power) {
    const n = count || 48;
    const pwr = power || 5.8;
    const base = fwPick(FW_COLORS);
    for (let i = 0; i < n; i++) {
      const ang = (Math.PI * 2 * i) / n + fwRand(-0.2, 0.2);
      const spd = pwr * fwRand(0.65, 1.25);
      fwParticles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1,
        decay: fwRand(0.008, 0.016),
        size: fwRand(3.2, 6.2),
        color: Math.random() < 0.4 ? fwPick(FW_COLORS) : base,
        glow: fwRand(14, 28),
      });
    }
    for (let j = 0; j < 16; j++) {
      fwParticles.push({
        x: cx, y: cy,
        vx: fwRand(-2.4, 2.4),
        vy: fwRand(-2.4, 2.4),
        life: 1,
        decay: fwRand(0.014, 0.024),
        size: fwRand(4, 7.5),
        color: '#fff8e1',
        glow: 18,
      });
    }
  }

  function fwLaunchRocket(targetX, targetY, delay) {
    const { w, h } = fwCenter();
    const startX = targetX != null ? targetX : fwRand(w * 0.08, w * 0.92);
    const endX = targetX != null ? targetX : startX + fwRand(-55, 55);
    const endY = targetY != null ? targetY : fwRand(h * 0.12, h * 0.55);
    fwRockets.push({
      x: startX,
      y: h + 12,
      tx: endX,
      ty: endY,
      t: 0,
      delay: delay || 0,
      color: fwPick(FW_COLORS),
      trail: [],
    });
  }

  function fwCenter() {
    const wrap = document.querySelector('.frame-wrap');
    const pad2 = FW_PAD * 2;
    if (!wrap) return { w: 400 + pad2, h: 400 + pad2, cx: 200 + FW_PAD, cy: 150 + FW_PAD };
    const w = wrap.clientWidth + pad2;
    const h = wrap.clientHeight + pad2;
    return { w, h, cx: w * 0.5, cy: h * 0.4 };
  }

  function launchFireworksShow(mode) {
    const { w, h } = fwCenter();
    if (mode === 'big') {
      const spots = [
        [w * 0.22, h * 0.42], [w * 0.78, h * 0.35], [w * 0.5, h * 0.22],
        [w * 0.15, h * 0.52], [w * 0.85, h * 0.48], [w * 0.38, h * 0.18], [w * 0.62, h * 0.58],
      ];
      spots.forEach(([x, y], i) => fwLaunchRocket(x, y, i * 160));
    } else {
      fwLaunchRocket(fwRand(w * 0.1, w * 0.9), fwRand(h * 0.2, h * 0.55), 0);
      fwLaunchRocket(fwRand(w * 0.1, w * 0.9), fwRand(h * 0.2, h * 0.55), fwRand(350, 800));
    }
    if (!fwAnim) fwTick();
  }

  function fwTick() {
    if (!fwCtx || !fwCanvas) return;
    const { w, h } = fwCenter();
    fwCtx.clearRect(0, 0, w, h);

    fwRockets = fwRockets.filter((r) => {
      if (r.delay > 0) { r.delay -= 16; return true; }
      r.t += 0.028;
      const ease = 1 - Math.pow(1 - Math.min(r.t, 1), 2.2);
      const px = r.x + (r.tx - r.x) * ease;
      const py = r.y + (r.ty - r.y) * ease;
      r.trail.push({ x: px, y: py, life: 1 });
      if (r.trail.length > 16) r.trail.shift();
      for (const tr of r.trail) {
        tr.life -= 0.1;
        if (tr.life <= 0) continue;
        fwCtx.globalAlpha = tr.life * 0.75;
        fwCtx.fillStyle = r.color;
        fwCtx.beginPath();
        fwCtx.arc(tr.x, tr.y, 3.2 * tr.life + 1, 0, Math.PI * 2);
        fwCtx.fill();
      }
      fwCtx.globalAlpha = 1;
      fwCtx.fillStyle = '#fff';
      fwCtx.shadowColor = r.color;
      fwCtx.shadowBlur = 16;
      fwCtx.beginPath();
      fwCtx.arc(px, py, 4.5, 0, Math.PI * 2);
      fwCtx.fill();
      fwCtx.shadowBlur = 0;
      if (r.t >= 1) {
        fwBurst(px, py, 56, 6.8);
        return false;
      }
      return true;
    });

    fwParticles = fwParticles.filter((p) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.042;
      p.vx *= 0.988;
      p.life -= p.decay;
      if (p.life <= 0) return false;
      fwCtx.globalAlpha = Math.max(0, p.life);
      fwCtx.fillStyle = p.color;
      fwCtx.shadowColor = p.color;
      fwCtx.shadowBlur = p.glow * p.life;
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      fwCtx.fill();
      fwCtx.shadowBlur = 0;
      return true;
    });
    fwCtx.globalAlpha = 1;

    if (fwParticles.length || fwRockets.length) {
      fwAnim = requestAnimationFrame(fwTick);
    } else {
      fwAnim = 0;
    }
  }

  function startAutoFireworks() {
    if (fwAutoTimer) clearInterval(fwAutoTimer);
    const tick = () => {
      if (document.hidden) return;
      launchFireworksShow('normal');
    };
    fwAutoTimer = setInterval(tick, 9000);
    setTimeout(tick, 2200);
  }

  function initFireworks() {
    fwCanvas = $('fw-canvas');
    if (!fwCanvas) return;
    fwCtx = fwCanvas.getContext('2d');
    fwResize();
    startAutoFireworks();
  }

  let ws, rt;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws' + location.search);
    ws.onopen = () => clearTimeout(rt);
    ws.onclose = () => { rt = setTimeout(connectWS, 1500); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'settings') {
        if (m.payload && m.payload.habibiTop) {
          cfg = Object.assign(cfg, m.payload.habibiTop);
          applyStyle(); render();
        }
      } else if (m.type === 'habibiTop') {
        applyPayload(m.payload);
      } else if (m.type === 'habibiTopTest') {
        if (!isEmbed) runTest();
        else launchFireworksShow('big');
      } else if (m.type === 'habibiTopReset') {
        if (!isEmbed) resetTop();
      }
    };
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.kind !== 'habibitop') return;
    if (d.type === 'config') {
      cfg = Object.assign(cfg, d.config);
      applyStyle(); render();
    } else if (d.type === 'test') runTest();
    else if (d.type === 'fireworks') launchFireworksShow('big');
    else if (d.type === 'reset') { previewMode = false; isEmbed ? runTest() : resetTop(); }
  });

  if (isEmbed) {
    document.documentElement.classList.add('embed');
    const fit = () => {
      document.documentElement.style.setProperty('--fit', Math.min(window.innerWidth / 420, window.innerHeight / 520));
      applyFrameLayout();
    };
    fit();
    window.addEventListener('resize', fit);
  }

  window.addEventListener('resize', () => { applyFrameLayout(); fwResize(); });

  if (params.get('v') !== OV_BUILD) {
    const u = new URL(location.href);
    u.searchParams.set('v', OV_BUILD);
    location.replace(u.toString());
    return;
  }

  applyStyle();
  initFireworks();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { applyStyle(); render(); });
  }
  if (!isEmbed) {
    const cached = loadTopCache();
    if (cached) { topData = cached; render(); }
  }
  if (isEmbed) runTest(); else if (!topData) render();
  connectWS();
})();
</script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
