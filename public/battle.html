<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay Batalla · Livecoins</title>
  <link rel="stylesheet" href="/css/battle.css" />
</head>
<body>
  <div id="wrap" class="hidden">
    <div class="names">
      <span id="nameA" class="nameA">Equipo A</span>
      <span class="goal">Meta: <b id="goal">0</b> 💎</span>
      <span id="nameB" class="nameB">Equipo B</span>
    </div>
    <div class="bar">
      <div id="fillA" class="fillA"><span id="scoreA">0</span></div>
      <div id="fillB" class="fillB"><span id="scoreB">0</span></div>
    </div>
  </div>
  <script src="/js/battle.js"></script>
  <script src="/js/overlay-keepalive.js"></script>
</body>
</html>
